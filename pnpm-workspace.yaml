packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  # Optional parts of next-intl's message extractor, which the site does not use (messages are
  # hand-written JSON); both ship prebuilt binaries.
  '@parcel/watcher': false
  '@swc/core': false
  # wrangler's local runtime (wrangler dev), which the deploy does not use: `wrangler pages deploy`
  # only uploads apps/web/out/. Its binary ships in a platform package; the script only checks it.
  workerd: false

catalog:
  "@types/node": ^22.20.4
  csv-parse: 7.0.3
  tsx: 4.23.15
  typescript: ~6.0.3
  vitest: 5.0.2
  yaml: 2.9.1
  zod: 4.6.5

minimumReleaseAgeExclude:
  - miniflare@5.20260926.0-alpha
  - wrangler@4.142.0
