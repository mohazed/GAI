packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  # Optional parts of next-intl's message extractor, which the site does not use (messages are
  # hand-written JSON); both ship prebuilt binaries.
  '@parcel/watcher': false
  '@swc/core': false

catalog:
  "@types/node": ^22.20.4
  csv-parse: 7.0.3
  tsx: 4.23.15
  typescript: ~6.0.3
  vitest: 5.0.2
  yaml: 2.9.1
  zod: 4.6.5
