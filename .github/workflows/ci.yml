name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Elsewhere a newer run replaces the older one. On main every run gets its own group and is
  # never cancelled or dropped from the queue: each push to main is compared only with the
  # commit before it, so a cancelled run would leave that push's diff unchecked.
  group: ci-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for the steps that follow (P-19): nothing here pushes.
          persist-credentials: false
          # Full history: pnpm validate compares published events with the base ref
          # (corrections required on edit, docs/03 §11).
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # One package at a time: the runner has two cores, and the scoring property tests, the
      # schema dataset tests and the pipeline tests are each CPU-bound; run side by side they
      # starve one another past their timeouts.
      # This step also runs the scoring rules' worked examples (packages/scoring) and the
      # build-data unit tests (packages/pipeline/src/build): no separate step repeats them.
      - name: Tests (every package, scoring rules and build-data included)
        run: pnpm test --concurrency=1
      # Line and branch coverage of the scoring engine, with the floors of
      # packages/scoring/vitest.config.ts (P-19).
      - name: Scoring coverage
        run: pnpm --filter @gai/scoring coverage
      - name: Validate data and methodology
        run: pnpm validate
        env:
          # Pull requests: resolveBaseRef uses the merge base with origin/$GITHUB_BASE_REF.
          # Pushes to main: compare with the commit before the push (empty for main's first
          # push). Pushes to any other branch: empty, so resolveBaseRef uses the merge base with
          # origin/main and the run checks the whole branch, as the pull request run does.
          GAI_VALIDATE_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
      # Determinism (docs/04 §2 step 7, D-25): build the API twice, in two processes into two
      # temporary directories, with one build date, and fail on any byte of difference. The full
      # history fetched above lets the build name the commit of every correction.
      - name: Build the API twice and compare (real data)
        run: pnpm build:data:check
      - name: Build the API twice and compare (fixtures)
        run: pnpm build:data:check --root fixtures
      # The site (docs/04 §3): pnpm build writes the API from data/ and exports apps/web to out/;
      # its postbuild writes each page's CSP and fails on style attributes, a url() to a missing
      # file, the dev-only kit, Inter, any colour outside the design tokens (docs/05 §9), a page
      # over the JavaScript budget (150 KB gzipped, 25 KB of application code; docs/10 B-79) or a
      # message file in a client chunk.
      - name: Build the site
        run: pnpm build
      # The kit build adds the dev-only /_kit route (fixtures API) in apps/web/out-kit/, never
      # deployed, with scores shown (NEXT_PUBLIC_SHOW_SCORES=true): the browser tests run the page
      # smoke tests on it in score mode and on out/ in scorecard mode, axe on both and on the kit,
      # and check the CSP, the redirect and the output without JavaScript.
      - name: Build the component kit
        run: pnpm --filter @gai/web build:kit
      - name: Install Chromium for Playwright
        run: pnpm --filter @gai/web exec playwright install --with-deps chromium
      - name: Browser tests (Home and Ranking in both modes, axe, CSP, redirect, no-JS)
        run: pnpm test:e2e
      # Lighthouse CI on out/ (apps/web/lighthouserc.cjs): LCP < 1.5 s on Lighthouse's mobile
      # profile with applied throttling, JavaScript ≤ 150 KB on the wire, CLS ≤ 0.001,
      # accessibility, best practices and SEO at 100 (docs/04 §3, docs/10 B-103).
      - name: Lighthouse CI (performance budgets)
        run: pnpm --filter @gai/web lighthouse
