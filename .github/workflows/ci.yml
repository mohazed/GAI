name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Elsewhere a newer run replaces the older one. On main every run gets its own group and is
  # never cancelled or dropped from the queue: each push to main is compared only with the
  # commit before it, so a cancelled run would leave that push's diff unchecked.
  group: ci-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: pnpm validate compares published events with the base ref
          # (corrections required on edit, docs/03 §11).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # One package at a time: the runner has two cores, and the scoring property tests, the
      # schema dataset tests and the pipeline tests are each CPU-bound; run side by side they
      # starve one another past their timeouts.
      # This step also runs the scoring rules' worked examples (packages/scoring) and the
      # build-data unit tests (packages/pipeline/src/build): no separate step repeats them.
      - name: Tests (every package, scoring rules and build-data included)
        run: pnpm test --concurrency=1
      - name: Validate data and methodology
        run: pnpm validate
        env:
          # Pull requests: resolveBaseRef uses the merge base with origin/$GITHUB_BASE_REF.
          # Pushes to main: compare with the commit before the push (empty for main's first
          # push). Pushes to any other branch: empty, so resolveBaseRef uses the merge base with
          # origin/main and the run checks the whole branch, as the pull request run does.
          GAI_VALIDATE_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
      # Determinism (docs/04 §2 step 7, D-25): build the API twice, in two processes into two
      # temporary directories, with one build date, and fail on any byte of difference. The full
      # history fetched above lets the build name the commit of every correction.
      - name: Build the API twice and compare (real data)
        run: pnpm build:data:check
      - name: Build the API twice and compare (fixtures)
        run: pnpm build:data:check --root fixtures
