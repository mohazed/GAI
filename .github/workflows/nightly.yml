name: Nightly

# The nightly rebuild (D-06, docs/04 §5): at 03:15 UTC, the same build and upload as deploy.yml on
# main, with --date of the run day, so that decay, passivity windows, the "changed this week"
# feed and the stale-build notice of /changes move even when no file changed. A failed run opens
# (or comments on) the issue "Nightly build failed"; the next successful run comments and closes it.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SITE_URL: https://gaza-accountability-index.pages.dev
  PROJECT: gaza-accountability-index
  ISSUE_TITLE: Nightly build failed

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Run day (UTC)
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-site
        with:
          date: ${{ steps.day.outputs.date }}
          site-url: ${{ env.SITE_URL }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATE: ${{ steps.day.outputs.date }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          sha=$(git rev-parse HEAD)
          pnpm exec wrangler pages deploy apps/web/out --project-name "$PROJECT" --branch main \
            --commit-hash "$sha" --commit-message "nightly $DATE ${sha:0:7}" --commit-dirty=false
      - name: Check the deployment serves this build
        run: .github/scripts/smoke.sh "$SITE_URL" apps/web/out/api/v1/manifest.json
      - name: Mirror to the VPS (off by default; see deploy.yml)
        if: vars.GAI_MIRROR == 'true'
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
          MIRROR_TARGET: ${{ secrets.MIRROR_TARGET }}
        run: .github/scripts/mirror.sh apps/web/out
      - name: Open or update the issue "Nightly build failed"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATE: ${{ steps.day.outputs.date }}
        run: |
          printf 'The nightly build of %s failed: %s\n\nThe site keeps serving the previous build; the stale-build notice of /changes appears once the build is more than three days old.\n' "$DATE" "$RUN" > "$RUNNER_TEMP/body.md"
          .github/scripts/issue.sh open "$ISSUE_TITLE" "$RUNNER_TEMP/body.md"
      - name: Close the issue after a successful build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATE: ${{ steps.day.outputs.date }}
        run: |
          printf 'The nightly build of %s succeeded: %s\n' "$DATE" "$RUN" > "$RUNNER_TEMP/body.md"
          .github/scripts/issue.sh close "$ISSUE_TITLE" "$RUNNER_TEMP/body.md"
