name: Right of reply
description: A government, embassy or other party named in an event responds to it. Published verbatim within 10 days.
title: "[Reply] "
labels: ["right-of-reply"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Your response is published verbatim on the country page within 10 days of receipt, in its original language with a translation, and the project's answer is shown beneath it.
        Events you contest are marked `disputed` until resolved by a correction, a retraction or a documented rejection with reasons.
  - type: input
    id: country
    attributes:
      label: Country
      description: Name or ISO 3166-1 alpha-3 code of the country page concerned.
      placeholder: "DEU"
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Events contested
      description: One event id per line (shown on each event card, format `evt_YYYY_MM_DD_ISO3_IND`).
      render: text
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response text
      description: The text to publish, exactly as it should appear, in its original language.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language of the response
      placeholder: "German"
    validations:
      required: true
  - type: textarea
    id: translation
    attributes:
      label: Translation into English or French (optional)
      description: If you provide one, it is published beside the original and marked as supplied by you. Otherwise the project translates it and marks the translation as its own.
  - type: input
    id: capacity
    attributes:
      label: Official capacity
      description: Organisation and role, as they should appear on the page.
      placeholder: "Embassy of Germany, Paris — Press office"
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: An address the project can use to verify the capacity above. This field is public; give an institutional address (for example a press office), not a personal one.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: I understand that this response will be published verbatim, with my stated capacity.
          required: true
