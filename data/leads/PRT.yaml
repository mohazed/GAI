  indicator: B5
  claim: 'Portugal''s position on the ICC arrest warrants of 21 November 2024. DN/Lusa of 22 November 2024 (read): after the Council of Ministers the Foreign Minister, Paulo Rangel, ''garantiu que Portugal
    irá cumprir com as suas “obrigações internacionais”'' on the ICC''s warrants, reaffirmed the position stated in May that Portugal is bound by the Court''s decisions, called an equivalence between Hamas
    and the Government of Israel ''politicamente desajustado'', and said ''Não há nenhuma hesitação do Governo Português''. A B5 event needs an archived Government text (the Council of Ministers'' communiqué
    or press-conference transcript of 22 November 2024 on portugal.gov.pt was not found); the statement is a lead (docs/10 B-729 ff.). Re-checked on 2026-11-10 (docs/10 B-2030): a search restricted to portugal.gov.pt, portaldiplomatico.mne.gov.pt and presidencia.pt found no communiqué or transcript of 22 November 2024; the lead stays open. P-23 pass, T-G-LEADS-6 (2026-11-11): a Portuguese search (Rangel TPI mandado Netanyahu obrigações internacionais briefing Conselho de Ministros 22 novembro 2024 portugal.gov.pt vídeo) returned the DN and Notícias ao Minuto reports of the press conference (Lusa) and commentary; no Government transcript or video page was found. Kept open.'
