- id: lead_20261110_PRT_3
  country: PRT
  indicator: A5
  claim: 'The stopover at the Lajes base of three American aircraft for delivery to Israel under a tacit authorisation. The Ministry of Foreign Affairs'' statement of 2 October 2025, as reported by Lusa through RTP and ECO (both read), describes ''a escala e sobrevoo de três aeronaves americanas para entrega a Israel'', with ''comunicação e autorização tácita (isto é, por decurso do prazo respetivo)'' on a favourable opinion of the National Aeronautical Authority, ''uma óbvia falha de procedimento'' that should have been reported to the Minister''s office before the deadline, and says the stopover does not mean that ''o compromisso assumido pelo Ministério ou pelo Governo nesta matéria'' was ''estritamente violado'', which Lusa describes as ''o embargo à venda de armas e passagem pelo território nacional de material militar para Israel, determinado pelo executivo de Luís Montenegro'' (Lusa''s wording, not the Ministry''s). RTP gives 22 April as the date of the stopover; ECO says an initial check after an El País article of 29 September found no aircraft bound for Israel had been authorised. The Ministry''s own text was not found (portaldiplomatico.mne.gov.pt lists no communiqué; a search restricted to portugal.gov.pt and the portal found none), and neither report states the aircraft''s type or load. If the Ministry''s text is archived and states that the aircraft are military aircraft or carry arms, it is a documented transit under A5 (a stopover and overflight authorisation, -5), dated by the document; the Government''s own reading is that its embargo was not breached (docs/10 B-2030). P-23 pass, T-G-LEADS-6 (2026-11-11): two Portuguese searches (portaldiplomatico.mne.gov.pt nota à imprensa aeronaves Lajes Israel autorização tácita outubro 2025; audição Paulo Rangel Lajes F-35 Israel comissão Negócios Estrangeiros Assembleia da República outubro 2025) returned press reports that name the three aircraft as F-35 fighters sold by the United States to Israel (Renascença, DN, 24noticias, 14 October 2025), that the Foreign Affairs committee approved a hearing of the Foreign Minister on the stopover on 14 October 2025 and rejected hearings of the Defence Minister, and that Amnesty International said in April 2026 that the stopover breached Portugal''s obligations; a third (parlamento.pt resposta pergunta Ministério dos Negócios Estrangeiros escala Lajes) found no Government answer to a parliamentary question. The Wayback CDX listing of portaldiplomatico.mne.gov.pt for October 2025 holds no note on the stopover (the ''Nota à Comunicação Social'' of 16 October 2025, read, concerns consulates in Brazil). No official text is archived; the hearing''s record (committee minutes or the Parliament''s video) is the next route. Kept open.'
