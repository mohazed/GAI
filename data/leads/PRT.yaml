  claim: 'Portugal''s stated position on suspending the EU-Israel Association Agreement. Lusa''s report in ECO of 11 May 2026 (read): at a meeting of the EU foreign ministers in Brussels the Foreign Minister,
    Paulo Rangel, said that Portugal supports the suspension of the agreement: ''Quanto à suspensão do acordo de associação com Israel, Paulo Rangel referiu que Portugal apoia essa medida, mas salientou
    que, “infelizmente”, nem a sua suspensão total nem parcial serão aprovadas nesta reunião.'' The same report has him asking the EU to sanction two ''radical ministers'' of Israel and saying Portugal
    ''sempre defendeu que houvesse mais sanções aos colonos''. A web-search summary credits the Prime Minister with favouring a partial suspension on 20 May 2026 (ECO; the page could not be read: not relied
    on). A C1 event needs the Government''s own text (a Council statement, a Ministry release or a transcript of the press remarks); none was found, so the statement is a lead (docs/10 B-729 ff.). Re-checked on 2026-11-10 (docs/10 B-2030): a search restricted to portugal.gov.pt and portaldiplomatico.mne.gov.pt found no Government text of the remarks of 11 or 20 May 2026; the lead stays open. Foreign Minister Rangel also said in Brussels on 13 July 2026 (DNoticias, Lusa) that an import ban on settlement goods is the only possible measure; that is a position at EU level, not an association-agreement statement. P-23 pass, T-G-LEADS-6 (2026-11-11): not searched again by query (B-2030, the day before); the Wayback CDX listing of portaldiplomatico.mne.gov.pt for October 2025 was read for PRT_3 and holds no item on the association agreement. Kept open.'
