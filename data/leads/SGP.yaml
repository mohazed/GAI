    cover. An A3 standing state (-15) only if a primary document names a Singaporean supplier of parts or maintenance for the global programme. P-23 pass, T-G-LEADS-7 (2026-11-11): two English searches (ST Engineering F-35 component supplier Lockheed Martin contract; MINDEF Singapore F-35 industry participation ST Engineering supply chain) returned MINDEF''s releases on the F-35B delivery schedule and ST Engineering''s other contracts (infantry fighting vehicles, commercial aerospace repairs); no MINDEF, ST Engineering or Lockheed Martin document naming a Singaporean supplier of parts or maintenance for the global F-35 programme was found. Kept open.'
