  claim: 'A defence-news site (The Defense Watch, undated, found by a web search on 2026-11-10, not read in full) says ST Engineering ''manufactures components including aircraft structures and participates
    in maintenance, repair, and overhaul activities for the F-35 program''. No official programme document, Lockheed Martin supplier disclosure, Ministry of Defence statement or UN Special Rapporteur''s report
