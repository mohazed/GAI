      publisher: The Media Line
      kind: press
      title: Egypt Postpones Israeli Ambassador's Accreditation as Gaza War Strains Ties
  date: 2026-09-30
  status: open
- id: lead_20260930_EGY_3
  country: EGY
  indicator: E2
  claim: >-
    Amnesty International and Human Rights Watch report the arrest of at least 123 people for
    expressing solidarity with Palestine between October 2023 and May 2024 (the dispersal of
    protests after Friday prayers at al-Azhar on 27 October 2023, arrests at Tahrir Square), and in
    June 2025 the detention and deportation of hundreds of foreign participants in the Global March
    to Gaza; the Ministry of Foreign Affairs' statement of 11 June 2025 required prior approval for
    visits to the border areas (not a protest ban). No official decree banning Palestine solidarity
    protests was found. E2 is recorded but unscored in v1.0 (D-12).
  sources:
