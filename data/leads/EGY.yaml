- id: lead_20260930_EGY_1
  country: EGY
  indicator: A5
  claim: >-
    Rights lawyers and vessel-tracking reports said in late October 2024 that the German-flagged
    MV Kathrin, carrying about 150 tonnes of military-grade explosives bound for an Israeli
    defence contractor, docked at Alexandria. The Armed Forces spokesman denied "assisting Israel
    in its military operations", and the Ministry of Transport said the ship unloaded a cargo for
    the Ministry of Military Production and asked to leave for Türkiye. No official record of a
    transit of Israel-bound military cargo through an Egyptian port was found; A5 counts confirmed
    instances only.
  sources:
    - url: https://www.usnews.com/news/world/articles/2024-10-31/egypt-denies-assisting-israels-military-operations-amid-reports-about-explosives-shipment
      publisher: Reuters (via U.S. News)
      kind: press
      title: Egypt Denies Assisting Israel's Military Operations Amid Reports About Explosives Shipment
      date: 2024-10-31
    - url: https://english.ahram.org.eg/NewsContent/1/1234/534493/Egypt/Foreign-Affairs/Alexandria-Port-did-not-receive-German-ship-%C3%AF%C2%BF%C2%BDKathr.aspx
      publisher: Ahram Online
      kind: press
      title: "Alexandria Port did not receive German ship 'Kathrin' carrying military supplies to Israel: source to Al-Qahera News"
  date: 2026-09-30
  status: open
- id: lead_20260930_EGY_2
  country: EGY
  indicator: B12
  claim: >-
    The press reports that Egypt's ambassadorial post in Israel has been vacant since Ambassador
    Khaled Azmy left Tel Aviv in 2024, that Cairo decided not to name a successor while the war in
    Gaza continues, and that the accreditation of Israel's ambassador-designate, requested in April
    2024, was postponed (he was not invited to the credentials ceremony of 2025). No official
    announcement of a recall, a downgrade or a refusal was found; B12 needs an official act.
