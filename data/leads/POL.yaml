# Leads for Poland: claims without an archived primary document. Never scored (docs/03 §10).
# Finish run of 2026-11-09 (T-F-W5, docs/10 B-905).
- id: lead_20261109_POL_1
  country: POL
  indicator: E2
  claim: >-
    A press report of 15 November 2023 (Notes from Poland) says the Mayor of Warsaw banned a pro-Palestinian
    march planned for 18 November 2023 that would have ended outside the Israeli embassy, citing security
    concerns, and that the organisers appealed to a court. A decision of the Regional Court in Warsaw of 16
    November 2023 (file IV Ns 173/23, anonymised, on the Court's public information site) reviewed a ban of
    an assembly planned for 18 November whose route ended near an embassy, but the published text does not
    name the topic. Promote to an E2 event (experimental, unscored in v1) only with a document of the City
    of Warsaw or the Court that names the assembly's purpose.
    P-23 pass, T-G-LEADS-6 (2026-11-11): a Polish search (Prezydent m.st. Warszawy zakaz zgromadzenia 18 listopada 2023 propalestyńskie ambasada Izraela decyzja sąd okręgowy) found the amicus curiae opinion of the Helsinki Foundation for Human Rights (hfhr.pl, November 2023, NGO, in search excerpts), which gives the Mayor's decision as no. WV5310/ZG/9/2023 of 14 November 2023 banning the assembly at plac Zbawiciela with a march to the Israeli embassy, citing the conflicts in Ukraine and the Middle East and a terrorist threat; OKO.press reports that the Regional Court lifted the ban on 16 November 2023 and that the march took place on 18 November. No document of the City or of the Court naming the assembly's purpose was found (the City's decision is not published; the Court's anonymised text does not name it). A municipal ban annulled by a court two days later; kept open (E2 unscored).
  sources:
    - url: https://notesfrompoland.com/2023/11/15/warsaw-bans-pro-palestine-demonstration-outside-israeli-embassy/
      publisher: Notes from Poland
      kind: press
      title: "Warsaw bans pro-Palestine demonstration outside Israeli embassy"
  date: 2026-11-09
  status: open
- id: lead_20261109_POL_2
  country: POL
  indicator: E3
  claim: >-
    OKO.press and the Anadolu Agency report of 25 May 2026 that a group of Polish citizens of Palestinian
    origin, supported by the Hind Rajab Foundation, filed a notification at the Regional Prosecutor's Office
    in Wrocław against current and former Israeli political and military figures for genocide, war crimes
    and crimes against humanity in the Gaza Strip, on article 110 of the Polish criminal code. No decision
    of the prosecutor to open or refuse an investigation is known. Promote to an E3 event (experimental,
    unscored in v1) only with a dated communication of a Polish prosecution office or court that confirms an
    investigation was opened.
    P-23 pass, T-G-LEADS-6 (2026-11-11): a Polish search (Prokuratura Regionalna we Wrocławiu zawiadomienie ludobójstwo Gaza Hind Rajab wszczęcie śledztwa odmowa 2026) returned OKO.press, Middle East Eye and the Foundation's pages on the filing; no decision of the Wrocław prosecutors was found. The same searches found a separate investigation in rem opened in September 2025 by the District Prosecutor's Office in Kielce on a complaint about Israeli arms companies at the MSPO fair, recorded as lead_20261111_POL_3. Kept open.
  sources:
