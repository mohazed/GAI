  claim: 'The 2nd ASEAN-Gulf Cooperation Council Summit (Kuala Lumpur, 27 May 2025) was attended by the Lao Prime Minister Sonexay Siphandone, among the leaders of ASEAN, who ''shared their views and
    proposals'' (Bernama, 27 May 2025, read: Malaysia''s Chief Secretary to the Government said the key issues included the urgent need for a ceasefire in Gaza and that ''the final statement will be
    issued later''). The text of the summit''s final statement was not found, so no passage of it is quoted and no event is filed. If an official text is archived that names Gaza and a ceasefire,
    it is a B9 candidate for each signatory head of government at the call tier (+2) or higher; whether a summit statement agreed by leaders counts as the Prime Minister''s own formal words is
    a question for the author (a declaration naming a state without a signatory is a lead in earlier sessions). The Lao Deputy Minister of Foreign Affairs'' speech at the Non-Aligned Movement summit in Kampala (January
    2024, Laotian Times, read through a search result only) is not a B9 speaker (R3). Re-checked 2026-11-10 (T-F-L11): the official text of the summit''s final statement is now archived (src_20250527_asean_asean-gcc-china-summit-joint-statement, the Final Joint Statement of the ASEAN-GCC-China Summit, 27 May 2025): ''The Leaders expressed grave concerns over the developments in the Middle East and agreed on the following: Condemn all attacks against civilians and call for a durable ceasefire and for all concerned parties to ensure the most effective and efficient access for humanitarian aid ... throughout Gaza''. It is a statement of the Member States as a body, with no named signatory; it is not filed as the Prime Minister''s own words pending the author''s reading (docs/10 B-2004); the lead stays open.'
