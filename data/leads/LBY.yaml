    read live on 13 October 2026, 173,306 bytes; no Wayback capture, so not recorded) names ''Palestine'' (فلسطين) four times, speaks of ''the decades-long ordeal of occupation, repression and attempts
    to alter their identity'' (UN Meetings Coverage) and of the implementation of Security Council resolutions ''free from selectivity and double standards'' (the Ministry''s report) and never uses the
    word Gaza (R7): not a B9 event. If the author reads ''Palestine'' as covering Gaza (the decision pending for Jamaica, Nicaragua and Uruguay), the passage would be filed from a Wayback copy of the file
