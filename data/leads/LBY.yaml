- id: lead_20261013_LBY_1
  country: LBY
  indicator: B9
  claim: 'The Acting Minister of Foreign Affairs and International Cooperation of the Government of National Unity, Taher El-Baour, in the Ministry''s own reports (indirect speech, R4): at the annual meeting
    of the OIC foreign ministers in New York on 24 September 2026 he stressed ''the need to continue efforts aimed at consolidating the ceasefire in the Gaza Strip, ensuring the immediate, safe, and sustained
    delivery of humanitarian assistance'' (the report quotes only a sentence on Islamic unity); at the joint Arab-Islamic ministerial meeting on Jerusalem on 25 September 2026 he called for ''a ban on settlement
    products'' and ''sanctions on officials and settlers'' (a West Bank and Jerusalem statement, not Gaza); with the Palestinian Foreign Minister in Tripoli on 12 October 2026 he rejected forced displacement.
    A B9 event at the call tier (+2) for the 24 September statement, and a B11 reading for the call for sanctions, if an official transcript or video of the speeches is archived (the OIC''s or UN Web TV''s
    recording).'
