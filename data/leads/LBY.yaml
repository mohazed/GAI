- id: lead_20261013_LBY_4
  country: LBY
  indicator: A8
  claim: 'Libyan ports refused vessels that had called at Israeli ports in November 2023: on 12 November 2023 port authorities at Mellitah kept the crude tanker Proteus Philippa from loading because it
    had carried a cargo to Haifa, and on 14 November Misrata''s authorities stopped the freighter Norjan arriving via Haifa and blacklisted it for violating ''the principle of boycotting the Zionist enemy''
    (Libya Security Monitor, 12 November 2023; Bloomberg, relayed by Maritime Executive on 15 November, believed it was not an official policy). No decision of a port authority or Government statement was
    found, and the vessels were not carrying arms: not an A8 instance (transit denied to arms shipments), and not a measure on relations. Recorded for the author''s reading of the Arab League boycott rules. Re-checked 2026-11-10 (T-F-L09): a web search in English returned the same press reports of November 2023 (Energy Intelligence, Argus, Libya Security Monitor) and no port authority or Government statement. Kept. P-23 pass, T-G-LEADS-4 (2026-11-10): an Arabic search for a decision of the Ports and Maritime Transport Authority on vessels that called at Haifa (Misrata, November 2023) returned Ministry of Transport decisions of 2018 to 2025 on lawsociety.ly (port state control, ship registration; one decision of 2025 not readable, HTTP 402) and no decision on such vessels. Kept open (the author''s reading of the boycott rules).'
