    October 2023 (calling on the international community to stop ''the Israeli occupation''s blatant violations''); Menfi on 12 and 15 October 2023 (the need to protect civilians in Gaza, rejection of displacement
    ''under any circumstances''); Menfi on 19 January 2024 at the Non-Aligned Movement summit in Kampala, announcing in a speech that Libya joins South Africa''s case (the Libyan News Agency, indirect speech,
    cited in a footnote of Libya''s declaration); Dbeibah on 22 November 2023, praising the mediators of the truce. No transcript or video was found; each is expired and adds nothing to the score. The speech
    of 19 January 2024 is the one worth a transcript (the Movement''s site) for the history.'
