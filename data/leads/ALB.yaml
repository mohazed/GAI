  claim: 'One patient from Gaza, a one-year-old child, was evacuated to Albania on the evening of 15 January 2025 and treated at the University Hospital Centre ''Mother Teresa'' in Tirana, with the father,
    brother and sister housed at the refugee centre in Babrru; the WHO office in Albania announced it and thanked ''Albania''s state institutions for facilitating this medical evacuation'' (periskopi.com,
    16 January 2025, read). WHO/Europe''s photo story of 3 March 2025 says ''another patient, along with 3 family members, was flown to Albania aboard a Luxembourg medical ambulance''. One case is not a
    programme (docs/02 §2 D4: one event per programme, not per patient) and the Government''s own text (the Ministry of Health, the Prime Minister''s Office) was not found: a D4 event at +5 only if the
    author reads one evacuation as a programme or a Government document of a programme is found. Finish run, T-F-L14 (2026-11-10): a web search for the Government''s own text (the Ministry of Health, the Prime Minister''s Office, the Ministry for Europe and Foreign Affairs) returned none; the lead stays open. P-23 pass, T-G-LEADS-1 (2026-11-10): an Albanian search (Ministria e Shëndetësisë, QSUT, evakuim, janar 2025) found the Health Minister''s social-media post as Shqiptarja.com quotes it (''Fëmija 1 vjeç, i cili kishte nevojë të menjëhershme për trajtim mjekësor, është duke u asistuar me shumë sukses nga stafi i QSUN'') and no Ministry or Government release; one evacuation is still not a programme. Kept open.'
