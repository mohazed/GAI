  claim: 'The state news agency (AMI) prints the text of the speech of President Mohamed Ould Cheikh El Ghazouani to the extraordinary Arab summit in Cairo on 4 March 2025. In it he speaks of
    ''the horror of what the Palestinian people in general, and the residents of the Gaza Strip in particular, are subjected to: killing, destruction and genocide'' (وسكان قطاع غزة بوجه أخص، من
    قتل وتدمير وإبادة جماعية) and calls for ''consolidating the ceasefire agreement'' (لتثبيت اتفاق وقف إطلاق النار) and for the reconstruction of Gaza. The page is the agency''s, not the Presidency''s
    (kind press): not an event for the same reason as lead_20261104_MRT_1. Candidate for a B9 event at +5. 610 days old on 4 November 2026 (docs/10 B-812). Update of 2026-11-10 (T-F-L20, docs/10
    B-2067): no Presidency or Arab League text of the Cairo speech was found in the session''s searches; the lead stays open.'
