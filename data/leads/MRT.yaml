  claim: 'The Ministry of Foreign Affairs'' report of 21 June 2025 says, in indirect speech, that the Minister of Foreign Affairs, Mohamed Salem Ould Merzoug, told the 51st session of the OIC
    Council of Foreign Ministers in Istanbul that ''the continuation of the genocidal war on the besieged Gaza Strip'' (واستمرار حرب الإبادة الجماعية على قطاع غزة المحاصر) and Israeli attacks
    on Iran mark an unprecedented level of tension, and called for a united Islamic position. The words are the report''s (R4); no recording or text of the speech in the Minister''s own words
    was found. 501 days old on 4 November 2026. The Ministry''s report of the Minister''s speech to the Arab summit in Baghdad on 17 May 2025, on behalf of the President (a ''comprehensive war
    of genocide'' (حرب إبادة شاملة), concern at Israeli violations of the ceasefire in Gaza), is also in indirect speech (https://www.diplomatie.gov.mr/ar/node/608, read, not archived) (docs/10
    B-812). Update of 2026-11-10 (T-F-L20, docs/10 B-2067): no direct-speech text of the Minister''s Istanbul statement was found (the OIC''s and the Ministry''s sites were not searched again);
    the lead stays open.'
