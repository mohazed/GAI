# Leads for Mauritania (P-21 light protocol, T-P21-39, 2026-11-04). A lead is never scored.
- id: lead_20261104_MRT_1
  country: MRT
  indicator: B9
  claim: 'The state news agency (AMI) prints ''the full text'' of the speech of President Mohamed Ould Cheikh El Ghazouani (head of state; chair of the African Union at the time) to the joint
    Arab-Islamic follow-up summit in Riyadh on 11 November 2024. In it he renews ''our condemnation and denunciation of what Israel is doing in Palestine by way of genocide and destruction'' (لما
    تقوم به إسرائيل في فلسطين من إبادة وتدمير) and ''our insistence on an immediate ceasefire'' (لنؤكد على تمسكنا بضرورة الوقف الفوري لإطلاق النار), and says that the Arab and Islamic summit had
    demanded of the Security Council ''an immediate ceasefire and the entry of aid to the stricken Palestinian people'' in ''Gaza''. The page is the agency''s, not the Presidency''s (kind press):
    the quote cannot support a B9 event (the validator requires an official or official-video source; the Presidency''s site does not carry the speech). Candidate for a B9 event at +5 (legal characterisation
    and a call for a ceasefire in one passage) if the author accepts the state agency''s full text, or if a Presidency text or an Arab League record is archived. 723 days old on 4 November 2026
    (not expired, weight close to zero) (docs/10 B-812). Update of 2026-11-10 (T-F-L20, docs/10 B-2067): an Arabic search for the Presidency''s text of the Riyadh speech of 11 November 2024 returned
    press lists of attendees and no official text; presidence.mr''s speeches page carries no text; the lead stays open.'
