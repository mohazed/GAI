- id: lead_20261013_TUN_2
  country: TUN
  indicator: B9
  claim: 'The Minister of Foreign Affairs, Mohamed Ali Nafti, delivered the President''s speech at the extraordinary Arab summit (the ''summit for Palestine'') in Cairo on 4 March 2025. La Presse, from
    the Ministry''s post on social media, reports in indirect speech (R4) that he called on the Arab, Islamic and international community ''to intensify their action to ease the suffering of the Palestinian
    people and protect it against the war of extermination of which it has been a victim for decades'' and rejected every attempt at displacement. The Ministry''s own text of the speech was not found
    (the post is on the Ministry''s page on a social network; the content API screened has no post for that day). A B9 event at the +5 tier (a violation and a characterisation) if the speech is archived
    in the speaker''s words.'
