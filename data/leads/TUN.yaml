- id: lead_20261013_TUN_4
  country: TUN
  indicator: B9
  claim: 'The Minister of Foreign Affairs, Mohamed Ali Nafti, in the Ministry''s own reports in indirect speech (R4), none with the speech itself: at the extraordinary meeting of the OIC Council of Foreign
    Ministers on 25 August 2025 he ''called for intensified efforts ... to compel the occupying entity to stop the war crimes and acts of genocide it commits daily'' (post of 26 August 2025); at the 164th
    session of the Arab League Council on 4 September 2025 he ''emphasized that joint Arab security is based on the need to stop the genocide, starvation and all the grave violations'' (post of 5 September
    2025); at the emergency Arab and Islamic summit in Doha on 15 September 2025, where he delivered Tunisia''s statement, the report says it called for ''an immediate end to its aggression against
    the Gaza Strip'' and the Security Council to ''put an end to the killings, starvation, and terrorism'' (post of 16 September 2025). Each would be a +5 reading (a legal characterisation, or a call
    with named violations) if the speech were archived in his words; all are more than 365 days old on 13 October 2026 (the latest, 393 days).'
