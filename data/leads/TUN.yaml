- id: lead_20261013_TUN_1
  country: TUN
  indicator: B9
  claim: 'The President, Kais Saied, as two press reports relay his meetings in indirect speech (R4): on 22 July 2025 with the US President''s adviser Massad Boulos he, according to Webdo, ''qualified
    these acts as crimes against humanity'' and condemned ''the policy of extermination and colonisation in Palestine'' (showing photographs of starving children); on 2 October 2025 with the Foreign Minister
    he stressed, according to a Tunisian report carried by allAfrica, that Tunisia''s voice is heard ''concerning the crimes of genocide committed by the Zionist enemy against the Palestinian people''
    (a meeting on the return of Tunisians detained after the flotilla; no Gaza in the sentence). The President is a B9 speaker under R3 but the Presidency''s own releases are on social networks and the
    site carthage.tn was not searched; no transcript or video was found. A B9 event at the +5 tier for 22 July 2025 (named violations and a legal characterisation; 448 days old on 13 October 2026,
    so it would count at a low weight and not end the passivity penalty) if the Presidency''s release in the President''s words is archived.'
