- id: lead_20261013_TUN_3
  country: TUN
  indicator: B9
  claim: 'The Minister of Foreign Affairs, Mohamed Ali Nafti, in the Ministry''s own reports in indirect speech (R4): on 25 December 2024 in Cairo, with the Egyptian Foreign Minister, he ''reiterated our
    country''s firm stance on the situation in Gaza, stressing the need for a ceasefire'' (post of 26 December 2024); on 13 January 2025, receiving a delegation of the International Criminal Court (the
    First Vice-President and the Tunisian judge), he ''condemned the ongoing genocide in Gaza and the other occupied Palestinian territories'' and expressed concern ''over the stagnation of investigations
    into the situation in Palestine'' (post of 14 January 2025; neither a commitment to execute the warrants of 21 November 2024 nor a refusal: B5 and B6 stay `none-found`). The first would be a B9 call
    (+2) and the second a +5 reading if the Minister''s words are archived from a transcript or a recording; both are more than 365 days old.'
