  claim: 'Vatican News of 14 August 2025 (read) reports, in Italian, that three children from Gaza landed at Rome-Ciampino on the evening of 13 August 2025 with their parents and siblings and were taken to the Bambino Gesù Paediatric Hospital, and that ''salgono a 20 i minori provenienti da Gaza presi in carico dal Bambino Gesù dall''inizio del conflitto, nell''ottobre 2023''. The flights are organised by Italian authorities (the programme is Italy''s; Italy''s D4 is for its own file); the hospital is a Holy See institution. Whether its admissions are a D4 ''medical-evacuation programme'' of the Holy See, and from which date (the first children arrived in January 2024 according to web-search results not read), is the author''s reading; no official Holy See text of a programme was found (docs/10 B-736). Re-checked on 2026-11-10 (docs/10 B-2034), the hospital press release and Vatican News of August 2025 still give 20 children since October 2023, and a search in Italian found no 2026 report and no Holy See text of a programme; the lead stays open. P-23 pass, T-G-LEADS-8 (2026-11-11): an Italian search (Bambino Gesù bambini Gaza ricoverati 2026 comunicato ospedale pediatrico Santa Sede) returned the hospital''s release of 14 August 2025 (20 minors since October 2023), Quotidiano Sanità on three children in stable condition and press reports of Italy''s evacuation flights (Avvenire, AGI, Domani); no Holy See text of a programme and no 2026 count of the hospital was found. Kept open.'
