    to ERR News that ICC rulings cannot be applied selectively and that signatories such as Estonia cannot politically interfere in decisions; ERR quotes him: ''we all applauded, we all stood up when
    ICC gave the arrest warrant to Putin and it was the right thing to do''. ERR''s report is in indirect speech on the warrants for Israeli officials and the Ministry''s written comment of 21 November
    2024 (archived) is sceptical that the warrants contribute to a lasting peace: neither is a public commitment to execute the warrants (B5) or a refusal (B6). A B5 event if an official transcript
