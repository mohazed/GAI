    2025 (the high-level conference of 22 September) it says he ''added that the first essential step towards peace is respecting the principles of international law - establishing a ceasefire, ending
    attacks on civilians, ensuring the opening of humanitarian corridors and securing the release of all hostages''; the words in quotation marks in the second report (''to prevent the deterioration
