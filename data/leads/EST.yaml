  claim: 'The Police and Border Guard Board banned a public meeting in support of Palestinians planned in Tartu in November 2023, on the ground that meetings inciting hatred and violence are not allowed;
    the Interior Minister said on 8 December 2023 that the police had overreacted and the meeting took place on 2 December 2023 (ERR News, 8 December 2023). The police fined participants of a demonstration
    on Freedom Square in Tallinn in November 2023 for the slogan ''From the river to the sea, Palestine will be free'' (ERR News, 5 December 2023); Harju County Court upheld a fine and the Estonian Human
    Rights Centre appealed to the Supreme Court (ERR News, 17 July 2024), and a court acquitted a third participant (Estonian Human Rights Centre, 20 June 2025, title read). An E2 event (experimental,
    unscored) if the police decision or the court rulings are archived: a ban on a protest and fines for a slogan are the acts E2 records. Found in the finish run (T-F-L09, 2026-11-10).'
