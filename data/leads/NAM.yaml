  claim: 'Namibia is named among the twelve states that signed the final declaration of the Hague Group''s emergency ministerial conference on Palestine (Bogota, 15 and 16 July 2025:
    Bolivia, Colombia, Cuba, Indonesia, Iraq, Libya, Malaysia, Namibia, Nicaragua, Oman, Saint Vincent and the Grenadines, South Africa), which adopted six measures (arms, fuel and military
    technology, ports, flags, public procurement, investigations). Infobae (read on 4 November 2026) says that ''solo Bolivia, Cuba, Colombia, Indonesia, Irak, Libia, Malasia, Namibia,
    Nicaragua, Omán, San Vicente y las Granadinas y Sudáfrica firmaron la declaración final''; the Colombian Ministry''s release is archived (src_20250718_cancilleria_sosa-grupo-la-haya-bogota)
    and names Namibia among the signatories but no Namibian signatory or speaker. A joint statement archived with Namibia''s President or Foreign Minister as signatory would be a B9
    event (docs/10 B-444); the six measures are commitments, and no Namibian implementing act was found (A6, A8, C6 are unchecked in the light protocol). Namibia is also a founding state
    of the Hague Group (31 January 2025: the Group''s declaration is not archived). Update of 2026-11-10 (T-F-L20, docs/10 B-2070): searched for Namibian
    implementing acts of the six measures (arms, ports, procurement); none was found; the refusal of the vessel Kathrin (August 2024, evt_2024_08_24_NAM_A8) predates the conference. The lead stays open.'
