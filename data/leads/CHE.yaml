- id: lead_20260929_CHE_1
  country: CHE
  indicator: C5
  claim: >-
    The exclusion list of the Swiss Association for Responsible Investments (SVVK-ASIR), whose members
    include the federal pension fund PUBLICA, Suva and compenswiss (the Federal Council's answer to
    interpellation 25.3963, 26 November 2025), recommends excluding Bank Hapoalim, Bank Leumi and other
    Israeli issuers (list read on 2026-09-29, not archived). The reason (conduct-based, for example
    financing of settlements) and the date of each recommendation, and whether PUBLICA or compenswiss
    applied them, were not established. Promote to a C5 event only with an archived decision of a
    public pension fund, dated, citing Gaza or the occupied territories (a recommendation of an
    association is not the fund's decision); a settlements-only reason would be scoped `west-bank`.
  sources:
    - url: https://svvk-asir.ch/de/ausschlussliste
      publisher: Schweizer Verein für verantwortungsbewusste Kapitalanlagen (SVVK-ASIR)
      kind: ngo
      title: Ausschlussliste
  date: 2026-09-29
  status: open
