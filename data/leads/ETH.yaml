# Leads for Ethiopia (P-21 light protocol, T-P21-35, 2026-11-04). A lead is never scored.
- id: lead_20261104_ETH_1
  country: ETH
  indicator: C2
  claim: 'Ethiopia–Israel cooperation under way in the window, with no signed instrument found. The Ministry of Foreign Affairs'' page on bilateral relations (mfa.gov.et/api/bilateral, updated 24 November
    2025) lists the visit of Israel''s Energy and Infrastructure Minister to Ethiopia (February 2025), the visit of the Foreign Minister, Gedion Timothewos, to Israel (March 2025) and the visit of Israel''s
    Foreign Minister to Ethiopia (May 2025). The Ethiopian News Agency reports the Foreign Minister''s meetings with Israel''s Minister of Economy and Industry (13 March 2025) and Minister of Energy and
    Infrastructure (14 March 2025) on trade, investment, energy, mining and technology, and the Israeli Ambassador''s interview of 16 September 2026 on cooperation in agriculture, health, technology, water
    and energy. None of these items reports a signing. Not filed: a C2 event needs the signed agreement from a treaty register or a ministry release (C2 text) and none was found; the agency''s items
    are meetings. Check in P-23: the Ministry of Foreign Affairs'' releases of the March 2025 visit, Israel''s Ministry of Foreign Affairs and Knesset records, and the Israeli embassy page
    (embassies.gov.il/ethiopia). The agency''s items dated February 2023 on earlier agreements (''Ethiopia, Israel Ink Major Cooperation Agreements'') carry a date of February 2023 (probably the date of the agency''s archive import, not of the events) and therefore fall before the window.'
