- id: lead_20260928_IRL_1
  country: IRL
  indicator: B5
  claim: >-
    The Taoiseach (Simon Harris) said on RTÉ Radio One on 22 November 2024 that Netanyahu would
    "absolutely" be arrested if he came to Ireland, and the Tánaiste (Micheál Martin) told Newstalk
    the same day that Ireland would execute the warrant. Filed at corroborated confidence
    (evt_2024_11_22_IRL_B5) on two press reports; no official transcript of either interview and no
    later official statement committing to execute the warrants was archived. Promote the event to
    `confirmed` with an official transcript, a Dáil record (for example Leaders' Questions after
    December 2024) or a written parliamentary answer stating that Ireland would execute the
    warrants.
    P-23 pass, T-G-LEADS-3 (2026-11-10): an English search restricted to oireachtas.ie and the Oireachtas API (written questions of 2025 and 2026 filtered for 'Criminal Court' and 'warrant') found the Minister for Justice's written answer of 13 February 2025 to Question 259 [5363/25], archived as src_20250213_oireachtas_pq-259-icc-warrants (bytes and SHA-256 equal to the replay): 'If, in due course, Ireland were to receive a request for the arrest and surrender of a person who is subject to an International Criminal Court arrest warrant, such a request would fall to be dealt with in accordance with the International Criminal Court Act 2006 (as amended).' It is a statement of the procedure, names no person and does not say the warrants would be executed, so the event stays at corroborated (default adopted in the unattended run of 2026-11-10, CHECKUP §7, B-2140; the author may read it as confirming). The Tánaiste's Dáil answer of June 2024 (search summary: a request 'would be handled under the relevant provisions' of the 2006 Act) is of the same kind and was not read. Kept open.
  sources:
    - url: https://www.thejournal.ie/joe-biden-says-icc-arrest-warrant-against-benjamin-netanyahu-is-outrageous-6549985-Nov2024/
      publisher: TheJournal.ie
      kind: press
      title: "Taoiseach and Tánaiste say Ireland would 'absolutely' execute arrest warrant against Netanyahu"
    - url: https://www.thedailystar.net/news/world/israels-attack-on-palestine/news/ireland-would-arrest-netanyahu-pm-3759161
      publisher: The Daily Star (wire report)
      kind: press
      title: "Ireland would arrest Netanyahu: PM"
  date: 2026-09-28
  status: open

