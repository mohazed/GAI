- id: lead_20260928_IRL_3
  country: IRL
  indicator: A5
  claim: >-
    Press reports of March 2026 (The Ditch, Al Jazeera) say the Minister for Transport granted an
    exemption for a US military-chartered civil flight to carry munitions through Irish airspace to
    the Nevatim air base in Israel, and that a Department of Transport inquiry found nine flights
    had carried munitions to Israel through Irish airspace without authorisation since October 2023.
    A written answer of June 2024 (reported) said no exemption had been sought or granted for
    munitions to Israel in 2023 and 2024. No parliamentary answer or departmental document naming an
    authorised flight was archived. An authorised transit would be an A5 instance (a documented
    transit authorisation); unauthorised flights are not acts of the state. Finish run of 2026-11-09 (T-F-W2): the Wayback CDX listing of the Department of Transport's press releases from 2025 holds no release on the exemption (searched for Israel, munitions, Gaza); kept open.
    P-23 pass, T-G-LEADS-3 (2026-11-10): the Oireachtas API (written questions of January to November 2026) gives the Minister for Transport's answers of 24 February 2026 (Question 302: 'there was a single refusal in 2025'; monthly statistics of exemptions on gov.ie), 9 June 2026 (Question 514: no inspection of a civil aircraft under the 1973 and 1989 Orders from 2019 to 2026) and 28 July 2026 (Question 529: the examination of the alleged carriage of munitions 'is ongoing', no decision on publishing a report); none names an exemption granted for munitions to Israel. The Minister for Foreign Affairs' answer of 22 January 2026 (Question 274) restates the 1959 arrangements for unarmed US military overflights. Read, not archived. Kept open; the Department's monthly exemption statistics on gov.ie were not read.
  sources:
    - url: https://www.aljazeera.com/news/2026/3/30/palestine-aily-ireland-under-fire-for-allowing-weapons-transfers-to-israel
      publisher: Al Jazeera
      kind: press
      title: "Palestine ally Ireland under fire for allowing weapons transfers to Israel"
    - url: https://www.ontheditch.com/state-admits/
      publisher: The Ditch
      kind: press
      title: "State admits it's allowed weapons through Ireland to Israel"
  date: 2026-09-28
  status: open

- id: lead_20260928_IRL_4
