    Documents released under freedom of information (reported by The Currency and RTÉ) say the
    Department of Enterprise refused dual-use export licences to Israel (two applications worth
    EUR 2.96 million, on a high risk of diversion to military use), and press reports of 2026 say
    applications were refused in 2025 on a clear risk of use in serious violations of international
    humanitarian law. These search-result summaries were not read in full or archived. Individual
    refusals are case-by-case decisions, not a decision suspending a class of licences (docs/02 §2
    A6); a published policy or ministerial statement that all such licences to Israel are refused
    would be an A6 event. No official document archived. Finish run of 2026-11-09 (T-F-W2): the Wayback CDX listing of the Department of Enterprise's press releases from 2025 holds no release on export licences to Israel (searched for Israel, export control, dual-use); kept open.
    P-23 pass, T-G-LEADS-3 (2026-11-10): the Oireachtas API gives the Minister for Enterprise's answers of 5 February 2026 (Question 206: in 2025, 15 individual dual-use licences to Israel issued, maximum value EUR 3.16m, and 2 applications refused, EUR 2.22m), 24 February 2026 (Question 433) and 22 September 2026 (Question 24: 'Each application is assessed individually'). They describe case-by-case decisions under the EU Common Position, not a decision suspending a class of licences, so A6 is not met. Read, not archived. Kept open.
  sources:
