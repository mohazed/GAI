  claim: 'Open Zambia (press), 15 May 2026: Zambia and Israel signed a US$460 million debt restructuring agreement under which Zambia''s outstanding obligations to Israel are restructured through
    to 2043; the debt relates to facilities backed by Israel''s Foreign Trade Risks Insurance Corporation (ASHRA) covering sectors including agriculture, defence and healthcare; the Minister of Finance
    and National Planning, Situmbeko Musokotwane, spoke at the signing and Israel''s Ambassador, Ofra Farhi, attended; the agreement forms part of Zambia''s restructuring under the G20 Common Framework.
    No release of the Ministry of Finance and National Planning was found by a web search on 2026-11-10, so nothing can be filed. Two questions for the author before any event: whether a bilateral
    debt restructuring agreement with an official creditor is a ''trade, investment or cooperation agreement'' under C2 (R18 reads any signed governmental instrument of cooperation; the same reading
    would apply to every Common Framework debtor that signed with Israel), and the signing date (the article is dated 15 May 2026 and gives no date). P-23 pass, T-G-LEADS-8 (2026-11-11): an English search (Ministry of Finance and National Planning Zambia Israel debt restructuring agreement signed 2026 press release) returned press reports only (Open Zambia, Youth Village Zambia, Efficacy News: an ''amendment agreement'' signed at the Ministry in Lusaka, obligations restructured to 2043); the Ministry''s site (mofnp.gov.zm, mof.gov.zm) did not answer a script. Kept open (the C2 reading and the signing date are the author''s questions).'
