- id: lead_20261109_UKR_6
  country: UKR
  indicator: B9
  claim: 'The Foreign Minister''s statement of 21 May 2026 on the video of detained Gaza flotilla activists (a speaker under R3), as the Kyiv Independent reports it: the footage is ''unacceptable
    and incompatible with respect for human dignity, human rights, and international law'', and he called for the activists'' ''swift release'' and ''safe return ensured, with a full respect
    for their rights and dignity''. It is a statement on the treatment of activists detained by Israeli authorities, not a call for a ceasefire or an end of the blockade and not a statement
    on violations in Gaza, so it is not a B9 tier on its face (the flotilla statements filed for other countries are joint statements that call the attacks on the flotilla violations of international
    law, evt_2026_04_30_MYS_B9 and its counterparts: twelve foreign ministers, 30 April 2026); the author may read ''incompatible with international law'' as the legal characterisation of the +5 tier. The Ministry''s own text or post
    was not found (search of 2026-11-09), so the evidence is press only and nothing is filed. A Ministry release or an archived post with the quotation would let the author decide; within
    the 730 days of decay (172 days old).'
