- id: lead_20261005_MDA_2
  country: MDA
  indicator: B10
  claim: 'Moldova''s early statements on the attack of 7 October 2023, read and not filed as B10: the Parliament''s declaration
    of 19 October 2023 ''recognising the right of the State of Israel to self-defence'' and condemning the attack, without a mention
    of Palestinian civilians (a parliament is not a B10 speaker, R3); President Maia Sandu''s message (''I condemn the massive
    violence against innocent civilians. My thoughts are with Israel'') and Prime Minister Dorin Recean''s (''We stand together
    against terrorism''). Neither names unconditional support nor denies a violation, and both pre-date the window of decay (more
    than 730 days). A statement by the President, the Prime Minister or the Foreign Minister in later months that supports Israel''s
    operations without condition would decide a B10 event.
    Finish run, T-F-L02 (2026-11-09): the Ministry of Foreign Affairs'' and the Government''s releases of the autumn of
    2026 (mfa.gov.md, gov.md) and the Prime Minister''s General Debate statement of the 81st session hold no statement of
    support for Israel''s operations. Kept open. P-23 pass, T-G-LEADS-5 (2026-11-11): not searched again; the statements of October 2023 are more than 730 days old and T-F-L02 found no later statement of support in the releases of the autumn of 2026. Kept open.'
