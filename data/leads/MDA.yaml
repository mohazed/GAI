- id: lead_20261109_MDA_3
  country: MDA
  indicator: A8
  claim: 'On 20 November 2025 Moldovan customs at the Leușeni-Albița crossing stopped a truck of a Moldovan company carrying munitions,
    an anti-aircraft missile launcher and drone parts; the Prosecutor General''s Office said the items had been smuggled into Moldova
    from Ukraine and that the export customs documents were filed for ''metal articles'' destined for Israel (Moldpres, 26 November
    2025; the transporter, the organiser and the customs broker were charged and detained). The destination is the one in the paperwork:
    the driver said Israel, a member of Parliament and Western sources doubted it, and the Interior Minister said that all hypotheses,
    among them an attempt to discredit Moldova, are examined. Read at T-F-L02 (third session, 2026-11-09) and not filed: a smuggling
    prosecution is neither a denial of transit to a consignment for Israel (A8) nor a policy, and no document of the State links the
    cargo to Gaza. The Prosecutor General''s own release (procuratura.md) was not found by the search and not archived; an archived
    official copy and the outcome of the case would let a reader decide whether it belongs to A8 or E1. P-23 pass, T-G-LEADS-5 (2026-11-11): a Romanian search (procuratura.md Leușeni armament camion Israel articole metalice comunicat 2025) returned press reports (Europa Liberă, Antena 3, Digi24, Adevărul, Radio Moldova, MOLDPRES) quoting the Prosecutor General''s Office and Romania''s DIICOT, and a Watchdog.md analysis of the disinformation around the case; the Prosecutor General''s own release was not found and no outcome of the case was reported. Kept open.'
