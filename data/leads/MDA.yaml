  claim: 'The interinstitutional documents with Israel on the Embassy''s page of the bilateral legal framework (archived: src_20261005_mfa-md_embassy-israel-cadrul-juridic),
    signed since October 2023 and not filed as C2: the memorandum of the Republican Clinical Hospital ''Timofei Moșneaga'' with
    the Rambam Medical Corporation (Haifa, 2 April 2024); the memoranda of the National Archives Agency with the Central Archives
    for the History of the Jewish People (29 July 2024), Yad Vashem (30 July 2024) and the Israel State Archives (31 July 2024);
    the memorandum of the Emergency Medicine Institute with the Meir Medical Center (Kfar Saba, 26 February 2026). The Embassy
    states that such documents are not international treaties. R18 reads C2 as a signed governmental instrument (agreement, memorandum,
    joint declaration setting up a cooperation mechanism); a hospital, an institute or a state agency''s memorandum with an Israeli
    institution is not read as one of the government''s, so none is filed (docs/10 B-526 (3)). The Invest Moldova arrangement of
    21 June 2023 pre-dates the window. A reader who counts agency-level memoranda would add events, with no effect on the score
    while the category cap of -20 holds.
    Finish run, T-F-L02 (2026-11-09): the Ministry of Foreign Affairs'' 49 releases and the Government''s 59 releases of
    the autumn of 2026 (mfa.gov.md, gov.md) name no further instrument with Israel. Kept open. Third session (T-F-L02, with web search, 2026-11-09): the search for further instruments with Israel found Radio Moldova''s report that a meeting of the joint trade commission is planned for 2026, no new signed governmental instrument. Kept open. P-23 pass, T-G-LEADS-5 (2026-11-11): a Romanian and English search (Moldova Israel acord memorandum semnat guvern 2026 mfa.gov.md) returned the instruments already listed (the legal cooperation agreement of 28 May 2025, the declaration of intent of the ministries of agriculture of 3 September 2025, read again in MOLDPRES''s report, both filed), the Emergency Medicine Institute''s memorandum with the Meir Medical Center (agency level, in this lead), a business-forum memorandum signed by private bodies and the Deputy Prime Minister for Reintegration''s courtesy meeting with Israel''s Ambassador (January 2026); no new governmental instrument. Kept open (the R18 reading of agency memoranda is the author''s).'
