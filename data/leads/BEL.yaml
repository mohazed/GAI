- id: lead_20261109_BEL_1
  country: BEL
  indicator: A8
  claim: >-
    The Royal Decree of 18 January 2026 "portant interdiction du survol de l'espace aérien national
    et prohibant les escales techniques des aéronefs transportant du matériel militaire depuis la
    Belgique vers Israël et le Territoire palestinien occupé" (Numac 2025009929, Moniteur belge of
    22 January 2026) prohibits the overflight of Belgian territory and technical stops on it by
    aircraft whose cargo of military equipment would strengthen the military capacities of the
    forces present and which are bound for Israel or the occupied Palestinian territory, including
    when federal or foreign authorisations were obtained before the decree (articles 2 and 3),
    obliges airlines to report such movements (article 4) and enters into force on publication
    (article 5). The session read the text at the Moniteur's address
    (https://www.ejustice.just.fgov.be/eli/arrete/2026/01/18/2025009929/moniteur, answered to a
    plain script on 2026-11-09), but could not archive it: Save Page Now captures a protection page
    of the Moniteur site (6.5 to 6.7 kB, discarded), the Wayback Machine holds no capture of the
    decree's page, and its only capture of the day's Moniteur (the 212-page PDF
    mopdf/2026/01/22_1.pdf, capture of 2026-10-03) exceeds the archiver's text limit. An act of the
    state that denies transit by air would be an A8 event (+5, repeatable) once an archived copy of
    the Moniteur text (or a Federal Public Service Mobility or Cabinet release) exists; A8 stays
    none-found until then. The A8 note of the Council of Ministers' decision of 2 September 2025
    (instruction to refuse Israeli military overflight requests) remains as before.
    Promoted on 2026-11-10 (T-G-BLOCKED, docs/10 B-2119): the Wayback CDX listing of
    mopdf/2026/01/22_1.pdf holds two PDF captures of 22 and 24 January 2026 (the capture of
    2026-10-03 is the site's human-verification page, not the PDF); the capture of 24 January 2026
    was recorded with pnpm archive --capture (2,575,118 bytes, SHA-256 equal to the replay and to the
    PDF the Moniteur serves today), and the decree lies inside the 200 KB of extracted text that the
    archiver keeps. Filed as evt_2026_01_22_BEL_A8.
  sources:
    - url: https://www.vrt.be/vrtnws/fr/2026/01/22/interdiction-de-survol-de-la-belgique-pour-les-avions-charges-de/
      publisher: VRT NWS
      kind: press
      title: Interdiction de survol de la Belgique pour les avions chargés de matériel militaire à destination d'Israël
      date: 2026-01-22
    - url: https://www.cnapd.be/inaction-de-letat-belge-face-au-genocide-a-gaza-nouvelle-victoire-judiciaire-pour-les-plaignants/
      publisher: CNAPD
      kind: ngo
      title: "Inaction de l'Etat belge face au génocide à Gaza : nouvelle victoire judiciaire pour les plaignants"
  date: 2026-11-09
  status: promoted:evt_2026_01_22_BEL_A8

- id: lead_20261109_BEL_2
  country: BEL
  indicator: E3
  claim: >-
    Press reports say that the federal prosecutor received complaints of the Hind Rajab Foundation
    and the Global Legal Action Network in July 2025 against two Israeli soldiers present at the
    Tomorrowland festival and had police locate and question them (under article 14/10 of the
    Preliminary Title of the Code of Criminal Procedure, in force since 28 April 2024), and that in
    July 2026 it set aside a similar complaint of the Foundation against another Israeli at the
    festival because the elements were insufficient to open an investigation. The same press
    recalls that an investigating judge was seized on 17 October 2024 in the matter of the Refaim
    sniper unit (Belgian-Israeli soldiers). The federal prosecutor's own communiqué of July 2025
    (om-mp.be, "Persbericht - Ontvangst van twee klachten tegen twee leden van het Israëlische
    leger", read only as a search summary) could not be archived: Save Page Now captures a protection
    page of the site (6.6 kB, discarded) and the Wayback Machine holds no other capture. E1 and E3
    are unscored in v1 (D-12); both stay none-found until a prosecutor's communiqué or a court
    record is archived.
  sources:
    - url: https://www.dhnet.be/dernieres-depeches/2026/07/23/le-parquet-federal-ecarte-une-plainte-visant-un-israelien-a-tomorrowland-HNZI4U2OIJBCLHTWJPPAML3WKA/
      publisher: dhnet.be
      kind: press
      title: Le parquet fédéral écarte une plainte visant un Israélien à Tomorrowland
      date: 2026-07-23
    - url: https://www.justiceinfo.net/fr/137501-crimes-palestine-justice-belge-binationaux.html
      publisher: JusticeInfo.net
      kind: press
      title: "Crimes en Palestine : la justice belge s'intéresse à ses binationaux"
  date: 2026-11-09
  status: open

