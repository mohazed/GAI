  claim: 'An NGO (named "Environmental Justice" in the report) said in November 2025 that the Portuguese-registered vessel Holder G had put into the port of Maputo with 440 tonnes of military
    equipment for the Israeli arms producer Elbit Systems. The port operator, the Maputo Port Development Company (MPDC), said in a statement of 26 November 2025, reported by AIM on 27 November
    2025 (archived, src_20251127_aim_maputo-port-denies-israel-military-cargo), that the vessel did not dock at any terminal, that it was anchored on 19 November at Buoy N1, 30 nautical miles
    from the quays, where it only took on fuel from the tanker CPG Alma, and that it left on 20 November; its destination per tracking services was Port Said. No Mozambican Government act,
    authorisation or statement was found, and the cargo and its destination rest on the NGO''s claim. Not an A5 instance as it stands (A5 counts a documented transit or port call of
    military cargo to Israel); not an A8 instance (no denial). A Government statement or the maritime authority''s record of the vessel''s call and cargo would decide it. P-23 pass, T-G-LEADS-5 (2026-11-11): a Portuguese search (Holder G navio Maputo Elbit Governo Moçambique INAMAR declaração novembro 2025) returned AIM''s report already archived, Club of Mozambique, and Portuguese reports (Sábado, Renascença) of a parliamentary question to Portugal''s Government about the Portuguese-flagged vessel; no statement of the Mozambican Government or of the Maritime Administration (INAMAR) was found. Kept open.'
