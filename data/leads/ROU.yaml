- id: lead_20261005_ROU_3
  country: ROU
  indicator: D3
  claim: 'The Ministry of Foreign Affairs'' item of 17 October 2024 on the Foreign Minister''s visit to the Hashemite Kingdom of
    Jordan (https://www.mae.ro/en/node/65727, which answers scripted requests with a bot check and could not be archived): at a
    UNRWA girls'' school in Amman the Minister ''announced a humanitarian contribution from Romania, intended for UNRWA operations
    in the Hashemite Kingdom of Jordan'' and stressed the implementation of the recommendations of the Colonna report (as a search-engine
    excerpt of the Ministry''s page reads). It is the only Romanian document found that dates a resumption of funding to UNRWA
    after the hold of 29 January 2024; the filed D2 ends, and D3 restored begins, on 19 July 2024, the date of the UK government''s
    release that lists Romania among the partners that had restored funding (docs/10 B-525 (2)). The Foreign Minister said on 13
    February 2024, after meeting the Arab and OIC ambassadors, that Romania''s assistance to Gaza would continue through other
    channels while the UNRWA investigations were pending (ACTMedia), which shows the hold still in place. An archivable copy of
    the Ministry''s item, or of any earlier Romanian announcement of the resumption, would decide the dates and could raise D3
    restored to `confirmed`.'
