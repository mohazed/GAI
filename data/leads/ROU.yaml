- id: lead_20261005_ROU_4
  country: ROU
  indicator: D4
  claim: 'Romania''s medical-evacuation programme continued after the event filed (docs/10 B-525 (3)): the Ministry of Foreign
    Affairs announced its 12th humanitarian flight on 31 August 2026 (five children and 15 relatives evacuated from Gaza under
    the EU Civil Protection Mechanism and in cooperation with the WHO; two patients treated in Bucharest, three transferred to
    Belgium), and the Air Force flew a C-27J Spartan medical mission on 10 July 2026 for two burns patients to Belgium and Germany
    (MApN release no. 199, https://www.mapn.ro/cpresa/19307_misiune-umanitara-a-for%C8%9Belor-aeriene-romane, not an evacuation
    from Gaza). The Ministry''s releases (mae.ro) cannot be archived; Romanian outlets reproduce the one of 31 August 2026. The
    filed D4 is one event for the programme (docs/02 §2 D4); a reader who counts a new documented phase as a new event (R11) would
    add a D4 event dated 31 August 2026, at +5, which would also end the passivity penalty; it needs an archivable official page
    (MApN, IGSU or the Ministry of Health) for the flight of 31 August 2026.'
