  claim: '(1) The Ministry of Foreign Affairs'' message of 22 November 2024 on the ICC warrants, on its X account (not archivable),
    as HotNews reports it: Romania ''reiterates its principled position on the independence of the ICC'' and there is ''no equivalence
    between Israel, a democracy, and terrorist organisations such as Hamas and Hezbollah''; it states no position on executing
    the warrants and names no speaker, so it is not filed as B5 or B6 (docs/10 B-298 (2), B-517 (4)). (2) Prime Minister Marcel
    Ciolacu announced in January 2025 a joint meeting of the Romanian and Israeli governments in Bucharest and invited Mr Netanyahu,
    who was subject to the ICC warrant; Digi24 headlines that he could be arrested if he came; the meeting did not take place (HotNews,
    3 February 2026). An invitation without a visit is not hosting a person under warrant (docs/02 §2 B6); a statement by the Prime
    Minister or the Foreign Minister on whether Romania would execute the warrant, or a visit of Mr Netanyahu to Romania, would
    decide a B6 or B5 event.'
