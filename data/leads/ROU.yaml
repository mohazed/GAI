  indicator: D4
  claim: 'Romania''s medical-evacuation programme continued after the event filed (docs/10 B-525 (3)): the Ministry of Foreign
    Affairs announced its 12th humanitarian flight on 31 August 2026 (five children and 15 relatives evacuated from Gaza under
    the EU Civil Protection Mechanism and in cooperation with the WHO; two patients treated in Bucharest, three transferred to
    Belgium), and the Air Force flew a C-27J Spartan medical mission on 10 July 2026 for two burns patients to Belgium and Germany
    (MApN release no. 199, https://www.mapn.ro/cpresa/19307_misiune-umanitara-a-for%C8%9Belor-aeriene-romane, not an evacuation
    from Gaza). The Ministry''s releases (mae.ro) cannot be archived; Romanian outlets reproduce the one of 31 August 2026. The
    filed D4 is one event for the programme (docs/02 §2 D4); a reader who counts a new documented phase as a new event (R11) would
    add a D4 event dated 31 August 2026, at +5, which would also end the passivity penalty; it needs an archivable official page
    (MApN, IGSU or the Ministry of Health) for the flight of 31 August 2026.
    Finish run, T-F-L02 (2026-11-09): the Ministry of National Defence''s own release no. 278 of 31 August 2026
    (https://www.mapn.ro/cpresa/19386_, read with a browser User-Agent) is the official copy: a C-130 Hercules ''a
    executat luni, 31 august, o misiune de evacuare medicală din Fâșia Gaza, a cinci pacienți pediatrici, împreună cu rude
    ale lor'', organised by the Ministries of Foreign Affairs, Defence, Interior (Department for Emergency Situations) and
    Health under the EU Civil Protection Mechanism with the WHO, ''al 12-lea zbor umanitar organizat de țara noastră''. It
    could not be archived (Save Page Now answers HTTP 410 for its request and Wayback holds no capture), so the lead stays
    open; the same programme is one D4 event (docs/02 §2), already filed. P-23 pass, T-G-LEADS-6 (2026-11-11): the Wayback CDX index now lists captures of the Ministry of National Defence''s release no. 278 (www.mapn.ro/cpresa/19386_misiune-de-evacuare-aeriana-din-israel, HTTP 200, first capture 20260831225905); recorded from that capture (src_20260831_mapn_c130-evacuare-medicala-gaza, 94,051 bytes, SHA-256 equal to the replay) and added as evidence to evt_2024_09_30_ROU_D4, the programme''s event (points and date unchanged). Not filed as a second D4 event, as B-525 (3) and the United Kingdom''s programme (evt_2025_09_17_GBR_D4) were read; a reading of the 2026 flights as a new documented phase under R11 would add a D4 event dated 31 August 2026 (+5, inside the 365 days of the passivity rule) and is the author''s (docs/10 B-2148). Kept open for that reading.'
