  claim: 'The 2025 annual report of ANCEX (the export-control department of the Ministry of Foreign Affairs), published in March 2026 at
    https://ancex.ro/wp-content/uploads/2026/03/Anual.pdf, is reported by Snoop and HotNews (26 March 2026) to show exports actually made
    to Israel of EUR 78.3 million in 2025 (25 per cent of the EUR 314 million total, the largest destination; Czechia second at EUR 36.1
    million), EUR 75.8 million in 2024 and EUR 59 million in 2023, and 33 definitive export licences for Israel in 2025 (over EUR 307 million),
    26 in 2024 (EUR 102 million) and 16 in 2023 (EUR 67.5 million); the largest category is ML 11, electronic equipment (EUR 21.4 million).
    The report was not read: ancex.ro answers HTTP 503 to scripts and to Save Page Now (Wayback holds only 503 captures), so the figures are
    the press''s. They show that licensing continued; A6 asks for a suspension and stays none-found, and the figures are not scored (A1 and
    A2 are generated from SIPRI and Comtrade). An archived copy of the report would let the author decide whether the figures belong in
    the country page as context. P-23 pass, T-G-LEADS-6 (2026-11-11): the Wayback CDX index holds four captures of ancex.ro/wp-content/uploads/2026/03/Anual.pdf, all HTTP 503 (the latest of 9 November 2026), and no capture of the report itself; not retried with Save Page Now. Kept open.'
