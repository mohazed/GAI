  country: ROU
  indicator: B9
  claim: 'The Foreign Minister''s General Debate statement of 27 September 2025 (80th session), in the English text published at
    https://gadebate.un.org/sites/default/files/gastatements/80/ro_en.pdf (read on 2026-10-05 by a direct request; Save Page Now
    answers HTTP 405 for that site and Wayback holds no capture): ''Looking at the global map, we are concerned about the escalation
    of tensions and conflicts in the Middle East. An immediate ceasefire in Gaza, the unconditional release of all hostages, as
    well as adequate humanitarian assistance are merely the first steps towards a permanent end to hostilities.'' It would be a
    B9 event at the call tier (+2) for the Minister of Foreign Affairs, a B9 speaker (R3), dated 27 September 2025, inside the
    decay window; it cannot be filed without an archived copy of the UN''s text (CLAUDE.md; docs/10 B-509 for a statement with
    no quotable copy). The verbatim record of the 12th and 13th meetings of the 80th session (A/80/PV.12 or PV.13) is not retrievable
    by a script (docs.un.org is a script-loaded viewer); a Wayback capture of the General Debate file, or the UN''s verbatim record
    in an archivable form, would decide the event. The President''s statement of the 81st session (23 September 2026, https://gadebate.un.org/sites/default/files/gastatements/81/ro_en.pdf)
    calls to ''advance the implementation of the Peace Plan for Gaza, in accordance with Security Council Resolution 2803, and
    to address the humanitarian situation on the ground without delay'': no call for a ceasefire.
    Finish run, T-F-L02 (2026-11-09): Save Page Now was tried again on the same file and answered HTTP 405 (the failed
    index row was removed); the Wayback CDX lists no capture of gastatements/80/ro_en.pdf; the UN''s page of the statement
    (gadebate.un.org/en/80/romania) dates it 27 September 2025, and the UN Meetings Coverage summary
    (press.un.org/en/2025/ga12714.doc.htm) paraphrases the passage in indirect speech, which R4 does not accept. Kept
    open. Third session (T-F-L02, with web search, 2026-11-09): the Wayback CDX holds no capture of the General Debate file (gadebate.un.org/sites/default/files/gastatements/80/ro_en.pdf) and Save Page Now answers HTTP 405 for the site, so no archived copy could be made; a search for a Romanian-language relay of the Minister''s statement of 27 September 2025 was not run. Kept open. P-23 pass, T-G-LEADS-6 (2026-11-11): an English search (A/80/PV.13 General Assembly 27 September 2025 Romania Țoiu) found the Ministry of Foreign Affairs'' press release of 28 September 2025 in the press-release feed of AGERPRES (''Comunicat de presă - MAE''), which prints the Ministry''s English transcript of the statement as delivered, with the passage above; archived with Save Page Now (src_20250927_agerpres-mae_toiu-unga-80-statement, 63,701 bytes, SHA-256 equal to the replay). documents.un.org redirected A/80/PV.12 to PV.14 to its error page for a scripted request. Filed as evt_2025_09_27_ROU_B9 (+2, call tier, flagged for the official copy''s channel).'
