  claim: >-
    Press reports say the Prime Minister, Anwar Ibrahim, said on 22 November 2024 that the ICC's arrest warrants for
    Benjamin Netanyahu and Yoav Gallant were apt and well justified, called them a monumental victory for justice,
    and said the two should be arrested even when visiting other countries. Read from search summaries only. The
    statement is not among the Ministry of Foreign Affairs' press releases or speeches of November 2024 (both
    listings were read in full back to October 2023) and was not found on the Prime Minister's Office site; it may
    have been published on the Prime Minister's social media accounts. Malaysia is not a party to the Rome Statute.
    A B5 event (+8, standing) needs the Prime Minister's own words in an official text or official video (docs/10
    B-414 (3)).
    Finish run, T-F-W9 (2026-11-09): the Prime Minister's Office verbatim listings were read for the window only
    (its site search matches loosely and about half the requests were refused); no official copy found; kept open
    (docs/10 B-925).
