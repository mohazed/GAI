- id: lead_20261111_MYS_2
  country: MYS
  indicator: A8
  claim: >-
    The Malaysian Border Control and Protection Agency (AKPS) said in a statement of 8 August 2026, as The Star
    (8 August 2026) and Bernama report it, that a container was detected and seized at the Port of Tanjung Pelepas,
    Johor, on 7 August 2026, suspected of violating Item No. 15 of the Second Schedule of the Customs (Prohibition of
    Exports) Order 2023, and that it would verify "the nature, specifications, intended use and classification of
    the goods", including whether they are strategic goods under the Strategic Trade Act 2010. Bloomberg, as The
    Jerusalem Post reports it (15 September 2026), says the container came from the Philippines, was consigned to
    Elbit Systems and was suspected of holding weapons, and that three further containers bound for Ashdod (parts
    of electric bicycles) were stopped on 19 August 2026; both were transit shipments. The Prime Minister wrote on
    Facebook on 8 August 2026 that the country "will never become a route for trade that could support or
    contribute to the atrocities of the Israeli regime" (The Star), and on X on 15 September 2026 that "any
    suspicious shipment will be subject to inspection and investigation in accordance with Malaysian law" (Bernama,
    Malay Mail); a Minister in the Prime Minister's Department supported the seizure in a statement of 18 September
    2026 (RTM). Read on 2026-11-11 from press pages only (The Star, Malay Mail, Bernama, The Jerusalem Post, RTM);
    the AKPS site (akps.gov.my) did not answer from this network and the Internet Archive was offline, so nothing
    was archived. Reading for the author: a transit shipment consigned to an Israeli arms maker, seized by a state
    agency under the export prohibition, would be an A8 instance (+5, port denial to a shipment bound for Israel's
    military) dated 7 August 2026 once an official copy of the AKPS statement (or the Prime Minister's own post,
    which the pipeline does not archive) is archived; whether the contents must first be confirmed as arms or
    strategic goods is the author's decision. The three containers of 19 August 2026 (bicycle parts) are not arms.
    The Customs (Prohibition of Exports) Order 2023 itself was not read (its date decides whether it is a measure
    of the window; A7 reads pre-existing restrictions as outside the window). Found by T-G-RS-3 (2026-11-11) in
    the Malay search of A8; not seen by the wave-9 session of 2026-09-29 or the finish run.
    A search restricted to akps.gov.my, pmo.gov.my, moha.gov.my, customs.gov.my, mot.gov.my and miti.gov.my
    (2026-11-11) found no copy of the AKPS statement or of a Government release on the seizure.
