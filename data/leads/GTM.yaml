- id: lead_20261109_GTM_3
  country: GTM
  indicator: B9
  claim: 'Emisoras Unidas reports (27 August 2025) a statement of Guatemala''s Ministry of Foreign Affairs, issued for the Government of President Arévalo, that expresses ''profunda preocupación''
    about the situation in the Gaza Strip and says ''Guatemala hace un llamado urgente a las partes al establecimiento de un alto al fuego inmediato'', with protection of civilians, the release
    of all hostages and unrestricted humanitarian access; the same searches show Ministry statements on Gaza of 4 June 2024 (support for a ceasefire proposal) and 21 March 2025 (regret at the
    breakdown of the ceasefire). The statements name no speaker (R3: B9 needs the head of state, the head of government or the foreign minister) and speak of a ceasefire without naming a violation;
    not filed. Press only (a page of Emisoras Unidas, read through WebFetch; the Ministry''s site and the national agency''s answer a Cloudflare check that was not bypassed). A filing, if the
    author reads a Ministry communiqué as a position of the state, needs the Ministry''s own text, archived (a decision of the R2 kind, docs/10 B-441). P-23 pass, T-G-LEADS-3 (2026-11-10): a Spanish search (MINEX Guatemala comunicado Gaza alto al fuego inmediato 27 agosto 2025) found Emisoras Unidas and the national agency''s items (agn.gt, which say the Ministry published the ''Comunicado relativo a la situación en la Franja de Gaza'' on its X account); minex.gob.gt and agn.gt answer 403 to a script (curl, 2026-11-10), so the Ministry''s own text is still not archived; it names no B9 speaker in any case (R3). Kept open.'
