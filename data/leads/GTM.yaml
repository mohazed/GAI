  claim: 'Press and the national agency''s headlines report that Guatemala and Israel signed a free trade agreement on 8 September 2022 in Tel Aviv, that Guatemala''s Congress approved it on 29
    November 2023 (Decree 17-2023 as the results give it), and that it entered into force on 1 March 2024 (the national agency''s headline and search summary; a Prensa Libre item gives 4 March;
    the two pages answer 403 and were not read, so the dates are the search summaries). C2 counts an agreement ''signed with Israel since October 2023'': the signature precedes the window, so
    no event is filed; the ratification and the entry into force are the part that falls after 7 October 2023. A reading for the author (a reader who counts ratification or entry into force would
    file C2 at -10, standing from 1 March 2024); the Congress''s own decree, the Ministry of Economy''s treaty page or the Official Gazette, archived, would be the primary. Not read: the Congress''s
    site and the Ministry of Economy''s treaty page were not fetched in this pass. P-23 pass, T-G-LEADS-3 (2026-11-10): a Spanish search (Decreto 17-2023 Congreso Guatemala Tratado de Libre Comercio Israel) found the Ministry of Economy''s profile of the agreement (July 2024), now archived as src_20240805_mineco-gt_perfil-guatemala-israel (891,761 bytes, SHA-256 equal to the Wayback replay and a direct download): ''suscrito en septiembre de 2022'', ''Aprobación: Decreto No. 17-2023 del Congreso de la República de Guatemala'', ''Entrada en Vigor: 01 de marzo de 2024''. The primary the lead asked for is now archived; the filing still waits for the author''s reading of C2 (''signed since October 2023''; default not filed, docs/10 B-970 (2)). Kept open.'
