  claim: 'EFE reports (11 April 2013) that Guatemala recognised Palestine that week as a ''free, independent and sovereign'' State, the Foreign Minister Fernando Carrera announcing it by videoconference
    from the UN; the registry gives 9 April 2013. No document of the Government of Guatemala (the Ministry''s communiqué or the Minister''s statement) is archived, so there is no row in data/structured/recognitions.csv
    (R21). Once a state document is archived the row adds B8 +3 (the pre-existing tier). Re-checked 2026-11-09 (T-F-L05): the Ministry of Foreign Affairs'' site answers 403; the Wayback CDX window
    of 9 April to 31 May 2013 for www.minex.gob.gt lists no page whose address names Palestine or a communiqué, and the capture of the home page of 20 April 2013 (204,470 bytes) has no item on
    Palestine. No state document found; no recognitions row added. Re-checked with search (T-F-L05-R, 2026-11-09; Spanish): the searches returned press items on the recognition (the Foreign Ministry
    statement of 2013 is not among them as a state document) and an AGN item on the Government''s position on the conflict, whose site answers a Cloudflare check that was not bypassed; no state
    document found, no recognitions row added. The lead stays open. Candidate state document found in the redo pass (T-F-L05-R, 2026-11-09): the delegation of Guatemala''s statement to the United
    Nations conference on the two-State solution of 30 July 2025, published by UNISPAL (https://www.un.org/unispal/wp-content/uploads/2025/07/guatemala_nyc_es.pdf; 6 pages, ''En nombre del Gobierno
    de Guatemala''), says ''La República de Guatemala reconoció oficialmente a Palestina el 8 de abril de 2013, como un Estado libre, independiente y soberano.'' It is a state document of the
    kind Angola''s row rests on and would support the row `GTM,2013-04-08` (B8, +3). Save Page Now captured it, but the Wayback replay answered the Internet Archive''s bot-filter text (620 bytes)
    for about fifteen minutes, so the capture could not be checked against its replay (B-880) and was not recorded; a later session should archive it again (`pnpm archive <url> --kind official
    --id src_20250730_unispal_gtm-two-state-conference`), check the replay, and add the row. The statement names no speaker (R3), so it is not a B9 event.'
