    for the speaker''s exact words), they speak of support and solidarity ''in this challenging time'' and not of support for Israel''s conduct in Gaza, and the same report notes that the President
    had not called for a ceasefire. Not filed as B10; decayed to zero in any case (962 days). Re-checked 2026-11-09 (T-F-L05): the Presidency''s own item of 19 February 2024 on the Munich visit
    (bernardoarevalo.presidencia.gob.gt, ''Presidente Arévalo continúa en París actividades gira de trabajo por Europa'') lists the meeting with Israel''s President, the International Criminal
