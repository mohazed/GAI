  claim: 'President Santiago Peña''s statements of 11 and 12 December 2024 in Israel. At the Knesset (Wednesday 11 December) he said, as La Política Online reports (read): ''Paraguay es uno de
    los países que siempre ha apoyado a Israel después de los terribles ataques del 7 de octubre. Este no fue solo un ataque contra Israel, sino contra todos nosotros'', and the same report quotes
    him as saying ''siempre acompañaremos a Israel cueste lo que cueste'' (the quotation is Netanyahu''s recollection of the speech). At the inauguration of the embassy in Jerusalem (Thursday
    12 December) Agencia IP (archived, read) quotes: ''Como dije ayer vamos a estar con Israel pase lo que pase'' and says the reopening ''ratifica que Paraguay apoyará a Israel incondicionalmente,
    según dijo el mandatario''. None of the texts read cites Gaza (docs/calibration/README.md R7: the document must cite Gaza for B9 and B10 alike), and the Knesset''s own text of the address
    (m.knesset.gov.il/EN/activity/Documents/SpeechPdf/Pena.pdf) answers ''the site is temporarily inaccessible from your location'' and has no Wayback capture, so it could not be read. If a full
    text that cites Gaza were found, each would be a B10 event (-5, 663 days old, decayed to about -2); the same standard applies to the President''s General Debate statements of September 2024
    and September 2025 (right of Israel to defend itself, calls to relieve the humanitarian situation and free the hostages, no mention of Gaza), read in full and kept in the B10 assessment note.
    Re-checked in the redo pass (T-F-L06-R, 2026-11-09, Spanish and English searches), the Presidency''s own report of 13 December 2024 (Wayback capture of 19 August 2026, read) describes the
    embassy ceremony and the meetings without quoting the Knesset address; the Knesset text was not found; the lead stays open.'
