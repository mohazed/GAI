    to culminate in a sit-in outside the US Embassy in Islamabad to demonstrate solidarity with Gaza.'' Aaj English TV (24 October 2025) quotes the notification: ''The Federal government hereby orders
    TLP to be a Proscribed Organisation for the Act and lists the aforesaid organisation in the FIRST SCHEDULE.'' The measure bans an organisation on grounds of terrorism after clashes in which police
    officers were killed, not Palestine solidarity protests or symbols as such; recommended reading: not E2 (unscored, D-12), recorded so that the author sees it. The notification itself was not read
    (docs/10 B-2021). P-23 pass, T-G-LEADS-6 (2026-11-11): an English search (Ministry of Interior notification Tehreek-e-Labbaik proscribed organisation First Schedule October 2025 nacta.gov.pk list) returned Dawn, Geo, ARY, Business Recorder and Daily Times reports of the notification (in search excerpts: under section 11B(1) of the Act, one report citing SRO 2011(1) of 2025, on ''reasonable grounds to believe'' that the party ''is connected with and concerned in terrorism''); the notification and NACTA''s list were not found in an archivable official copy. The reading (not E2) is unchanged. Kept open (E2 unscored).'
