  claim: >-
    The agreement on the establishment of diplomatic relations between the State of Palestine and
    Antigua and Barbuda, signed in New York on 14 June 2024 by the Minister of Foreign Affairs Paul
    Chet Greene and Palestine's Permanent Observer Riyad Mansour, to be submitted to the
    Secretary-General by a memorandum of understanding (WAFA, the Palestinian news agency; no
    Antiguan document read). The registry dates Antigua and Barbuda's recognition 22 September 2011,
    so the agreement is not a recognition and no B8 event of +8 (recognition after 7 October 2023)
    is filed; the pre-existing tier (+3) needs a state document archived (R21). The Government's or
    the Mission's own release of the agreement, archived, would settle both the date of the
    recognition and whether the agreement is read as a B8 act. P-23 pass, T-G-LEADS-1 (2026-11-10):
    an English search found the UN Digital Library record of note verbale NV/2024/38, 'Diplomatic
    relations between Antigua and Barbuda and State of Palestine as of 14 June 2024' (record
    4053671, dated 2024-06-14; the English file NV_2024_38-EN.pdf, 222,347 bytes, is a scan without
    a text layer, not OCR'd and not archived), and press reports (Antigua News, Kaieteur News); no
    Government release. B8 is already set by the recognition row ATG,2011-09-22 (pre-existing tier,
    +3); an agreement on diplomatic relations is not a recognition, so the note verbale would change
    no score. Kept open for the author's reading of the agreement.
