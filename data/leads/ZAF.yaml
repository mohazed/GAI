- id: lead_20260928_ZAF_2
  country: ZAF
  indicator: A6
  claim: >-
    The National Conventional Arms Control Committee (NCACC) stated in November 2023 that South
    Africa does not export arms to Israel and that export applications to countries in conflict are
    not eligible under the National Conventional Arms Control Act (reported by defenceWeb; the
    report is reproduced on Armscor's website). Not filed as A6: the text read is a press report,
    and a statement that no exports exist is not a decision suspending or refusing a class of
    licences unless the NCACC or the Cabinet records such a decision. Promote with the NCACC's own
    statement, its quarterly or annual report showing refusals for Israel, or a parliamentary answer.
  sources:
    - url: https://www.defenceweb.co.za/industry/industry-industry/no-south-african-arms-exports-to-israel-ncacc/
      publisher: defenceWeb
      kind: press
      title: "No South African arms exports to Israel – NCACC"
    - url: https://www.armscor.co.za/wp-content/uploads/2023/11/No-South-African-arms-exports-to-Israel-%E2%80%93-NCACC.pdf
      publisher: Armscor (reproduction of the defenceWeb report)
      kind: press
      title: "No South African arms exports to Israel – NCACC"
  date: 2026-09-28
  status: open

