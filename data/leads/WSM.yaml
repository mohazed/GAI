  claim: 'The Samoa Observer (8 January 2026, read) reports that Prime Minister La''auli, speaking as special guest at the ICEJ Samoa prayer service on Tuesday 6 January 2026, said: "I [have]
    instruct[ed] our foreign affairs to start preparation to open an office of Samoa in Jerusalem this year". The article notes that the 2025/2026 Budget has no funding for it. An embassy or office
    is not an indicator act (docs/10 B-599); recorded as the stated plan, with no instrument or opening found. The Government''s own release of 23 October 2025 (src_20251023_samoagovt_pm-meets-israel-deputy-foreign-minister)
    says the Prime Minister hosted Israel''s Deputy Foreign Minister and that ''Samoa is looking at potential representation in Israel''. Re-checked 2026-11-10 (T-F-L11): the Samoa Observer of 21 February 2026 (read) reports the Head of State mentioning the plan to open a mission in Jerusalem later in 2026 to Israel''s new ambassador; no instrument or opening was found; the lead stays open. P-23 pass, T-G-LEADS-8 (2026-11-11): an English search (Samoa embassy Jerusalem opening 2026 Prime Minister La''auli Israel agreement signed) returned the reports of January 2026 (Israel''s Foreign Ministry on the call with the Prime Minister, AFP, JNS, RNZ) and no report of an opening or a signed instrument. Kept open.'
