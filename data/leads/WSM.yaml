  claim: 'Talamua Online (Apia, 18 September 2025, read) reports that Prime Minister Laaulialemalietoa Leuatea Polataivao Fosi Schmidt, asked by the media about the Jewish elements at his swearing-in,
    said: "So diplomatically, religiously, culturally, we stand with Israel", and "From now on and until I''m not longer the Prime Minister, I stand in support of Israel and Gods people" (the
    article''s spelling). The article also has him say that Samoa and Israel ''have signed an agreement for mutual recognition and support'' (no instrument named). Known from press only (no Government
    text or video found: the Government''s site has the swearing-in address of 16 September 2025 in Samoan and no passage on Israel). A B10 event (-5; no legal qualifier, no condition on Israel)
    if an official transcript or video is archived; the wording does not cite Gaza (R7), so it would also need to be read under R7. Middle East Eye (reporting Talamua) repeats it: one origin. Re-checked 2026-11-10 (T-F-L11): the Government portal''s search (Israel, Gaza, Palestine) returns no transcript or video of the statement; the lead stays open. P-23 pass, T-G-LEADS-8 (2026-11-11): not searched again for a transcript (the Government portal was searched on 2026-11-10); the search below returned no Government text with the Prime Minister''s words. Kept open.'
