  claim: 'Two items on the President''s and the Foreign Minister''s words, neither filed. (1) At the 81st session of the General
    Assembly (26 September 2026) the Minister of Foreign Affairs, a B9 speaker (R3), is reported by Asia Plus to have expressed
    concern over Gaza and called for a lasting ceasefire and unhindered humanitarian access. The UN''s automatic transcript
    of the General Debate sitting of 26 September (Day 5, timestamp 5:30:49) carries the words: "We reiterate our call for
    a lasting ceasefire in Gaza and unhindered access to humanitarian assistance." The transcript page is 1.9 MB and the archiver
    truncates extracted text at 200 KB (the passage is at about 224 KB), so no quotable copy exists; a copy of the speaker''s
    own text (the General Debate site''s text, or the verbatim record A/81/PV when published; the Ministry''s own page of
    27 September 2026, mfa.tj/en/main/view/19581, is a third-person summary with no passage on Gaza and was not archived)
    would decide a B9 event at +2 that counts at full weight today (docs/10 B-509). Update of 2026-11-09 (T-F-L01 resumed): the speaker''s own text is at gadebate.un.org/sites/default/files/gastatements/81/tj_en.pdf (231,438 bytes, SHA-256 04a40d568693f17c…, the sentence is in it), but Save Page Now answers HTTP 405 for that host and the Wayback CDX holds no capture of the file, so it is still not archivable; a later capture or A/81/PV decides (docs/10 B-955). (2) The President''s speech at the Extraordinary
    Arab-Islamic Summit in Riyadh (11 November 2024) is known through the Ministry''s third-person account with a few quoted
    phrases (a call on the parties to resolve disputes through negotiations; support for a State of Palestine on the 1967
    borders with East Jerusalem as its capital); the full text was not found (president.tj loads its texts by script). Official
    page: https://transcripts.un.org/en/asset/k16/k16g777u83. Official page: https://www.mfa.tj/en/main/view/16117/participation-in-the-extraordinary-joint-arab-islamic-summit-in-the-city-of-riyadh. P-23 pass, T-G-LEADS-7 (2026-11-11): (1) the Wayback CDX still holds no capture of gastatements/81/tj_en.pdf; the 81st session''s General Debate meetings are not on transcripts.un.org (meetings 5 to 12 answer 404), so the asset transcript cited above stays the only route (an author''s reading, docs/10 B-2134 (3)). (2) A Russian search and a search limited to president.tj, mfa.tj and khovar.tj returned the Ministry''s third-person account of 12 November 2024 (mfa.tj/en/main/view/16117) and the President''s full speech at the joint summit of 11 November 2023 (mfa.tj/en/main/view/13739, ''Tajikistan strongly condemns the attack on civilian facilities in Gaza''; older than 730 days, not this lead''s item); no full text of the address of 11 November 2024 was found. Kept open.'
