  claim: 'Press (Kommersant) reports that the lower house of Parliament examined a draft resolution to terminate the Rome Statute of the International Criminal Court, after the authorities declined to execute the Court''s warrant for the Russian President during his state visit to Dushanbe in 2025. It concerns the Court in general, not the warrants of 21 November 2024; no statement of the Government on the warrants for Israel''s Prime Minister and former Defence Minister was found. The date of the parliamentary item and the primary (the Assembly''s record) were not found. P-23 pass, T-G-LEADS-7 (2026-11-11): a Russian search (Таджикистан выход из Римского статута Маджлиси намояндагон постановление 2026) returned expert.ru (the Council of the lower house examined on 16 September 2026 a draft resolution ''on terminating the Statute of the International Criminal Court''; the decisions taken were not disclosed) and the Court''s press release of 7 May 2026 referring Tajikistan''s non-compliance in the Putin case to the Assembly of States Parties; no adopted resolution and no depositary notification of a Tajik withdrawal were found. Kept open (a withdrawal notified to the Secretary-General would be a B6 event as for the Niger and Chad).'
