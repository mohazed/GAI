- id: lead_20261013_FIN_1
  country: FIN
  indicator: D2
  claim: 'On 27 August 2026 the Minister for Foreign Trade and Development, Ville Tavio, announced that Finland will not renew its multi-year funding agreement with UNRWA (2023-2026, EUR 5 million
    a year) when it expires and that the overall level of Finnish funding for the Palestinian territories will not fall but will go through other channels such as the World Food Programme; Yle
    (27 August, 14:41) quotes a press release in which he says ''We are exploring different possibilities''. Helsinki Times (27 August 2026, read) says the announcement was Tavio''s post on X
    (''has not granted further funding''; ''The level of funding will not decrease, but it will be provided through other channels, such as the World Food Programme'') and cites no Ministry release;
    the Ministry''s own text was not found (valtioneuvosto.fi cannot be searched by a script). Payments under the agreement continued to 2026 (UNRWA thanked Finland for the disbursement of the
    2023-26 funds, per press), so no payment is withheld: read as the end of a funding relationship after 2026, not a suspension. A D2 event (flagged, as Sweden''s end of core funding, docs/10
    B-283 (1)) if the Ministry''s release is archived and the author reads the non-renewal as a funding stop.'
