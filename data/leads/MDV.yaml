  indicator: E2
  claim: 'The arrest under a court order of two women who protested daily against the war in Gaza near embassies and ambassadors'' residences in Malé (August 2024). MV Republic (29 August 2024): ''Two
    women have been arrested for continuously protesting against Israel''s ongoing atrocities in Gaza, marking the first time in the Maldives that arrests have been made for such demonstrations. A police
    spokesman confirmed on Wednesday that the arrests were made under a court order. According to the police, the women were detained for allegedly disrupting activities at embassies and the residences
    of ambassadors in the capital, Malé.'' An enforcement act against two persons on a charge of disruption, not a decree or ruling banning Palestine solidarity protests or symbols (the E2 evidence rule);
    recorded as a lead, as for the Egyptian arrests (B-454) and lead_20261110_LKA_2. Marches in solidarity with Palestine took place in Malé (20 October 2023, the photograph caption of the same page).
    The police''s statement and the court order were not found (docs/10 B-2019). P-23 pass, T-G-LEADS-5 (2026-11-11): an English search for the police statement and the court order returned MV Republic and The Edition reports (the police cited the Freedom of Peaceful Assembly Act; the Criminal Court released the two women on condition that they not protest near foreign embassies in the capital) and the CIVICUS Monitor; no police release or court order was found, and the release condition is an order in an individual case, not a decree or ruling banning solidarity protests. The women''s names are not recorded here. Kept open (E2 unscored).'
