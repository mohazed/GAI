  claim: 'The dates of the first arrivals of children from Gaza under the Maltese programme of medical care (docs/10 B-723 ff.; the programme itself is filed as a D4 event dated 22 September 2025 from the Prime Minister''s
    release and General Debate address). MaltaToday of 19 February 2024 reports that Selah, aged three, was to receive free care at Mater Dei Hospital after the Government of Malta ''offered to treat her
    ... for free'', the Palestinian embassy having announced it; MaltaToday of 25 February 2024 reports that she ''arrived in Malta for medical care on Tuesday'' (20 February 2024) and that the Prime
    Minister announced that ''Malta will be accepting more children from Gaza''; MaltaToday of 10 April 2025 reports that four children from Gaza arrived in the early hours of Thursday 10 April 2025, ''government
    has announced''. A reader who accepts the press dates would move the D4 event to 20 February 2024. The Government''s own release of the arrival of 10 April 2025 (the Department of Information, gov.mt,
    which answers HTTP 403 to scripts) was not read. Finish run, T-F-L14 (2026-11-10): the Office of the Prime Minister''s release PR251482 of 29 August 2025 (src_20250829_pm-gov-mt_pm-visits-gaza-patient, archived from Wayback) says a patient ''was brought to Malta last April ... under an initiative coordinated through the European Union Civil Protection Mechanism'' and that ''Malta was among the first EU member states to welcome patients from Gaza''; the D4 event was moved to 29 August 2025 on that release. The Government''s own release of the arrival of 10 April 2025 and any official text of February 2024 were not found (primeminister.gov.mt answers 403; no Wayback capture found by search); the press dates stay in this lead. P-23 pass, T-G-LEADS-5 (2026-11-11): English searches for the Government''s release of 10 April 2025 and for the Prime Minister''s visit to the four children (15 April 2025, reported by The Malta Independent and Maltadaily, which cite the Office of the Prime Minister) returned press reports and the release of 29 August 2025 already archived; the Wayback copy of primeminister.gov.mt''s April 2025 listing (captured 24 May 2025) shows only its first page (releases of 24 to 29 April 2025) and the CDX index holds no capture of a Gaza release of that month. Kept open (the press dates stay in this lead).'
