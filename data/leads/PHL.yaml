    calls upon all parties to adhere to their obligations under international law, with particular emphasis on the protection of civilians, especially women and children, and the facilitation of
    humanitarian assistance to all those who are in need'' (GMA News, 27 May 2025, and Philstar, 27 May 2025, read; the Philippine News Agency''s report, mirrored by GlobalSecurity.org, read,
