    ceasefire in Gaza'', Inquirer, read) is older than 730 days. A Manila Bulletin item of 7 August 2025 (not read: its site shows a bot check) is said by search results to report the President
    calling the humanitarian cost in Gaza ''unacceptable'': not used.'
