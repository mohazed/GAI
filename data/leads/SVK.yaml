  claim: 'Prime Minister Fico''s post of 25 February 2025 on the ICC, as the press quotes it: ''I do not doubt for a second that the ICC warrants for Vladimir Putin or Benjamin Netanyahu were
    politically motivated. But how are we to react to them? By ignoring them, although we recognise the ICC''s jurisdiction?''; ''if someone mentioned the ICC to me a few years ago, I felt seriousness
    and respect. Today I find it laughable'', asking whether it is time to abolish it (info.sk, in Slovak; the post itself is on a social network and is not archivable). It criticises the warrants
    and the Court and asks a question about ignoring them; it states no position on executing them, so it is not filed as B5 or B6 (docs/10 B-298 (2), R2). The Foreign Minister said in New York
    on 24 September 2026 that Slovakia supports the ICC and the Rome Statute and wants to be an active partner in accountability for the most serious crimes (SITA, TASR; the Ministry''s release
    is not archivable). A statement of the Prime Minister or the Foreign Minister on whether Slovakia would execute the warrant against Mr Netanyahu, archived, would decide a B5 or B6 event.'
