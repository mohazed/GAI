    the basic principles of international humanitarian law are being violated'', and ''called on the Israeli side to allow humanitarian aid unconditionally'' (the Ministry''s release of that day
    is the primary; its text could not be archived); the statements page of the Ministry (Wayback capture of 26 March 2025, not archived as a source) lists the titles below; (3) the title ''Anniversary
    of the Hamas terror attack on Israel. Minister Blanár: One year since the Hamas attack, the Middle East is closer to war than peace'' (October 2024, listed on the Ministry''s statements page,
