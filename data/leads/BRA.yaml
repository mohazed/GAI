      publisher: Poder360
      kind: press
      title: "Lula remove embaixador de Israel e o transfere para Genebra"
    - url: https://en.mercopress.com/2024/05/29/brazil-downgrades-diplomatic-mission-in-tel-aviv
      publisher: MercoPress
      kind: press
      title: "Brazil downgrades diplomatic mission in Tel Aviv"
