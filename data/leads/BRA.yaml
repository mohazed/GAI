- id: lead_20261109_BRA_1
  country: BRA
  indicator: B12
  claim: >-
    Press reports of 19 February 2024 say the Ministry of Foreign Affairs recalled Brazil's ambassador in Tel Aviv,
    Frederico Meyer, for consultations, after Israel's Foreign Minister declared the President persona non grata, and
    summoned Israel's ambassador; press reports of 29 May 2024 say the President removed the ambassador from the
    post and that no successor would be sent, the embassy being led by a chargé d'affaires. The Ministry's press note
    of 29 May 2024 on his designation as Special Representative to the Conference on Disarmament (read in its Wayback
    capture 20240604010437) says only that he 'exercia o cargo de Embaixador do Brasil em Israel'; it does not state a
    recall. No Ministry announcement of the recall of 19 February 2024 was found among the press notes captured from
    19 February to 5 March 2024, and the Diário Oficial decree of removal was not found by search. Promote to a B12
    event (recall, +5 standing) only with the Ministry's announcement or the decree, archived.
    P-23 pass, T-G-LEADS-1 (2026-11-10): two Portuguese searches (one restricted to in.gov.br,
    planalto.gov.br and gov.br) found press reports that the decree removing the Ambassador ex
    officio from the Embassy in Tel Aviv to the Permanent Mission in Geneva was signed on 28 May
    2024 and published in the Diário Oficial da União of 29 May 2024 (Brasil de Fato, Congresso em
    Foco, O Povo), and the Ministry's press note of 29 May 2024 already read; the decree's page was
    not found (the Diário Oficial's PDF viewer at pesquisa.in.gov.br asks for a captcha field and
    was not used). Kept open.
  sources:
