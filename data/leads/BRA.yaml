- id: lead_20261109_BRA_2
  country: BRA
  indicator: E3
  claim: >-
    Press reports of January 2025 say a federal judge of the Federal District, Raquel Soares Chiarelli, ordered the
    Federal Police on 30 December 2024 to investigate an Israeli soldier visiting Brazil, on a complaint of the Hind
    Rajab Foundation concerning the destruction of civilian property in Gaza, that the Federal Police asked for the
    order to be reconsidered, that the soldier left Brazil in early January 2025 and that the case was placed under
    seal. No court document or Federal Police statement was read. Promote to an E3 event (experimental, unscored in
    v1) only with the court's decision or an official statement of the federal judiciary or the Federal Police,
    archived.
    P-23 pass, T-G-LEADS-1 (2026-11-10): a Portuguese search for a decision or note of the Federal
    Court of the Federal District (TRF1, SJDF) or the Federal Police found press reports of January
    2025 only (the case placed under seal on 5 January 2025). Kept open.
