# Leads for the United Arab Emirates: press or NGO claims without an archived primary document.
# Never scored (docs/03 §10). P-D research session, wave 8, 2026-09-29.
- id: lead_20260929_ARE_1
  country: ARE
  indicator: B6
  claim: >-
    Press reports say the President of the United Arab Emirates received the Israeli Prime Minister,
    Benjamin Netanyahu, subject of the International Criminal Court's arrest warrant of 21 November
    2024, in Abu Dhabi on Sunday 27 September 2026, and that the Emirates News Agency (WAM) confirmed
    the meeting on 28 September 2026 ("discussed bilateral relations between the UAE and Israel and
    ways to strengthen and develop them", as the press reports it); the Israeli Prime Minister's
    Office said the visit was at the President's invitation. Read from the search results' titles
    and summaries only; the articles were not archived. The agency's item (a candidate address
    found by search, https://www.wam.ae/en/article/3coqvthq-uae-president-receives-prime-minister-israel,
    not verified) could not be read: its pages carry no text in the served HTML and its content API
    refuses scripted requests; the Ministry of Foreign Affairs had not published the item by 29
    September 2026. Hosting a person under warrant on an official visit without arrest is a B6
    instance (docs/02 §2), filed for the United States on data/wave-1 although it is not a party
    to the Rome Statute; promote once an official Emirati or Israeli record of the visit is
    archived (docs/10 B-388 (1)).
  sources:
    - url: https://www.aljazeera.com/news/2026/9/28/uae-confirms-netanyahu-visit-to-abu-dhabi
      publisher: Al Jazeera
      kind: press
