      date: 2026-09-28
    - url: https://www.cnn.com/2026/09/28/middleeast/israel-netanyahu-secret-visit-uae-intl
      publisher: CNN
      kind: press
      title: Netanyahu met with UAE president Sunday in rare trip to country, both sides confirm
      date: 2026-09-28
    - url: https://www.khaleejtimes.com/uae/uae-president-receives-israeli-pm-netanyahu-september-2026
      publisher: Khaleej Times
      kind: press
      title: UAE President receives Israel PM Netanyahu, discusses bilateral relations
  date: 2026-09-29
  status: open

- id: lead_20260929_ARE_2
  country: ARE
  indicator: A5
  claim: >-
    Press reports describe military cooperation between the United Arab Emirates and Israel during
    the window: Emirati Mirage 2000-9 aircraft in the multinational air exercise Iniochos 2025 at
    Andravida, Greece (31 March to 11 April 2025), in which Israel's air force also took part
    (Newsweek); an Iron Dome battery, interceptors and Israeli soldiers sent to the UAE during the
    war with Iran (Middle East Eye, 2026); and an Emirati statement of September 2026 that relevant
    intelligence has been and continues to be shared with Israel, in answer to a report that the
    President warned the Israeli Prime Minister before 7 October 2023 (Haaretz, 8 September 2026).
    Read from the search results' titles and summaries only; the articles were not archived. No
    Emirati official document was found; none of these ties the cooperation to the Gaza campaign
    (docs/02 §2 A5). The Ministry denied on 14 May 2026 that an Israeli military delegation had
    been received (src_20260514_mofa-ae_denial-netanyahu-visit).
  sources:
    - url: https://www.newsweek.com/arabs-israel-trump-uae-qatar-iran-aircraft-2053399
      publisher: Newsweek
      kind: press
      title: U.S. Arab Allies Join Rare Air Exercises with Israelis
    - url: https://www.middleeasteye.net/news/report-israel-equipped-uae-iron-dome-system-troops-during-war-iran
      publisher: Middle East Eye
      kind: press
      title: Israel sent air defence system and troops to UAE during Iran war, report says
    - url: https://www.haaretz.com/middle-east-news/2026-09-08/ty-article/.premium/uae-says-intelligence-is-shared-with-israel-no-comment-on-netanyahu-warning/000001a0-820e-dc23-adf2-c25f39d80000
      publisher: Haaretz
      kind: press
      title: UAE says intelligence is shared with Israel, no comment on Netanyahu warning
      date: 2026-09-08
  date: 2026-09-29
  status: open

