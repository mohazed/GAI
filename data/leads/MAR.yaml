- id: lead_20261109_MAR_5
  country: MAR
  indicator: E3
  claim: >-
    Press reports say seven Moroccan lawyers filed a complaint on 29 July 2024 against an Israeli soldier then
    staying in Marrakech, for war crimes and crimes against humanity during his service in Gaza, under Article 711-1
    of the Code of Criminal Procedure (terrorist crimes committed abroad, suspect apprehended in Morocco); that the Marrakech
    prosecutor first refused it and that the Court of Appeal of Rabat agreed to review it (Morocco World News, 18 September 2024, which quotes one of the lawyers and cites no court document). A second complaint, filed
    on 17 February 2025 at the Court of Appeal of Rabat against the Israeli Transport Minister on her visit to
    Marrakech, was reported under review; the Administrative Court of Rabat rejected a related urgent request to bar
    her entry on 18 February 2025 (Yabiladi, 19 February 2025). Read through WebFetch of the two articles and search
    summaries; no court record or prosecutor statement accepting either complaint for investigation, and no later
    decision, was found; the prosecutor's site (www.pmp.ma) refused the connection on 9 November 2026. Promote to an
    E3 event (unscored, D-12) only with a court record or prosecutor announcement of the acceptance.
    P-23 pass, T-G-LEADS-5 (2026-11-11): an Arabic search for a decision of the prosecutor at the Court of Appeal of Rabat on the complaint of July 2024 returned Hespress and Al3omk reports of the filing and a separate complaint of April 2026 on the detention of Moroccan flotilla participants; no court record or prosecutor's decision was found. The soldier's name is not recorded here (B-2111). Kept open.
