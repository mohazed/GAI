    Press reports say Morocco signed on 15 July 2026 an agreement on its participation in the International
    Stabilization Force for Gaza that includes a military field hospital of the Royal Armed Forces, and that the
    Foreign Minister announced at the General Assembly on 22 September 2026 that the field hospital would be deployed.
    No record of the hospital operating in the Gaza Strip was found to 29 September 2026. Promote to a D4 event (+5,
    one programme) once an official record of its deployment (the Royal Armed Forces, the Ministry, WHO) is archived.
