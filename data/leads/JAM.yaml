  claim: 'The Prime Minister, Andrew Holness, at the General Debate of the 80th session on 26 September 2025 (the delegation''s file `jm_en.pdf` on gadebate.un.org, read on 6 October 2026, lines
    168 to 181 of the extracted text): ''Jamaica once again condemns the heinous October 7, 2023 attack on Israel and deeply regrets the devastating humanitarian consequences of the counter-offensive
    in the Palestinian territories. … We continue to support United Nations Security Council Resolution 242 and support the call for a ceasefire agreement that includes the release of all remaining
    hostages and definitively ends the protracted war and human suffering.'' The statement never uses the word Gaza (the document must cite Gaza, R7, docs/10 B-32), and the file has no Wayback
    capture and the site fails Save Page Now (docs/10 B-523), so no event is filed. The Foreign Minister cited the passage as the Government''s answer to the Opposition (press release of 30 September
    2025) and said at the post-Cabinet briefing of 1 October 2025 ''We have condemned actions on both sides, called for a ceasefire'' (a recapitulation, not a call). Filed from an archived copy
    that cites Gaza it would be a B9 event of +2 (call tier), dated 26 September 2025: 375 days old, about +1.95. Re-checked 2026-11-09 (T-F-L05): the full text of the address is published on
    the Office of the Prime Minister''s site (opm.gov.jm, ''80th Session of the United Nations General Assembly (UNGA) General Debate'', 26 September 2025); it reads ''the counteroffensive in
    the Palestinian Territories'' and the word Gaza does not occur in it, so R7 still bars an event whatever the copy. The lead stays open. Re-checked with search (T-F-L05-R, 2026-11-09; English):
    the searches returned the Jamaica Observer''s report of the Foreign Minister''s reply of 30 September 2025 (press) and the Prime Minister''s earlier statements of 2023 (Gleaner, Observer,
    JIS) but no new statement of the Prime Minister or the Foreign Minister of October or November 2026 and no text that names Gaza in the address of 26 September 2025. The lead stays open (R7).'
