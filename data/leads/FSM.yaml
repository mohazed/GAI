  claim: 'Micronesia''s support for Israel is stated by its Permanent Mission and in the Government''s reports, none of them a B10 speaker or in the speaker''s own words (R3, R4): the Permanent Representative
    on 1 November 2023 (''we support Israel''s right to defend its territory and its people''; archived: src_20231101_unmission-fm_ess10-lippwe-statement), the Deputy Permanent Representative on 30 April
    2026 (''Micronesia unequivocally affirms Israel''s right to defend itself''; archived: src_20260430_unmission-fm_security-council-middle-east-debate) and the Permanent Representative on 9 September
    2026 at the inaugural meeting of the UN Task Force on Combating Antisemitism (''Micronesia has long stood with Israel in international fora''; archived: src_20260909_unmission-fm_antisemitism-task-force-lippwe);
    the Government''s report of the President''s meeting with Israel''s new ambassador on 5 March 2025 (indirect speech: ''reiterated the FSM''s commitment to seeking solutions to the Israel-Gaza conflict'',
    ''a two-state solution''; archived: src_20250305_gov-fm_israel-ambassador-credentials-simina) and of the credentials ceremony in Jerusalem on 28 April 2025 (''Micronesia has been consistent with its
    support of the State of Israel at a multilateral level'', no named speaker; archived: src_20250428_gov-fm_soram-credentials-israel). The press (a blog of The Times of Israel, 27 July 2025, citing UN
    Watch) says, citing the UN Watch database, that Micronesia has not cast a vote against Israel in ten years; the vote table agrees for the window (no on 9 of the 12 qualifying votes, an abstention on 2, no vote on 1, never yes). A B10 event (−5) if the President or the Secretary of Foreign Affairs
    is found to have declared unconditional support for Israel, or denied documented violations, in their own words and citing Gaza.'
