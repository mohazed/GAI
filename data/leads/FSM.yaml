  claim: 'President Wesley W. Simina at the General Debate of the 79th session (26 September 2024; the delegation''s file and the Mission''s copy are archived: src_20240926_un-gadebate_fsm-simina-en,
    src_20240926_unmission-fm_simina-79th-general-debate, lines 33 to 35 of the second): ''We also condemn the attack by Hamas on Israeli citizens on October 7th, and we believe that every nation has the
    right to defend its people and territory. We urge for the immediate and safe release of hostages and cessation of hostilities, and urge all parties to work towards a peaceful resolution.'' The
    passage speaks of ''the ongoing conflicts in Ukraine and between Israel and Palestine'' and never uses the word Gaza (R7, docs/10 B-32): no event, as for Jamaica''s ''the Palestinian territories''
    (docs/10 B-581) and Uruguay''s (B-612). Read as citing Gaza it would be a B9 event at the call tier (+2, ''cessation of hostilities'' joined to the release of hostages), 748 days old on 13 October
    2026 and so expired. It is not a B10 event on any reading: the right of every nation to defend itself is joined to a call for cessation of hostilities and for the protection of civilians. The
    President''s address to the 80th session (25 September 2025) and the Vice-President''s to the 81st (26 September 2026, not a B9 speaker, R3) have no passage on Gaza, Israel or Palestine.'
