- id: lead_20261005_BGR_3
  country: BGR
  indicator: C2
  claim: 'The plan of cooperation on maternal and child health signed on 13 November 2024 by Bulgaria''s interim Minister of
    Health, Galya Kondeva, and Israel''s ambassador, which the press says builds on an existing health agreement between
    the two states (the Bulgarian Government approved it on 30 August 2024). A plan implementing a pre-war agreement is
    not a new instrument under R18, and no primary (the Ministry of Health''s release or the Council of Ministers''
    decision) was archived, so nothing is filed; the primary and the title of the agreement it implements would decide it.
    Finish run, T-F-L02 (2026-11-09): the Council of Ministers'' own record of its meeting of 30 August 2024 (archived:
    src_20240830_gov-bg_ms-zasedanie-30-08-2024) confirms the decision approving the draft Plan of Cooperation between the
    Ministries of Health of Bulgaria and Israel on maternal and child health, with its priority areas (reproductive health
    services, training of doctors and nurses, exchange of experts for the new national children''s hospital, scientific
    exchange) and direct contacts between counterpart bodies; it says the plan ''will continue the established line of
    successful bilateral cooperation'' and does not name an earlier agreement it implements. The signing on 13 November
    2024 is still known from the press only. Whether such a ministerial plan is a signed governmental instrument of
    cooperation under R18 (as the memoranda filed for Moldova''s C2 were read) or an implementing arrangement is for the
    author; a primary for the signature (the Ministry of Health''s release) would decide a C2 event of -10 dated 13
    November 2024, which would sit inside the category cap.'
