# Leads for India: press or NGO claims, or official facts without an archived primary document.
# Never scored (docs/03 §10). P-D research session, wave 2, 2026-09-28.
# The session had no web search; press claims were read through the Wayback listings of The Wire
# and the articles themselves (read, not archived). India's 1988 recognition (B8) and the labour
# framework agreement of November 2023 (C2) rest on official documents without a day; they are
# described in data/assessments/IND.yaml, since a lead cites press or NGO sources only.
- id: lead_20260928_IND_1
  country: IND
  indicator: A1
  claim: >-
    Adani-Elbit Advanced Systems India Ltd, a Hyderabad joint venture of the Adani Group and Elbit
    Systems, manufactured and dispatched more than 20 Hermes 900 medium-altitude long-endurance
    drones (or their aerostructures and subsystems) to Israel, first reported by Shephard Media on
    2 February 2024; Elbit told The Wire that Adani is a supplier to its unmanned aerial systems
    supply chain. Neither government acknowledged the export. Complete systems would appear in
    SIPRI's deliveries (A1); components under HS 8802 count in A2 only with a confirming document.
    Promote with an export licence record, a parliamentary answer or an investigation citing the
    customs code (a2_confirmed_military.csv), or SIPRI's register once imported.
    P-23 pass, T-G-LEADS-3 (2026-11-10): not searched again: A1 is generated from SIPRI's register (no new release, B-187) and the components would count in A2 only through a confirming document under HS 8802; no hand filing is possible. Kept open.
  sources:
    - url: https://thewire.in/world/adani-jv-just-exported-lethal-drones-to-israel-same-model-being-used-in-genocide-tainted-gaza-war
      publisher: The Wire
      kind: press
      title: "Adani JV Just Exported Lethal Drones to Israel, Same Model Being Used in Genocide-Tainted Gaza War (12 February 2024)"
  date: 2026-09-28
  status: open

- id: lead_20260928_IND_2
  country: IND
  indicator: A2
  claim: >-
    Munitions India Ltd, a public sector enterprise under the Ministry of Defence, was licensed on
    1 January 2024 by the Directorate General of Foreign Trade (a dual-use licence, not a
    Munitions List authorisation) to export products to Israel, and applied on 18 April 2024 for a
    repeat order (The Wire, citing public records). Customs values are already in A2 (India's own
    HS 93 exports to Israel: USD 130 million in 2023); promote to a confirming row only if a
    licence register or parliamentary answer states the goods and customs codes.
    P-23 pass, T-G-LEADS-3 (2026-11-10): not searched again: A2 is generated from Comtrade and India's HS 93 exports are already counted; a confirming row is only needed for the dual codes (HS 8526, 8802), which the licence of 1 January 2024 is not shown to cover. Kept open.
