- id: lead_20260928_IND_3
  country: IND
  indicator: A2
  claim: >-
    Amnesty International reported (30 July 2026) 2,596 shipments of small arms, ammunition and
    military-vehicle components from India to Israel between 7 October 2023 and 30 November 2025,
    naming nine Indian companies, three of them defence public sector undertakings. On 31 July 2026
    the MEA spokesperson answered that India "has a robust legal and regulatory framework on
    strategic trade controls" and exports dual-use items in accordance with national laws and
    international obligations (as reported by The Wire; the MEA briefing transcript was not
    archived). Neither is a suspension (A6). Promote the customs-code detail to
    a2_confirmed_military.csv if the report cites HS 8526 or 8802 shipments with licence records.
  sources:
    - url: https://thewire.in/diplomacy/india-sidesteps-amnesty-israel-allegations-says-export-controls-robust
      publisher: The Wire
      kind: press
      title: "After Amnesty Report on Israel Arms Trade, India Says Exports Follow Legal, International Norms (31 July 2026)"
  date: 2026-09-28
  status: open

