- id: lead_20261109_CHL_2
  country: CHL
  indicator: E3
  claim: >-
    A press report of 17 February 2026 (Cooperativa) says that a Chilean lawyer, Pablo Araya, representing the Hind
    Rajab Foundation, filed a complaint on the principle of universal jurisdiction against an Israeli soldier said to
    have been in Chile since 6 February 2026, over genocide, crimes against humanity and war crimes in Gaza (the
    Al-Shifa hospital operation of March and April 2024). The report does not name the court or say whether the
    complaint was admitted. No court record or Fiscalía communication was found. Promote to an E3 event
    (experimental, unscored in v1) only with a record that confirms the complaint was accepted for investigation,
    dated.
    P-23 pass, T-G-LEADS-1 (2026-11-10): two Spanish searches (Juzgado de Garantía, Corte de
    Apelaciones, querella, genocidio, 2026) found press reports that the complaint was filed on 16
    February 2026 with the 8th Juzgado de Garantía of Santiago, that this court declined to examine
    it, that the Eighth Chamber of the Santiago Court of Appeals annulled that decision and that a
    hearing on jurisdiction was set for 12 June 2026 (El Ciudadano, El Dínamo, Meganoticias; press
    only; the outcome of the hearing was not found). No resolution of the Poder Judicial was found
    or archived. Kept open.
  sources:
    - url: https://cooperativa.cl/noticias/pais/denuncian-en-chile-a-soldado-israeli-por-genocidio-y-crimenes-de-guerra/2026-02-17/092217.html
      publisher: Cooperativa
      kind: press
      title: Denuncian en Chile a soldado israelí por genocidio y crímenes de guerra
  date: 2026-11-09
  status: open
