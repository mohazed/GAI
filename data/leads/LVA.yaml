  claim: 'On 28 August 2025, at a media briefing after meeting the Palestinian Foreign Minister in Riga, Foreign Minister Baiba Braže said, as the Baltic Times (LETA) prints it: ''Israel has a
    duty to respect the principles of international law and international humanitarian law, i.e., not to cause civilian casualties while exercising its right to self-defense'' and ''We also do
    not support Israel''s plans to expand illegal settlements, and together with other countries we have called on Israel to reconsider this decision''; the same report says she called Israel''s
    actions against the population in Gaza condemnable and attacks on hospitals and journalists unacceptable, and that Latvia asked Israel to give international non-governmental organisations
    access to Gaza. The Ministry''s release of the same day (mfa.gov.lv, read) puts her words in indirect speech (''Braže underlined that it was vital to resume ceasefire … expressed deep concern
    over the dire humanitarian situation in Gaza, including the risk of a large-scale famine'') and prints no quotation. A B9 event (+5 for a named duty and a legal characterisation, or +2 for
    the ceasefire call) if an official transcript or video of the briefing is archived.'
