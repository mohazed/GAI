  claim: 'Contracts and ventures with Israeli defence firms, relayed without a primary in BIRN''s report of 29 April 2026 (republished by 021.rs, archived as src_20260429_021-rs_birn-sporazum-srbija-izrael-tajni-podaci):
    ''Početkom prošle godine, Elbit Systems je Srbiji prodao napredne artiljerijske sisteme i dronove u vrednosti od 335 miliona dolara'' (early 2025), ''U avgustu 2025. godine potpisan je još jedan ugovor
    vredan 1,6 milijardi dolara'' (August 2025) and a plan, reported by BIRN in May and ''confirmed'' by President Vučić, to produce drones in Serbia together with Elbit. These are contracts with a firm
    (A4 in SIPRI''s terms, not a Government-to-Government instrument) and a venture whose terms were not read in a primary; web-search results of April 2026 (AP and others, not read) report the President''s
    announcement of 14 April 2026 of a joint drone factory with Elbit (Yugoimport-SDPR). No contract text, signing day or Government release was found; if one is archived, a C2 event for the venture (investment)
    would be filed (docs/10 B-734 ff.). Re-checked on 2026-11-10 (docs/10 B-2033): Tanjug reports on 17 September 2026 (read) that the President opened ''a factory for assembling the most modern drones of Israeli production'' (his Instagram post: ''Otvorio sam fabriku za sklapanje najmodernijih dronova izraelske proizvodnje''), for about one hundred workers, with three more factories planned; Calcalist (read, same day) names the venture Elbit Systems (51 percent) and Jugoimport SDPR (49 percent) at Simanovci; Tanjug of 8 August 2026 has the President announcing it with Elbit (search result). None of the pages prints a signed agreement, its day or a Government release, and the Presidency''s and the Ministry''s own pages were not found by searches restricted to them (the Ministry''s page on Eurosatory 2026 says Serbia has significant contracts with Elbit). The venture is therefore still a lead: a C2 event needs the instrument or an official release (default: if the author reads the opening as an investment agreement, file C2 at -10, `corroborated`, dated 2026-09-17 from Tanjug and Calcalist). P-23 pass, T-G-LEADS-7 (2026-11-11): a Serbian search (Vučić otvorio fabriku dronova Elbit Jugoimport Simanovci septembar 2026 ugovor) returned Calcalist, Arab News, BTA, i24NEWS, N1 and 021.rs on the opening and the 51/49 ownership, none printing a signed instrument or a Government release; a search limited to mod.gov.rs, predsednik.rs, srbija.gov.rs and vs.rs found no item on Elbit or the factory. Kept open.'
