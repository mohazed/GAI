  indicator: A6
  claim: 'The general suspension of arms exports of 23 June 2025. The Ministry of Defence announced, ''in accordance with the instructions of the President of the Republic'', that ''the export of weapons and military equipment produced in the Republic of Serbia has been suspended'' and that exports from defence-industry factories ''will require the consent of the National Security Council'' under Article 16, paragraph 4 of the Law on the Export and Import of Weapons and Military Equipment (the Government''s English page, srbija.gov.rs, read; the Ministry''s own page found by search). The President said the same day, in answer to a question on exports to Israel, that ''sada ne izvozimo ništa'' and that ''Mi smo sada zaustavili bukvalno sve'' (RFE/RL of 23 June 2025, read). The announcement does not mention Israel and states no end date; a Radio Free Europe item seen in a search result (its date is not clear) says two state factories confirmed that exports restarted in February after eight months, which the State did not confirm. It is not filed as A6 because it is a suspension towards every destination and its end is not documented; if the author reads a general suspension as an A6 act, it is a standing event from 2025-06-23 with an end date still to be found (docs/10 B-2033). P-23 pass, T-G-LEADS-7 (2026-11-11): a Serbian search (Srbija nastavak izvoza naoružanja Savet za nacionalnu bezbednost odluka 2026 obustava izvoza ukinuta) returned the Radio Free Europe items of June 2025 and its report, from two state factories, that exports restarted from February 2026; no decision of the National Security Council or release of the Ministry of Defence ending or confirming the suspension was found. Kept open.'
