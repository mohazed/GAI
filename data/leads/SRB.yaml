- id: lead_20261110_SRB_3
  country: SRB
  indicator: A5
  claim: 'Israeli cargo flights between Belgrade and the Nevatim air base. Radio Free Europe (24 June 2025, read) reports from Flightradar24 data that the same cargo aircraft of Challenge Airlines, an Israeli carrier specialised in dangerous cargo such as arms, made the Israel-Serbia-Israel trip eight times in eight months, always flying on from Belgrade to the military airfield of Nevatim near Beersheba; the latest landed at Belgrade on the evening of 23 June 2025, hours after the President said exports were suspended, and left on 24 June. The ministries of defence, foreign affairs and trade and the airline did not answer, the airport said it served the aircraft under equal conditions without saying why it flew, and the President refused to say what took off and landed (''Ne pada mi na pamet da kažem šta je uzletelo, a šta je sletelo''). What the aircraft carried is not known and no official document names the flights; a documented transit under A5 (port call or overflight authorisation) needs a primary document. The same report quotes the President''s interview with the Jerusalem Post of 6 June 2025: Serbia is the only country in Europe that does business with Israel in military ammunition and deliveries were accelerated after October 2023 (docs/10 B-2033). P-23 pass, T-G-LEADS-7 (2026-11-11): a Serbian search (Challenge Airlines Beograd Nevatim let 2026 Direktorat civilnog vazduhoplovstva odobrenje municija Izrael) returned reports on the airline''s flights through Ireland and Dubai and the Israeli Ministry of Defense''s airlift release; no Serbian civil aviation or Government document on the Belgrade flights was found. Kept open.'
