  claim: 'Seychelles Nation, 12 January 2024, reproducing a press release of the Foreign Affairs department: at a meeting on 11 January 2024 with Israel''s non-resident ambassador (Michael Lotem),
    the Minister for Foreign Affairs and Tourism, Sylvestre Radegonde, ''deplored the indiscriminate killings of civilians'' and the destruction of civilian infrastructure in Gaza and ''called
    for an immediate end of the war as well as the release of all hostages being held by Hamas'', and said Israel''s right to self-defence ''cannot encroach on the rights of civilians in Gaza
    under the Human Rights Charter and Geneva Conventions''. The text is the department''s indirect speech (R4), the release is not archived from a Government site, and the outlet is state-owned
    press: a lead. A B9 event (+5 on the named rights of civilians and the indiscriminate killings, +2 on the call alone) if the Department''s own release or a verbatim record is archived; it
    would be 1,028 days old on 4 November 2026, expired (more than 730 days), so no effect on the score either way. Completion of 2026-11 (2026-11-10): the Ministry''s own release of 11 January
    2024 was found on the Ministry of Foreign Affairs and the Diaspora''s site (mfa.gov.sc/news/israeli-ambassador-meets-with-the-minister-for-foreign-affairs-and-tourism/, post 16228) and prints
    the same words in indirect speech (''He deplored the indiscriminate killings of civilians ... and called for an immediate end of the war''); R4 excludes a third-person readout, so the lead
    stays. The Minister''s own words in quotation marks at the Diplomatic Cocktail of 23 February 2024 are filed as evt_2024_02_23_SYC_B9. P-23 pass, T-G-LEADS-7 (2026-11-11): not searched again (the Ministry''s own release is in indirect speech, R4; expired). Kept open.'
