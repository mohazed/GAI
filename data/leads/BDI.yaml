# Leads for Burundi (P-21 light protocol, T-P21-31, 2026-11-04; finish run T-F-L16, 2026-11-10). A lead is never scored.
- id: lead_20261104_BDI_1
  country: BDI
  indicator: B10
  claim: 'The Presidency''s own report of the audience that President Évariste Ndayishimiye gave on 22 December 2023 to the special envoy of Israel''s President, Dr Ron Adam. In the report''s indirect
    speech the President ''a remercié son hôte'', ''s''est réjoui des bonnes relations de coopération qui existent entre le Burundi et l''Etat d''Israël'', expressed ''la solidarité du peuple burundais''
    with the people of Israel and presented condolences to the families bereaved by ''les tueries qui sévissent dans la région'', while Burundi ''soutient toujours la résolution pacifique au conflit'';
    the envoy congratulated the Government on its position ''en faveur de l''Israël'' at the African Union and the United Nations and offered support in education (a STEM centre), agriculture, defence
    and a second photovoltaic power plant. Not filed: (1) the words are the Presidency''s report in indirect speech, not the President''s own (R4); (2) the report cites Gaza only in the envoy''s briefing,
    not in anything the President is reported to have said (R7); (3) the President is not a head of government or foreign minister by title, and the B10 definition names the head of government (the
    rank of a head of state is read under R3 as for B9, flagged); (4) the report is 1,048 days old on 2026-11-04 and would carry no weight (decay, 730 days). It is kept as the one Burundian item that
    shows the Government''s stance towards Israel. The envoy''s offers are not signed instruments (C2). Finish run, T-F-L16 (2026-11-10): re-checked with searches in French and English for a statement of the President, the Prime Minister or the Foreign Minister on Israel; no direct quotation and no other copy found, so the lead is kept as it stands.'
