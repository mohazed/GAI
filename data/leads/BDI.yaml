  claim: 'Press reports of 24 August 2026 (the AP report, carried by Asharq Al-Awsat and other outlets) say that a Burundian military delegation led by three senior officers visited Israel, with a Ugandan
    delegation, to discuss a possible troop contribution to the International Stabilization Force for Gaza backed by the Board of Peace. A Board of Peace official, not named, told the AP that nothing
    had been finalised with Burundi and that the Burundian representatives ''expressed interest in our mission''; a Burundian military official told the AP that Burundi appeared intent on joining; Burundi''s
    military spokespersons did not respond. Not filed: (1) no Burundian Government text confirms the visit or a decision; (2) no indicator of docs/02 defines participation in the stabilisation force (A5 covers
    named exercises, documented transit, public basing agreements and official confirmation of intelligence sharing; the Ugandan case is lead_20261104_UGA_1, docs/10 B-844); (3) the source speaks through an anonymous
    official. Kept for the author, who decides whether an indicator covers it.'
