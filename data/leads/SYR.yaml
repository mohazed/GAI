  claim: 'Press reports of 2026 (i24NEWS, L''Orient Today, Middle East Online; found by a web search on 2026-11-10 during the verification of T-F-L24, none read in full: the pages answered 403 or a script check to curl and have no Wayback capture) say that the President, Ahmed al-Sharaa, issued a new customs law that keeps the boycott of Israel inherited from the earlier legislation: its Article 112 reportedly bars imports that breach the boycott legislation and Article 206 reportedly gives customs courts expedited procedures for Israeli goods. The reports disagree on the decree''s number and date. The SYR C4 entry (none-found) says the status of the boycott legislation under the transitional authorities was not established. A decree in the window that bars all Israeli goods also bars settlement goods; whether a renewal of a general boycott inherited from before the window is a C4 ban (+5, dated at entry into force) is the author''s reading, and the decree''s text (SANA or the Official Gazette) must be archived first. P-23 pass, T-G-LEADS-7 (2026-11-11): an Arabic search and a search limited to sana.sy found SANA''s item of 18 May 2026 (sana.sy/presidency/2478774/) and the decree''s signed text: Decree No. 109 of 2026 containing the Customs Law, replacing Laws 37 and 38 of 2006, dated 17 May 2026 (a 78-page scanned PDF, archived as src_20260517_sana_decree-109-customs-law, 10,271,732 bytes, SHA-256 checked against the replay). The pages are images with no text layer, so no passage can be quoted from the archived text. Read on the page image (page 29): Article 112 bars from the free zones, among other goods, goods prohibited for breaching the provisions of the boycott of Israel or public order, and goods originating from a country whose economic boycott has been decided. The article governs the free zones and refers to the boycott legislation, which pre-dates the window; it is not itself a ban on settlement goods entering Syria. Article 206 was not read. Default: not