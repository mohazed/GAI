  claim: 'The Chief Adviser, Professor Muhammad Yunus, at the General Debate of the 80th session (26 September 2025), as UNB reports his words in quotation marks: ''Nowhere is this tragedy more visible than in Gaza. Children are dying of hunger. Civilians are being killed without distinction. Entire neighbourhoods, including hospitals and schools, are being wiped from the map'' and ''We do agree with the UN independent international inquiry commission that we are witnessing a genocide happening live.'' A +5 reading (named violations and a legal characterisation, Gaza named). The delegation''s file is in Bengali (gadebate.un.org/sites/default/files/gastatements/80/bd_fl.pdf, 314,198 bytes on 2026-11-04, its text layer garbled by the font) and has no Wayback replay; the verbatim record A/80/PV.10 and PV.11 were not served (documents.un.org error page). An archived official text (the delegation file, the Chief Adviser''s press wing, or the verbatim record) would make it a B9 event: 404 days old on 2026-11-04, it would count at about 0.8 and would not end the passivity penalty (docs/10 B-740 ff.). Finish run, T-F-L12 (2026-11-10): the delegation file answers HTTP 405 to a script and the Wayback CDX lists no capture of it; documents.un.org answered an HTML page instead of A/80/PV.10 and PV.11; the UN Digital Library''s search returned no record for either symbol; a web search found no text on the Chief Adviser''s Office or the Ministry''s site (Dhaka Tribune, BSS, UNB and Tribune India report the same quoted words). Kept open. P-23 pass, T-G-LEADS-1 (2026-11-10): an English search for the full text on the Chief Adviser''s, the Prime Minister''s or the Ministry''s sites found press reports only (Tribune India, UNB, Prothom Alo, Dhaka Tribune, BSS); cao.gov.bd did not answer; the Press Wing site (presswing.pmo.gov.bd) now serves the Prime Minister''s Office of the present Government and its speech pages were not searched for the 2025 text. The UN Digital Library holds no record for A/80/PV.10 or PV.11 (the 80th-session General Debate records are not yet issued; documents.un.org''s symbol link for A/80/PV.10 returns its error page). Kept open. Second route (same day, docs/10 B-2134): the UN''s automatic transcript of the 10th and 11th plenary meetings (transcripts.un.org/en/ga/80/11, 2,451,807 bytes, read, not archived) carries the English interpretation of the address: ''Nowhere is this tragedy more visible than in Gaza. Children are dying of hunger, civilians are being killed without distinction, entire neighborhoods, including hospitals and schools, are being wiped from the map. We do agree with the UN Independent International Inquiry Commission that we are witnessing a genocide happening live.'' The address was delivered in Bengali, so these are an interpreter''s words, not the speaker''s (R4); whether a UN automatic transcript of the interpretation counts as an official transcript is for the author (B-2134), and the page exceeds the archiver''s 200 KB text limit. Kept open. P-23 search, T-G-RS-3 (2026-11-11): a web search restricted to Bangladesh Government sites returned the Chief Adviser''s Office''s own PDF of the address (cao.gov.bd/sites/default/files/files/cao.portal.gov.bd/pm_speech/5bb4b5d1_ab91_4e96_8ee0_6e2ca295d325/80UNGA_260925.pdf, titled ''80th Session of the UN General Assembly Address'', English; the search engine''s extract carries the two sentences of the claim). cao.gov.bd refused the connection from this network, and Save Page Now answered HTTP 404 and then 503 for the file; the Wayback CDX lists no capture. Not archived, so not filed; an archived copy of this PDF (the Office''s English text of an address delivered in Bengali: whether it counts as the speaker''s words under R4 is for the author, as B-2134) would let the author file it. Kept open. T-H-UNDOCS (2026-11-28): the Official Document System serves A/80/PV.1 to PV.8 and PV.16 to PV.18 (PV.7 and PV.8, the General Debate meetings of 24 September 2025, 3 p.m., and 25 September 2025, 9 a.m., first served after 2026-11-10); A/80/PV.9 to PV.15 (25 September 2025, 3 p.m., to 29 September 2025) still answer the error page (in English; PV.9, PV.12 and PV.14 also in Spanish, French, Arabic, Russian and Chinese), so the address of 26 September 2025 (A/80/PV.10 or PV.11) is not yet a route; the automatic transcript waits for the author''s rule (B-2134). Kept open. Launch-plan catch-up, T-H-ML-3 (2026-11-28): the symbol links A/80/PV.9, PV.10 and PV.11 answer the Official Document System''s error page (A/80/PV.8 answers as a control), so the record is still not issued. Launch-plan catch-up, T-H-ML-3 (2026-11-28): not searched again for its own document in this session; the window''s official listings and searches for the country (docs/review/light-protocol.md, Launch plan of 2026-11-27) hold nothing on it. Kept open.'
