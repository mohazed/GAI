  claim: 'The Secretary of State for Foreign Affairs'' statement at the 80th General Debate (27 September 2025), which has no archived text. The live file (gadebate.un.org/sites/default/files/gastatements/80/sm_en.pdf,
    167,415 bytes on 2026-11-04) says: ''we reiterate our call for an immediate and permanent ceasefire, and for full, safe, and unhindered humanitarian access'' and ''Nothing can justify the collective
    punishment of the Palestinian people through indiscriminate bombing, starvation and displacement.'' Save Page Now answers 405 for the file and Wayback has no replay, so it cannot be an event; as filed
    for Brunei and Egypt, naming collective punishment, bombing, starvation and displacement would be the tier of named violations (+5, Gaza). The Foreign Secretariat''s release of 28 September 2025 (libertas.sm,
    read) reports the call for ''un cessate il fuoco immediato e permanente'' in indirect speech (R4) (docs/10 B-729 ff.). Re-checked on 2026-11-10 (docs/10 B-2032): the Wayback CDX for the 80th file lists one capture (20250930213725, status 301) whose replay answers 404, and none for the 81st; no other text of either statement was found (a search in Italian, the Foreign Secretariat''s pages and UNISPAL list the Minister''s statement at the two-state conference of 29 July 2025 only: it is filed as evt_2025_07_29_SMR_B9). The lead stays open.'
