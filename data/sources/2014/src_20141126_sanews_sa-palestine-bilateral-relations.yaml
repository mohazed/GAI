excerpt: "South Africa and Palestine established full diplomatic relations on 15 February 1995, following the advent of freedom and democracy that South Africa gained in 1994."
notes: "The Government News Agency's report of 26 November 2014 on the state visit of the President of the State of Palestine; line 23 dates the establishment of full diplomatic relations between South Africa and the State of Palestine to 15 February 1995, read as South Africa's recognition (the registry's date). Archived in P-16 under R21 (docs/10 B-448). Text extracted by readability."
