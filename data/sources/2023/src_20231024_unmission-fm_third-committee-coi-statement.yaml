notes: 'The Mission''s post of the statement of the Micronesian delegation in the Third Committee''s interactive dialogue with the Independent International Commission of Inquiry on the Occupied Palestinian
  Territory (agenda item 71(c)), New York, 24 October 2023: it condemns the attack by Hamas and criticises the Commission''s ''disproportionate focus on the State of Israel''. A statement of a delegation,
  not of the President or the Secretary of Foreign Affairs (R3). Read in the finish run (T-F-L08, docs/10 B-981).'
