notes: 'La Prensa''s report of the Foreign Ministry''s announcement (the Foreign Minister''s post on X, 3 November 2023): the Government ''ha decidido llamar inmediatamente a consultas'' its ambassador
  to Israel. It quotes the vice-minister: calling an ambassador ''no significa que se le retira oficialmente'', and says the Ministry''s communiqué, deleted minutes later, called the situation
  ''genocidio''. Text extracted by readability.'
