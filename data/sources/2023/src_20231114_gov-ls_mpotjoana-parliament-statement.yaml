notes: 'Thirteen-page PDF in Sesotho that the Government''s portal posted on 14 November 2023 (post 14659, ''Polelo ea Letona la Litaba tsa Machabeng''); the cover reads ''Maseru, November 2023'' and the text addresses the Speaker and the Honourable Members of the Ntlo ea Sechaba (the National Assembly); the exact day of delivery is not stated, so the posting date is used and the event is dated ''no later than'' it. The file is served by the portal''s download manager (the URL carries a one-time refresh token; the byte count and SHA-256 of the file read on 2026-11-04 equal the Save Page Now capture''s). The Sesotho text (language recorded as mul: Sesotho with English terms) has English parentheses at its key terms (''disproportionate force'', ''collective punishment'', and a sentence of the Government''s position in English); those are the quoted words (docs/10 B-808). Save Page Now capture; the replay fetched again with curl --compressed equals the index row. Text extracted by pdf.'
