notes: The Government portal's report of the Foreign Minister's press conference of Monday 23 October 2023 (published 2023-10-23 19:14 UTC, from the page's datePublished). It states the Government's
  position (no side; international humanitarian law must prevail; a peace process leading to a two-State solution; de-escalation) and, in the last paragraph, that Suriname has recognised Palestine
  as a State since 2011 and the PLO as the legitimate representative of the Palestinian people. It contains no call for a ceasefire (a web-search summary said it did; the text read does not).
  The Foreign Minister's words are partly in indirect speech. Save Page Now capture; the extracted text (3,758 characters) was read.
