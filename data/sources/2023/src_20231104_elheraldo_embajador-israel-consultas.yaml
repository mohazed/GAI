notes: 'El Heraldo''s report: the Foreign Ministry''s communiqué on X that the Government ''ha decidido llamar inmediatamente a consultas'' the ambassador, deleted minutes later; the Foreign Minister
  denied that Honduras would break relations. The reports of La Prensa and El Heraldo are of two publishers with their own reporting (each interviewed the vice-minister); the underlying document,
  the Ministry''s post and communiqué on X, is not archivable. Text extracted from the page body.'
