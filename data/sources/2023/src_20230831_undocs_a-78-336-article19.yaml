notes: 'Lists the four Member States in arrears under Article 19 on 31 August 2023: Comoros, Sao Tome and Principe, Somalia and Venezuela (Bolivarian Republic of); minimum payments computed on the contributions of 2021 and 2022. The Article 19 page cites it for the lists of the votes of 27 October and 12 December 2023 (src_20231026_un-ga_article19-page). Resolution 78/2 permitted the Comoros, Sao Tome and Principe and Somalia to vote until the end of the 78th session. Reached through documents.un.org/api/symbol/access?s=A/78/336&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
