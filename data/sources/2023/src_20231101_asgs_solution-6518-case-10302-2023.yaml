notes: "Judgment of the Administrative Court of Sofia City (39th panel) dismissing an appeal against Order no. СОА23-РД09-226 of 20 October 2023 of the Mayor of Sofia, which banned a peaceful rally planned for 22 October 2023 to commemorate the victims of the war in the Middle East. The court's published copy anonymises names and places (initials and '[населено място]'). The replay of the Wayback capture of 9 November 2026 was checked against the direct download: same byte count and SHA-256. Text extracted from the PDF text layer."
