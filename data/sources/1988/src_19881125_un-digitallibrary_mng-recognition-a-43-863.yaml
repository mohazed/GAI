notes: "Document A/43/863 of 25 November 1988 (two scanned pages without a text layer): the Permanent Representative (Mangalyn Dugersuren) transmits 'the text of the statement issued by the Ministry of Foreign Affairs of the Mongolian People's Republic on the proclamation of the independent Palestinian State'; the annex, issued at Ulan Bator on 22 November 1988, states that 'the Mongolian People's Republic officially declares that it recognizes the declaration of the independent Palestinian State'. Recorded from the existing Wayback capture 20250506103859 (replay 51,272 bytes, SHA-256 equal to a direct download of 2026-11-09). The text file is machine OCR (tesseract) of the two pages, with the usual errors, checked against the page images; the letter's own date (22 or 23 November) is hard to read, the annex's date is clear."
