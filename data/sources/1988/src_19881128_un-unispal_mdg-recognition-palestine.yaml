notes: 'UNISPAL''s page of the General Assembly document (forty-third session, agenda items 37 and 40; also a Security Council document): the letter of the Permanent Representative (Blaise Rabetafika)
  transmitting the President''s message of 15 November 1988 to Yasser Arafat, which states that Madagascar ''has decided to recognize the independent Palestinian State de jure as of this very
  day''. The page''s own date (1988-11-15 in the page''s metadata) is the message''s date; the letter is dated 28 November 1988. Recorded from the Wayback capture 20261110051955 (Save Page Now of
