notes: 'The Division for Palestinian Rights'' monthly review of events (UNISPAL''s copy). Line 291, in the entries dated 27 September: ''Grenada and Haiti officially recognized the State of Palestine
  in a ceremony held at UN Headquarters in New York City. Palestinian Foreign Minister Al-Malki signed separate agreements to establish diplomatic relations with the two countries.'' (Ma''an News
  Agency). The review is dated by the month it covers (30 September 2013); the issue date was not read. A review of the UN Secretariat, not the Government''s own text: Haiti''s own statement of
  the recognition was not found online (WAFA''s report of 28 September 2013, press, gives the ceremony on Friday 27 September). Text extracted by readability.'
