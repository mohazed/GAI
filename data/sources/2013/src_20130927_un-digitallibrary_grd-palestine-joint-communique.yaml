notes: 'UN note verbale NV/2013/83 of 9 October 2013, transmitted at the request of the Permanent Representatives of Grenada and of the State of Palestine: their letter of 27 September 2013 ("Grenada and
  the State of Palestine have established diplomatic relations as of today, 27 September 2013, through a Joint Communiqué signed by our Foreign Ministers") and the Joint Communiqué, done in New York on
  27 September 2013 and signed for Grenada by the Minister for Foreign Affairs and International Business, Nickolas Steele. Four scanned pages without a text layer: the text file is machine OCR (tesseract)
  of the three English pages, checked against the page images; the Arabic page is not transcribed. Recorded from the existing Wayback capture 20250603112457 (--capture); replay re-fetched with curl --compressed
  on 2026-11-10: 95,913 bytes, SHA-256 equal to the index row, and equal to a direct download of the UN file on 2026-11-10. Relations, not a recognition statement: the row is flagged as Papua New Guinea''s
  (docs/10 B-2103 (d)).'
