notes: 'Record of the Ministry''s treaties database: ''Fecha suscripción 15/07/2009'', place Sharm el Sheikh, signatories President Leonel Fernández Reyna and President Mahmoud Abbas, subject
  ''Establecimiento de relaciones diplomáticas'', status ''Vigente''. The Ministry''s release of 14 May 2024 (src_20240514_mirex_coherencia-medio-oriente) says that in 2009 the country ''estableció
  relaciones diplomáticas con el Estado de Palestina''. The row of recognitions.csv rests on this record (R21, flagged: a joint communiqué establishing relations with the State of Palestine, not
  a separate act of recognition). Captured by Save Page Now; the extracted text keeps the site''s menu before the record (the record is at lines 171 to 195).'
