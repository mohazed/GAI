notes: 'Liechtenstein Law Gazette 2024 No. 289, issued 17 July 2024: the Government''s ordinance, with reference to Council Decision (CFSP) 2024/1967 of 15 July 2024, adding five persons to Annex A (items 110 to 114) and three entities to Annex B (items 29 to 31, among them Tzav 9, listed for blocking trucks carrying humanitarian aid to Gaza) of LGBl. 2021 No. 104; in force on the day of publication; signed by the Prime Minister, Daniel Risch. The PDF''s metadata date is 16 July 2024; the gazette''s own date is 17 July 2024 (B-663). No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 85,354 bytes, SHA-256 equal to the index row). Text extracted from the PDF.'
