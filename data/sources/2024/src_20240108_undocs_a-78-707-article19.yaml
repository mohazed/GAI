notes: 'Lists the 10 Member States in arrears under Article 19 on 8 January 2024 (Afghanistan, Antigua and Barbuda, Comoros, Dominica, Ecuador, Iran, Liberia, Sao Tome and Principe, Somalia, Venezuela); minimum payments computed on the contributions of 2022 and 2023; footnote: resolution 78/2 permitted the Comoros, Sao Tome and Principe and Somalia to vote until the end of the 78th session. Updated by A/78/707/Add.1 to Add.5. Reached through documents.un.org/api/symbol/access?s=A/78/707&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
