notes: 'Liechtenstein Law Gazette (Landesgesetzblatt) 2024 No. 168, issued 23 April 2024: the Government''s ordinance, under the International Sanctions Act (ISG) and with reference to Council Decision (CFSP) 2024/1175 of 19 April 2024, adding four settlers to Annex A (items 106 to 109) and two entities to Annex B (items 27 and 28, among them the Hilltop Youth) of the ordinance of 16 March 2021 on human rights sanctions (LGBl. 2021 No. 104); in force on the day of publication; signed for the Government by the Prime Minister, Daniel Risch. Found through the amendment history of LGBl. 2021 No. 104 on gesetze.li (the consolidated law''s metadata page). No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 77,906 bytes, SHA-256 equal to the index row). Text extracted from the PDF (hyphenated line breaks kept).'
