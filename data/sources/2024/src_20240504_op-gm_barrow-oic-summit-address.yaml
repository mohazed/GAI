notes: The President's own address as State House prints it (the page is dated 'May 04'; the 15th Islamic Summit of the Organisation of Islamic Cooperation met in Banjul on 4 and 5 May 2024, and
  the Final Communique printed on the same site refers to a forum of 1 to 3 May 2024). Gaza is named at lines 29 and 31; lines 37 to 39 commend South Africa's case before the ICJ and say that
  impunity for 'grave violations of international law, such as those committed against the Palestinian people, will not be tolerated' (the B9 event of docs/10 B-799). Save Page Now capture; the
  replay fetched again with curl --compressed equals the index row. Text extracted by readability (the page's date line is not in the extracted text).
