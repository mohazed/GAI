notes: "The Ministry's English news item on the Foreign Minister's speech at the extraordinary meeting of the OIC Council of Foreign Ministers in Jeddah. The page gives its date (Tuesday 05 March 2024) and its first sentence (\"delivered, on March 05, 2024 in Jeddah, a speech\") above the article body, outside the extracted text, which begins at the body's first paragraph (\"reiterated, here Tuesday\"). The Ministry's site answers scripted requests with a bot check after the first request; the page was read in the built-in browser and archived with pnpm archive (Save Page Now's crawler received the page), docs/10 B-402. Text extracted by readability."
