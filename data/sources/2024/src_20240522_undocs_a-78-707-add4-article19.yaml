notes: 'Ecuador made the payment necessary to reduce its arrears below the Article 19 amount. Addendum to A/78/707, dated twelve days after the vote of 10 May 2024 (A/RES/ES-10/23); the letter does not state the date of the payment. Reached through documents.un.org/api/symbol/access?s=A/78/707/Add.4&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
