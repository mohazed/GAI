notes: "Kun.uz's report of 27 December 2024 (19:43): the ambassador in Cairo, Mansurbek Kilichev, announced that on 26 December, on the President's initiative and in coordination with the Ministry of Health, 100 injured Palestinian children and women and their companions were evacuated to Uzbekistan, to be accommodated in rehabilitation centres and hospitals; the headline says 'from Rafah'. Saved with Save Page Now on 2026-11-11; the replay fetched with curl (gzip-decoded) and the archiver's copy are equal in bytes (216,642) and SHA-256 (checked 2026-11-11). Cited by evt_2024_12_26_UZB_D4."
