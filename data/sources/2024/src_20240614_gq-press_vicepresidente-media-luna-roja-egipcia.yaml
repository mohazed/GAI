notes: The Government's press office reports the Vice President's handing over, in Cairo, of EUR 500,000 (more than 350 million CFA francs) to the Red Crescent of Egypt 'para apoyar los esfuerzos
  de las Naciones Unidas y demás países en asistencia humanitaria para la población de Gaza', and his call for the protection of civilians (the Vice President is not a B9 speaker, R3). Recorded
