notes: 'Text of the Berlin Declaration of 12 December 2024 as the Ukrainian Ministry publishes it: ''We, Foreign Ministers of France, Germany, Italy, Poland, Spain and the United Kingdom
  as well as the High Representative of the European Union ... have come together with the Foreign Minister of Ukraine''; it ''stress[es] the need for a ceasefire, a hostage release deal
  and provide[s] humanitarian aid at scale also in Gaza''. Recorded from the existing Wayback capture 20241212223712; the replay equals the recorded bytes and SHA-256. The Ukrainian Minister
  is not among the ''We'' who issue it; not filed for any country. Cited by lead_20261109_UKR_5.'
