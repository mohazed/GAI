notes: 'The joint written answer of the Minister of Justice, Elisabeth Margue, and the Minister of Foreign Affairs and Foreign Trade, Xavier Bettel, to parliamentary question No 1577 of 25 November 2024 (deputies Franz Fayot and Yves Cruchten), dated and received 23 December 2024: Luxembourg took note of the Court''s decision to issue arrest warrants against Benjamin Netanyahu, Yoav Gallant and Mohammed Deif and will apply all its obligations under the Rome Statute (lines 5 to 10). Found by web search. No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 753,209 bytes, SHA-256 equal to the index row). Text extracted from the PDF.'
