notes: 'The Government''s information service publishes the Prime Minister''s remarks in full (the General Debate page of the 79th session gives 27 September 2024 and names Terrance Micheal Drew,
  Prime Minister). Recorded from the existing Wayback capture 20241005205643: Save Page Now answers sknis.gov.kn with error:bad-gateway (HTTP 502) at three attempts (a failed row was removed from
  the index, B-208) while the page has good Wayback captures. The delegation''s own file (gadebate.un.org/…/79/kn_en.pdf) has captures of 30 September and 11 November 2024 but its extracted text
  drops the ''fi'' ligatures (''cease re''), so this clean copy is cited; the sentence on Gaza is at line 36. Text extracted by readability.'
