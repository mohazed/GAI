notes: Official gazette of 14 October 2024 (187), page 10413 to 10414. It prints the National Assembly's declaration of 11 October 2024 asking the Government to consider breaking relations with
  Israel (its text cites the genocide in Gaza) and the Presidential Agreement No. 181-2024 of 11 October 2024, which revokes the ambassador's appointment 'por rompimiento de Relaciones Diplomáticas
  con el Gobierno de Israel'. Recorded from the existing Wayback capture 20260512054956 (pgr.gob.ni does not answer from outside Nicaragua); the bytes (2,349,657) were checked against a second
  download of the replay. Text extracted from the PDF, 167 KB, under the 200 KB limit. The Government's own communiqué of 11 October 2024 (El 19 Digital) could not be fetched (HTTP 403) and has
  no Wayback capture.
