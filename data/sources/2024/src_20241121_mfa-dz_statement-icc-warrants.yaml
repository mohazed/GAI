notes: "Statement of Algeria's Ministry of Foreign Affairs on the ICC arrest warrants, dated 21/11/2024 in its title (line 85), Arabic version. mfa.gov.dz did not answer scripted requests on 2026-11-09 (timeout), as in P-16 (docs/10 B-453); the page was found through the Wayback CDX index (four captures of the EN, FR, AR and default paths, 1 January and 15 February 2025) and recorded from the Arabic capture 20250215131731 (`--capture`), the only one whose HTML carries the statement's text (the English and French captures hold only the page shell, the text being loaded by script). The replay re-fetched with curl --compressed has the same bytes (51,907) and SHA-256. The statement is issued in the Ministry's name, unsigned."
