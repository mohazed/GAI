notes: "The Chamber's stenographic record of 27 November 2024, with the question time at which the Minister of Foreign Affairs, Antonio Tajani, answered three questions on the ICC arrest warrants (page 67 of the PDF; the archiver's extracted text is truncated at 200 KB and stops before it, so the passage was read in the full PDF and in the HTML version, sed0388/stenografico.htm, which Save Page Now refused with HTTP 503): 'L'Italia, come sapete, è parte dello Statuto di Roma e rispetta gli obblighi derivanti dal suo impegno verso la giustizia internazionale. Riconosciamo l'importanza della Corte penale internazionale come istituzione indipendente. Abbiamo preso atto della sua decisione di emettere un mandato di arresto nei confronti del Premier israeliano Netanyahu e dell'ex Ministro della Difesa Gallant. Riteniamo indispensabile esaminare in dettaglio le motivazioni di tale decisione. Stiamo effettuando, in raccordo con altri Paesi dell'Unione europea, approfondimenti giuridici anche in relazione alla prevalenza del diritto internazionale generale sulle immunità.' In a reply: the Court 'debba svolgere un ruolo giuridico e non politico'. Archived with Save Page Now on 2026-11-10; the replay and a direct download are equal in bytes and SHA-256. Not filed: the Minister states neither that Italy will execute the warrants nor that it will not (author's reading, docs/10 B-2143). Cited by lead_20260928_ITA_2 (T-G-LEADS-4)."
