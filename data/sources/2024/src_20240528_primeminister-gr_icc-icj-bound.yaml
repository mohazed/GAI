notes: "Transcript of the Prime Minister's television interview of 28 May 2024, published by his office. primeminister.gr refuses scripts and Save Page Now (HTTP 403, Akamai), so the page was recorded from its existing Wayback capture of 13 December 2025 (pnpm archive --capture); the replay was fetched again with curl --compressed on 2026-11-10, bytes and SHA-256 equal to this record. Text extracted by readability; the question on the ICC Prosecutor's applications at lines 142 and 143, the answer at line 144 ('δεσμευόμαστε από τις αποφάσεις του Διεθνούς Δικαστηρίου'), Rafah at lines 145 and 146. Cited in the B4 note of data/assessments/GRC.yaml (docs/10 B-2124)."
