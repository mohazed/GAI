notes: 'Ministerial decision No 2024-63 of 15 July 2024, signed by the Minister of State, Pierre Dartout: under Sovereign Ordinance No 8.664 of 26 May 2021 on asset freezes applying international economic sanctions, the annex of decision No 2021-1 of 4 June 2021 (Monaco''s national freeze list) is amended as set out in the decision''s annex (published as a separate spreadsheet, archived as src_20240715_geldefonds-mc_dm-2024-63-annexe). Found through the list of ministerial decisions on geldefonds.gouv.mc (read in the browser pane: the site answers 403 to scripts, its downloads do not). No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 143,562 bytes, SHA-256 equal to the index row). Text extracted from the PDF.'
