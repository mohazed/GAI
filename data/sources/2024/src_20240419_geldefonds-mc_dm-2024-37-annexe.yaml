notes: 'The annex of ministerial decision No 2024-37 of 19 April 2024 (spreadsheet): the entries added to Monaco''s national freeze list under the EU human rights sanctions regime (Regulation (EU) 2020/1998), on the legal basis of Implementing Regulation (EU) 2024/1172 of 19 April 2024: four persons (Ben Pazi, Levi, Ettinger, Yered) and two entities (Lehava, Hilltop Youth). No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 10,416 bytes, SHA-256 equal to the index row). The text file holds the cell contents of the sheet, one row per line with cells separated by " | ", extracted by the session (the archiver kept the zipped bytes; precedent: src_20260630_nzsuperfund_exclusions-list-june-2026).'
