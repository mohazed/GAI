notes: 'Mexico''s declaration of intervention under Article 63 in ICJ case 192 (ICJ document 192-20240524-int-01-00-en.pdf), as published by UNISPAL; the ICJ''s own copy answers HTTP 403 to scripts and to Save Page Now and all its Wayback captures are 403 pages (docs/10 B-203); in the built-in browser on 2026-11-09 the Court''s case page lists it as the "Declaration of intervention of Mexico". Found through the Wayback CDX listing of UNISPAL''s upload folder of May 2024 and recorded from the existing capture (`--capture 20240604222315`, Wayback serving the identical snapshot 20240625015137); the replay re-fetched with curl --compressed has the same bytes (500,885) and SHA-256. Text extracted by pdf (text layer present). The filing date is printed on the cover and confirmed by the Court''s report A/79/4, paragraph 231.'
