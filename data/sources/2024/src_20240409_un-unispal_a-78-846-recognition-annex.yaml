notes: 'Document A/78/846-S/2024/283 (distributed 9 April 2024; letters dated 2 April 2024), signed by Abdulaziz Alwasil, Permanent Representative of the Kingdom of Saudi Arabia and Chair of the Arab Group,
  with the Permanent Representatives of Mauritania (OIC Group) and Uganda (Coordinating Bureau of the Non-Aligned Movement). The annex lists 140 Member States with a date of recognition of the State of
  Palestine; it is the source of recognises_palestine.since in data/countries.yaml (docs/10 B-178). Recorded from the existing Wayback capture 20260801205400 of the UNISPAL file (no new Save Page Now capture);
  replay re-fetched with curl --compressed on 2026-11-10: 331,679 bytes, SHA-256 equal to the index row. Text extracted from the PDF text layer. Cited in recognitions.csv for Saudi Arabia as its own document
  (B-950 (1) default) and, flagged under R21, for the states without a document of their own (CHECKUP §2b default), task T-G-B8.'
