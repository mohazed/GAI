excerpt: A vessel suspected by the Namibian authorities to be carrying military cargo intended for Israeli use in the ongoing war in Gaza has been blocked from docking in the southern African
  country.
notes: 'BBC News'' report of 28 August 2024 as republished by The Star (Nairobi) on the same day (the text says Namport ''has not responded to the BBC''): the Justice Minister told the state-run
  New Era that the MV Kathrin, set to dock at Walvis Bay on Monday (26 August), was stopped and, citing a police investigation, that the vessel was ''indeed carrying explosive material destined
  for Israel, and was therefore prohibited from entering Namibian waters''. Cited by evt_2024_08_24_NAM_A8. The live URL redirects to /news/realtime/; replay of the Wayback capture 20261110054233
