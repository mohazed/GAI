notes: "The draft Plan of Cooperation between the two Ministries of Health on maternal and child health, as a Word file on the Government's portal (file created and saved on 2 September 2024; the Council of Ministers approved the draft on 30 August 2024, src_20240830_gov-bg_ms-zasedanie-30-08-2024). Its preamble says the Ministries agree the plan 'въз основа на Споразумението между правителството на Република България и правителството на Държавата Израел за сътрудничество в областта на здравеопазването и медицинската наука, подписано в София на 14 март 1991 г.'; article on final provisions: in force on signature for four years, renewed automatically. Save Page Now returned the existing capture of 12 December 2025, whose bytes equal a direct download of 2026-11-10 (SHA-256 equal). The archiver's raw text extraction kept the binary Word file; the text file is the macOS textutil conversion of the same bytes to UTF-8 text. Cited by lead_20261005_BGR_3 only (T-G-LEADS-1, docs/10 B-2132)."
