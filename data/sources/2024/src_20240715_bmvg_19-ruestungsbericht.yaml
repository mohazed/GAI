notes: "The Ministry's 19th report on armaments matters, part 1 (PDF created 15 July 2024; the date is the file's). In the F-35A chapter (lines 1172-1176): 'Die industrielle Vereinbarung zur Zusammenarbeit zwischen LM, Northrop Grumman und Rheinmetall wurde im August 2023 mit dem ersten Spatenstich zum Bau einer Produktionsstätte für F-35 Rumpfmittelteile in Weeze konkretisiert.' The replay of the capture of 2026-11-10 is equal in bytes and SHA-256 to a direct download. Cited by evt_2023_10_07_DEU_A3 (T-G-LEADS-2, docs/10 B-2138)."
