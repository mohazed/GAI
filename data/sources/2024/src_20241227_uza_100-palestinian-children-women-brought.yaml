notes: "The state news agency's item of 27 December 2024 (12:26): 'yesterday' a special charter flight on the Tashkent-Egypt-Tashkent route brought 100 Palestinian children and women affected in the war zones, with those accompanying them, who are to receive full medical examinations from the state and be placed in health sanatoria. Recorded from the existing Wayback capture 20241227090415; the replay fetched with curl and the archiver's copy are equal in bytes (55,247) and SHA-256 (checked 2026-11-11). Recorded as press, as Viet Nam's state broadcaster is (lead_20261110_VNM_1). Cited by evt_2024_12_26_UZB_D4."
