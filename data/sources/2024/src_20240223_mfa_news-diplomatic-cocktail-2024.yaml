notes: 'The Ministry''s press release (page dated 23 February 2024) on the annual Diplomatic Cocktail of the Minister for Foreign Affairs and Tourism, Sylvestre Radegonde, with his remarks printed in quotation marks (the Gaza passage is on line 77). Save Page Now capture; the replay fetched again with curl --compressed equals the index row (724,173 bytes). Text extracted by html-body. The Ministry''s site (mfa.gov.sc, WordPress, post types news and speeches; its REST search answers) was not read by the earlier sessions, which took mofa.gov.sc (the Ministry of Fisheries and Agriculture) for the only candidate (docs/10 B-831).'
