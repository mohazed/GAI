notes: 'The Ministry''s news item on the call of 12 January 2024 (2567 of the Buddhist era); it states the dates of Thailand''s recognition of the State of Palestine (17 January 2012) and of diplomatic
  relations (1 August 2012) and that Thailand has consistently contributed to UNRWA. The registry date for the recognition is 18 January 2012 (the Ministry''s own page gives the 17th: the Ministry''s date
  is used for the row of recognitions.csv). Saved with Save Page Now on 4 November 2026; the replay equals the index row (111,159 bytes, same SHA-256).'
