notes: "Speaking notes of the Minister of Foreign Affairs (Lars Løkke Rasmussen) for the Foreign Affairs Committee's consultation of 13 September 2024 on export control for the F-35 programme, sent as the answer to URU alm. del question 252 (ODA document 1120346, 24 September 2024), as published by the Folketing. ft.dk refuses Save Page Now (HTTP 403), so the PDF was recorded from its existing Wayback capture of 22 August 2025 (--capture, docs/10 B-188). Filed as kind official: the Minister's own words in the parliament's official record. Recorded from the existing Wayback capture 20250822005658 (no new Save Page Now capture). Text extracted by pdf."
