notes: 'Bolivia''s declaration of intervention under Article 63 in ICJ case 192 (ICJ document 192-20241008-int-01-00-en.pdf), as published by UNISPAL in a reduced-size file; the ICJ''s own copy answers HTTP 403 to scripts and to Save Page Now and all its Wayback captures are 403 pages (docs/10 B-203); in the built-in browser on 2026-11-09 the Court''s case page lists it as the "Declaration of intervention of Bolivia". Found through the Wayback CDX listing of UNISPAL''s upload folder of October 2024 and recorded from the existing capture (`--capture 20241212112248`); the replay re-fetched with curl --compressed has the same bytes (5,160,418) and SHA-256. Text extracted by pdf: the text layer is an OCR of a scan with some letter errors (for instance ''destmction''); only passages that read clean are quoted. The cover gives 8 October 2024, the date the Court''s report A/80/4, paragraph 202, gives for the filing.'
