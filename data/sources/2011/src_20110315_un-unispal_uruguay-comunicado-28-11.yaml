notes: The Government's own press release no. 28/11 (the text names no Ministry in the extract; UNISPAL titles it 'Statement by the Government of Uruguay recognizing the State of Palestine'), reproduced on the United Nations' UNISPAL site, record dated 15 March 2011. It says that 'en el día de hoy' the decision to recognise the Palestinian State was communicated to the Palestinian Authority, with the General Assembly resolutions 181 and 3236 and Security Council resolution 242 as basis. The date of the release is the UNISPAL record date; the page does not print a day. Save Page Now capture 20261109232359, compared with the Wayback replay by byte count and SHA-256 (equal). Text extracted by readability.
