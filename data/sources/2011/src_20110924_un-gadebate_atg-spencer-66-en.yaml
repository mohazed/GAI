notes: English text of the statement as the General Debate site publishes it (headed 24 September 2011, 'Please check against delivery'). Recorded from the existing Wayback capture 20210718180549;
  the replay equals the recorded bytes and SHA-256. The Prime Minister, who is also the Minister of Foreign Affairs, says that Antigua and Barbuda decided 'to join with others who have already
  done so and grant recognition to the State of Palestine' (lines 54 to 56). It is the state's own document for the pre-existing recognition that the registry dates 22 September 2011 (A/78/846
  annex); the row of recognitions.csv was added in the finish run (T-F-L03, docs/10 B-938), as for Belize (R21).
