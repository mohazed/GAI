notes: UNISPAL's copy of A/65/939-S/2011/543 (document dated 8 September 2011). The Permanent Representative's letter of 29 August 2011 transmits the statement issued on 29 August 2011 by the Ministry of Foreign Affairs, Foreign Trade and Consumer Affairs, which says that the Government 'has today decided to formally recognize the State of Palestine'. The statement is the Government's own text; the United Nations circulated it. Save Page Now capture 20261109233208, compared with the Wayback replay by byte count and SHA-256 (equal). The digitallibrary.un.org copy of the same document (A_65_939--S_2011_543-EN.pdf) answered Save Page Now with HTTP 202 and was not archived. Text extracted by readability.
