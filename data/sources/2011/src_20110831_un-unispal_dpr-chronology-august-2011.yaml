notes: 'The Division for Palestinian Rights'' monthly review of events (UNISPAL''s copy). Line 28: ''El Salvador and Honduras recognize Palestine as an independent State (25 and 26 August)''.
  The review is dated by the month it covers (31 August 2011); the issue date was not read. A review of the UN Secretariat, not the Government''s own text: the Government''s statement of the recognition
  is the President''s address of 21 September 2011 (src_20110921_un-unispal_hnd-lobo-ga66-excerpt). Text extracted by readability.'
