excerpt: "México ha tenido una posición desde hace años, no solo de los gobiernos de la Cuarta Transformación, sino viene de antes, del reconocimiento del Estado palestino y al mismo tiempo, el Estado de Israel."
notes: "Official transcript of the President's morning press conference of 5 February 2025 (Presidency). The B8 source (recognitions.csv, row MEX,2023-06-02): the President describes the recognition of the Palestinian State as a position held for years, from before the governments of the Fourth Transformation (2018 on). The day, 2 June 2023, is the registry's (data/countries.yaml, from A/78/846), not read in a Mexican document; the President said later (2 October 2025, 5 March 2026) that her government recognised Palestine as a State in full by accrediting its ambassador, which would be the new tier (docs/10 B-367 (1)). Text extracted by readability."
