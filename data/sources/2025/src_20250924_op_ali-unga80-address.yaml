notes: 'The Office of the President''s report of the address of 24 September 2025 (the General Debate page of the 80th session gives that date; the page is dated 25 September), with the President''s
  words in quotation marks (lines 11 to 14): the condemnation of 7 October, the call for the release of the hostages, ''not warfare, but mass extermination'', ''halt the genocide''. The delegation''s
  own file (gadebate.un.org/…/80/gy_en.pdf, headed ''September 23rd 2025'') has no Wayback capture and the site fails Save Page Now (405), so this page is the archived copy. Text extracted by
  readability.'
