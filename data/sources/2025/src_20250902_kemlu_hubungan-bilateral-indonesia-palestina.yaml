notes: "The Ministry's country brief on relations with Palestine (PDF in the Ministry's document repository; its file name carries the Unix time 1756801047, 2 September 2025, and its last dated entry is of August 2025). Page 1 states that Indonesia was among the first countries to recognise the independence of Palestine after the State of Palestine was declared in Algiers on 15 November 1988. Cited by data/structured/recognitions.csv (B8) and by assessment notes. Archived with pnpm archive."
