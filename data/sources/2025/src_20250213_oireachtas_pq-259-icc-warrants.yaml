notes: "The Official Report's Akoma Ntoso record of the written answer (the HTML page on oireachtas.ie shows a human check, which was not passed; the record was found through api.oireachtas.ie/v1/questions for 13 February 2025). The Minister for Justice answers Deputy McGuinness: 'operational details in that regard are not made public' and 'If, in due course, Ireland were to receive a request for the arrest and surrender of a person who is subject to an International Criminal Court arrest warrant, such a request would fall to be dealt with in accordance with the International Criminal Court Act 2006 (as amended).' (line 80). It names no person and does not say that the warrants would be executed. Save Page Now capture 20261110224734; its replay and a direct download are equal in bytes and SHA-256; the archiver's date (the capture day) is replaced by the answer's date. Cited by lead_20260928_IRL_1 only (T-G-LEADS-3)."
