notes: "The Directorate's report of the President's address to the general debate of the 80th session, quoting it verbatim. The page prints no date; the address was delivered on 23 September 2025, the first day of the general debate. The Presidency's own transcript (tccb.gov.tr) could not be archived: the site answers scripted requests with a redirect loop and Wayback holds only 302 captures of its speech pages. Text extracted by readability."
