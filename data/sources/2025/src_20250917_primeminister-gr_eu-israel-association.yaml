notes: "Transcript of the Prime Minister's television interview of 17 September 2025, published by his office. primeminister.gr refuses scripts and Save Page Now (HTTP 403, Akamai), so the page was recorded from its existing Wayback capture of 21 January 2026 (pnpm archive --capture); the replay was fetched again with curl --compressed on 2026-11-10, bytes and SHA-256 equal to this record. Text extracted by readability; the Gaza passage at lines 231 to 244 (the Commission's proposed suspension of trade concessions, 'Δεν είμαι σίγουρος ότι μία αναστολή ...' at line 242; the term genocide declined at line 238). Cited in the A6, C1 and B10 notes of data/assessments/GRC.yaml; an interview, so not a B9 instance (docs/10 B-325 (4), B-2124)."
