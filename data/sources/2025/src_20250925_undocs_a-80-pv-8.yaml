notes: 'Verbatim record of the General Debate meeting of 25 September 2025, 9 a.m. (A/80/PV.8, 67 pages; the PDF was created on 25 November 2026 and was first served by the Official Document
  System symbol link documents.un.org/api/symbol/access?s=A/80/PV.8&l=en&t=pdf after 2026-11-10, when T-G-LEADS-3 found A/80/PV.7 to PV.16 not issued). The record holds the text of speeches
  delivered in English and the translation of speeches delivered in other languages (line 8). The President of Ghana, John Dramani Mahama, speaks in English at lines 1417 to 1663 (no "spoke in"
  note), so the record is his own delivered words; his passage on Gaza is at lines 1563 to 1571. Saved with Save Page Now on 2026-11-28; the Wayback replay fetched again has the same SHA-256 and
  byte count. Text extracted by pdf (248 KB, complete: it ends with "The meeting rose at 2.50 p.m."). Filed in the launch-plan run (T-H-UNDOCS, docs/10 B-2179).'
