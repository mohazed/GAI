notes: "The decree's text in the National Database of Legislation (Uzbek, Cyrillic script; in force 15 August 2025; paragraph 3 (d) added by Decree PF-157 of 8 September 2025, as the database notes). Saved with Save Page Now on 2026-11-11; the replay fetched with curl (gzip-decoded) and the archiver's copy are equal in bytes (184,429) and SHA-256 (checked 2026-11-11). The preamble refers to the shelter and support given to 'Palestinian citizens brought to Uzbekistan' (the 'guests'); paragraph 1 (b) records that the guests were given medical examinations and medicines; paragraph 2 approves a Republican Commission for 'Palestinian patients and those accompanying them'. The decree names neither Gaza nor the date of arrival. Cited by evt_2024_12_26_UZB_D4 (T-G-LEADS-8, docs/10 B-2153)."
