notes: "Press note of the Ministry of Foreign Affairs, published 21 September 2025 19h35, welcoming the recognitions by Australia, Canada, the United Kingdom and Portugal; it states that Brazil has recognised the State of Palestine since 2010. Source of the BRA row of data/structured/recognitions.csv (docs/10 B-353 (4)): the statement gives the year; the day, 3 December 2010, is that of the Ministry's note \"Reconhecimento do Estado palestino nas fronteiras de 1967\", whose URL Wayback first recorded on 3 December 2010 (capture 20101203231537, HTTP 403, not readable; the page no longer exists on gov.br). The registry's 2011-12-03 (data/countries.yaml, from A/78/846) contradicts the year of this statement. Recorded from the existing Wayback capture 20250922155534 (no new Save Page Now capture); Save Page Now capture 20250922001006, Wayback serves the identical snapshot 20250922155534. Text extracted by html-body."
