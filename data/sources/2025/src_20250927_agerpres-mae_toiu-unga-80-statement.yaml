notes: "The Ministry of Foreign Affairs' press release of 28 September 2025 (09:02), published in the 'COMUNICATE' feed of AGERPRES, the national news agency, which carries issuers' releases under the heading 'Comunicat de presă - MAE'. The release says the Foreign Minister delivered Romania's national statement in the General Assembly plenary on 27 September 2025, links the UN Web TV video (webtv.un.org/en/asset/k15/k1517tcuo2) and prints 'transcrierea în limba engleză a intervenției' (lines 6 onwards of the text; the release's five opening lines are in Romanian, the rest of the text is the English transcript, hence language en). The Ministry's own site (mae.ro) answers a verification check and the General Debate file (gadebate.un.org/sites/default/files/gastatements/80/ro_en.pdf) cannot be archived (lead_20261005_ROU_1). Save Page Now capture 20261110235549; the replay fetched with curl --compressed equals the archiver's copy in bytes (63,701) and SHA-256. Recorded as kind official: the Government's own release with the Minister's words as delivered (the Presidency-report route of docs/10 B-569 applied to a Ministry release; flagged for the author, B-2148). Cited by evt_2025_09_27_ROU_B9 (T-G-LEADS-6)."
