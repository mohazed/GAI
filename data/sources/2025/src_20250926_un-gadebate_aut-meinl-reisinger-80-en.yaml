notes: "The delegation's file at_en.pdf of the 80th General Debate: a browser printout (3 pages) of the Ministry's page headed 'New York, 26. September 2025', 'Check against delivery'; the UN's page of the statement gives 25 September 2025 as the date of delivery, which the event uses. Recorded with --capture 20260108002637 (an existing Wayback capture). The PDF's text layer is garbled (symbol-font encoding): the archived text is the OCR text (tesseract, English model, 150 dpi) of the three pages, with page markers, and the passages quoted in events were compared with the page images. The replay was fetched again with curl --compressed and equals the index row (same byte count and SHA-256)."
