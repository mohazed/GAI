notes: 'The Prime Minister''s Office release, bylined ''October 29, 2025'', on the courtesy call of Israel''s Deputy Foreign Minister, Sharren Haskel, on the Prime Minister ''today (20.10.25)'' at Melanesian
  House: Mr Marape''s quoted words are ''Papua New Guinea stands with Israel during these difficult times it is going through as the people of Israel look to find peace'' and, on Hamas, ''if they really
  value peace in Gaza, they must take the first step''. The event is dated 20 October 2025 by the release''s own text; the release was posted nine days later. Captured by Save Page Now on 2026-10-07. Text
  extracted by readability.'
