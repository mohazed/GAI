notes: 'The Government''s copy of Liechtenstein''s statement in the 80th General Debate (gadebate.un.org has no file for Liechtenstein for that session, T-P21-49). Lines 1 to 6 name the speaker, Deputy Prime Minister Sabine Monauni, Minister of Foreign Affairs, Environment and Culture, and the date. Line 28 onward: in Gaza, we have become bystanders; we are merely witnesses to the unprecedented and unjustifiable suffering of civilians, in spite of our pledge to end and prevent atrocity crimes (no call and no named violation: not a B9 event). Found by web search. A Wayback capture of 16 June 2026 exists (CDX); recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 246,029 bytes, SHA-256 equal to the index row). The PDF''s metadata date is 3 October 2025; the speech''s date is 25 September 2025 (B-663). Text extracted from the PDF.'
