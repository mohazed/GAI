notes: 'Report of the Ministry''s statement of 30 September 2025: 57 people evacuated from the Gaza Strip on 29 and 30 September (48 Ukrainian citizens and nine Palestinian nationals), flown
  to Chisinau. A consular evacuation of citizens, not a medical-evacuation programme (D4) or a visa instrument (D5). Cited in the notes of UKR D4 and D5.'
