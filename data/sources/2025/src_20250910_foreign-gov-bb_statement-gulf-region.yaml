notes: 'The Ministry''s own page of 10 September 2025 (''Author: Government of Barbados''; no minister or Prime Minister is named). Archived by Save Page Now on 2026-11-09; the replay equals the
  recorded bytes and SHA-256. Read in the finish run (T-F-L03, docs/10 B-937): it condemns the Israeli strikes on Qatar and says the priority should be ''an immediate and long-term ceasefire in
  Gaza, the return of all hostages and prisoners'' and the two-state solution. It names no speaker, so under R3 (docs/10 B-442) it is not a B9 event, as for the Government''s statement of 26 October
  2023. Cited by lead_20261109_BRB_2.'
