notes: 'Plan V''s report on the President''s meeting with Israel''s Prime Minister in Jerusalem on 5 May 2025, which quotes him: ''Para nosotros, es simple. Tenemos los mismos enemigos. Nuestros
  enemigos son la pobreza, el terrorismo, la miseria''. The words are the outlet''s (the Israeli Ministry of Foreign Affairs published the meeting; the Presidency did not): not unconditional support
  and not an official transcript, so not filed as B10. Captured by Save Page Now (704,862 bytes; the first page of text). Text extracted by readability.'
