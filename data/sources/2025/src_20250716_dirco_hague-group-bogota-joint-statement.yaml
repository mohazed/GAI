notes: "The Hague Group's joint statement adopted in Bogotá on 16 July 2025, as South Africa's Department of International Relations and Cooperation publishes it (3 pages). Save Page Now capture 20261110234706, served by Wayback as the identical snapshot 20260105190856; the replay fetched with curl, a direct download and the archiver's copy are equal in bytes (326,105) and SHA-256. It opens 'We, the representatives of Bolivia, Cuba, Colombia, Indonesia, Iraq, Libya, Malaysia, Namibia, Nicaragua, Oman, Saint Vincent and the Grenadines, South Africa and all other states* that endorse the following before the 20th September 2025' and names no signatory person; the six measures are commitments. Not cited by an event: a joint statement counts for B9 only with the state's head of government or foreign minister named as signatory (docs/10 B-444). Read for lead_20261104_NAM_1 and lead_20261006_NIC_4 (T-G-LEADS-5)."
