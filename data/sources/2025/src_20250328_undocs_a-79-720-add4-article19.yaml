notes: 'The Congo made the payment necessary to reduce its arrears below the Article 19 amount. Addendum to A/79/720. The Article 19 page captured on 1 April 2025 (src_20250401_un-ga_article19-page) still lists the Congo; the page of 20 June 2025 does not. Reached through documents.un.org/api/symbol/access?s=A/79/720/Add.4&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
