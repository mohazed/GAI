notes: "Belgium's declaration of intervention dated 18 December 2025, registered by the Court on 23 December 2025 (ICJ file 192-20251223-int-01-00-fr.pdf). The ICJ's own URL answers Save Page Now with HTTP 403 and its Wayback captures are 403 pages, so the copy published by the UN's Question of Palestine site (UNISPAL) is recorded (docs/10 B-203). The PDF is a scan without a text layer: the extracted text is empty, so no quote can be checked against it; the declaration was read in this session from the archived file (OCR for reading only) and is cited in event notes, not as quoted evidence."
