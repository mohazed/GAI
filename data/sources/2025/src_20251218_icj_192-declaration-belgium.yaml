notes: "Belgium's declaration of intervention dated 18 December 2025, registered by the Court on 23 December 2025 (ICJ file 192-20251223-int-01-00-fr.pdf). The ICJ's own URL answers Save Page Now with HTTP 403 and its Wayback captures are 403 pages, so the copy published by the UN's Question of Palestine site (UNISPAL) is recorded (docs/10 B-203). The PDF is a scan without a text layer. On 2026-11-09 (T-F-UNDOCS-1) the replay was re-fetched with curl --compressed (1,187,041 bytes, SHA-256 equal to the record) and the text file was replaced by an OCR of those bytes (tesseract, English model, 300 dpi, 18 pages, page markers); the English model misreads many French accents, so only passages compared with the page images (page 6, paragraph 19) are quoted."
