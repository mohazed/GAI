notes: "Judgment of the Criminal Chamber of the Supreme Court of 5 March 2025 in misdemeanour case 4-23-4296 (Penal Code § 151¹(1)), the official PDF served by Riigi Teataja's court-decisions API. Line 24 onwards: the Police and Border Guard Board's decision of 5 December 2023 fined a participant of the demonstration of 5 November 2023 on Freedom Square in Tallinn 120 euros for holding a placard reading 'Jõest mereni'; Harju County Court upheld the fine on 11 July 2024; lines 17-18: the Supreme Court annulled the County Court's judgment and terminated the proceedings. The text extraction renders § 151¹ as '§ 1511'. The replay of the capture of 2026-11-10 is equal in bytes and SHA-256 to a direct download. Cited by evt_2023_12_05_EST_E2 (T-G-LEADS-2, docs/10 B-2137)."
