notes: "Judgment ECLI:BE:RVSCE:2025:ARR.263.167 annulling the Walloon ministerial decree of 27 May 2024 on military equipment in transit through the airports bound for Israel (article 1 of the operative part, line 190), on the application of four Challenge companies filed on 8 July 2024. Found through the Council of State's refLex record of the decree (judgment number 263167, 29/04/2025, Annulation), linked from the decree's Justel page. Replay re-fetched (curl --compressed): bytes and SHA-256 equal to the index row and to a direct download of 2026-11-10. Found in the P-23 lead pass (T-G-LEADS-1, docs/10 B-2133)."
