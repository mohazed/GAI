notes: "The delegation's file no_en.pdf of the 80th General Debate: a browser printout (7 pages, 9/26/25) of the Norwegian Mission's page 'GA: Norway's Statement in the General Debate of the 80th General Assembly'; the UN's page of the statement gives 25 September 2025 as the date of delivery, which the event uses. Recorded with --capture 20260108054237 (an existing Wayback capture). The PDF's text layer is garbled: the archived text is the OCR text (tesseract, English model, 150 dpi) of the seven pages, with page markers, and the passages quoted in events were compared with the page images (page 3 and 4 viewed). The replay was fetched again with curl --compressed and equals the index row (same byte count and SHA-256)."
