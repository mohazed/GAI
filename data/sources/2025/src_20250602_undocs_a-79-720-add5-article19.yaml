notes: 'Guinea-Bissau made the payment necessary to reduce its arrears below the Article 19 amount. Addendum to A/79/720, dated ten days before the vote of 12 June 2025 (A/RES/ES-10/27). The PDF carries the distribution line ''25-08618 (E) 220726'' and sits under the 2026 path of documents.un.org (n26), so this copy was issued in 2026; the Article 19 page captured on 20 June 2025 (src_20250620_un-ga_article19-page) already cites A/79/720/Add.5. Reached through documents.un.org/api/symbol/access?s=A/79/720/Add.5&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
