notes: "The Majlis Research Center's copy of the law of nine articles and seven notes: the Speaker's letter No. 54639/320 of 1404/7/15 to the President, the President's order No. 117747 of 1404/7/22 (14 October 2025) for implementation, and the text as published in the Official Gazette No. 23462 of Wednesday 23 Mehr 1404 (line 8); passed by the Majlis on 6 Mehr 1404 (28 September 2025) and approved by the Guardian Council on 1404/7/9 (1 October 2025). Article 3(a) reads 'وارد نمودن به کشور' where Hamshahri Online's report prints 'وارد کردن به کشور' (lead_20261111_IRN_3). rc.majlis.ir did not answer from this network on 2026-11-28 (timeout), so the existing Wayback capture 20251028123719 was recorded (no new Save Page Now capture); later captures of the URL (December 2025 to May 2026) are pages of about 2 KB without the text. Its replay fetched separately with curl is 63,495 bytes with the same SHA-256. The archiver's date (the capture day) is replaced by the date of the President's order. Cited by lead_20261111_IRN_3 and the IRN A7 note (T-H-RS, docs/10)."
