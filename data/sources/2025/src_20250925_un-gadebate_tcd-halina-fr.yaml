notes: "The delegation's file td_fr.pdf (22 pages, a scan with no text layer; scanner title SKM_C22725092516330). The cover reads 'Declaration du Marechal Mahamat Idriss Deby Itno, Président de la République du Tchad, Chef de l'État a la 80eme Assemblee Generale des Nations Unies, prononcée par l'Amb. Allamaye Halina, Premier ministre, Chef du gouvernement (New York, 25 Septembre 2025)'; page 2 has the Prime Minister say he reads 'le message du Président de la République du Tchad, Chef de l'État et je cite'. Recorded with --capture 20251009004133 (Save Page Now answers 405 for gadebate.un.org; the Wayback capture has the size and SHA-256 of the live file read on 2026-11-04). The replay was fetched again with curl --compressed and equals the index row (874,087 bytes, same SHA-256). archive/text holds the OCR of the 22 pages (tesseract, English model, 130 dpi; no French model installed), lines of a paragraph joined, with page markers; the cover, page 2 and the passage on Gaza (pages 6 and 7) were corrected against the page images (accents, apostrophes). The UN's page of the statement (gadebate.un.org/en/80/chad) gives 25 September 2025 and names the Prime Minister as the speaker."
