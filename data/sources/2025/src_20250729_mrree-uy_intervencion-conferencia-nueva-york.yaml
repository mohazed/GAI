notes: 'The Ministry''s text of Uruguay''s statement at the plenary of the High-Level International Conference for the Peaceful Settlement of the Question of Palestine and the Implementation of
  the Two-State Solution (New York, 29 July 2025). The page names no speaker; the Ministry''s communiqué of 8 August 2025 (as El Popular and other outlets print it) says Uruguay expressed its
  position ''a través de una intervención de la representante permanente de nuestro país en la ONU, embajadora Laura Dupuy'', who is not a B9 speaker (R3). The text cites Gaza, names violations
  of international law and humanitarian law and calls for an immediate and permanent ceasefire: a lead (docs/10 B-612). Save Page Now capture; the extracted text was read.'
