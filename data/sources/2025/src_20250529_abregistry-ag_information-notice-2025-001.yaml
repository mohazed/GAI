notes: 'The Maritime Administration''s notice of 29 May 2025 to owners, operators and masters of Antigua and Barbuda-flagged ships: carriage of arms, ammunition or military equipment ''intended
  for delivery to, or use in, a conflict zone'' is prohibited; breach makes the vessel liable to de-registration or detention in a foreign port at the owner''s expense; it cites A/RES/ES-10/24
  and A/HRC/RES/55/28 and does not name Israel. Archived by Save Page Now on 2026-11-09 (Wayback serves the identical snapshot 20260809041742). Cited by lead_20261109_ATG_3.'
