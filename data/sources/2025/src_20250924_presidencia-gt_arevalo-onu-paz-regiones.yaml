notes: 'The Presidency''s report of the President''s address to the General Assembly of 24 September 2025, with his words in quotation marks (lines 12 and 13: ''detener inmediatamente los ataques
  y garantizar el ingreso de ayuda humanitaria a todos los territorios en guerra''; ''un alto total al sufrimiento y a la muerte de población civil en Gaza''; the release of the hostages). The
  delegation''s own file (gadebate.un.org/…/80/gt_es.pdf, read on 6 October 2026, the same sentences at lines 278 to 287) has a CDX entry (Wayback 20250928064943) that Wayback does not serve,
  and the site fails Save Page Now (405), so this page is the archived copy. Text extracted by readability.'
