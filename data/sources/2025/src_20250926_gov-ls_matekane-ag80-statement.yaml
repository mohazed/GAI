notes: 'The Government''s own page (the page''s dateline is 26 September 2025; the WordPress metadata gives 29 September 2025) prints ''the full statement delivered by the Prime Minister'' at the General Debate of the 80th session. The page says he addressed the Assembly ''yesterday'' while the UN''s General Debate page and the statement''s cover give 26 September 2025; the cover date is used. The same words are in the General Debate file (gastatements/80/ls_en.pdf, read live on 2026-11-04, 275106 bytes), which has no Wayback capture and cannot be saved (gadebate.un.org fails Save Page Now with 405), so this page is the archived text (Presidency-report route, docs/10 B-569). Lines 69 to 71: Gaza, the hostages, the call for a permanent ceasefire (docs/10 B-807). Recorded from the existing Wayback capture 20260210005203 after Save Page Now answered 504 and 503 on the Government''s site; the replay fetched again with curl --compressed equals the index row. Text extracted by readability.'
