notes: 'The delegation''s statement of 30 July 2025, delivered on behalf of the Government of Guatemala: "La República de Guatemala reconoció oficialmente a Palestina el 8 de abril de 2013, como un Estado
  libre, independiente y soberano" (lines 24 to 26). The registry (A/78/846 annex) gives 9 April 2013; the row follows the state document (as Brazil''s, docs/10 B-355 (4)). Save Page Now returned the capture
  20261109222523 of the UNISPAL file; replay re-fetched with curl --compressed on 2026-11-10: 225,866 bytes, SHA-256 equal to the index row. Text extracted from the PDF text layer. English rendering (the
  session''s): "The Republic of Guatemala officially recognised Palestine on 8 April 2013 as a free, independent and sovereign State."'
