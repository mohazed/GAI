notes: 'Spanish verbatim record of the General Debate meeting of Tuesday 23 September 2025, 3 p.m. (A/80/PV.5, 84 pages; served by the Official Document System symbol link documents.un.org/api/symbol/access?s=A/80/PV.5&l=es&t=pdf). The address of the President of Colombia, Gustavo Petro Urrego, starts at line 1754; he spoke in Spanish (the record prints no "habla en" note for him), so this record holds his own words and the English record (A/80/PV.5, n2524877.pdf) is a translation (docs/10 B-2180 (4)). Save Page Now on 2026-11-28; the Wayback replay fetched again on 2026-11-28 has the same SHA-256 and byte count as the direct download. Text extracted by pdf (338 KB, complete: it ends with "Se levanta la sesión a las 23.05 horas."). The archiver dated the record from the PDF metadata (2026-10-24, the file''s creation); the meeting date is used here. Recorded in the launch-plan run (T-H-MF-4, docs/10 B-2191).'
