notes: 'Speech text as the Presidency''s site prints it (page published 25 September 2025). The UN''s General Debate page for Gabon (gadebate.un.org/en/80/gabon) gives it as President Oligui Nguema''s
  statement of 25 September 2025. Line 45: ''Le 12 décembre 1988, le Gabon reconnaissait officiellement l’État de Palestine'' (the date of recognition, a row of recognitions.csv, R21, docs/10
  B-796); the speech names neither Gaza nor a ceasefire (R7). Save Page Now capture; the replay fetched again with curl --compressed equals the index row. Text extracted by readability.'
