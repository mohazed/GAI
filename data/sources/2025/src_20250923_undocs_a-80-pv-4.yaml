notes: 'Verbatim record of the opening General Debate meeting of 23 September 2025, 9 a.m. (A/80/PV.4, 74 pages; the PDF was created on 6 October 2026 and is served by the Official Document
  System symbol link documents.un.org/api/symbol/access?s=A/80/PV.4&l=en&t=pdf). The record holds the text of speeches delivered in English and the translation of speeches delivered in other
  languages. The President of Lithuania, Gitanas Nausėda, speaks in English from line 2592 (passage on Gaza at lines 2690 to 2694) and the President of Slovenia, Nataša Pirc Musar, in English
  from line 3105 (passage on Gaza at lines 3258 to 3261); neither carries a "spoke in" note. Save Page Now answered with its existing capture of 14 November 2026; the Wayback replay fetched
  again on 2026-11-28 has the same SHA-256 and byte count. Text extracted by pdf (282 KB, complete: it ends with "The meeting rose at 4.05 p.m."). Recorded in the launch-plan run (T-H-UNDOCS,
  docs/10 B-2179).'
