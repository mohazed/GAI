notes: "Press note no. 336 of the Ministry of Foreign Affairs, published 23 July 2025 15h37 (the page says updated 26 October 2026). Save Page Now capture 20261110203451; replay fetched again with curl --compressed on 2026-11-10, bytes and SHA-256 equal to this record. Text extracted by html-body. Line 358: the Government announces it is in the final phase of submitting a formal intervention in South Africa's case and grounds the decision on the plausibility, found by the Court in 2024, that Palestinians' rights to protection from acts of genocide are being irreversibly harmed (docs/10 B-2120)."
