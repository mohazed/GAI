excerpt: The Maputo Port Development Company (MPDC). which operates the port of Maputo, has categorically denied a story circulating on social media, claiming that the port is being used to supply
  lethal military equipment to Israel.
notes: 'AIM''s report of 27 November 2025 of the port operator''s (MPDC) statement issued on Wednesday 26 November 2025: the vessel Holder G, which an NGO said had put into Maputo with 440 tonnes
  of military cargo for Elbit Systems, did not dock at any terminal and only bunkered at Buoy N1 on 19 November 2025, leaving on 20 November; destination Port Said per tracking services. Cited
  by lead_20261110_MOZ_1. Replay of the Wayback capture 20261110055815 checked (99,743 bytes, SHA-256 equal to the index row). Text extracted by readability.'
