notes: 'The General Debate site''s page for the Niger''s statement in the 80th session: it names the speaker (Lamine Zeine Ali Mahaman, Prime Minister of the Transition Government) and the date (27 September
  2025, shown in the page header), and carries the UN''s summary of the statement. gadebate.un.org now answers a scripted request with a CAPTCHA page (HTTP 405, read on 2026-11-04), so the existing Wayback
  capture 20251008034732 is recorded (--capture); the replay fetched again with curl --compressed has the same SHA-256. Text extracted by readability (the extraction keeps the UN''s summary, not the page
  header). The summary is the UN''s, in indirect speech; the statement itself is src_20250927_un-gadebate_ne-zeine-ag80.'
