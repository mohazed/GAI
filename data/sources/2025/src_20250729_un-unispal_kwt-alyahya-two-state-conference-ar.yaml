notes: 'The Kuwaiti delegation''s Arabic text as UNISPAL publishes it, listed under ''Kuwait (Arabic)'' on UNISPAL''s page of the statements of the conference''s 2nd plenary meeting of 29 July 2025 (document
  statements-by-member-states-2nd-plenary-two-states-solution-29jul25). The cover still carries the conference''s first dates (''28-30 يونيو 2025'', June, before it was postponed); the UN''s press
  release of the second and third meetings (src_20250729_unispal_two-state-conference-day-two-release, line 36) reports the Minister''s statement on 29 July 2025 in indirect speech, including the
  passage on the Palestinian Government''s authority that is point five of this text, so the date is 29 July 2025. The text layer splits the lam-alef ligature (''هللا'', ''المالجئ'', ''األراضي''); quotes
  take the archived characters. Recorded from the existing Wayback capture 20260517083307 (CDX status 200); the replay fetched again with curl --compressed is identical to the live file (157,188 bytes,
  same SHA-256). Text extracted by pdf.'
