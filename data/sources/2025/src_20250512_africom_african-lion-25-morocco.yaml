notes: "The release of United States Africa Command (a document of the United States, not of Morocco) on the opening of the Moroccan phase of African Lion 25 (dated 12 May 2025 on the page). Recorded from the existing Wayback capture 20260119021708 (africom.mil answers HTTP 403 to scripts; no new Save Page Now capture); the replay fetched with curl and the archiver's copy are equal in bytes (85,146) and SHA-256. Line 15 of the extracted text: 'Participating nations include Cameroon, Cape Verde, Djibouti, France, Gambia, Ghana, Guinea-Bissau, Hungary, Israel, Kenya, Morocco, Netherlands, Nigeria, Portugal, the United Kingdom, and the United States.' It names no unit and no activity of the Israeli forces. Cited by lead_20260929_MAR_1 only; not filed (whether Israeli participation in this recurring multinational exercise is an A5 instance is the author's reading, docs/10 B-403 (4); T-G-LEADS-5)."
