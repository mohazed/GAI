notes: "UNifeed's story page of the WHO footage of the medical evacuation of 4 March 2025. The page's summary ('Today (Mar 4), 29 child patients were evacuated from Gaza to Jordan for specialized medical treatment, accompanied by 43 companions. This was the first WHO-supported medical evacuation to Jordan since the ceasefire in Gaza began.') and its dateline ('04 MARCH 2025, EUROPEAN GAZA HOSPITAL, RAFAH, GAZA STRIP') are in the archived bytes but outside the text Readability extracted, which holds the shot list and the soundbites (lines 1 to 40); the document date is read from the dateline. Save Page Now capture 20260929150119; Wayback serves the identical snapshot 20260929173638. Text extracted by readability."
