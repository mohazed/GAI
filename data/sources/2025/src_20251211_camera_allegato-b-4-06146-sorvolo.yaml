notes: "Allegato B of the Chamber's sitting of 11 December 2025 (sitting 582), the Government's written answers to parliamentary questions. Lines 2385 to 2462 of the extracted text: the answer to question 4-06146 (Ascari, to the Ministers of Foreign Affairs, Defence, Interior and Justice) on the overflight of Italian airspace by the Israeli Prime Minister's aircraft on its way to the 80th General Assembly (September 2025), signed by the Under-Secretary of State for Foreign Affairs, Giorgio Silli: no overflight request reached the Foreign Ministry; the competent military authority (Comando squadra aerea) authorised the flight; 'non risulta essere stata notificata all'Italia alcuna richiesta di cooperazione giudiziaria da parte della Corte penale internazionale'; the execution of the Court's warrants 'si realizza infatti solo a seguito di una richiesta formale di arresto e consegna'; the visit's diplomatic initiatives are ones 'che non è nell'interesse dell'Italia, né della regione mediorientale, ostacolare'; the Government will keep 'il pieno rispetto degli obblighi internazionali'. Archived with Save Page Now on 2026-11-10; the replay and a direct download are equal in bytes and SHA-256. Not filed: the answer is signed by an Under-Secretary, not the head of government or the foreign or justice minister (docs/02 §2 B5/B6; the GBR_1 precedent of T-G-LEADS-3), and the overflight is a lead unless accompanied by a stated position on the warrants (author's reading, docs/10 B-2143). Cited by lead_20260930_ITA_2 and lead_20260928_ITA_2 (T-G-LEADS-4)."
