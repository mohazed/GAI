notes: 'Lists the 10 Member States in arrears under Article 19 on 13 January 2025 (Afghanistan, Antigua and Barbuda, Bolivia, Cabo Verde, Congo, Ecuador, Grenada, Guinea-Bissau, Sao Tome and Principe, Venezuela); minimum payments computed on the contributions of 2023 and 2024; footnote: resolution 79/3 permitted Sao Tome and Principe to vote until the end of the 79th session. Updated by A/79/720/Add.1 to Add.5. Reached through documents.un.org/api/symbol/access?s=A/79/720&l=en&t=pdf. Saved with Save Page Now (or recorded from the existing capture named in wayback_url); the replay equals the bytes fetched. Used for the Article 19 check (docs/10 B-878, docs/review/monthly-2026-11.md section 6).'
