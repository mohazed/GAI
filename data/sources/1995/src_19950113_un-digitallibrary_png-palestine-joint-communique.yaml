notes: 'UN note verbale NV/95/10 of 27 January 1995, transmitted at the request of the Permanent Representative of Papua New Guinea and the Permanent Observer of Palestine: a letter of 13 January 1995 (''today,
  the Government of the Independent State of Papua New Guinea and the State of Palestine have established diplomatic relations'') and the joint communique on the establishment of diplomatic relations at
  Ambassadorial level, ''done at New York on this 13th day of January 1995'', signed ''for the Government of the Independent State of Papua New Guinea'' by its Permanent Representative (Utula U. Samana).
  Three scanned pages with an OCR text layer; the text was compared with the page images. Recorded from the existing Wayback capture 20250325063200 (--capture; 409,185 bytes, equal to a direct download
  of the UN file on 2026-11-10).'
