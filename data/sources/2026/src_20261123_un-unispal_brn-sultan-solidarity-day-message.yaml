notes: 'The Sultan''s message for the International Day of Solidarity with the Palestinian People, headed ''23RD NOVEMBER 2026'' (the day of the Committee''s special commemorative meeting), transmitted by the Permanent Representative''s letter of 20 November 2026 to the Chair of the Committee, as UNISPAL publishes it (uploaded 23 November 2026). Three scanned pages without a text layer: the text file is machine OCR (tesseract, eng) of the three pages, checked against the page images at 110 dpi; four OCR errors corrected from the images (''23RD'', ''unfulfilled'', ''to take'', and a stray mark removed), the Jawi letterhead and the handwritten salutation of page 1 not transcribed. Archived with Save Page Now on 2026-11-28 (T-H-ML-3); the replay fetched again with curl --compressed has 595,706 bytes and the recorded SHA-256.'
