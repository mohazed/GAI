notes: 'News item of the Ministry, dated 14 October 2026: it names H.E. Abdisalam Ali as Minister of Foreign Affairs and International Cooperation. The earlier events of Somalia spell the name Abdisalan Abdi Ali (S/PV.10003); the spelling differs and the office is the same. Used for the minister''s name in evt_2026_10_16_SOM_B9 (docs/10 B-855).'
