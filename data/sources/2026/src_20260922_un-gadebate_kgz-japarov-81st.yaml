notes: "The President's statement to the General Debate of the 81st session (22 September 2026) in the Arabic text the General Debate site publishes for the delegation (12 pages); the only Wayback capture of a Kyrgyz file of the 81st session in the CDX index (`gastatements/81/kg*`, read 2026-11-10). Recorded from the existing Wayback capture 20261012171046 (no new Save Page Now capture); the replay fetched with curl and the archiver's copy are equal in bytes and SHA-256. Palestine is named once, in a list of crises ('المحيطة بأوكرانيا وإيران والسودان وفلسطين', the events surrounding Ukraine, Iran, Sudan and Palestine, line 18 of the extracted text); Gaza is not named and no ceasefire is called for, so no B9 event. Cited by lead_20261005_KGZ_1 only (T-G-LEADS-4, docs/10 B-2143)."
