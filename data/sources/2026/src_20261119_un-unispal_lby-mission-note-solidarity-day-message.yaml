notes: 'The Libyan Mission''s note verbale of 19 November 2026 to the Secretariat of the Committee on the Exercise of the Inalienable Rights of the Palestinian People, transmitting the message of solidarity of Eltaher Salem Elbaour, Acting Minister of Foreign Affairs and International Cooperation, for the Day observed on Monday, 23 November 2026 (UNISPAL upload of 23 November 2026; the file name''s ''2016'' is the uploader''s). The message itself is published separately in Arabic as a scanned page without a text layer (`20161119_FM_Libya_MoFA_AR_Message.pdf`), not archived or transcribed in this session: no Arabic OCR is installed (recorded in the B9 assessment note of LBY for a later session). Used here to name the Acting Minister in office in November 2026 (docs/10 B-444). Archived with Save Page Now on 2026-11-28 (T-H-ML-3); the replay fetched again with curl --compressed has 717,972 bytes and the recorded SHA-256. Text extracted by pdf.'
