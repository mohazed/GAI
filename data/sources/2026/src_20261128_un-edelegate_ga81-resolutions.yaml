notes: "The list of resolutions of the 81st session that the Secretariat generates, as it stood on 2026-11-28 (13 resolutions, A/RES/81/1 to A/RES/81/13). Archived by T-H-STRUCT (docs/10 B-2177) for the symbol of the vote of 17 September 2026: line 17 gives A/RES/81/1, 'Participation by the State of Palestine during the eighty-first session', draft A/81/L.2, meeting A/81/PV.4, agenda item 7, adopted on 17 September 2026. The list says 'without a vote' where the UN press release GA/12784 (src_20260917_un-unispal_ga12784) reports a recorded vote of 152 to 3 with 4 abstentions; the discrepancy is recorded in B-2177 (2). Not cited by any event or by votes.yaml."
