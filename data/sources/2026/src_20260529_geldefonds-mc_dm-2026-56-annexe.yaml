notes: 'The annex of ministerial decision No 2026-56 of 29 May 2026 (spreadsheet): the entries added to Monaco''s national freeze list under the EU human rights sanctions regime (Regulation (EU) 2020/1998), on the legal basis of Implementing Regulation (EU) 2026/1177 of 28 May 2026: three persons (Weiss, Deutsch, Suissa) and four entities (Amana, Nachala Movement, Regavim, Hashomer Yosh). No earlier Wayback capture; recorded by Save Page Now in this session (T-F-L25; replay re-fetched with curl: 10,528 bytes, SHA-256 equal to the index row). The text file holds the cell contents of the sheet, one row per line with cells separated by " | ", extracted by the session (the archiver kept the zipped bytes; precedent: src_20260630_nzsuperfund_exclusions-list-june-2026).'
