notes: 'The Ministry''s release, dated 6 July 2026 in the site''s API (post 22273): "Les deux pays ont procédé ce jour, à Lomé, à la signature solennelle d''un Mémorandum d''Entente sur les consultations politiques", "paraphé" by the Secretary General of the Ministry and by Israel''s Ambassador. The Ministry''s site is a script-rendered page whose text is served by its WordPress API (the page URL answers an empty shell), so the API record is archived (kind json-content). Save Page Now capture; the replay fetched again with curl --compressed equals the index row (30,114 bytes). The id was renamed from the archiver''s src_20261110_ id to the post''s own date (docs/10 B-663).'
