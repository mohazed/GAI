notes: "Media statement of South Africa's Department of International Relations and Cooperation, dated 16 October 2026: the joint statement of twenty foreign ministers (Egypt, the State of Palestine, Turkey, Djibouti, Lebanon, Libya, Yemen, Qatar, Jordan, Somalia, Malaysia, Indonesia, Saudi Arabia, Kuwait, Algeria, Oman, Syria, Sudan, Pakistan and South Africa), found in the department's list of media statements. Save Page Now capture of 4 November 2026; the Wayback replay was re-fetched with curl --compressed and its byte count (164,609) and SHA-256 equal the index row. Text extracted by readability. The one archived text is used for every signatory among the 45 full-protocol countries, as for the joint statement of 21 August 2025 (docs/10 B-444); the other ministries' copies were not read."
