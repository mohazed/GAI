notes: 'The release of the Israeli President''s office as the Ministry''s embassy site carries it (Israeli embassy in Thailand''s news page, listed 4 August): the President received on 3 August
  2026 the credentials of six ambassadors, including those of Chile and Honduras, ''whose countries returned Ambassadors to Israel for the first time since October 7th'', and says Honduras''s
  Ambassador is Jose Luis Nunez Bennet. The primary for the end of Honduras''s recall (B12). Text extracted by readability.'
