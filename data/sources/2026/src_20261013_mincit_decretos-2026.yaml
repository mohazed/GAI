notes: "The Ministry's list of 2026 decrees; row 3 lists Decreto 1514 of 9 October 2026 with the dates 09/10/2026 (decree) and 13/10/2026 (published on the Ministry's site). Captured with Save Page Now on 2026-11-09 (after two host-resolution retries); the replay was fetched again with curl --compressed and equals the index row (83,747 bytes, same SHA-256). Same listing as src_20241231_mincit_decretos-2024 for the year 2024. The date of the decree's publication in the Diario Oficial was not read. Found in T-F-W7 (docs/10 B-913)."
