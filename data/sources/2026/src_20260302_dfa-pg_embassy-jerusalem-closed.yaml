notes: 'The Department''s release (datePublished 2026-03-02) on the Foreign Minister''s announcement of the temporary closure of the embassy in Jerusalem during the war between the United States, Israel
  and Iran, for the staff''s safety; the embassy''s operations are to move to Port Moresby. A closure for security, not a downgrade or a recall: not a B12 act (docs/10 B-599). Captured by Save Page Now
  on 2026-10-07. Text extracted by readability.'
