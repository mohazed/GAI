notes: 'The President''s message for the International Day of Solidarity with the Palestinian People, dated ''New York, le 23 novembre 2026'', as UNISPAL publishes it on the Permanent Mission''s letterhead (file received 19 November, uploaded 20 November 2026; PDF created 20 November 2026). Two pages whose text layer is incomplete (the heading box and parts of five paragraphs are images): the text file is the machine OCR (tesseract, eng) of the two pages at 300 dpi, checked line by line against the page images, with the French accents and the OCR errors corrected from the images (à, l''égard, sœurs, frères, règlement, même, fidèle, côtés, quête, règne, où; the ornamental star lines shortened). Unsigned; the heading names the speaker. Archived with Save Page Now on 2026-11-28 (T-H-ML-6); the replay fetched again with curl has 310,942 bytes and the recorded SHA-256. Dated by its own date line (docs/10 B-2206 (1)).'
