notes: 'Namibia''s declaration of intervention in case 192, filed on 12 March 2026 (ICJ document 192-20260312-int-01-00-en.pdf, 26 pages, signed by the Agent, the Ambassador of Namibia to Belgium, the Netherlands, Luxembourg and the European Union, at Brussels on 12 March 2026), archived from the copy UNISPAL publishes because icj-cij.org answers HTTP 403 to a scripted request and its Wayback captures do not exist (docs/10 B-203). The PDF has a text layer; page numbers cited are the declaration''s own. The Wayback replay fetched again with curl --compressed has the same byte count and SHA-256 (714,578 bytes). Text extracted by pdf.'
