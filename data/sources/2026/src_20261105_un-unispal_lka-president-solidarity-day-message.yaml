notes: 'The President''s signed message for the International Day of Solidarity with the Palestinian People (page 2, undated) and the Permanent Mission''s note verbale of 5 November 2026 transmitting it to the Division for Palestinian Rights (page 1), as UNISPAL publishes them (uploaded 20 November 2026). The message is dated to the note that transmits it (flagged, docs/10 B-2208). Two scanned pages without a text layer: the text file is machine OCR (tesseract, eng) at 300 dpi, checked against the page images; corrected from the images: ''I reaffirm'' (twice), ''inalienable'', ''Gaza''s'', ''essential'', ''Sri Lanka welcomes'', ''Board of Peace, to'', ''West Bank, including'', ''two-State'', ''Anura'', ''Republic'', the note''s e-mail and web addresses and its date and seal; the Sinhala and Tamil headings are not transcribed. Archived with Save Page Now on 2026-11-28 (T-H-ML-4); the replay fetched again with curl --compressed has 1,206,975 bytes and the recorded SHA-256.'
