notes: Delegation file of the 81st General Debate for Pakistan. The file carries no heading with the speaker or the date; the speaker says he addresses the Assembly 'for the fourth time, on behalf
  of the 240 million' people of Pakistan. The UN's page for Pakistan (gadebate.un.org/en/81/pakistan, read live on 2026-11-04) gives 'Prime Minister' and '25 September 2026' and summarises Mr. Sharif's
  address; the page also shows the date 26 September 2026 beside the file (flagged; the UN's statement date is used). Recorded from the existing Wayback capture 20261011051102 (CDX status 200); the
  replay fetched again with curl --compressed equals the live file (684,939 bytes, same SHA-256). Palestine passage at lines 130 to 150. Text extracted by pdf.
