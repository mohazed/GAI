notes: >-
  Original: the "Trade registers" export of the SIPRI Arms Transfers Database
  (https://armstransfers.sipri.org; supplier Israel, all recipients, no year range, ordered by
  buyer; "Data generated: 29 Sep 2026"), release of 9 March 2026. The export is built with a POST to
  atbackend.sipri.org, so it has no URL Save Page Now can capture (B-187). Downloaded by the author
  in a browser on 2026-09-29 and uploaded unchanged (115,389 bytes, MD5
  8b8924027687210b13fd75511646cf7e, equal to the file list of the item) to the Internet Archive item
  sipri_register_supplier_israel
  (https://archive.org/download/sipri_register_supplier_israel/sipri_register_supplier_israel.csv),
  which Save Page Now refuses to capture (error:blocked-url, B-900). The same bytes were committed
  to this repository in commit ab996e43c9fd99edec337d2f7a994f94134e7723 as
  data/structured/author-downloads/sipri_register_supplier_israel.csv (B-903); this record is the
  Save Page Now capture of that commit-pinned raw.githubusercontent.com URL, made on 2026-10-05; the
  SHA-256 of the bytes Wayback serves equals the local file's and the README table's. Information
  from the Stockholm International Peace Research Institute (SIPRI) Arms Transfers Database;
