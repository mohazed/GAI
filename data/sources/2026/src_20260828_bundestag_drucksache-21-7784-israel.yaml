notes: "The Federal Government's answer of 28 August 2026 (sent on 27 August by the Federal Ministry for Economic Affairs and Energy) to a minor interpellation of the Left group. Cited in the A7 assessment note: licences for the definitive export of military goods to Israel in the second quarter of 2026 worth EUR 735,763,266 (provisional), 67 per cent a naval project, 21 per cent German-Israeli cooperation in the interest of the Bundeswehr, the rest other military goods, no war weapons. Text extracted by pdf."
