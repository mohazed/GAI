notes: 'Forum Communique of the 55th Pacific Islands Forum Leaders Meeting (Koror, Palau, 31 August to 3 September 2026): the heads of state and government of the Federated States of Micronesia, the Marshall
  Islands, Papua New Guinea and Solomon Islands attended; Fiji, Vanuatu, Samoa and New Caledonia at ministerial level and Kiribati at senior-official level (paragraph 1). Paragraph 11: leaders ''agreed
  on the placement of partners in the two partnership streams'' and that the Secretary General would communicate the decision to partners; the text names no partner and does not contain the words Israel,
  Palestine or Gaza (searched 2026-11-10 in the extracted text). Downloaded from forumsec.org and archived by Save Page Now.'
