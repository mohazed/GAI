notes: "The Customs Law issued by the President's Decree No. 109 of 2026, replacing Laws 37 and 38 of 2006, as a 78-page scanned PDF linked from SANA's item 'الرئيس الشرع يصدر المرسوم رقم (109) الذي يتضمن قانوناً جديداً للجمارك' (sana.sy/presidency/2478774/, published 2026-05-18). Save Page Now capture 20261111003839, served by Wayback as the identical snapshot 20260518153230; the replay fetched with curl, a direct download and the archiver's copy are equal in bytes (10,271,732) and SHA-256 (checked 2026-11-11). The pages are images: the extracted text holds no words, so no passage can be quoted from it. Read on the page image (page 29; each page is dated 'دمشق ٣٠ ذو القعدة ١٤٤٧هـ - ١٧ أيار ٢٠٢٦م', 17 May 2026): Article 112 bars from the free zones, first, goods prohibited for breaching the provisions of the boycott of Israel or public order, and, sixth, goods originating from a country whose economic boycott has been decided. The article concerns the free zones and refers to the boycott legislation, which pre-dates the window. Not cited by an event; read for lead_20261110_SYR_1 (T-G-LEADS-7, docs/10 B-2151)."
