notes: "The Ministry's quarterly magazine, issue 0010 (July to September 2026); the date is the PDF's creation date (12 August 2026), the file sits in the site's uploads of September 2026. Page 43, 'Coopération Cameroun - Israël : un partenariat de 98 milliards FCFA pour booster la production locale de riz', says that 'Le gouvernement camerounais et la société israélienne Ekobell ont signé, le 6 mars 2026, un accord' to develop 10,000 hectares of rain-fed rice in the North and Adamawa regions (EUR 150 million), signed in the Ministry's conference room; it names no Israeli state party and no export credit guarantee. Save Page Now returned the existing capture of 6 September 2026; its replay and a direct download of 2026-11-10 are equal in bytes and SHA-256. Extracted text truncated at 200 KB by the archiver (page 43 is inside it). Cited by lead_20261110_CMR_1 only (T-G-LEADS-2, docs/10 B-2135)."
