notes: "The Secretary of the Knesset's letter of 25 January 2026 to the members of the Knesset (11 pages) tabling, on 26 January 2026, the framework agreement for general cooperation between Israel and South Sudan sent by Israel's Foreign Minister, with the Treaties Department's explanatory notes in Hebrew; the agreement's Hebrew and English pages are images and not in the extracted text. Save Page Now capture 20261111002941; the replay fetched with curl and the archiver's copy are equal in bytes (2,534,293) and SHA-256 (checked 2026-11-11). Note 1 of the explanatory notes says the agreement was signed in Jerusalem on 17 July 2023 by Israel's ambassador to South Sudan, Gershon Kedar, and South Sudan's Minister of Foreign Affairs and International Cooperation, Deng Dau Deng Malek; note 5 says it enters into force after both sides complete their internal procedures. Not cited by an event: the instrument was signed before the window (docs/02 §1) and is not the memorandum of 13 August 2025 (evt_2025_08_13_SSD_C2). Read for lead_20261110_SSD_3 (T-G-LEADS-7, docs/10 B-2151)."
