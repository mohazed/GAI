notes: "India–Israel Joint Statement of 26 February 2026 (Jerusalem), issued at the end of the Prime Minister's state visit to Israel; paragraph 41 lists the sixteen documents exchanged that day, and paragraphs 4, 15 and 16 refer to the defence MoU of 4 November 2025, the Bilateral Investment Agreement of September 2025 and the terms of reference for free-trade negotiations. Recorded from the Wayback capture of 28 February 2026 of the former server-rendered MEA page. Recorded from the existing Wayback capture 20260228044914 (no new Save Page Now capture). Text extracted by readability."
