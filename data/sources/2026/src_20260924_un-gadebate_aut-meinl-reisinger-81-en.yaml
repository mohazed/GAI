notes: "The delegation's file at_en.pdf of the 81st General Debate (5 pages, with a text layer). The date is that of the Ministry's own release of 24 September 2026 ('In ihrer Rede vor der 81. Generalversammlung der Vereinten Nationen am 24. September 2026', Aussendung of 24 September 2026), which does not carry the passage on Gaza. Recorded with --capture 20261022075407 (an existing Wayback capture); the file the UN serves on 2026-11-09 has a different byte count (124,002) with the same text on lines 51 to 59. The PDF's metadata title reads 'RP/VDG draft with tracked changes'; the text is the final wording of the speech. The replay was fetched again with curl --compressed and equals the index row (same byte count and SHA-256)."
