notes: 'Depositary notification of 30 June 2026: Mali''s withdrawal from the Rome Statute effected on 24 June 2026, to take effect on 24 June 2027; it quotes the Government''s letter (translated from French) in part. The existing Wayback capture of 6 October 2026 is recorded (--capture 20261006064626; 55,920 bytes), as for Burkina Faso''s notification; the replay fetched again with curl --compressed and the live file (HTTP 200 to a request with a browser User-Agent) have the same SHA-256. Text extracted by pdf.'
