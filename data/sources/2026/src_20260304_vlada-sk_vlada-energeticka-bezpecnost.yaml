notes: 'The Government Office''s release on the Government meeting of 4 March 2026. Archived by Save Page Now on 2026-11-09; the replay equals the recorded bytes and SHA-256. Read in the finish run (T-F-L03, docs/10 B-937) for SVK A5 and A8: the Prime Minister rejects media reports that Slovakia allowed overflights of combat aircraft heading for the Middle East (transport and refuelling aircraft only); the context is the conflict of the United States and Israel with Iran, not the Gaza campaign, so it is not an A5 or A8 instance. Not cited by an event.'
