notes: "The association's exclusion recommendations as served on 2026-11-10 (no date per entry). In the served HTML, Bank Hapoalim BM and Bank Leumi Le-Israel B.M. (IL, all securities) carry the mark of the first column, 'Verhaltensbasierte Ausschlüsse' (conduct-based exclusions), and none of the weapons columns; no reason is printed. The page says the recommendations are addressed to the members, who decide on their implementation. The rendered page in a browser first asks to accept terms of use (not accepted). Replay re-fetched (curl --compressed): bytes and SHA-256 equal to the index row. Cited by lead_20260929_CHE_1 and the CHE C5 note only (T-G-LEADS-1, docs/10 B-2129)."
