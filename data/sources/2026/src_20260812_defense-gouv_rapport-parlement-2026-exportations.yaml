notes: "The government's annual report to Parliament on arms exports (data to 2025), PDF of 5,984,565 bytes; the Wayback Machine serves the identical snapshot of 29 October 2026 and Save Page Now's capture of 9 November 2026 has the same SHA-256 as the file downloaded by the session. The archived text is cut at 200 KB (D-24) before the passage on Israel: the figures cited in the assessment notes (deliveries to Israel EUR 30.1 million in 2023, 16.1 million in 2024, 19.8 million in 2025; licences granted in 2025 EUR 119 million, down 69 per cent from 2024; the statement that France delivers no weapons to Israel and exports components) were read in the PDF itself (page 59 of the report and the table of deliveries by country, extracted with pdftotext)."
