notes: 'The President''s message of 13 November 2026 to the Secretary-General, the President of the General Assembly, the Chair of the Committee on the Exercise of the Inalienable Rights of the Palestinian People and the President of the State of Palestine, for the International Day of Solidarity with the Palestinian People, as UNISPAL publishes it (uploaded 20 November 2026): the Mission''s unofficial English translation (lines 1 to 74, dated ''Ha Noi, 13 November 2026'', signed TO LAM), the Mission''s note verbale No. 190/HC-2026 transmitting it, and the Vietnamese original (signed TÔ LÂM, ''Hà Nội, ngày 13 tháng 11 năm 2026''). The Vietnamese is the original; the English is the delegation''s translation. Archived with Save Page Now on 2026-11-28 (T-H-ML-3); the replay fetched again with curl --compressed has 948,373 bytes and the recorded SHA-256. Text extracted by pdf.'
