notes: "Report of Yemen's state news agency Saba dated 27 September 2026 (New York): the Minister of Foreign Affairs and Expatriates, Dr. Afrah al-Zouba, met Algeria's Foreign Minister at the 81st session of the General Assembly. The Ministry's own site (mofa-ye.org, which republishes Saba's items, e.g. Pages/41281 of 17 October 2026 in her name) refuses Save Page Now (HTTP 403), so Saba's copy is recorded. Used for the minister's name in evt_2026_10_16_YEM_B9 (T-F-UNDOCS-1). Archived with Save Page Now on 2026-11-09; the replay re-fetched with curl --compressed equals the record (29,123 bytes, same SHA-256). No B9 event is filed on it."
