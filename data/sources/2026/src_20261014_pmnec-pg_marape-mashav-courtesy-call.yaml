notes: 'The Prime Minister''s Office release of 14 October 2026 (byline date) on the courtesy call of the head of Israel''s international development agency (MASHAV): the Prime Minister''s quoted words
  ''PNG always stands with Israel in thoughts and prayers, especially in this time of continued unrest'' and the offer of 300 agricultural internships; an initial government-to-government memorandum of
  understanding is said to have been delivered to the Ministry of Agriculture (not signed). The release does not mention Gaza. Text extracted by readability.'
