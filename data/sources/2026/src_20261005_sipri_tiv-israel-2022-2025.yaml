  atbackend.sipri.org, so it has no URL Save Page Now can capture (B-187). Downloaded by the author
  in a browser on 2026-09-29 and uploaded unchanged (788 bytes, MD5
  ffadbc6dca1c9e78a2080bda7588638e, equal to the file list of the item) to the Internet Archive item
  sipri_register_supplier_israel
  (https://archive.org/download/sipri_register_supplier_israel/sipri_tiv_israel_2022-2025.csv),
  which Save Page Now refuses to capture (error:blocked-url, B-900). The same bytes were committed
  to this repository in commit ab996e43c9fd99edec337d2f7a994f94134e7723 as
  data/structured/author-downloads/sipri_tiv_israel_2022-2025.csv (B-903); this record is the Save
  Page Now capture of that commit-pinned raw.githubusercontent.com URL, made on 2026-10-05; the
  SHA-256 of the bytes Wayback serves equals the local file's and the README table's. The failed
  capture of the archive.org copy stays recorded as src_20260929_sipri_tiv-israel-2022-2025
