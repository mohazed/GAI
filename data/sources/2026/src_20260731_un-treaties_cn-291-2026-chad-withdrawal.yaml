notes: 'Depositary notification of 31 July 2026: Chad''s withdrawal from the Rome Statute effected on 27 July 2026, to take effect on 27 July 2027; it quotes the Government''s letter (translated from French), which gives the Court''s modest track record, its concentration on African situations and the maturity of national and African courts as the reasons and does not mention Gaza, Palestine, Israel or the warrants of 21 November 2024. Recorded from the existing Wayback capture 20260910194653 (treaties.un.org refuses Save Page Now, docs/10 B-2122); the replay fetched with curl and the archiver''s copy are equal in bytes (60,763) and SHA-256 (checked 2026-11-11). Found by an English web search during the P-23 lead pass (T-G-LEADS-7, docs/10 B-2151).'
