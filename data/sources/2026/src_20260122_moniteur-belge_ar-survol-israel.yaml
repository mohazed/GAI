notes: "Recorded from the existing Wayback capture 20260124203628 (pnpm archive --capture; no new Save Page Now capture: the Moniteur site answers the Internet Archive with a human-verification page, and the capture of 2026-10-03 of the same address is that page, not the PDF). The replay was fetched again with curl --compressed on 2026-11-10: 2,575,118 bytes, SHA-256 equal to this record; the PDF downloaded the same day from the Moniteur's own address has the same SHA-256. The whole day's Moniteur (212 pages, Dutch, French and German); the extracted text is truncated at 200 KB (204,708 of 1,051,449 bytes kept), and the decree (Federal Public Service Mobility and Transport, [C − 2025/009929]) lies inside the kept part, in Dutch (from line 3060) and in French (from line 3131); its articles 2 to 6 in French at lines 3544 to 3576. The decree enters into force on the day of its publication in the Moniteur belge (article 5), 22 January 2026. The ELI pages (eli/arrete/2026/01/18/2025009929/moniteur and /justel) serve the text to a browser but answer Save Page Now with the protection page (docs/10 B-894, B-2119)."
