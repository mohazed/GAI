notes: 'The Foreign Minister''s message for the International Day of Solidarity with the Palestinian People, on the Ministry''s letterhead, signed ''د. عبداللطيف بن راشد الزياني، وزير الخارجية، مملكة البحرين، المنامة، 17 نوفمبر 2026'' (page 3), as UNISPAL publishes it (uploaded 20 November 2026). Three scanned pages in Arabic without a text layer: the text file holds only what the PDF''s text layer gives (nothing usable); no Arabic OCR model is installed on the machine of this session, so no quote can be filed from it yet (the B9 note of data/assessments/BHR.yaml; docs/10 B-2215). Archived with Save Page Now on 2026-11-28 (T-H-ML-6); the replay fetched again with curl --compressed has 1,318,327 bytes and the recorded SHA-256.'
