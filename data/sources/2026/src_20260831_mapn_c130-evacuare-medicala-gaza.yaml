notes: "The Ministry of National Defence's press release no. 278 of 31 August 2026: a C-130 Hercules of the Romanian Air Force carried out on 31 August a medical evacuation from the Gaza Strip of five paediatric patients with relatives (two treated in Bucharest, three transferred to Belgium), organised by the Ministries of Foreign Affairs, Defence, Interior and Health under the EU Civil Protection Mechanism with the WHO, 'al 12-lea zbor umanitar organizat de țara noastră' (lines 57 to 65 of the text). Found through the Wayback CDX index (P-23 pass, T-G-LEADS-6, 2026-11-11; Save Page Now had answered HTTP 410 on 2026-11-09); recorded from the existing capture 20260831225905, the replay fetched with curl --compressed equal to the archiver's copy in bytes (94,051) and SHA-256. Added as evidence to evt_2024_09_30_ROU_D4 (same programme, docs/02 §2 D4, docs/10 B-525 (3), B-2148); lead_20261005_ROU_4."
