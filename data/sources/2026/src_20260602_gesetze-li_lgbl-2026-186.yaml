notes: 'Liechtenstein Law Gazette 2026 No. 186, issued 2 June 2026: the Government''s ordinance, with reference to Council Decision (CFSP) 2026/1176 of 28 May 2026, adding three persons to Annex A (items 136 to 138, among them Daniella Weiss, director of Nachala, cited for efforts to resettle the Gaza Strip) and four entities to Annex B (items 38 to 41) of LGBl. 2021 No. 104; in force on the day of publication; signed for the Government by Sabine Monauni, Deputy Prime Minister. Recorded from the existing Wayback capture 20261016222246 with --capture (T-F-L25; replay re-fetched with curl: 74,897 bytes, SHA-256 equal to the index row and to the live file). Text extracted from the PDF.'
