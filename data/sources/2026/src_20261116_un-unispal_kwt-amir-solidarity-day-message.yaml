notes: 'The Amir''s message for the International Day of Solidarity with the Palestinian People, addressed to the Committee''s Chair and dated 16/11/2026 (page 1), as UNISPAL publishes it (file received 17 November, uploaded 20 November 2026). Five scanned pages whose text layer holds only the page numbers and fragments: the text file is the machine OCR (tesseract, eng) of the five pages at 300 dpi, checked against the page images, blank lines removed and each page''s number kept on its own line; two OCR errors corrected from the images (''Al-Jaber'' in the signature, ''a just'' on page 3); ''while affirmed'' (page 3) is as printed. The signature block names the speaker (page 5). Archived with Save Page Now on 2026-11-28 (T-H-ML-6); the replay fetched again with curl --compressed has 1,233,276 bytes and the recorded SHA-256. Dated by its own date line (docs/10 B-2206 (1)).'
