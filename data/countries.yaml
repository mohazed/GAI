# countries.yaml — the universe of the index (docs/02 §1, docs/03 §3).
#
# 195 entries: the 193 UN member states and the two observer States, the Holy See (scored) and the
# State of Palestine; ISR and PSE carry `excluded: true` (D-10), which leaves 193 scored entities.
# Built in P-13 (2026-09-28) from the sources below; DEU, ISR and PSE keep the text checked in P-02.
#
# - iso2, iso3, m49, region, subregion: UN M49 overview, English table,
#   https://unstats.un.org/unsd/methodology/m49/overview/ (read 2026-09-28). Sub-regions are the
#   M49 sub-regions, not the intermediate regions (Caribbean, Central America, South America,
#   and the four African intermediate regions).
# - name.en, name.fr, name.fr_def: UNTERM country names, the export of
#   https://unterm.un.org/unterm2/en/country (term/downloadCountries, read 2026-09-28, SHA-256
#   3b42ac104a94c8b358f98e2269d15704f6609314a89581fff85d0c704693627d). name.en and name.fr are the
#   short names without the article UNTERM adds in brackets ("Germany", "Allemagne");
#   name.fr_def is the French short name with that article ("l'Allemagne", "la France",
#   "les États-Unis d'Amérique"), the short name alone where UNTERM gives no article ("Cuba",
#   "Malte"), and the French formal name where the short name carries a bracketed descriptor
#   instead of an article (Bolivie, Iran, Micronésie, Pays-Bas, Venezuela). Apostrophes as UNTERM
#   writes them. name.en_def (P-18, 2026-09-30, from the same export downloaded again from
#   https://conferences.unite.un.org/untermapi/api/term/downloadCountries, SHA-256
#   f6b79716677e50dfff99604bed3cac4bfb190c302bb095f1d3d225d13da55458, whose French short names
#   match every fr_def above): the English short name with the article UNTERM brackets ("the
#   United States of America", "The Bahamas"), the name alone where UNTERM gives none
#   ("Germany"), and the English formal name for the same five descriptor names ("the Islamic
#   Republic of Iran", "the Kingdom of the Netherlands"). Generated summaries open with en_def
#   and fr_def (the first letter capitalised).
# - memberships.unsc: elected terms from the UN list of elected members
#   (https://main.un.org/securitycouncil/en/content/countries-elected-members, Wayback capture
#   2026-02-24; the live page needs JavaScript) for every term that runs in 2023 or later, from
#   1 January of the first year to 31 December of the second; the terms of 2027-2028 from UN press
#   release GA/12762 of 3 June 2026 (Austria, Kyrgyzstan, Portugal, Trinidad and Tobago,
#   Zimbabwe). The five permanent members (UN Charter Art. 23) from 1945-10-24, to: null.
# - eu: https://european-union.europa.eu/principles-countries-history/eu-countries_en (27).
#   nato: https://www.nato.int/en/about-us/organization/nato-member-countries (32; Sweden from
#   2024-03-07). arab_league: lasportal.org member list (Wayback capture 2025-03-24; 22 including
#   the State of Palestine). oic: https://www.oic-oci.org/states/?lan=en (Wayback capture
#   2026-01-14; 57 including the State of Palestine; Syria dated). g20: the 19 member countries
#   (g20.org, read 2026-09-28; see the ZAF and POL notes). g7: the seven members. brics: the BRICS
#   Brasil 2025 site, "About the BRICS" (Wayback capture 2026-01-06), dated for the members
#   admitted in 2024 and 2025; Saudi Arabia not counted (see its note).
# - recognises_palestine.since: to 2023, the annex of UN document A/78/846-S/2024/283 (letters of
#   2 April 2024 from the chairs of the Arab Group, the OIC Group and the Non-Aligned Movement,
#   "Recognition of the State of Palestine (1988–2023)", 140 Member States and the Holy See, with
#   dates); from 2024, the seed list of docs/06 §8, checked against the Wikipedia list
#   "International recognition of Palestine" (read 2026-09-28). Differences and uncertain dates
#   carry a note. These dates are leads: B8 is generated from data/structured/recognitions.csv,
#   where P-14 (2026-09-28) confirmed 18 recognitions of 2024-2025 from archived official
#   statements (each entry's note says so); the other dates stay leads.
# - gov_sources: for the 45 countries of docs/07, the foreign ministry and the head of government
#   (and the head of state where the two differ), each URL requested on 2026-09-28; a site that
#   refused a scripted request was checked through its latest Wayback capture (the notes say
#   which). The other entries have none yet: the light protocol (P-21) adds them.

- iso3: AFG
  iso2: AF
  m49: 4
  name: {en: Afghanistan, en_def: Afghanistan, fr: Afghanistan, fr_def: 'l''Afghanistan'}
  region: Asia
  subregion: Southern Asia
  un_member: true
  observer: false
  excluded: false
  memberships:
    unsc: []
    eu: false
    nato: false
    arab_league: false
    oic: true
    g20: false
    g7: false
    brics: false
  recognises_palestine: {since: 1988-11-16}
  gov_sources:
    - {label: 'Ministry of Foreign Affairs of the Taliban authorities ("Islamic Emirate"), English pages (mfa.gov.af/en)', url: 'https://mfa.gov.af/en/', type: mfa, lang: [en]}
    - {label: 'Permanent Mission of Afghanistan to the United Nations (appointed by the former Islamic Republic), read through Wayback', url: 'http://www.afghanistan-un.org/', type: mission, lang: [en]}
  notes: >-
    gov_sources checked 2026-11-04: mfa.gov.af answered HTTP 200 (the home page lang="ps", the English section /en/ lang="en-US"; its site search /en/?s=Gaza lists the Ministry's statements on Gaza
    of 2023 to 2025, none with a named speaker); the Taliban authorities' Prime Minister's Office (pmo.gov.af) answered a Cloudflare challenge ('Just a moment...') and alemarahenglish.af HTTP 403, so
    no head-of-government entry is given; the Permanent Mission's site (afghanistan-un.org) did not answer from this network and has a Wayback capture of 12 May 2026 (status 200). Afghanistan's United
    Nations seat is held by the mission of the former Islamic Republic while the Taliban authorities govern; whose statements count for B9/B10 is the author's decision (docs/10 B-742).

