      5 February 2025 that Mexico recognises the State of Palestine (Wikipedia dates the
      recognition to that day) and received the credentials of a Palestinian ambassador in
      March 2025; docs/06 §8 lists Mexico under 2025 with the date to confirm from the SRE.
      The date before 7 October 2023 decides between the pre-existing and the new B8 tier:
