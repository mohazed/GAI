    arab_league: false
    oic: false
    g20: false
    g7: false
    brics: false
  recognises_palestine:
    since: 1988-11-18
    note: >-
      A/78/846 (annex) lists the Czech Republic from the recognition by Czechoslovakia on 18
      November 1988; the Czech Republic declared on its independence that it would continue
      the recognitions of Czechoslovakia, and the Ministry of Foreign Affairs lists an Embassy
      of the State of Palestine. Its position is described as disputed in several lists
      (Wikipedia, AFP count of July 2025). P-14 confirms it from an official Czech document.
      P-14: not confirmed. No official Czech statement of recognition, or of continuing the
      Czechoslovak one, was found and archived; recognitions.csv has no row and no B8 event is
      generated. P-D (2026-09-29): the Ministry of Foreign Affairs stated on 25 September 2025
      that Czechoslovakia never recognised the State of Palestine and only acknowledged its
      proclamation, a step not intended to have legal effect
      (src_20250925_mzv-cz_position-recognising-palestine); no row is added (docs/10 B-310).
  gov_sources:
