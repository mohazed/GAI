      document dating a recognition was found: the date of A/78/846 matches the
      reclassification of the Palestinian mission in Mexico as an embassy on 1-2 June 2023, a
      decision of the State of Palestine announced by its Ministry of Foreign Affairs, not a
      Mexican act; President Sheinbaum's statement of 5 February 2025 says that Mexico
      recognises the State of Palestine without dating it. recognitions.csv has no row, so no
      B8 event is generated until an official Mexican document dates the recognition (it
