  recognises_palestine:
    since: 2023-06-02
    note: >-
      Uncertain. A/78/846 (annex, 9 April 2024) lists Mexico as recognising on 2 June 2023,
      the day the Palestinian mission in Mexico became an embassy; President Sheinbaum said on
      5 February 2025 that Mexico recognises the State of Palestine (Wikipedia dates the
      recognition to that day) and received the credentials of a Palestinian ambassador in
      March 2025; docs/06 §8 lists Mexico under 2025 with the date to confirm from the SRE.
      The date before 7 October 2023 decides between the pre-existing and the new B8 tier:
      P-14 confirms it from an official Mexican document. P-14: not confirmed. No Mexican
      document dating a recognition was found: the date of A/78/846 matches the
      reclassification of the Palestinian mission in Mexico as an embassy on 1-2 June 2023, a
      decision of the State of Palestine announced by its Ministry of Foreign Affairs, not a
      Mexican act; President Sheinbaum's statement of 5 February 2025 says that Mexico
      recognises the State of Palestine without dating it. recognitions.csv has no row, so no
      B8 event is generated until an official Mexican document dates the recognition (it
      decides the +3 or +8 tier).
