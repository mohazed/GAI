    status: has-events
    note: 'Eight events: the Foreign Minister (Nabil Ammar) at the OIC emergency meeting in Jeddah, 18 October 2023 (evt_2023_10_18_TUN_B9, +5), at a high-level event in Geneva, 12 December 2023 (+5), at the Non-Aligned Movement summit, 20 January 2024 (+5, date flagged) and at the Human Rights Council, 27 February 2024 (+5), all expired; Mohamed Ali Nafti at the 79th General Debate, 27 September
