      2026 (+5; 232 days, qualifying) and at the 81st General Debate, 26 September 2026 (+5; 17 days, qualifying): each is a qualifying event inside 365 days and either alone ends the passivity penalty. The speaker of the last is established
      by La Presse and Arab News, not by the Ministry''s text (flagged). Read and not filed: (1) the Minister''s interview with EFE (December 2023, the Ministry''s record: ''demand a ceasefire
      and stop the killings''): a press interview, expired; (2) the Minister at the extraordinary Arab summit in Cairo, 4 March 2025, delivering the President''s speech, known from La Presse''s
      report in indirect speech (lead_20261013_TUN_2, R4); (3) the Minister at the Arab League''s ministerial sessions of March 2026 (Ministry posts 1135 and 1156: statements on the Palestinian
      State, no Gaza-specific call or violation); (4) the Ministry''s reports in indirect speech of the Minister''s interventions at the OIC (25 August 2025), the Arab League Council (4 September 2025) and the Doha summit (15 September 2025), and of 26 December 2024 and 13 January 2025 (leads 3 and 4, R4); (4b) the Ministry''s communiqués with no named speaker (29 November 2023, 10 February 2025 on displacement, August 2025 on the reoccupation of
      Gaza, 30 March 2026 on Land Day: ''violations of the Gaza Strip ceasefire agreement'', ''genocidal plans''), not B9 under R3; (5) the President, Kais Saied, whose statements are known from
      press reports of his meetings in indirect speech (22 July 2025 with a US adviser, 31 July 2025 with Italy''s Prime Minister, 2 October 2025 on the flotilla''s detainees: ''crimes of genocide'';
      lead_20261013_TUN_1); the Presidency''s site carthage.tn was not searched and no transcript or video was found.'
