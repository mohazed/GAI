  B9:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Six gaza events and one west-bank event (unscored). Prime Minister: 21 October 2023 (Cairo Peace
      Summit, +5), 26 September 2024 (General Assembly, +2), 26 September 2025 (General Assembly,
