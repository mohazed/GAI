# Coverage record for Greece (docs/03 §6). P-D research session, wave 5, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-325): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Slovenia, Czechia, Hungary and Poland, docs/10 B-303, B-309,
# B-315, B-320). mfa.gr and primeminister.gr refuse scripted requests (HTTP 403) but answer in the
# built-in browser, where both sites' WordPress search API (`/wp-json/wp/v2/posts?search=…`, full
# text, posts from 2023-10-06) was read, read-only. mfa.gr (the Ministry's current site holds its
# releases, statements, speeches, interviews and parliamentary answers since 2023, Greek): Γάζα,
# Γάζας, Gaza, Ισραήλ, Ισραήλ Γάζα, Παλαιστίνη, Παλαιστιν, UNRWA, Νετανιάχου, Netanyahu, Χαμάς,
# εκεχειρία, ανθρωπιστική, Μέση Ανατολή, Israel, Palestin, ceasefire (484 posts, read by title, all
# searched in full text for ceasefire, famine, displacement, hospital, ICC and warrant terms, about
# 40 read in full); then Μνημόνιο Ισραήλ, υπογραφή Ισραήλ, συμφωνία Ισραήλ, Ισραηλινό ομόλογο,
# Ισραηλινό, Ισραηλινή, UNRWA, Ποινικό Δικαστήριο, Διεθνές Δικαστήριο, Διεθνούς Δικαστηρίου,
# εποίκων, κυρώσεις, Συμφωνία Σύνδεσης, αναγνώριση Παλαιστινιακού, στολίσκο, ιατρική εκκένωση,
# παιδιά από τη Γάζα, Global Sumud (175 posts). primeminister.gr (Greek and English): Γάζα, Γάζας,
# Gaza, Ισραήλ, Παλαιστιν, UNRWA, Νετανιάχου, Netanyahu, Χαμάς, εκεχειρία, κατάπαυση, Μέση
# Ανατολή, Israel, Palestin, ceasefire (480 posts; 250 naming Gaza, Palestine or Netanyahu read by
# title, the speeches, joint declarations and statements with Israeli or Palestinian leaders in
# full), then searched in full text for ICC, warrant, Association Agreement, sanctions, UNRWA,
# recognition, memorandum and genocide terms. Save Page Now is refused by both sites (HTTP 403), so
# every source was recorded from an existing Wayback capture (`--capture`, B-188).
# Not searched: the press; the Hellenic Parliament (questions, answers and resolutions beyond those
# the Ministry publishes); the Ministry of National Defence (mod.mil.gr has no search API reachable
# from the browser; exercises, basing, transit and the purchases of Israeli systems); the Ministry
# of Development's export licensing (A2, A6); the Hellenic Police and the courts (E1–E3); the Bank
# of Greece, the Hellenic Development Bank of Investments and public pension funds (C5); the ports
# of Piraeus and Thessaloniki (A5, A8); hellenicaid.mfa.gr (humanitarian aid records).
country: GRC
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build.
  A2:
    status: has-events
    note: >-
      Generated from Comtrade (Greece had rows from P-14, so no fetch was run). Greece's own reports
      carry HS 93 exports to Israel of USD 16,278 (2022), 2,823 (2023) and 814 (2025), and HS 8710
      (tanks and armoured fighting vehicles, and parts) of USD 361,741 in 2025: −3 from 2026-07-13
      (the 2025 value, V ≥ 100,000); 0 before. Israel's mirror HS 93 imports from Greece are USD
      16,000 (2022), 21,000 (2023), 47,000 (2024) and 69,000 (2025). HS 8526 (own USD 20,620, 813,
      39,443 and 18,545) is not counted: no licence register, parliamentary answer or investigation
      confirming a military nature was found, and no row was added to a2_confirmed_military.csv. No
      Greek document on arms-export licences to Israel was found on the two sites searched; the
      Ministry of Development's licensing records and Parliament were not searched. Reported, not
      disputed: nothing Greek contradicts the HS 8710 row.
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No official document naming Greek companies as suppliers of parts or maintenance for the F-35
      programme was found in the sources searched. The Ministry of National Defence and industry
      participation records were not searched.
    queries:
      - mfa.gr and primeminister.gr full-text search (Israel, Ισραήλ; read for F-35)
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no release archived yet (docs/10 B-187). Left to the
      build. The Prime Minister spoke with Prime Minister Netanyahu of "defence cooperation" on 30
      March 2025, 22 December 2025 and 24 September 2026 (primeminister.gr); Greece's orders of Israeli
      weapons systems since October 2023 were not researched from primary documents and belong to
      A4, never to C2.
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No named exercise with Israel, transit authorisation, basing agreement or official
      confirmation of intelligence sharing related to the Gaza campaign was found in the sources
      searched. The Joint Declaration of 22 December 2025 (src_20251222_primeminister-gr_joint-
      declaration-trilateral-israel, line 9) agrees to reinforce "ongoing" trilateral cooperation on
      security, defence and military matters, a pre-existing arrangement, and announces a 2026 joint
      exercise on marine pollution (civil); Greece's participation in the US-led Civil-Military
      Coordination Center for Gaza is not cooperation with Israel's campaign. The Ministry of
      National Defence and the ports were not searched (P-16).
    queries:
      - mfa.gr and primeminister.gr full-text search (Israel, Ισραήλ)
  A6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No decision suspending or refusing licences for military exports to Israel found; the
      Prime Minister stated on 17 September 2025 that he was not sure a suspension of the EU-Israel
      agreement served Europe's and Greece's interests (primeminister.gr/2025/09/17/36953, not
      archived). Export licensing records were not searched.
    queries:
      - mfa.gr search (κυρώσεις, Ισραήλ); primeminister.gr full-text search (sanctions, αναστολή)
  A7:
    status: none-found
    checked_at: 2026-09-29
    note: No law or decree on an arms embargo on Israel found.
    queries:
      - mfa.gr and primeminister.gr search (Ισραήλ, Israel)
  A8:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No official denial of transit or port access to a vessel carrying arms to Israel found. Port
      authorities and the Ministry of Maritime Affairs were not searched.
    queries:
      - mfa.gr and primeminister.gr search (Ισραήλ, Israel)
  B1:
    status: has-events
    note: >-
      Generated. Rows for the seven votes to December 2024 (docs/10 B-186): abstention on
      A/RES/ES-10/21 and 79/232; yes on ES-10/22, ES-10/23, ES-10/24, ES-10/25 and ES-10/26. The UN
      press release GA/12626 records that Greece's delegate voted in favour of ES-10/24; the other press
      releases do not name Greece; the Minister explained the abstention on ES-10/21 in an interview of
      5 November 2023 (mfa.gr, not archived). No Greek document contradicts the rows. Later votes without
      rows (docs/10 B-199 (1)): the Minister told Parliament on 16 October 2025 that Greece voted for
      the ceasefire resolution of 12 June 2025 (ES-10/27) and for the two-state text of 12 September
      2025 (A/DEC/80/506) (mfa.gr, not archived); A/RES/80/1, 80/78 and 80/116 are not named.
  B2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Greece has been an elected member of the Security Council since 1 January 2025 (applicable). It
      cast no veto; it voted in favour of the ceasefire drafts vetoed on 4 June 2025 (S/PV.9929) and
      18 September 2025 (S/PV.10000), both vetoed by a permanent member. No unsc_vetoes.csv row
      concerns it.
    queries:
      - archived S/PV.9929 and S/PV.10000 (voting lists)
      - mfa.gr search (Συμβούλιο Ασφαλείας, Γάζα)
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: Greece is not in the ICJ's list of declarations of intervention in case 192 (docs/06 §8).
    queries:
      - mfa.gr search (Διεθνές Δικαστήριο, Διεθνούς Δικαστηρίου)
  B4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement rejecting the ICJ's provisional measures or their binding character and no
      intervention against the applicant found. The Prime Minister said on 28 May 2024 that Greece is
      bound by the decisions of "the International Court" (answer on the ICC prosecutor's request;
      primeminister.gr/2024/05/28/34348, not archived).
    queries:
      - mfa.gr search (Διεθνές Δικαστήριο, Διεθνούς Δικαστηρίου); primeminister.gr full-text search (Δικαστήριο)
  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No commitment to execute the ICC warrants of 21 November 2024 by the Prime Minister or the
      foreign or justice minister found. On 14 December 2024 the Minister of Foreign Affairs told
      Parliament that Greece "respects the jurisdiction" of the Court but that "at this moment the
      immediately useful is not the implementation of this decision", but a ceasefire
      (src_20241214_mfa-gr_omilia-vouli-proypologismos, line 37): neither a commitment to execute nor a
      stated refusal; flagged (docs/10 B-326 (1)). On 28 May 2024, before the warrants, the Prime
      Minister said Greece is bound by the Court's decisions.
    queries:
      - mfa.gr search (Ποινικό Δικαστήριο, ένταλμα, Νετανιάχου)
      - primeminister.gr full-text search (Ποινικό Δικαστήριο, ένταλμα, ICC, arrest warrant)
  B6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
