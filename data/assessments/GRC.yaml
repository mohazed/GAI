      7 June 2024: a "disproportionate reaction"); the Prime Minister's interview of 17 September 2025
      (a "public call" to stop the operation in Gaza); the Office's reports of the Prime Minister's
      words in indirect speech (30 March 2025, Jerusalem: the need for the cessation of Israeli
      operations in Gaza); the Ministry's unattributed announcement of 18 October 2023 on the hospital
