      in its OCR text (file et_fl.pdf, a scan). The 80th (25 September 2025) was delivered by the President, Taye Atske Selassie Amde, who is head of state, not head of government (R3: read at
      the B9 rank for a head of state, flagged); it says ''We affirm our historic position on the right of the Palestinian people for self-determination. Direct negotiation among the warring parties
      is an immediate necessity. Humanitarian assistance must reach too all the people in need'' and that ''any proposed peace and reconstruction plan in the Middle East should not create complications
      to adjacent countries and regions'' (OCR of et_en.pdf, page 4): it names neither Gaza nor a ceasefire and calls for no end to hostilities, so it has no B9 tier (R7). The 81st (23 September
      2026, the President) names none of Gaza, Palestine or Israel. The files are image scans with no text layer and Save Page Now answers gadebate.un.org with 405, so none is archived (read by
      OCR on 2026-11-04). (2) The Ministry''s endpoints (news: 32 items, press releases, press briefings) and the Ethiopian News Agency''s searches hold no statement on Gaza by the Foreign Minister,
      Gedion Timothewos, or the Prime Minister, Abiy Ahmed; the agency''s items on Israel are meetings on trade, energy and agriculture (docs/10 B-794). (3) The Prime Minister''s own social-media
      posts were not read.'
