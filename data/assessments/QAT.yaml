      `west-bank`, unscored: the joint statement of 18 June 2026 on settler attacks. Not filed (the
      standard of docs/10 B-381 (4)): the Ministry's unsigned statements; the words of the Official
      Spokesperson (the Adviser to the Prime Minister, Majed Al-Ansari); the Prime Minister's words
      reported in indirect speech (for instance 5 November 2023 with the French Foreign Minister,
      "genocidal practices", and 7 January 2024 with the US Secretary of State); statements in the
      same weeks as a filed one (the Security Council speech of 11 September 2025 on the Israeli
      strike on Doha, which cites "the ongoing genocide in Gaza"; the press conference with the
      Egyptian Foreign Minister of 20 August 2026; the high-level meeting of 23 September 2026);
      statements by the Ministers of State and the Permanent Representative, who are not B9
      speakers. The press conference with Türkiye's Foreign Minister in Doha (27 April 2025, per
      the Ministry's list; "We cannot accept the starvation of the brotherly Palestinian people")
      is archived (src_20250427_mofa-qa_pm-press-conference-turkiye) but not filed: its page carries
