  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Qatar is not a party to the Rome Statute (it joined the 23rd Assembly of States Parties as an
      observer, Ministry item of 3 December 2024, by title). No statement by the Prime Minister and
