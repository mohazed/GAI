    checked_at: 2026-11-09
    note: >-
      Generated from recognitions.csv. The row QAT,1988-11-16 was added in the resumed T-F-W8
      session of 2026-11-09 (docs/10 B-949), citing the letter of 14 December 1988 from Qatar's
      Chargé d'affaires a.i. to the Secretary-General (A/43/971-S/20332, UNISPAL, archived,
