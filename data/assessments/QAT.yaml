# Coverage record for Qatar (docs/03 §6). P-D research session, wave 8, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-391): one session of 2026-09-29, with a web search used for the gaps.
# Sources read, read only:
# - Ministry of Foreign Affairs (mofa.gov.qa, English): its pages are rendered on the server and
#   answer scripted requests. The site search (/en/search?indexCatalogue=mofasite&searchQuery=…,
#   twenty items a page, every page read) was harvested by script for the terms Gaza, Palestinian,
#   Israeli, UNRWA, "Criminal Court", "Court of Justice", "arrest warrant", recognition,
#   evacuation, wounded, "field hospital", genocide, "joint statement", Netanyahu, "West Bank",
#   starvation, famine, ceasefire, "Security Council" and "State of Palestine" (3,498 distinct
#   items, 1,350 dated 7 October 2023 or later, titles and summaries read); the lists "Prime
#   Minister Speeches" and "Press Conferences" were read through the site's own listing API
#   (/api/DynamicItems): every speech (16) and every press conference (18) of the Prime Minister and
#   Minister of Foreign Affairs from October 2023 was read in full, with about 40 news items. The
#   Ministry publishes the Prime Minister's speeches and press-conference remarks as transcripts in
#   the first person; its news items report his words mostly in indirect speech.
# - Save Page Now answered every capture request for mofa.gov.qa on 2026-09-29 with "not-found"
#   (HTTP 404 to the Internet Archive's crawler, while the pages answer 200 to a browser); pages were
#   archived from existing Wayback captures (`pnpm archive --capture`) where one exists, and the
#   others are not filed (docs/10 B-392).
# - Amiri Diwan (diwan.gov.qa): needs JavaScript (registry note); the Amir's statements were read in
#   the Ministry's items only.
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, gni.csv, unga_votes.csv, the UN
#   press releases archived in votes.yaml, and the joint statements of foreign ministers archived
#   for Saudi Arabia and the United Arab Emirates.
# - Web search: the medical-evacuation programme, the State Department's transcripts of the joint
#   press availabilities of October 2023, the joint statement of nine Arab foreign ministers of 26
#   October 2023.
# Not searched or not readable: the Amiri Diwan's own site, the Qatar News Agency (qna.org.qa), the
#   Official Gazette (Al Meezan), the Shura Council, the Ministry of Defence, the Qatar Investment
#   Authority (C5), the Public Prosecution and courts (E1, E3), Arabic-language pages (the Ministry's
#   English service was read; the Arabic originals were not compared).
# Finish run, T-F-W8 (2026-11-09, docs/10 B-917 to B-920): window 27 September to 9 November 2026 read
# through the Ministry's Statements listing (listing API, 90 items to 14 August 2026), the lists of the
# Prime Minister's speeches and press conferences (none in the window) and the Amiri Diwan's Speeches &
# Remarks (built-in browser). Filed: the Amir's speeches of 13 October (Shura Council) and 22 September
# 2026 (General Assembly), the France-Qatar joint statement of 21 October 2026 (Qatari and French
# texts), the mediators' statements of 3 and 20 August 2026 and the eight ministers' West Bank
# statements of 2 June, 23 July, 21 August and 9 September 2026. E1 and E3 stay unchecked. B8 unchanged.
