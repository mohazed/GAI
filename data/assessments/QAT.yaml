    status: none-found
    checked_at: 2026-09-29
    note: >-
      No named exercise, transit, basing agreement or official confirmation of intelligence sharing
      with Israel related to the Gaza campaign was found. The Ministry's items on Israel concern the
      mediation, the Israeli strike on Doha of 9 September 2025 (condemned as a violation of Qatar's
      sovereignty) and statements on Gaza. The Ministry of Defence was not searched.
    queries:
      - mofa.gov.qa site search (Israeli, Netanyahu)
  A6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
