  B8:
    status: unchecked
    note: >-
      Generated from recognitions.csv; Qatar has no row. The registry dates its recognition to 16
      November 1988 (data/countries.yaml, from A/78/846, a lead). No Qatari document stating the
      recognition and its date was found: the site search for "recognition" and "State of Palestine"
      returns Qatar's calls on other states to recognise Palestine and its welcome of their
      recognitions, not its own. No row added (as for Saudi Arabia and the United Arab Emirates,
      docs/10 B-382 (4), B-387 (5)); P-16 looks for a document of 1988.
    queries:
      - mofa.gov.qa site search (recognition, "State of Palestine")
  B9:
    status: has-events
    note: >-
      Eleven events scoped `gaza`, all on the Prime Minister and Minister of Foreign Affairs' own
      words: his remarks at the joint press availability with the US Secretary of State in Doha of
      13 October 2023 (the State Department's transcript), his press-conference remarks of 6
      February 2024 and 12 June 2024 (with the US Secretary of State), 28 August 2025 (with the
      Egyptian Foreign Minister, Cairo) and 12 May 2026 (with Türkiye's Foreign Minister), his
      speeches at the Summit of the Future (22 September 2024), the Doha Forum (7 December 2024) and
      the two-state solution conference (28 July 2025); and the joint statements of the foreign
      ministers of eight states of 1 February 2026 (the Saudi Press Agency's text), 6 August 2026 and
      6 September 2026 (the texts archived for the United Arab Emirates). One event scoped
      `west-bank`, unscored: the joint statement of 18 June 2026 on settler attacks. Not filed (the
      standard of docs/10 B-381 (4)): the Ministry's unsigned statements; the words of the Official
      Spokesperson (the Adviser to the Prime Minister, Majed Al-Ansari); the Prime Minister's words
      reported in indirect speech (for instance 5 November 2023 with the French Foreign Minister,
      "genocidal practices", and 7 January 2024 with the US Secretary of State); statements in the
      same weeks as a filed one (the Security Council speech of 11 September 2025 on the Israeli
      strike on Doha, which cites "the ongoing genocide in Gaza"; the press conference with the
      Egyptian Foreign Minister of 20 August 2026; the high-level meeting of 23 September 2026);
      statements by the Ministers of State and the Permanent Representative, who are not B9
      speakers. The press conference with Türkiye's Foreign Minister in Doha (27 April 2025, per
      the Ministry's list; "We cannot accept the starvation of the brotherly Palestinian people")
      is archived (src_20250427_mofa-qa_pm-press-conference-turkiye) but not filed: its page carries
      no date and the dated news item of that day could not be archived (docs/10 B-392). The Amir,
      head of state, is not a B9 speaker (docs/10 B-390 (2)); his addresses (the General Assembly,
      the Arab-Islamic summits) and the call of 8 August 2024 with the Presidents of Egypt and the
      United States were not filed. The joint statement of nine Arab foreign ministers of 26
      October 2023 is a lead (lead_20260929_QAT_1).
    queries:
      - mofa.gov.qa site search (Gaza, ceasefire, genocide, starvation, famine, "joint statement")
      - mofa.gov.qa Prime Minister Speeches and Press Conferences (every item from October 2023)
      - state.gov Secretary Blinken Qatari Prime Minister joint press availability Doha October 13 2023 transcript
