    note: >-
      Generated from unga_votes.csv (seven votes to December 2024, docs/10 B-186): yes on
      ES-10/21 to ES-10/26 and 79/232. The Ministry's items agree where they speak (Qatar's
      representative spoke for the resolution of 27 October 2023, GA/12548, archived). For the five
      later votes without rows (B-199 (1)): the UN press releases archived in votes.yaml do not name
      Qatar among the states against A/DEC/80/506 (GA/12707), against or abstaining on 80/1
      (GA/12708), against 80/78 (GA/12739) or against or abstaining on the vote of 17 September
      2026 (GA/12784); the releases of ES-10/27 and 80/116 do not list the states. No difference
      found.
  B2:
    status: not-applicable
    note: >-
      Qatar was not a member of the Security Council in the window (data/countries.yaml); it holds
      no veto. Generated from unsc_vetoes.csv: no Qatari row.
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Qatar filed no declaration of intervention in case 192 (not in the ICJ list of docs/06 §8, and
      no Ministry item reports one). It took part in the advisory proceedings on Israel's
