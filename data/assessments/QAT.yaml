      2024 and beyond, Ministry items by title) are part of the programme. The field hospitals
      flown to Al-Arish for delivery to Gaza (14 November 2023) were not filed: no primary confirms
      a deployment inside Gaza. Qatar's evacuations of Palestinians holding Qatari residency and of
      foreign nationals are not medical programmes.
