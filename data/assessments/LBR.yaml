  B9:
    status: none-found
    note: 'No B9 event. The President (Joseph Nyuma Boakai) is head of state and head of government (R3); the Foreign Minister is Sara Beysolow Nyanti. (1) His 79th General Debate statement (25
      September 2024, src_20240925_un-gadebate_lr-boakai-ag79, lines 231 to 234; 770 days, expired): ''we call for an immediate ceasefire in the Middle East'' and urges ''both the Israelis and
      Palestinians'' to negotiate: Gaza is not named (R7), so it is not an event (an `official` source cannot support a lead; it stays here). (2) His 80th statement (23 September 2025, src_20250923_un-gadebate_lr-boakai-ag80,
      lines 89 to 94): support for ''all credible mediation efforts'' on ''the Israeli-Palestinian conflict'' and the two-state solution, no call, no Gaza. (3) His 81st statement (24 September
      2026; the file lr_en.pdf is an image of 2,294,967 bytes, read by OCR on 2026-11-04, not recorded: no Wayback capture and gadebate.un.org fails Save Page Now): no mention of Gaza, Palestine,
      Israel or the Middle East. (4) The Executive Mansion''s report of 15 April 2024 (src_20240415_emansion_boakai-israel-iran-conflict) says in indirect speech that he ''urged both Israel and
      Hamas to adhere to the terms of the UN Security Council Resolution 2728'': lead_20261104_LBR_1. (5) The Executive Mansion''s report of the 80th statement (indirect speech, line 18) says
      the same as (2). The Foreign Minister''s statements: none on Gaza in the Ministry''s titles; Liberia''s statements in the Security Council since January 2026 were not read (a statement by
      a Permanent Representative is not B9, R3).'
    queries:
