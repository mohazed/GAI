      answer or investigation citing those codes was found. Disagreement with the country's own
      record, reported, not corrected: the Federal Government told the Bundestag that individual
      licences for the final export of military equipment to Israel worth EUR 485,103,796 were
      granted between 7 October 2023 and 13 May 2025 (Drucksache 21/284, answer to question 6; not
      archived in this session). Licences are not exports and the list positions are not HS codes, so
      the customs value is not replaced; the gap is stated for the author (docs/10 B-210).
