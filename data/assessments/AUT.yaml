# Coverage record for Austria (docs/03 §6). P-D research session, wave 4, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-297): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Norway, Sweden, Denmark and Switzerland). The protocol's
# searches (docs/06 §4 step 3) were run as (1) the Federal Ministry for European and International
# Affairs' press releases: the monthly listings of bmeia.gv.at (the site's own Ajax listing,
# October 2023 to September 2026, 411 releases), every release downloaded and its text filtered
# for Gaza, Paläst*, UNRWA, Westjordan*, Siedl*, Strafgerichtshof/IStGH, Netanja*, Waffenstillstand,
# Waffenruhe, Blockade, Völkerrecht*, Israel, Abkommen, F-35, evakuier*, medizinisch*; (2) the
# Federal Chancellery's news (bundeskanzleramt.gv.at, all 655 items from October 2023 to September
# 2026) with the same filter; (3) the Austrian Parliament's open data (the Filter API of
# parlament.gv.at): every written question of the Nationalrat of the XXVII and XXVIII legislative
# periods (26,521 questions) filtered by title since 2023-10-07 for 30 German terms (Gaza, Israel,
# Paläst*, UNRWA, Westjordan*, Siedl*, Hamas, Strafgerichtshof, IStGH, Netanja*, Rafah,
# Zweistaat*, Nahost, Naher/Nahen Osten, Völkermord, Genozid, F-35, Kriegsmaterial, Waffenexport,
# Rüstungsexport, Dual-Use, Elbit, Sky Shield, Anerkennung, Waffenstillstand, Waffenruhe,
# Völkerrecht, Flotill*, Drohne, Sanktion*), and the answers read (the ministers' signed PDFs).
# BMEIA, the Chancellery and parlament.gv.at accepted Save Page Now. Not searched: the press, the
# Nationalrat's plenary records and motions, the prosecution services and courts (E1, E3), the
# Federal Ministry of the Interior's and the Ministry of Economy's releases, the UN General Debate
# records, the BMEIA's English pages (joint statements Austria signed are cited in its German
# answers only), RIS (the legal information system). Each `queries` entry names the listing used.
country: AUT
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build. No
      Austrian document on deliveries of military equipment to Israel was found in the releases and
      answers searched.
  A2:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Generated from Comtrade (Austria's rows existed from P-14, so `pnpm fetch:comtrade` was not
      run). Own reports of HS 93 exports to Israel: USD 2,367,305 (2022), 747,407 (2023), 556,143
      (2024), 870,208 (2025); A2 is −8 on the 2022 report (from 2023-05-09) and −3 from 2024-07-26 on
      each later report. Israel's mirror imports of HS 93 from Austria are much higher in two years
      (USD 11,394,000 in 2023, which would give −15, and 6,690,000 in 2025, −8); the generator uses the
      country's own report when present (docs/02 §5), so the mirror values do not score; reported for
      the author. No Austrian document on war-material licences for Israel was found, so the generated
      value could not be checked against the Government's own figures; no disagreement recorded. HS 8526
      (own up to USD 745,098 a year) and 8802 (own USD 637,648 to 716,789) not counted: no document
      confirming military nature was found, so no row was added to a2_confirmed_military.csv. The
      Minister of Economy's answer of 24 November 2025 (src_20251124_parlament_ab-2867-rotax) says
      BRP-Rotax engines were originally built into Hermes 900 drones, that such engines are dual-use
      goods not listed in Annex I of Regulation (EU) 2021/821, need no export licence, and that no
      licence for Rotax engines to Israel was granted in ten years; engines are not an A2 heading.
    queries:
      - parlament.gv.at written questions (Rotax, Drohne, Kriegsmaterial, Rüstungsexport, Dual-Use) — 3332/J–3335/J, 5847/J, 17703/J
