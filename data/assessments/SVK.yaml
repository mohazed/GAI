#   no capture), the joint statements already archived for the 45 (docs/10 B-444: five name Slovakia), the EU Council's settler listings (R8, docs/10 B-446),
#   UNRWA's donor tables, SIPRI's trade register (archived), the generated events and the structured tables; web searches in English and in Slovak per
#   indicator group. Time: about 40 minutes.
# Statements read and not filed as B9 or B10: the President's General Debate statements of 24 September 2025 (Israel's right to defend itself, hostages home,
#   'we must allow access to humanitarian aid', two states: no call for a ceasefire, archived) and of 23 September 2026 (humanitarian aid must reach Gaza,
#   international humanitarian law must be respected, two states; no capture, a lead); the Minister's statements of 16 January 2025 (welcome of the ceasefire
#   agreement), 10 July 2025 (support for the negotiations on a ceasefire, a call to Israel to allow humanitarian aid, as the press reports it in indirect speech),
#   17 February 2026 (archived: Israel 'has the right to retaliate, but everything must be in compliance with international humanitarian law') and 24 September
#   2026 (support for the ICC's independence), none with the exact words of a call in an archived text (R4).
