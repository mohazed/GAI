# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the President's site (akorda.kz, English: the General Debate statement of 23 September
#   2025 read in full), the Ministry of Foreign Affairs portal (gov.kz/memleket/entities/mfa), whose pages load by script
#   and hold no text in their HTML (a Ministry release cannot be archived as text, docs/10 B-501), so the Ministry's
#   releases were read through press reports only (Astana Times, Qazinform, Kazinform, Kapital, Nur.kz via search
#   summaries); the generated events and the structured tables; web searches in English and in Russian (the working
#   language of the Ministry's releases) per indicator group. Time: about 10 minutes.
# Statements read and not filed as B9 (press accounts, not the speaker's own words, docs/10 B-407 (4); or no call): the
#   President at the CSTO parliamentary meeting of 3 June 2024 ("approaching catastrophic", Anadolu); the President at the
#   Qatar Consultative Assembly (14 February 2024); the President's support for the ceasefire agreement (9 October 2025,
#   press secretary's account); the Minister of Foreign Affairs at the OIC Council of Foreign Ministers (Istanbul, 21 June
#   2025: "immediate ceasefire and unimpeded delivery of humanitarian aid", the Ministry's paraphrase, Astana Times).
