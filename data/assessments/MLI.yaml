      General Debate statement (28 September 2024, src_20240928_un-gadebate_ml-maiga-ag79, page 8) was delivered by a Deputy Prime Minister, who is not a B9 speaker; it condemns ''sans réserve,
      l''usage indiscriminé de la force par l''armée israélienne contre les Palestiniens'', in ''les territoires palestiniens occupés'', without naming Gaza (R7); 767 days old, expired. (2) The
      80th statement (26 September 2025, the Prime Minister, src_20250926_un-gadebate_ml-maiga-ag80) does not mention Gaza, Palestine, Israel or the Middle East. (3) The 81st statement (28 September
      2026, the Foreign Minister, src_20260928_un-gadebate_ml-diop-ag81): ''le Mali réaffirme son soutien total au peuple palestinien frère dans sa lutte légitime d''exister en tant qu''Etat de
      plein droit'', no call, no violation, Gaza not named. (4) AMAP''s report of 17 November 2025 (the Minister at the anniversary of the Declaration of Independence of the State of Palestine)
      speaks of the suffering of the Palestinian people ''particulièrement à Gaza'' and of ''soutien indéfectible'', in the Ministry''s indirect speech and with no call. (5) The Council of Ministers''
      communique of 8 May 2024 reports the OIC summit''s support for the Palestinian cause ''dans un contexte marqué par l''agression en cours de l''Etat hébreu contre les populations palestiniennes
      à Gaza'' in the Government''s own words, with no named speaker. The Ministry''s and the Prime Minister''s sites did not answer.'
    queries:
    - 'koulouba.ml and amap.ml REST search: Gaza, Palestine, Palestinien, Israël, Hamas, cessez-le-feu, OCI (the matches that bore on Gaza opened)'
