    note: >-
      Generated from unga_votes.csv (seven votes to December 2024, docs/10 B-186): yes on ES-10/21
      to ES-10/26 and 79/232. The Ministry's release of 1 November 2023 states that Mexico voted in
      favour of ES-10/21 on 27 October 2023, which agrees; no Mexican document read contradicts the
      other rows. The five later votes have no rows (B-199 (1)); no Mexican document read names
      Mexico's vote on them, and the archived UN press releases name only the states voting against
      or abstaining, so a yes cannot be told from an absence there.
  B2:
    status: not-applicable
    note: Not a member of the Security Council in the window (set by the build's rule).
  B3:
    status: has-events
    note: >-
