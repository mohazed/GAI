  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv. Mexico had no row; the row MEX,2023-06-02 was added citing
      the President's words of 5 February 2025 that the recognition of the Palestinian State is a
      position held for years, from before the present governments (the source's excerpt); the day
      is the registry's (data/countries.yaml, from A/78/846), not read in a Mexican document: +3
      standing from 2023-10-07. The President later said her government recognised Palestine as a
      State in full by accrediting its first ambassador (2 October 2025, 5 March 2026, 8 May 2026;
      the credentials' date was not found in the Presidency's or the Ministry's listings), and the
      Foreign Secretary told the General Assembly on 25 September 2026 that Mexico "reconoce al
      Estado de Palestina". Flagged: if the author reads the accreditation as the recognition, B8
      is +8 from its date and 0 before (docs/10 B-367 (1)).
  B9:
    status: has-events
    note: >-
      Three events, the President's own words in the Presidency's transcripts (22 September 2025,
      6 October 2025, 8 May 2026, each a legal characterisation, +5). Not filed (docs/10 B-366 (3)):
      the Ministry's unsigned communiqués (8 October 2023; 23 January, 26 January, 7 May 2024 on
      Rafah with a call for a ceasefire and a finding of a serious violation of international
      humanitarian law; 15 May 2024; 30 July 2024), the addresses of ambassadors at the United
      Nations (26 October 2023, the Chargée d'affaires calling for a cessation of hostilities), the
      Foreign Secretary's General Debate address of 28 September 2024 (quoted: "La humanidad se
      quiebra en Gaza ante la inacción de la comunidad internacional", neither a ceasefire call nor
      a named violation), the President's words of 2 October 2025 (humanitarian aid must reach Gaza;
      same week as a filed event), 5 August 2026 ("esta ofensiva inhumana que ha hecho el Estado de
      Israel", no call or legal characterisation) and 11 October 2024 (condemnation of "las
      agresiones", no call). President López Obrador's statements (to 30 September 2024) could not be
      read.
    queries:
      - gob.mx/sre press listing (Gaza, Palestina, genocidio, alto al fuego, cese al fuego, Rafah)
      - Presidency transcripts full text (Gaza, Palestin, genocid)
