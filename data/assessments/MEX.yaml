# Coverage record for the United Mexican States (docs/03 §6). P-D research session, wave 7, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-366): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Colombia and Chile). Sources read, read only:
# - www.gob.mx answers scripted requests with a JavaScript proof-of-work challenge page (no CAPTCHA
#   was shown or solved); the pages were read in the built-in browser, which loads the site as any
#   visitor's browser does, and archived through Save Page Now.
# - Secretaría de Relaciones Exteriores (gob.mx/sre): the press listing was read in full by title
#   from 28 September 2026 back to May 2023 (about 1,270 items, of which 999 from 30 September 2023),
#   filtered for Palestina, Gaza, Israel, Medio Oriente, genocidio, UNRWA, Corte Internacional, Corte
#   Penal, CIJ, CPI, Netanyahu, Hamás, Rafah, Cisjordania, flotilla, alto al fuego, cese al fuego,
#   Franja, humanitaria, Asamblea General, Consejo de Seguridad, Nakba, credenciales, reconoce; about
#   25 items read in full. The Wayback CDX index of gob.mx/sre/prensa/ (7,585 captured addresses) was
#   filtered the same way.
# - Presidencia de la República (gob.mx/presidencia): the 1,037 transcripts (versiones
#   estenográficas) of President Sheinbaum's term, 1 October 2024 to 28 September 2026, were read in
#   full by script for Gaza, Palestin, Israel, genocid, Netanyahu, flotilla, UNRWA (163 with a match;
#   the passages spoken by the President or a Secretary read by eye); the 1,247 Presidency press
#   releases of the same period were read by title.
# - The ICJ's report to the General Assembly, A/79/4 (documents.un.org), for the intervention.
# - UNRWA's donor tables for 2022 and 2024 (records on this branch from data/wave-6, B-356).
# Not readable: the President López Obrador's transcripts (lopezobrador.org.mx answers with a bot
# challenge, not bypassed; they are not on gob.mx), so no statement of the head of government from
# 7 October 2023 to 30 September 2024 was read; the ICJ's copy of Mexico's declaration of
# intervention (every Wayback capture is HTTP 403); gadebate.un.org (bot check; the Foreign
# Secretary's General Debate addresses of September 2025 and 2026 were read only as the Ministry
# summarised them). Not searched: press and NGO reports (no leads were read); the Congress and the
# Diario Oficial de la Federación; the Ministry of National Defence and the Navy (A4, A5); the
# Ministry of Economy (C1, C2, C4); the migration and refugee authorities (D5); the Fiscalía and the
# courts (E1–E3); public pension funds (C5).
country: MEX
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build. Mexico is a
      buyer of Israeli equipment, not known as a supplier.
  A2:
    status: has-events
    note: >-
      Generated from Comtrade, fetched in this session (pnpm fetch:comtrade --reporters MEX; Mexico
      had no rows). Mexico's own data: no HS 93 or 8710 export to Israel in 2022–2025; HS 8526 of
      USD 1,821 in 2023. Israel's mirror imports from Mexico: HS 93 of USD 3,000 (2023) and 6,000
      (2025), 0 points under the USD 100,000 tier; HS 8526 of USD 58,000 (2022), 417,000 (2023),
      1,000 (2024) and 621,000 (2025), not counted: no licence register, parliamentary answer or
      investigation confirming a military flow was found, and no row was added to
      a2_confirmed_military.csv. No Mexican document on arms exports to Israel was found in the
      sources searched.
    queries:
      - gob.mx/sre press listing (Israel)
      - Presidency transcripts full text (Israel)
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Mexico is not a partner, supplier or customer of the F-35 programme; no document naming
      Mexican companies as suppliers of F-35 parts or maintenance was found.
    queries:
      - gob.mx/sre press listing (Israel)
  A4:
