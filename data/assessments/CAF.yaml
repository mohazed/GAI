      or Hamas. The Prime Minister (head of government), Félix Moloua: the Primature''s WordPress site (primature.cf, current to 3 November 2026, searched through /wp-json/wp/v2/posts?search=)
      returns nothing for Palestine, Palestinien, Moyen-Orient, Hamas, cessez-le-feu, CPI, Netanyahu, UNRWA or génocide, one item for Gaza (26 January 2026, a thanksgiving service, no passage
      on Gaza in its text) and two for Israël (1 June 2026, a sermon at a thanksgiving service that cites Israel as an example of hard work: not a statement on the conflict). The Government portal''s
      search (gouv.cf/search/node?keys=Gaza) returns no result. On 5 December 2025 the Central African Republic abstained on the Fourth Committee''s draft A/C.4/80/L.18 (Palestine refugees'' properties
