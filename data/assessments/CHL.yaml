  D5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No visa or refugee instrument for Gazans was found (see D4 for the evacuation of September
      2025). Consular evacuations of Chileans from Israel in October 2023 are not D5 instruments.
    queries:
      - minrel.gob.cl site search (Gaza, visa)
  E1:
    status: unchecked
    note: The Fiscalía and the courts were not searched (P-16).
  E2:
    status: unchecked
    note: No search of police or administrative bans on Palestine solidarity protests (P-16).
  E3:
    status: unchecked
    note: No domestic universal-jurisdiction complaint accepted for investigation was searched (P-16).
