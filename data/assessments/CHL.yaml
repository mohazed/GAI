    queries:
      - minrel.gob.cl site search (UNRWA)
  D3:
    status: has-events
    note: >-
      One event (evt_2024_12_31_CHL_D3): increased tier, USD 20,000 for 2024 against USD 12,500 for
      2022 (UNRWA tables), as data/wave-6 and Colombia for countries that never suspended.
  D4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No medical-evacuation programme or field hospital was found. On 13 September 2025 the
      Ministry reported that 68 Palestinians with close ties in Chile (36 minors) had arrived after
      an evacuation from Gaza organised by the government from 10 September 2025; the release
