#   tables; one web search in English per indicator group (no other official language is searched for a
#   government that publishes in English; te reo Māori texts are translations). Time: about 25 minutes.
# Statements read and not filed as B9: the Prime Minister's and the Minister's remarks on radio (21 May 2025, RNZ
#   Morning Report: "running out of patience", press only, lead_20261005_NZL_1); the General Debate statement of 26
#   September 2024 (the Minister calls the violence in Gaza "unacceptable" and describes Israel's response as "overwhelming",
#   with no call and no named violation; read in the General Debate site's copy, not filed).
