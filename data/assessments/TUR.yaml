# Coverage record for Türkiye (docs/03 §6). P-D research session, wave 2, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search facilities used: the Wayback CDX listings of mfa.gov.tr, ticaret.gov.tr, saglik.gov.tr,
# iletisim.gov.tr and istanbul.adalet.gov.tr (pages captured since October 2023), with web searches
# in English and Turkish. tccb.gov.tr (the Presidency) answers scripted requests with a redirect loop
# and Wayback holds only 302 captures of its speech pages, so the Presidency's statements were read
# through the Directorate of Communications (iletisim.gov.tr), which reports them verbatim.
country: TUR
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build.
      Türkiye states that it authorises no sale to Israel of any product or service usable for
      military purposes (src_20240409_ticaret_israile-ihracat-kisitlamasi, line 17).
  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade; fetched in this session (`pnpm fetch:comtrade --reporters TUR`, 15 A2
      and 7 C3 rows; Türkiye's own report for 2025 is incomplete, "total trade not reported in both
      flows", so 2025 uses Israel's mirror). Values: own HS 93 USD 582,382 (2022), 998,990 (2023),
      317,206 (2024); mirror HS 93 USD 287,000 (2025) → −3 from 2026-05-14. Disagreement reported, not
      corrected: the Directorate of Communications states that the HS 93 goods exported to Israel were
      smoothbore hunting-gun parts, accessories and fishing equipment, not weapons of war, and that no
      sport or hunting guns were exported since May 2023 (src_20240326_iletisim_silah-muhimmat-ihracati-iddiasi);
      the Ministry of Trade states that no customs declaration for Israel was registered after 2 May
      2024 and that goods for Palestinian importers pass through Israeli ports
      (src_20250522_ticaret_israil-ticaret-iddialari), which Israel's mirror would record as imports
      from Türkiye. The conditional headings are not counted without a confirming document (docs/02
      §2): mirror HS 8802 USD 15,080,000 (2024; −15 if counted) and HS 8526 USD 16,000–149,000 a
      year; no licence register, parliamentary answer or investigation confirming a military nature
      was found, so no row was added to a2_confirmed_military.csv.
  A3:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      Türkiye was removed from the F-35 programme in 2019 (before the window); no ministry statement,
      programme document or UN Special Rapporteur passage naming a Turkish supplier of F-35 parts or
      maintenance in the window was found. A/HRC/59/23 (src_20250616_un-unispal_a-hrc-59-23) was
      searched for Türkiye: no F-35 supplier entry.
    queries:
      - A/HRC/59/23 Türkiye Turkey (archived text searched)
      - F-35 Türkiye supplier parts Israel 2024 2025
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no release archived yet (docs/10 B-187); left to the
      build. No Turkish order of Israeli arms since October 2023 was met in this session; all imports
      from Israel are halted since 2 May 2024 (evt_2024_05_02_TUR_A7).
  A5:
    status: none-found
    checked_at: 2026-09-28
    note: >-
