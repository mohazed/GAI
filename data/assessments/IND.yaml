# Coverage record for India (docs/03 §6). P-D research session, wave 2, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search facilities used: the Ministry of External Affairs' own listing search
# (mea.gov.in/FrontEnd/FetchPublicationListingData, keyword search of titles across press releases,
# speeches and statements, bilateral documents, media briefings, responses to media queries and the
# Lok Sabha and Rajya Sabha answers), run for Gaza, Palestine, Palestinian, Israel, UNRWA, ceasefire,
# West Asia, Middle East, Netanyahu, International Court, ICC, Rome Statute, genocide, flotilla,
# sanction, settlement, settler, West Bank, hostages, Hamas, Rafah, humanitarian, peace, General
# Assembly, UNGA, Knesset and related terms, from October 2023 to September 2026; then the full text
# of every speech or statement of the Prime Minister or the Minister of External Affairs listed since
# 7 October 2023 (429 documents) was searched for "Gaza" and "Palestin"; the Wayback CDX listings of
# mea.gov.in, pmindia.gov.in and dea.gov.in; Press Information Bureau releases (pib.gov.in) read
# by release id around the dates of the agreements. The session had no web search (the unattended
# run's allowance of 200 calls was used up before it started, as for Egypt, docs/10 B-240), so press
# and NGO claims were read only through the Wayback listings of The Wire and Scroll and the articles
# they point to. English is the language of the official record; the Hindi versions of the same
# releases were not searched separately.
country: IND
