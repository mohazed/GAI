      Israel under HS 93: USD 93,729,515 (2022), 130,159,979 (2023), 56,538,204 (2024), 48,451,872
      (2025), so A2 is −15 from 2026-07-10 (2023: −25 from 2024-05-30 to 2025-04-25); HS 8710 USD
      574 (2022). Disagreement reported, not corrected: Israel's mirror records far smaller imports
      from India under HS 93 (USD 2,128,000 in 2022, 2,060,000 in 2023, 2,782,000 in 2024,
      1,234,000 in 2025); the generator uses India's own report first (docs/02 §5). The conditional
      headings are not counted (own HS 8526 USD 9,875,734 and HS 8802 USD 61,916 in 2025; no
      licence register, parliamentary answer or investigation citing the customs code was found, so
      no row in a2_confirmed_military.csv). The MEA spokesperson answered on 31 July 2026, after an
      Amnesty International report on arms-related shipments from India to Israel, that exports of
      dual-use items follow India's laws and international obligations (lead_20260928_IND_3); press
      reports of ammunition-related exports by Munitions India Ltd (lead_20260928_IND_2) and of the
      Marianne Danica's cargo of explosives from Chennai (lead_20260928_IND_4) are leads.
