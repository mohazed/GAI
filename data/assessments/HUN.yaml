  C6:
    status: none-found
    checked_at: 2026-09-29
    note: No public procurement exclusion of implicated companies found.
    queries:
      - 2020-2025.kormany.hu search (közbeszerzés, Izrael)
  D1:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Generated; the build derives none-found (no FTS flow from a Hungarian government entity on the
