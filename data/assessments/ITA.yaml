# Coverage record for Italy (docs/03 §6). P-D research session, wave 3, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-251): no web search was available to this session (the run's allowance
# was used up); the searches were keyword filters of the Wayback CDX listings of esteri.it (press
# archive, 25,713 URLs since 2023), governo.it (articles and media since October 2023), difesa.it
# and aics.gov.it, direct reads of governo.it and difesa.it pages, Wayback reads of esteri.it
# pages, and the ANSA listings of chosen days. Each `queries` entry names the listing and the
# keywords used.
country: ITA
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build.
      Italy is a supplier of major arms to Israel in SIPRI's registers (the share is to be read
