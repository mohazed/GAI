      would still be −3. Disagreement reported, not corrected: the President of the Council told
      the Senate on 15 October 2024 that no new licence has been granted since 7 October 2023 and
      that earlier licences were reviewed case by case, some kept
      (src_20241015_governo_replica-senato-licenze-israele); the 2024 value is consistent with
      deliveries under earlier licences (docs/10 B-253).
