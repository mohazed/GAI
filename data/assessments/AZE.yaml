    queries:
      - SOFAZ exclusion Israel companies Gaza
  C6:
    status: none-found
    checked_at: 2026-09-30
    note: "No procurement exclusion of companies over conduct in Gaza was found."
    queries:
      - Azerbaijan procurement exclusion Israel companies
  D1:
    status: none-found
    checked_at: 2026-09-30
    note: >-
      Generated from FTS: no Azerbaijani government flow to the oPt plans in any window (no row in
      fts_funding.csv or fts_plan_totals.csv), a real zero under docs/02 §5. The Ministry reports
      USD 2 million of assistance since 2023 through UNRWA (no such flow appears in FTS) and
      education grants for Palestinian students.
  D2:
    status: none-found
    checked_at: 2026-09-30
    note: "Azerbaijan did not suspend its UNRWA funding; no announcement of a suspension was found."
    queries:
      - Azerbaijan UNRWA suspend funding
  D3:
    status: has-events
    checked_at: 2026-09-30
    note: "evt_2023_12_31_AZE_D3 (P-16, docs/10 B-445): UNRWA's 2023 table (archived in P-16) gives Azerbaijan USD 2,000,000 in 2023 against USD 88,235 in 2022 (line 75), so the increased tier holds from 31 December 2023 to 31 December 2024; the 2024 table has no Azerbaijani row (it ranks donors down to USD 894), so no increase in 2024. No suspension, so no restoration."
    queries:
      - UNRWA donor tables 2022 and 2024 (archived), row Azerbaijan
      - unrwa.org overall_donor_ranking_2023.pdf (403; Wayback capture 20250404101358 a 301)
  D4:
    status: none-found
    checked_at: 2026-09-30
    note: >-
      No Azerbaijani medical-evacuation programme or field hospital for Gaza was found; Azerbaijan
      is not among the hosting states in WHO's medical-evacuation summaries seen in search results.
    queries:
      - mfa.gov.az items, terms wounded, treatment, hospital, medical, evacuation
      - Azerbaijan wounded Palestinians treatment evacuation Gaza
  D5:
    status: none-found
    checked_at: 2026-09-30
    note: >-
      No visa or refugee instrument for Gazans was found. The Ministry evacuated 14 Palestinian
      students from Gaza in September 2025 to take up places under the Heydar Aliyev International
      Education Grant (release of 19 September 2025): a scholarship programme and a one-off
      evacuation, not an immigration regulation (one event per legal instrument, docs/02 §2).
    queries:
      - mfa.gov.az items, terms visa, refugee, evacuation, students Gaza
