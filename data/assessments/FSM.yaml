      1 (A/RES/80/1 of 19 September 2025; scored as absent, B1). Its Permanent Representative explained the position at the tenth emergency special session on 1 November 2023 (archived: src_20231101_unmission-fm_ess10-lippwe-statement:
      ''we support Israel''s right to defend its territory and its people'', a call for ''the immediate unconditional release of the hostages held by Hamas'' and for both sides to respect international
      humanitarian law); a Permanent Representative is not a B9 or B10 speaker (R3), so it is a note. A blog of The Times of Israel (27 July 2025, press; the Wayback copy was read) says, citing
      the UN Watch database, that Micronesia has not cast a vote against Israel in ten years; the vote table agrees for the window (never yes).'
    queries:
