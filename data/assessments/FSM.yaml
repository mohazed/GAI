  B9:
    status: none-found
    note: 'No B9 event. The President''s address to the 79th session (26 September 2024; the delegation''s file and the Mission''s copy archived) condemns the attack of 7 October, says every nation
      has the right to defend its people and territory and urges ''the immediate and safe release of hostages and cessation of hostilities'' in a passage on ''the ongoing conflicts in Ukraine
      and between Israel and Palestine'': it never uses the word Gaza (R7, docs/10 B-32), so it is a lead (`lead_20261013_FSM_1`), as Jamaica''s and Uruguay''s ''the Palestinian territories''.
      The President''s address to the 80th session (25 September 2025, the delegation''s file read live; no Wayback capture) has no passage on Gaza, Israel or Palestine; the 81st session''s statement
      was delivered by the Vice-President, Aren Palik (26 September 2026; the Mission''s copy read live; not a B9 speaker, R3), and its only mention of the region is ''Instability in the Middle
      East and volatile fuel prices''. The Government''s report of the President''s meeting with Israel''s ambassador (5 March 2025, archived) gives his words on ''the Israel-Gaza conflict'' and
      a two-State solution in indirect speech (R4).'
    queries:
    - Micronesia Gaza ceasefire statement President Simina OR Secretary Foreign Affairs
    - 'gov.fm search: Gaza, Israel, Hamas, ceasefire (read)'
    - 'unmission.fm search: Gaza, Israel, Palestin, hostage (read)'
    - gadebate.un.org Micronesia 79th to 81st sessions (fm_en.pdf, read)
    checked_at: '2026-10-13'
  B10:
    status: none-found
    note: 'No B10 event: no statement of unconditional support for Israel, or denial of documented violations, in the words of the President or of the Secretary of Foreign Affairs and citing Gaza
      was found. Context, flagged: the Federated States of Micronesia is among the states closest to Israel in the Assembly (nine ''no'' votes of twelve), and its Government says so, through speakers
      who are not B10 speakers (R3) or in indirect speech (R4): the Permanent Representative on 1 November 2023 and on 9 September 2026 (''Micronesia has long stood with Israel in international
      fora'', at the inaugural meeting of the UN Task Force on Combating Antisemitism), the Third Committee statements of the delegation on 24 October 2023 (''I wish to unequivocally condemn the
      abhorrent attack by the terrorist organization Hamas'') and of the Permanent Representative on 30 October 2024 (on the Commission of Inquiry; read live, not recorded as sources), the Deputy
      Permanent Representative on 30 April 2026 (''Micronesia unequivocally affirms Israel''s right to defend itself'', with a call that self-defence respect international humanitarian law; no
      Gaza), the Government''s reports of 5 March and 28 April 2025 (''Micronesia has been consistent with its support of the State of Israel at a multilateral level''): all archived, none filed
      (`lead_20261013_FSM_2`). The President''s own words (26 September 2024) join the right of defence to a call for cessation of hostilities and for the protection of civilians, and do not cite
      Gaza.'
    queries:
    - Micronesia President Simina support Israel Gaza Hamas statement
    - 'unmission.fm and gov.fm searches: Israel, Hamas, antisemit (read)'
    checked_at: '2026-10-13'
