# Coverage record for the Federated States of Micronesia (docs/03 §6). P-21 light protocol, session T-P21-16, 2026-10-13.
# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the FSM Government's site (gov.fm: its search for Israel, Gaza, Palestine, Hamas, ceasefire and Middle East; the executive page and the posts on Israel), the Permanent Mission's site (unmission.fm: the WordPress search for Israel, Gaza, Palestin, Hamas, antisemit, hostage and Middle East, every hit of 2023 to 2026 read, six of them recorded as sources), the General Debate pages and statements of the 79th to 81st sessions (gadebate.un.org: the 79th through Wayback captures, the 80th and 81st files read live), UN Meetings Coverage's reports of the votes already archived, the ICJ's case pages (case 192 archived 25 September 2026; case 186 archived), the Assembly of States Parties' list (archived), the SIPRI register, UNRWA's donor rankings of 2022 to 2024, the generated events and the structured tables; web searches in English (the official language) per indicator group. Time: about 15 minutes of research on the Federated States of Micronesia, inside the 90-minute budget of the session.
# No hand-authored event: the President's address of 26 September 2024 never cites Gaza (R7) and the statements of support for Israel are the Permanent Mission's (R3) or the Government's reports in indirect speech (R4); two leads.
