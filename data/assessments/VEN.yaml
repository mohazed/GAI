      file): ''demandamos el fin del genocidio del régimen sionista de Israel'' and solidarity with ''el heroico pueblo de Palestina'', and the file never names Gaza (R7: a lead in this note);
      the President''s remarks of 7 October 2025 (the Ministry''s report, read: ''el más brutal genocidio conocido por la humanidad'', ''Palestina libre vencerá''), in which Gaza is not cited
      (R7); the Foreign Minister''s Telegram reply to Israel''s Foreign Minister of 24 or 25 November 2025 (press: Resumen Latinoamericano, social-media post with no official transcript, lead_20261007_VEN_1);
