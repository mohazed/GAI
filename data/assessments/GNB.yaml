  B9:
    status: none-found
    note: 'No B9 event. The President in the 79th and 80th sessions of the General Debate was Úmaro Sissoco Embaló (head of state, R3). His 79th statement (25 September 2024, src_20240925_un-gadebate_gw-embalo-ag79,
      line 131; 770 days, expired) says that in recent months he made ''visits of friendship and work to Russia, Ukraine, Israel, and Palestine'': Gaza is not named (R7), no call, no violation,
      no agreement. His 80th statement (25 September 2025, src_20250925_un-gadebate_gw-embalo-ag80, line 71) names Gaza only in a list (''Conflicts in Ukraine, Gaza, Sudan, and other regions persist''):
      no call, no violation, neither tier. The 81st statement (25 September 2026) was delivered by the Prime Minister, Ilídio Vieira Té (head of government, R3); the UN''s page lists no file and
      its summary does not mention Gaza or Palestine, so the statement itself was not read. The state news agency (ang.gw, kind press; it cites the Presidency''s Facebook page) reports three activities
      of the President in indirect speech: on 10 October 2023 he ''apela ao cessar-fogo'' at a Defence Council meeting (src_20231010_ang_embalo-apela-paz-medio-oriente; 1,121 days, expired); on
      3 March 2024 in Israel, with President Herzog, he says that war should be the last resort and is not a solution (src_20240304_ang_embalo-israel-visit; the first visit to Israel of a Bissau-Guinean
      head of state); and on 4 March 2024 in Ramallah, with President Abbas, he receives the Grand Collar of the State of Palestine (src_20240305_ang_embalo-ramallah-grande-colar). None quotes
      his words (R4) or names Gaza in them (R7): no event, no lead. Left to P-23: the Government''s own sites do not cover the window (mne.gw''s latest post is 7 December 2023; presidencia.gw''s
      news sitemap ends on 7 May 2025); only the state news agency (ang.gw, kind press) was searched.'
    queries:
    - gadebate.un.org/en/{79,80,81}/guinea-bissau and gastatements/{79/gw_en,80/gw_en}.pdf (Wayback replays)
    - 'ang.gw REST search: Gaza, Israel, Palestina, Palestiniano, Hamas, Médio Oriente, cessar-fogo, Embaló Israel, Embaló Palestina, Herzog, Ramallah, Abbas (titles screened, three opened)'
