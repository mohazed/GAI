# Coverage record for Bulgaria (docs/03 §6). P-21 light protocol, session T-P21-03, 2026-10-05.
# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the Ministry of Foreign Affairs (mfa.bg: every news page answers a scripted request with a Radware
#   bot check, so its releases were read through Wayback captures), the Council of Ministers (gov.bg, archived), the President's
#   site, the General Debate statements of the United Nations (gadebate.un.org, Wayback captures of the 78th to 80th sessions;
#   the 81st has none), the joint statements already archived for the 45 (docs/10 B-444: two name Bulgaria), the EU Council's
#   settler listings (R8, docs/10 B-446), UNRWA's donor tables, the generated events and the structured tables; web searches in
#   English and in Bulgarian per indicator group. Time: about 15 minutes.
# Statements read and not filed as B9: the Ministry's positions of 8 August 2025 (concern at the expansion of the military
#   operation: calls for a ceasefire that disarms Hamas, unrestricted humanitarian access), 9 October 2025 and January 2026 (mfa.bg news 46789; they
#   welcome the ceasefire agreement and the second phase of the plan) and the Ministry's reply to BNT of 24 July 2025, all
#   ministry texts without a named speaker (docs/10 B-298 (1) for Austria); the Foreign Minister's remarks of 11 August 2025 (press,
#   BTA); the Prime Minister's words of 10 October 2025 welcoming the ceasefire (press); the Prime Minister's meeting with
#   President Abbas's envoy of 16 July 2026 (press; support for efforts to end hostilities, no call); the joint
#   statement of the President of Bulgaria and the Prime Minister of Japan of 20 May 2025, as reported by Anadolu (support for the
#   implementation of the ceasefire).
