    queries:
      - Itamaraty notes CDX filters (israel)
  B1:
    status: has-events
    note: >-
      Generated from unga_votes.csv (seven votes to December 2024, docs/10 B-186): yes on ES-10/21
      to ES-10/26 and 79/232. Brazil's own record agrees where read: the President refers to the
      Security Council draft Brazil proposed in October 2023 and to the truce resolution
      (evt_2023_11_21_BRA_B9), and the Ministry published notes welcoming the adoption of
      ES-10/21 (27 October 2023), ES-10/23 (10 May 2024) and ES-10/24 (September 2024) (titles
      read in the Wayback index; their texts could not be fetched once Wayback went offline). No
      Brazilian document read contradicts the rows. The five later votes have no rows (B-199 (1));
      no Brazilian document naming Brazil's vote on ES-10/27, A/DEC/80/506, 80/1, 80/78 or 80/116
      was read.
  B2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Applicable: Brazil was an elected member of the Security Council in 2022–2023. An elected
      member cannot cast a veto; no row in unsc_vetoes.csv. Brazil's own draft S/2023/773 on
      humanitarian pauses was vetoed by the United States on 18 October 2023 (a US event).
  B3:
    status: has-events
    note: >-
      One event (evt_2025_09_17_BRA_B3): declaration of intervention under Article 63 filed on 17
      September 2025 (ICJ press release 2025/41). The declaration's text could not be read (ICJ bot
      check, no readable capture); B3 rests on Brazil's own statements of purpose (the Minister's
      statement of 28 July 2025, the President's support for the case of 15 February 2024), docs/10
      B-355 (2). The Ministry's notes of 26 January and 24 May 2024 on the provisional-measures
      orders were read by title only.
  B4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement rejecting the ICJ's provisional measures or their binding character was found;
      the President and the Minister support the case (B3).
    queries:
      - Itamaraty notes CDX filters (cij, corte-internacional)
  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Brazil is a party to the Rome Statute. No statement by the President or the Minister on
      executing the arrest warrants of 21 November 2024 was found in the sources searched (the
      Ministry's notes list no note on the warrants; the President's General Debate statement of 22
      September 2026 says that persecuting the International Criminal Court and its members encourages
      impunity for the crimes, a statement against the sanctions on the Court, not on the warrants,
      and could not be archived).
    queries:
      - Itamaraty notes CDX filter (penal-internacional)
      - Planalto speeches of November 2024 to September 2026
  B6:
    status: none-found
    checked_at: 2026-09-29
    note: No refusal to execute the warrants and no visit by a person under warrant was found.
    queries:
