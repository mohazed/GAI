# Coverage record for the Federative Republic of Brazil (docs/03 §6). P-D research session, wave 6, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-351): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Japan, Korea, China and Russia, B-331, B-336, B-341, B-346).
# www.gov.br (the Ministry of Foreign Affairs, Itamaraty, and the Presidency, Planalto) answers
# scripted requests with HTTP 429 and a CAPTCHA page (not bypassed); in the built-in browser its
# search runs in a script that returned nothing, and the Presidency's speech listings require a
# login. The Wayback Machine's CDX index of the two sites served as the search facility, read only:
# - Itamaraty press notes (canais_atendimento/imprensa/notas-a-imprensa): 4,254 URL keys, filtered
#   for gaza, palestin, israel, unrwa, oriente-medio, penal-internacional, corte-internacional, cij,
#   genocid, flotilha, embaixador, assentament, cisjord, netanyahu, haia, consulta, convoc (205
#   notes from 2023 to 2026 read by title, about 30 in full).
# - Itamaraty speeches, articles and interviews of the Minister (centrais-de-conteudo/.../ministro-
#   das-relacoes-exteriores): 329 captures, every Middle East, Gaza, Palestine, UN or Security
#   Council item of the window read (7 in full).
# - Planalto speeches (acompanhe-o-planalto/discursos-e-pronunciamentos): 647 URL keys, every
#   international speech, summit address and press statement of 2023 to 2026 read for Gaza
#   passages (about 35 in full); no capture after July 2026.
# - gadebate.un.org: the President's General Debate statement of 22 September 2026 (read in the
#   built-in browser; not archivable, see B9).
# - icj-cij.org case 192 (interventions) and the ICJ press release on Brazil's declaration.
# - UNRWA's donor tables for 2022 and 2024 (records copied from data/wave-5, B-330).
# Not searched: the press and NGO reports (no leads were read); the National Congress (Chamber and
# Senate); the Ministry of Defence and the armed forces (A2, A4, A5); the Ministry of Development,
# Industry and Trade and its export-control authority (A6, C1–C6); the Ministry of Health (D4);
# the Ministry of Justice and the Diário Oficial da União (D5, E2); the Federal Police, the Federal
# Public Prosecutor's Office and the courts (E1–E3); the Portuguese texts of the Ministry's notes
# on the UN votes (Wayback went offline during the session).
country: BRA
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build.
  A2:
    status: has-events
    note: >-
      Generated from Comtrade, Brazil's own reports: HS 93 exports to Israel of USD 3,525,109 (2022),
      4,468,787 (2023), 1,763,215 (2024) and 777,517 (2025), so −8 for the windows of 2022 to 2024
      and −3 from 20 January 2026; no HS 8710 row. HS 8526 (own USD 3,494 to 4,798 a year) and
      HS 8802 (own USD 105,735 in 2023; Israel's mirror USD 1.46 million in 2023) are not counted:
      no licence register, parliamentary answer or investigation confirming a military flow was
      found, and no row was added to a2_confirmed_military.csv. Israel's mirror records far lower
      HS 93 imports from Brazil (USD 248,000 in 2022, 951,000 in 2023, 27,000 in 2024). No Brazilian
      document on arms exports to Israel was found in the sources searched; the Ministry of Defence
      and the export-control authority were not searched (P-16).
    queries:
      - Itamaraty notes and Planalto speeches CDX filters (armas, israel)
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Brazil is not a partner, supplier or customer of the F-35 programme; no document naming
      Brazilian companies as suppliers of F-35 parts or maintenance was found in the sources
      searched.
    queries:
      - Itamaraty notes CDX filter (israel)
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no SIPRI release can be archived yet (docs/10 B-187,
      B-199, B-902); left to the build. Purchases of Israeli systems by the armed forces were not
      searched (the Ministry of Defence, P-16).
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No exercise, transit, basing agreement or intelligence-sharing arrangement with Israel
      activated for the Gaza campaign was found in the Ministry's notes or the President's
      speeches. The Ministry of Defence was not searched (P-16).
    queries:
      - Itamaraty notes CDX filters (israel, embaixador)
  A6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
