      read, not archived) is reported in indirect speech and quotes only the word "genocidal" for the situation in Gaza: not filed; the statement''s own text is left for P-23. (5) Foreign Minister
      Njie''s statement of 12 January 2026 (extraordinary OIC session on Somalia) speaks of Israel''s "ongoing occupation of Palestinian and Arab territories" with no Gaza; the Ministry''s statement
      of 10 September 2025 on the strike on Doha has no named speaker.'
