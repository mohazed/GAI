      (R7); 939 days, expired. (2) His 79th General Debate statement (State House''s page of 30 September 2024, src_20240930_op-gm_barrow-ag79, lines 40 to 44; about 770 days, expired) lists the
      "blockade of Gaza" among causes of tension and asks the UN and the OIC "to join forces and urgently bring about permanent peace in Palestine": no call for a ceasefire or an end of the blockade,
