      files er_en.pdf, read live on 2026-11-04) name neither Gaza nor Palestine. His 79th statement (30 September 2024; 765 days old, expired) speaks of 'the perilous war unleashed to stifle the
      Palestinian cause and evict them from their land' with no call and without naming Gaza (R7). His statement to the Non-Aligned Movement ministerial meeting of 23 September 2024 (shabait.com;
      772 days old, expired) names 'the Gaza Strip' and 'the ongoing war in Gaza' and the Palestinian right to self-determination, with no call for a ceasefire. (2) The Ministry of Information's
      press statement of 19 January 2025 (src_20250119_shabait_press-statement-gaza-ceasefire, archived) says 'The Gaza Ceasefire Agreement is scheduled for implementation today' and reaffirms
      'historical solidarity' with the Palestinian people; it names no speaker and calls for nothing (R3, R4). (3) The Ministry's report of 28 November 2024 on the Foreign Minister's virtual address
      to the Group of Friends in Defense of the UN Charter on Palestine (25 November 2024) is in the third person and does not name Gaza (R4). (4) The President, Isaias Afwerki (head of state
      and of government), in the interviews of 4 and 11 December 2024, 23 and 30 July 2025 and 17 January 2026, mentions Israel or Gaza only in an interviewer's question (4 December 2024), in
      a passage on the foreign backers Ethiopia's Government claims (30 July 2025) and in a list of 'developments' in the neighbourhood (17 January 2026); no call, no violation. (5) The Permanent
      Representative's statements (14 May 2024, 16 October 2025) are not B9 (R3).
