  B9:
    status: has-events
    note: 'Ten events, six of them joint statements: the President at the 79th General Debate, 24 September 2024 (evt_2024_09_24_EST_B9, +2, the Assembly''s verbatim record A/79/PV.8; expired,
      749 days); the declaration of 26 EU foreign ministers, 19 February 2024 (evt_2024_02_19_EST_B9, +2, expired); the joint donor statement, 19 May 2025 (evt_2025_05_19_EST_B9, +2); the Foreign
      Minister''s words of 10 June 2025 (evt_2025_06_10_EST_B9, +5, Gaza and West Bank); the joint statements of 21 July, 12 August and 21 August 2025 (+5 each; the last west-bank, unscored) and
      of 8 June 2026 (+2); the President beside the President of Israel, 6 August 2025 (evt_2025_08_06_EST_B9, +5, flagged); the President at the 80th, 24 September 2025 (evt_2025_09_24_EST_B9,
      +5). Read and not filed: (1) the President in Amman, 4 November 2024 (''Every effort is essential to bring an end to hostilities and achieve a ceasefire'', the Office''s release, archived):
      it speaks of ''the conflict in the Middle East'' and does not cite Gaza (R7); (2) the President''s 81st statement, 23 September 2026 (president.ee, read live; ''check against delivery''):
      ''the situation in the West Bank and Gaza remains of great concern'' and Estonia ''has consistently called for ... unhindered access to humanitarian aid'' is a statement of past position
      with no call and no violation named; (3) the Foreign Minister''s remarks of 7 October 2024 (archived: the humanitarian situation in Gaza ''unacceptable'', solidarity with Israel ''while
      strictly following the norms of international humanitarian law''), 3 November 2023, 11 November 2025 and 17 March 2026 (archived or read): no call and no violation, or Iran, not Gaza; (4)
      the Ministry''s reports in indirect speech of 11 September 2025, 23 September 2025 and 16 May 2026 (leads 1 and 3, R4); (5) the Undersecretary for Global Affairs (30 July 2025: ''violence
      and aggression must stop immediately''): not a B9 speaker (R3). No statement of the Prime Minister (Kaja Kallas to 23 July 2024, Kristen Michal after) on Gaza was found except Kallas''s
      of 3 November 2023 (conditional support, expired). The joint statements of 9, 10 and 12 August 2025 (the latter filed), 27 September 2025, 28 January 2026, 1 and 24 February 2026 do not
      name Estonia (archive/text searched).'
