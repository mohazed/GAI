      own sites (ZUS, PFR) and the National Bank of Poland were not searched.
    queries:
      - gov.pl search (Izrael, Israel, Zachodni Brzeg with fund and investment terms)
  C6:
    status: none-found
    checked_at: 2026-09-29
    note: No exclusion of implicated companies from public procurement found; the Public Procurement Office was not searched separately.
    queries:
      - gov.pl search (Izrael, Elbit, Rafael)
  D1:
    status: has-events
    note: >-
      Generated from FTS: +1 to +3 by window (today +3: USD 5,381,741 in 2025-09…2026-08, 0.00058 %
      of GNI USD 929.8 billion). The Minister states PLN 70 million of aid to Palestinians in
      2023–2025 and USD 20 million in 2023–2025, about USD 11 million through UN agencies (releases of
      20 February and 23 July 2026, not archived); the difference includes development projects in
      the West Bank, in-kind aid and funding outside the flash appeals (docs/06 §7 gap).
  D2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Poland did not suspend UNRWA funding: the Ministry states that Polish support for UNRWA was not
      halted in early 2024 (src_20251121_gov-pl_zaangazowanie-palestyna, line 25); it contributed USD 1
      million in April 2024.
    queries:
      - gov.pl search (UNRWA, UNRWA wpłata)
  D3:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      One event (evt_2024_12_31_POL_D3), increased tier: UNRWA's tables give USD 205,956 for 2022 and
      USD 2,025,766 for 2024; Poland never suspended.
    queries:
      - gov.pl search (UNRWA)
  D4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No Polish medical-evacuation programme or field hospital found. The Ministry reports two
      shipments of medical aid to Egyptian hospitals treating patients from Gaza, Polish experts
      seconded to the WHO's medical-evacuation mission in Egypt, a planned in-kind supply to Jordan's
      field hospitals in Gaza, and a training project for Palestinian medics in the West Bank; the
      joint statement of 22 September 2025 states readiness to support treatment in the West Bank.
      None is a Polish evacuation programme or field-hospital deployment.
    queries:
      - gov.pl search (ewakuacja medyczna, dzieci z Gazy, leczenie pacjentów Gaza, ewakuacja Strefa Gazy)
  D5:
    status: none-found
    checked_at: 2026-09-29
    note: No visa or refugee pathway for Gazans found; the evacuations of 2023 concerned Polish citizens.
    queries:
      - gov.pl search (wizy Gaza, ewakuacja Strefa Gazy)
  E1:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Experimental, unscored. No investigation of Polish nationals or companies for conduct in Gaza
      found. The Regional Prosecutor's Office in Przemyśl has investigated since 2 April 2024 the
      killing of a Polish citizen, a World Central Kitchen volunteer, in an Israeli strike in Gaza
      (murder with explosives, Criminal Code art. 148 § 2 pt 4; extended to 2 October 2026); it
      concerns a Polish victim, not Polish suspects, so it is not filed as E1 (docs/10 B-322).
    queries:
      - gov.pl search (Soból, World Central Kitchen, Gaza terms; prosecution offices publish on GOV.PL)
  E2:
    status: unchecked
    note: >-
      Experimental, unscored. The police and municipal decisions on assemblies were not searched; the
