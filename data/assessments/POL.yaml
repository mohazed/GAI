    queries:
      - gov.pl search (umowa Izrael, porozumienie Izrael, memorandum Izrael, umowa o współpracy Izrael)
      - gov.pl search, units rolnictwo, piorin, edukacja, nauka, rozwoj-technologia (Izrael)
  C3:
    status: has-events
