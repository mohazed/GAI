  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade (own report). France 2025 HS 93 exports to Israel USD 64,176 (release
      of 2026-07-16; no HS 8710 row) → 0; 2023 USD 5,879 and 2024 USD 73,615, also 0. Not counted
      because no document citing the customs code confirms a military flow (docs/02 §2): HS 8802
      USD 43,141,895 in 2025 (own report; USD 39,397,195 in 2024) and HS 8526 USD 2,919,237 in 2025.
      Counted, HS 8802 would move A2 to −15; this is the largest effect of the 8526/8802 rule on a
      wave-1 country. The government's own record is not comparable: it states that France delivers
      no weapons to Israel and licenses only components for defensive systems or re-export (Minister
      of the Armed Forces, answer of 27 November 2025 to Senate written question 04403, read, not
      archived), and the annual report to Parliament on arms exports gives deliveries by military
      list category (the 2026 report of 12 August 2026 could not be archived: Save Page Now refused a
      second capture within 24 hours and the earlier capture was not yet indexed). Press reports put
      deliveries to Israel at EUR 30.1 million in 2023 and EUR 16.1 million in 2024 (lead
      lead_20260928_FRA_4); a disagreement with the HS 93 value, reported, not corrected.
    queries:
      - rapport au Parlement exportations d'armement 2025 Israël livraisons montant France
      - Sénat question écrite transfert et exportation d'armes vers Israël réponse ministère des Armées
      - Eurolinks maillons munitions Israël réexportation ministère des Armées
