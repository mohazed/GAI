# Coverage record for Jordan (docs/03 §6). P-D research session, wave 8, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-397): a first session of 2026-09-29 stopped at the usage limit after
# archiving three items of the Jordan News Agency; this session re-checked them (hashes and texts
# equal) and finished the protocol the same day, with a web search.
# Sources read, read only:
# - Jordan News Agency (Petra, petra.gov.jo, English service): the government's news agency, which
#   publishes the Foreign Minister's statements and the texts of his speeches. Its site of 2026
#   serves items from about February 2026 only; the former addresses
#   (/Include/InnerPage.jsp?ID=…&lang=en&name=en_news) redirect to a "not available" page, so older
#   items were found by web search restricted to petra.gov.jo and read and recorded from their
#   existing Wayback captures (pnpm archive --capture); items without a capture could not be read.
#   The new site's search form did not answer a scripted query (it returns the latest items).
# - Ministry of Foreign Affairs and Expatriates (mfa.gov.jo): Arabic only; its news items are
#   numbered pages (/news/NNNNNN) behind an ASP.NET listing with post-back paging and search, which
#   were not harvested; its Gaza page (mfa.gov.jo/Gaza/index.html) is the site of the "Call for
#   Action: Urgent Humanitarian Response for Gaza" conference of 11 June 2024.
# - Royal Hashemite Court (rhc.jo): the news listing answers scripted requests with "Request
#   Rejected" (a web application firewall); not read.
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, gni.csv, unga_votes.csv, the UN
#   press releases archived in votes.yaml, the joint statements of foreign ministers archived for
#   Saudi Arabia and the United Arab Emirates, UNifeed's WHO story of 4 March 2025.
# - Web search (English): Safadi and the ICC warrants; the medical evacuations; the field
#   hospitals; the water-for-energy deal and the water agreement; the ambassador; the April 2024
#   interceptions; settler sanctions and settlement goods; protests and arrests.
# Not searched or not readable: Arabic-language pages (Petra's Arabic service, the Ministry's news,
#   the Prime Ministry), the Royal Hashemite Court, the Official Gazette, the House of
#   Representatives, the Jordan Armed Forces' site, the Ministries of Defence, Industry and Trade
#   and Water, the Social Security Investment Fund (C5), the Public Prosecution and courts (E1,
#   E3).
country: JOR
