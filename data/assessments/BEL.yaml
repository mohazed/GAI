    queries:
      - FPS Foreign Affairs news search "mandat d'arrêt", aanhoudingsbevel, "arrest warrant", CPI, "Cour pénale"
      - lahbib.belgium.be and prevot.belgium.be CDX listings (cpi, icc, netanyahu)
  B6:
    status: none-found
    checked_at: 2026-09-28
    note: No refusal to execute the warrants and no official visit by a person under ICC warrant found.
  B7:
    status: none-found
    checked_at: 2026-09-28
    note: No sanctions on ICC officials; Belgium states support for the Court's independence (FPS Foreign Affairs releases of 1 July 2024 and 13 October 2024).
