# Coverage record for Belgium (docs/03 §6). P-D research session, wave 3, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-271): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Italy, the Netherlands, Canada and Australia, B-251, B-256,
# B-261, B-266). The protocol's searches (docs/06 §4 step 3) were run as (1) queries of the live
# search facility of the FPS Foreign Affairs news pages (diplomatie.belgium.be/fr/actualites,
# /nl/nieuws, /en/news, parameter search_term, all result pages) in French, Dutch and English:
# Gaza, Palestine / Palestina, Israël / Israel, UNRWA, Cisjordanie, cessez-le-feu, Netanyahu,
# "Cour pénale", CPI, "Cour internationale", génocide / genocide, "mandat d'arrêt" /
# aanhoudingsbevel / "arrest warrant", association / associatieakkoord, colonies, importation,
# Ben-Gvir, persona; (2) keyword filters of the Wayback CDX listings (URLs captured since
# 2023-10-07) of the Prime Minister (premier.be/fr, 283 URLs), the Ministers of Foreign Affairs'
# own sites (lahbib.belgium.be, 481 URLs; prevot.belgium.be, 805 URLs), the Walloon
# Minister-President (dirupo.wallonie.be) and wallonie.be (the listing of gouvernement.wallonie.be
# failed: the Wayback CDX service answered "temporarily offline"), with the
# keywords gaza, palest, isra, unrwa, cpi/icc, cij/icj, netanyahu, cessez, moyen-orient /
# midden-oosten, smotrich, ben-gvir, colon / kolonist / settler, sanction, genoc, associ, armes /
# wapen, licence, poudre, survol, embargo; (3) reads of about 60 matching pages. premier.be,
# lahbib.belgium.be, prevot.belgium.be and dirupo.wallonie.be refuse scripted requests or Save
# Page Now, so their pages were read and archived from existing Wayback captures (B-188). The
# Chamber of Representatives' records (written questions, plenary and committee reports), the
# Belgian Official Gazette (Moniteur belge), the Flemish Government's sites and the federal
# prosecutor were not searched (no search facility usable without web search); German, the third
# official language, was not searched. Each `queries` entry names the listing or query used.
country: BEL
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build.
      The regions' 2009 position refuses any arms export licence that would strengthen the military
      capacity of the forces present, and Wallonia suspended its valid licences on 7 February 2024
      (evt_2024_02_07_BEL_A6).
  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade (Belgium's rows existed from P-14, so `pnpm fetch:comtrade` was not
      run). Own reports of HS 93 exports to Israel: none reported for 2022–2024 and USD 3 for 2025
      (0 points from 2026-06-03); the 2023 and 2024 values come from Israel's mirror imports (USD
      1,000 and 10,000, 0 points). HS 8526 (own USD 152,504–242,070 a year; mirror USD 0.24–5.0
      million) and 8802 (own USD 2,890–353,711) are not counted without a confirming document
      (docs/02 §2); no licence register, parliamentary answer or investigation confirming a military
      nature was found, so no row was added to a2_confirmed_military.csv. No disagreement with the
      country's record: the regions' licence policy (evt_2024_02_07_BEL_A6) is consistent with
      near-zero HS 93 exports. The Walloon Government's annual reports to Parliament on arms
      licences (listed in Wayback for 2020–2022) were not read for 2023–2025.
    queries:
      - dirupo.wallonie.be CDX listing (Rapport armes 2020, 2021, 2022)
  A3:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No official programme document, national ministry statement or UN Special Rapporteur report
      naming Belgian companies as Tier-1 or Tier-2 suppliers of F-35 parts or maintenance was
      found. Belgium is an F-35 customer; A/HRC/59/23 (archived) does not name Belgium. The Ministry
      of Defence's industrial-participation pages were not searched.
    queries:
      - A/HRC/59/23 archived text searched for Belgium, Belgian, Belgique
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no release archived yet (docs/10 B-187). Left to the
      build. The federal government decided on 2 September 2025 that future defence purchases of
      equipment, spare parts and maintenance should no longer be made from companies located in
      Israel where equivalent alternatives exist, for as long as the conflict continues
      (src_20250902_diplomatie-belgium_kern-palestine, measure 11).
  A5:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No named exercise, transit authorisation, basing agreement or intelligence sharing with
      Israel related to the Gaza campaign found. The air-drop operations over Gaza (Cerulean Skies,
      2024 and 2025) and the evacuation of Belgians from Tel Aviv are not cooperation with Israel's
      campaign. Press reports on port or airport transit of military goods to Israel were not
      searched (no web search).
    queries:
      - FPS Foreign Affairs news search Israël / Israel / Gaza (all pages)
      - prevot.belgium.be and lahbib.belgium.be CDX listings (survol, armes, isra)
  A6:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2024_02_07_BEL_A6: Wallonia suspended its valid military export licences to Israel and,
      with the Brussels-Capital Region, extended the 2009 interregional refusal to dual-use and
      transit licences (7 February 2024); licensing is regional in Belgium. The 2009 position
      predates the window. The federal decision of 2 September 2025 supports extending the ban to all
      transit, dual-use goods with a military end user and all military goods for use by Israel and
      asks the regions for a joint decision (measure 5); no regional instrument implementing it and
      no Flemish decision was found (the Flemish Government's sites were not searched).
    queries:
      - dirupo.wallonie.be CDX listing (israel, armes, licence)
      - wallonie.be CDX listing (isra, gaza, palest, armes, licence, poudre); gouvernement.wallonie.be listing failed (Wayback CDX offline)
  A7:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No law or decree covering both arms exports to and imports from Israel. The 2 September 2025
      decision limits future defence purchases from Israeli companies where alternatives exist
      (measure 11) and asks the regions to widen the export ban (measure 5); neither is a two-way
      embargo in law.
  A8:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No documented instance of transit denied. The government instructed the Minister of Foreign
      Affairs on 2 September 2025 to refuse Israeli requests for military overflights of Belgian
      airspace while the war continues (src_20250902_diplomatie-belgium_kern-palestine, measure 10),
      and Wallonia and Brussels refuse transit licences that would strengthen the forces present
      (evt_2024_02_07_BEL_A6); these are policies, not instances (as Spain's transit measures,
      data/wave-1). A documented refusal of a given flight or shipment was not found.
  B1:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated. Rows for the seven votes to December 2024 (docs/10 B-186): yes on ES-10/21,
      ES-10/22, ES-10/23, ES-10/24, ES-10/25, ES-10/26 and 79/232. The archived UN press releases
      never list Belgium among the states voting against or abstaining; GA/12626 reports Belgium's
      delegate supporting ES-10/24 as in keeping with the ICJ advisory opinion, and the FPS Foreign
      Affairs release of 11 December 2024 states that Belgium voted for the two resolutions of that
      day (ES-10/25, ES-10/26). No disagreement. The later qualifying votes have no rows (B-199 (1));
      their press releases (GA/12690, GA/12707, GA/12708, GA/12739, GA/12743) do not list Belgium
      against.
  B2:
    status: not-applicable
    note: Not a Security Council member in the window (countries.yaml memberships.unsc is empty).
  B3:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2025_12_23_BEL_B3: declaration of intervention under Article 63 in case 192, dated 18
      December 2025 and listed by the Court on 23 December 2025; its construction of genocidal intent
      supports the applicant's reading (read from the archived scan, which has no text layer).
    queries:
      - ICJ case 192 page (archived src_20260927_icj-cij_case-192) and intervention page (live)
      - UNISPAL copy of 192-20251223-int-01-00-fr.pdf
  B4:
    status: none-found
    checked_at: 2026-09-28
