  B5:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No official statement by the Prime Minister or the Ministers of Foreign Affairs or Justice on
      executing the ICC warrants of 21 November 2024 was found in the FPS Foreign Affairs news, the
      Ministers' own sites or the Prime Minister's site. docs/06 §8 lists Belgium among the states
      that stated execution; the statement may be in the Chamber's records or in press interviews,
      which this session could not search. The government's decision of 2 September 2025 calls for
      prosecution of serious violations and Belgium states repeated support for the ICC
      (FPS Foreign Affairs statement of 13 October 2024, read, not archived), which is not a
