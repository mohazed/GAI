  B9:
    status: none-found
    note: 'No event filed. (1) The President, Brice Clotaire Oligui Nguema, is head of state and head of government (the Presidency''s titles: ''Chef de l’État, Chef du Gouvernement'') and a B9
      speaker under R3. His 80th General Debate speech (25 September 2025, src_20250925_presidence-ga_oligui-ag80, archived) states the recognition of 12 December 1988 and support for the two-State
      solution ''entre Israéliens et Palestiniens'' and never names Gaza or a ceasefire (R7). His 79th speech (Presidency''s page of 23 September 2024, src_20240923_presidence-ga_oligui-ag79,
      archived; the UN''s page gives 26 September 2024; 769 days old, expired) says ''je voudrais nous inviter à ne pas détourner les yeux de Gaza. Il est plus que jamais temps que s’installe
      une paix définitive en vue de la coexistence harmonieuse des États palestiniens et israéliens'': Gaza is named but there is no call for a ceasefire or an end of the blockade and no violation
      (neither tier; read as Samoa''s and Botswana''s passages were, flagged). (2) The 81st statement (26 September 2026) was delivered by the Foreign Minister, Marie-Edith Tassyla-Ye-Doumbeneny;
      the French file (gastatements/81/ga_fr.pdf, read live) names none of Gaza, Palestine or Israel. (3) The Deputy Permanent Representative''s statement at the Security Council briefing of 19
      December 2023 (''Ce bain de sang doit cesser'', src_20231219_diplomatie-ga_cs-bain-de-sang, archived) is not a B9 speaker''s (R3) and is expired (1,051 days). (4) The Gabonese Press Agency''s
      item of 14 June 2025 and the Ministry''s note on the vote of 12 June 2025 report a vote for ''un cessez-le-feu immédiat, inconditionnel et permanent'' (B1, generated), not a speaker''s statement.'
