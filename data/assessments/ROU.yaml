      (solidarity with Israel and condemnation of Hamas), Government Decision no. 1155 of 23 November 2023 (emergency aid for persons evacuated from the Gaza Strip), Government Decisions no. 65 of 31 January
      2024 and no. 795 of 11 July 2024 (humanitarian aid from the state reserves for the civilian population of Gaza), Parliament Decision no. 8 of 22 April 2024 (three Romanian officers in the United States-led
      maritime operation Prosperity Guardian in the Red Sea), Law no. 86 of 9 April 2024 (a day of solidarity and friendship between Romania and Israel on 14 May) and the National Strategy of 23 May 2024
      against antisemitism. None suspends or refuses licences. The service''s coverage of the Israel text is partial, the decisions of the national export-control authority (ANCEX) and the customs authority
      are not published as acts, and their sites answer a verification check (not bypassed); the Foreign Ministry (mae.ro) and the Government''s meeting communiqués of 2023 to 2025 (gov.ro refuses connections)
      were not read; no web search in that earlier session (re-run with web search below). Re-run with web search (T-F-L02, third session, 2026-11-09): Romania did not suspend licences:
