# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the Ministry of Foreign Affairs (mae.ro and its New York mission mpnewyork.mae.ro answer every scripted request with a
#   JavaScript bot check and their Wayback captures are bot-check pages: the Ministry's releases are known through the Romanian outlets that quote them
#   and through search-engine excerpts of its pages), the Government (gov.ro), the Presidency (presidency.ro: same bot check), the Ministry of Health (ms.ro),
#   the General Inspectorate for Emergency Situations (igsu.ro), the General Debate statements of the United Nations (gadebate.un.org: the 78th and 79th
#   sessions through Wayback captures; the 80th and 81st through a direct request), the joint statements already archived for the 45 (docs/10 B-444: two
#   name Romania), the EU Council's settler listings (R8, docs/10 B-446), UNRWA's donor tables, the generated events and the structured tables; web searches
#   in English and in Romanian per indicator group. Time: about 25 minutes (the first country of the session, with the archiving of ten pages).
# Statements read and not filed as B9: the Foreign Minister's General Debate statement of 27 September 2025 (an immediate ceasefire in Gaza: in the UN's file,
#   which Save Page Now cannot capture and Wayback does not hold: lead_20261005_ROU_1); the President's of 81st session (23 September 2026: 'advance the
#   implementation of the Peace Plan for Gaza ... and to address the humanitarian situation on the ground without delay': no call for a ceasefire or an end of
#   the blockade); the Prime Minister's visit to Israel of 2024 (support for the efforts towards a ceasefire agreement, a post relayed by
#   news.ro, decayed to zero; news.ro dates it 5 September 2024, HotNews 5 November 2024); the Prime Minister's words after it (conditional support for Israel's right to self-defence).
# Completion of 2026-11 (T-F-L02, 2026-11-09, first session, no web search available): A3 from the UN Special Rapporteur's report and the programme's page; A5 from the Ministry of National Defence's press releases of mid-2023 to November 2026 (mapn.ro, read, not archivable); A6 to A8 and C4 to C6 from the Official Gazette's legislative portal (acts naming Gaza, Palestine, Hamas, the West Bank or Israel since 7 October 2023); D5 note extended (Government Decision no. 1155 of 2023); lead_20261005_ROU_4 now has an official copy that cannot be archived; the Foreign Ministry, the Presidency, ANCEX and the Public Prosecutor's Office answer a verification check; E1 to E3 still unchecked.
# Completion of 2026-11 (T-F-L02, third session, with web search, 2026-11-09): A3, A5 to A8, C4 to C6 re-run with web search (nothing changes); E1 to E3 none-found; ANCEX figures (lead_20261109_ROU_5) and Hind Rajab Foundation complaints (lead_20261109_ROU_6) recorded as leads.
