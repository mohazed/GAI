      503 to scripts and Save Page Now, no capture, not read by this session), is reported by Snoop and HotNews on 26 March 2026 to show 33 definitive export licences for Israel in 2025 (the most for any
      destination, over EUR 307 million), 26 in 2024 (EUR 102 million) and 16 in 2023 (EUR 67.5 million), and exports actually made to Israel of EUR 78.3 million in 2025 (25 per cent of the total, the largest
      destination), EUR 75.8 million in 2024 and EUR 59 million in 2023. Press figures only; the report is recorded as lead_20261109_ROU_5 (not scored: A1 and A2 are generated from SIPRI and Comtrade). The
      none-found stands: no suspension.'
