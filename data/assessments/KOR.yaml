      Israel and said, per the Senior Presidential Spokesperson's written briefing: "최소한의
      국제규범이라고 하는 게 있는데 다 어기고 있다. 원칙대로 해달라. 너무 많이 인내했다" ("There
      is such a thing as minimum international norms, and they are all being violated. Please act
      according to principle. We have been too patient.", translation;
      src_20260520_president-kr_cabinet-meeting-briefing, line 10). The next day the Ministry's
      Spokesperson said the remark "지적한 것" (pointed out) "국제사회에서 공개적으로 논의된 바 있는
      쟁점 하나" (one issue publicly discussed in the international community) (briefing of 21 May
      2026, not archived). The words state no position on executing the warrants, so no B5 event is filed;
