      carry HS 93 exports to Israel of USD 7,349,644 (2023), 1,039,556 (2024) and 1,494,635 (2025),
      and HS 8710 of USD 12,875 (2022), 832,173 (2023), 100,671 (2024) and 156 (2025): −8 (USD 1
      million to 10 million) from the 2023 release (11 January 2025) to today. For 2022 Korea's own
      report has no HS 93 row and the generated event is 0 (HS 8710 only), while Israel's mirror
      records HS 93 imports from Korea of USD 4,072,000: reported to the author as a question on the
      generator's per-heading fallback (docs/10 B-338 (4)); the 2022 event ended on 2025-01-11 and
      does not count today. HS 8526 (own USD 196,385 to 1,498,358 a year; mirror 383,000 to 886,000)
      and HS 8802 (own USD 1,550,000 in 2022; mirror 1,902,000) are not counted: no licence register,
      parliamentary answer or investigation confirming a military nature was found, and no row was
