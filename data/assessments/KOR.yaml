# Coverage record for the Republic of Korea (docs/03 §6). P-D research session, wave 6, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-336): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Japan, B-331). The registry's two gov_sources were used, read by
# script (www.mofa.go.kr answers after a cookie redirect; www.president.go.kr through its own list
# API), read only:
# - MOFA English site: every title of the Press Releases board (m_5676, 1,120 items from October
#   2023 to September 2026), the Press Briefings board (m_5679, 160 opening statements, read in
#   full and searched for Gaza, Palestin*, Israel, ICC, Criminal Court, warrant, Netanyahu, UNRWA,
#   settler, Court of Justice, recogni*), the Ministry News board (m_5674, 370 items) and the
#   Minister's speeches board (m_5689, all 80 speeches of the period read in full and searched for
#   Gaza, Palestin*, Israel, UNRWA, Middle East, two-state); about 60 other items read in full (every
#   statement and commentary of the Spokesperson on Gaza, Israel, the West Bank and the region, the
#   Minister's meetings and telephone talks, the humanitarian-aid releases).
# - MOFA Korean site: every title of the press-release board 보도자료 (m_4080, 3,400 items from
#   October 2023) filtered for 가자, 팔레스타인, 이스라엘, UNRWA, 근동, 국제형사재판소, ICC,
#   국제사법재판소, 서안, 정착민, 하마스, 라파, 중동평화, 두 국가, 인질, 휴전, 중동; the board's
#   full-text search for 정착민, 팔레스타인 국가, UNRWA, 근동; the Spokesperson's regular briefings
#   (외교부 브리핑, m_4078, full transcripts with questions and answers) searched in full text for
#   ICC, 국제형사재판소, 체포영장, 네타냐후, UNRWA, 팔레스타인, 가자, 국가 승인, 정착민, 무기 수출,
#   방산, F-35, 국제사법재판소, 제노사이드, 집단살해 (the matching briefings read); the titles of
#   보도참고 및 설명자료 (m_24815).
# - Office of the President (president.go.kr, Lee Jae-myung administration from June 2025): the
#   speeches board (full-text search for 가자, 팔레스타인, 이스라엘, Gaza, Palestin; the General
#   Assembly addresses of 23 September 2025 and 22 September 2026, the Cairo speech and the
#   Korea-Egypt press statement of 20 November 2025 read) and the briefings board (full-text search
#   for 체포영장, 네타냐후, 가자, 팔레스타인, 이스라엘; the matching briefings on the Gaza-bound
#   vessels read).
# Save Page Now answers www.mofa.go.kr irregularly (HTTP 503 and 504; two pages captured anew with
# '&page=1', two recorded from existing captures with --capture, B-188).
# Not searched: the press; the National Assembly (questions, answers, resolutions); the Yoon
# administration's presidential archive (pa.go.kr, to June 2025); the Ministry of National Defense
# and the Defense Acquisition Program Administration (F-35 industrial participation, exercises,
# purchases of Israeli systems, export licences for A2, A6); the Ministry of Trade, Industry and
# Energy (strategic-goods export licences); the National Pension Service and other public funds
# (C5); the police, prosecutors and courts (E1–E3); the statements of Korea's Permanent
# Representative at the Security Council in 2024–2025 (the Mission's site).
