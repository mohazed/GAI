  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv (row from P-14: 2024-06-04, src_20240605_gov-si_palestine-relations).
      Agrees with the Government's account: the Government proposed the recognition on 30 May 2024 and
      the National Assembly adopted it on 4 June 2024 by 52 votes to none
      (src_20250514_gov-si_podporne-aktivnosti-palestini). +8 standing.
  B9:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Eight events (Foreign Minister Fajon: 29 November 2023, 27 May 2024, 20 May 2025, 7 October 2025,
      20 October 2025, 21 April 2026; Prime Minister Golob: 27 September 2024, 4 June 2025); the cap
      holds. Many more ministry releases report the Minister's or the Prime Minister's calls for a
      ceasefire (October 2023 to April 2026) and were not filed separately; statements of state
      secretaries and of the Permanent Representative are not by a B9 speaker; joint statements Slovenia
      signed without a named Slovenian speaker are not filed. No Gaza statement of Prime Minister Janša
      or Foreign Minister Kajzer (from June 2026) calls for a ceasefire or names a violation; the Prime
      Minister's General Assembly address of 24 September 2026 speaks of Palestinian and Israeli civilian
      suffering without a call, and is not B10 either.
    queries:
      - gov.si search (Gaza, Gazi, Gazo, premirje, genocid, Netanjahu, humanitarn)
      - gov.si news listing, May–September 2026 (predsednik vlade, minister Kajzer)
  B10:
    status: none-found
    checked_at: 2026-09-29
    note: >-
