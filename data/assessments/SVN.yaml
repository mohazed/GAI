# Coverage record for Slovenia (docs/03 §6). P-D research session, wave 5, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-303): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for the wave-4 countries). The protocol's searches (docs/06 §4 step 3)
# were run on GOV.SI, the single portal of the Government, the ministries and the Prime Minister's
# Office: (1) the portal's own site search (`gov.si/iskanje/?q=…` and `gov.si/en/search/?q=…`, every
# result page, news, documents and statements) for Gaza, Gazi, Gazo, Gaze, Izrael, Izraela, Izraelu,
# Palestina, UNRWA, Netanjahu, naseljencev, naselbin, embargo, orožja, premirje, genocid,
# kazensko sodišče, Zahodni breg, persona non grata, evakuacija, pridružitveni sporazum, and in
# English Gaza, Israel, Palestine, Netanyahu, persona non grata, arms (about 10,500 distinct results,
# the news items since October 2023 read by title and snippet, the relevant ones in full); (2) the
# portal's news listing by month (`gov.si/novice/?year=…&month=…`) for July–August 2025 and
# May–September 2026 (2,500 items), with every Government session release of May–September 2026
# read for Israel, Palestine, Gaza, UNRWA and Netanyahu. Slovenia changed government in June 2026
# (Robert Golob's government to 2026, then Janez Janša's, with Tanja Fajon as Minister of Foreign and
# European Affairs to June 2026, then Tone Kajzer). Not searched: the press, the National Assembly's
# records and answers to deputies' questions (dz-rs.si), the Official Gazette (uradni-list.si), the
# prosecution service and courts (E1, E3), the police (E2), the Slovenian Sovereign Holding and the
# pension fund KAD (C5). Each `queries` entry names the search terms used on GOV.SI.
country: SVN
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build. The
      Ministry of Defence states that Slovenia issued no licence for the export of weapons, ammunition
      or other military equipment to Israel since the start of the war in Gaza
      (src_20241123_gov-si_popravek-orozje-izrael).
  A2:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Generated from Comtrade. Slovenia had no Comtrade rows, so this session ran `pnpm fetch:comtrade
      --reporters SVN` (9 A2 and 8 C3 rows, sources src_20260928_comtrade_svn-self-* and
      src_20260928_comtrade_mirror-*-svn-svn-1). Slovenia's own reports carry no HS 93 or 8710 exports
      to Israel (HS 8526 only: USD 181,465 in 2022, then 1,030, 569 and 1,864), so the generator uses
      Israel's mirror imports of HS 93 from Slovenia: USD 174,000 (2022), 146,000 (2023), 60,000
      (2024) and 146,000 (2025), giving −3 from 2023-02-23 to 2025-02-21, 0 to 2026-05-14, and −3 from
      2026-05-14. Disagreement reported: the Government states that no export licence for military
      weapons and equipment to Israel was issued from October 2023 (src_20250731_gov-si_seja-345-orozje-izrael,
      src_20241123_gov-si_popravek-orozje-izrael) and prohibited exports from 31 July 2025 to 11 June
      2026; HS 93 also covers sporting and hunting arms and ammunition, which are not military
      equipment under the Defence Act, and mirror data record imports by date of entry. The generated
      value is kept (as Sweden's and Switzerland's, docs/10 B-284, B-294 on data/wave-4). HS 8526 and
      8802 not counted; no document confirming military nature was found, so no row was added to
      a2_confirmed_military.csv.
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: No official document naming Slovenian companies as suppliers of parts or maintenance for the F-35 programme was found.
    queries:
      - gov.si search (F-35, Lockheed)
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no release archived yet (docs/10 B-187). Left to the
      build. The Ministry of Defence states that Slovenia bought no weapons, ammunition or military
      equipment in Israel since the start of the war in Gaza and that its SPIKE anti-tank systems
      bought in 2022 and 2023 came from Eurospike (Germany) through NSPA and a national tender
      (src_20241123_gov-si_popravek-orozje-izrael); A4 will show any order recorded by SIPRI.
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No named exercise, transit authorisation, basing agreement or intelligence sharing related to the
      Gaza campaign found. The Government's decision of 31 July 2025 instructed the Ministry of
      Infrastructure to check the protocol for the transit of military equipment through the port of
      Koper and the railways; no transit instance was found. The talks of June–September 2026 on
      defence and security cooperation with Israel (src_20260924_gov-si_jansa-netanyahu) name no
      exercise or agreement.
    queries:
      - gov.si search (orožja, tranzit, Luka Koper, Izrael, embargo)
  A6:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      One event (evt_2023_10_07_SVN_A6): no export licence for military weapons and equipment to Israel
      issued by the Ministry of Defence from October 2023 on the ground of armed conflict (Defence Act,
      Article 77), as the Government recorded on 31 July 2025, ended on 11 June 2026 when the new
      Government withdrew the prohibition and the Ministry returned to applying the law and Council
      Common Position 2008/944/CFSP case by case; superseded by A7 from 31 July 2025.
    queries:
      - gov.si search (orožja, embargo, dovoljenj, Izrael)
  A7:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      One event (evt_2025_07_31_SVN_A7): the Government's decision of 31 July 2025 prohibiting the export
      and transit of military weapons and equipment to Israel and their import from Israel (import of
      equipment needed for security and resilience excepted), ended by the Government's decision of 11
      June 2026 (src_20260611_gov-si_seja-2-orozje-izrael). A7 is no longer in force.
    queries:
      - gov.si search (embargo, orožja, Izrael, prepoved)
  A8:
    status: none-found
    checked_at: 2026-09-29
    note: No refusal of port or airspace transit for a named arms shipment to Israel found.
    queries:
      - gov.si search (tranzit, Luka Koper, orožja)
  B1:
    status: has-events
    note: >-
      Generated. Rows for the seven votes to December 2024 (docs/10 B-186): yes on all seven
      (ES-10/21 to ES-10/26 and 79/232). No Slovenian document contradicts them: the Prime Minister
      welcomed on 15 December 2023 the support of most EU members for the General Assembly resolution
      demanding an immediate cessation of hostilities, and the Government's statements of 2024 describe
      Slovenia's support for Palestine's membership and for UNRWA; the archived UN press releases name
      no state's vote. Later votes have no rows (docs/10 B-199 (1)).
  B2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Slovenia was an elected member of the Security Council in 2024 and 2025 (applicable). It cast no
      veto (vetoes are cast by permanent members only); it voted for the ceasefire draft vetoed on 20
      February 2024 (its explanation of vote, src_20240220_gov-si_izjava-glasovanje-vs); the other vetoes
      of its term (20 November 2024, 4 June 2025, 18 September 2025) were cast by a permanent member. No unsc_vetoes.csv row concerns it.
    queries:
      - gov.si search (Varnostni svet, veto, resolucij, premirje)
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Slovenia filed no declaration of intervention in case 192 (South Africa v. Israel); it welcomed the
      order of 26 January 2024. Its written and oral statements in the advisory proceedings on the
      Occupied Palestinian Territory (February 2024) and on Israel's obligations towards the UN and
      other organisations (May 2025) are not B3.
    queries:
      - gov.si search (Meddržavno sodišče, ICJ, Južna Afrika, genocid)
  B4:
    status: none-found
    checked_at: 2026-09-29
    note: No statement rejecting the ICJ's provisional measures; the Ministry welcomed the order of 26 January 2024 and the Foreign Minister called on 27 May 2024 for full implementation of the orders.
    queries:
      - gov.si search (Meddržavno sodišče, začasni ukrepi, ICJ)
  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement by the Prime Minister or the ministers of foreign affairs or justice on executing the
      warrants of 21 November 2024 was found on GOV.SI (the Ministry's news of November and December 2024
      was read in full by title). The Government's measure of 25 September 2025 against Prime Minister
      Netanyahu cites the proceedings against him for war crimes and crimes against humanity
      (src_20250925_gov-si_session-170-netanyahu) but states no position on arrest; it is recorded under
      B11. The Government supported the Court against US sanctions (June 2025, March 2026), which is not
      B5. The National Assembly's records were not searched.
    queries:
      - gov.si search (Mednarodno kazensko sodišče, nalog za prijetje, Netanjahu, ICC)
  B6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No stated refusal to execute the warrants and no official visit to Slovenia of a person under
      warrant. Prime Minister Janša met Prime Minister Netanyahu in New York on the margins of the General
      Assembly on 24 September 2026 (src_20260924_gov-si_jansa-netanyahu); a meeting abroad is not hosting
      an official visit (docs/02 §2 B5/B6).
    queries:
      - gov.si search (Netanjahu, Netanyahu, Mednarodno kazensko sodišče)
  B7:
    status: none-found
    checked_at: 2026-09-29
    note: No sanctions on ICC officials; Slovenia is a State Party and protested the US sanctions on ICC judges, among them the Slovenian judge Beti Hohler.
    queries:
