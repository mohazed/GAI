      delegation was abstaining on ES-10/23 (agrees); GA/12626 reports that the United Kingdom's
      representative said her delegation abstained on ES-10/24 (agrees). The UK statement in the
      General Assembly of 11 December 2024 ("We intend to vote in favour of these resolutions backing
      UNRWA and a ceasefire in Gaza", GOV.UK title, not archived) agrees with the yes on ES-10/25 and
      ES-10/26. Of the five later votes (no row until B-199 (1)): GA/12690 reports the UK's
      explanation on ES-10/27 without its vote, and the UK statement of 12 June 2025 on GOV.UK ("The UK
      voted in favour…", GOV.UK title, not archived) states a yes; GA/12739 names the United Kingdom among the
      votes against a decolonization text, not a qualifying vote. The other releases do not list how
