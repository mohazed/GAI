  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade (own report). United Kingdom 2025 HS 93 exports to Israel USD 399,666
      (release of 2026-03-10; no HS 8710 row) → −3; 2023 USD 185,074 and 2024 USD 202,611, also −3.
      HS 8526 (USD 1.29 million in 2025, own report) and 8802 do not count: no licence register,
      parliamentary answer or investigation citing those codes was archived. The government's own
      record is licensing data, not customs values: the Department for Business and Trade publishes
      "Export control licensing management information for Israel" (licence decisions from 7 October
      2023, last updated 20 April 2026; read, not archived); no figure in it is comparable with the HS
      93 value, so no disagreement can be stated. F-35 components exported to the global pool are not
      counted as exports to Israel in either source (A3).
    queries:
      - gov.uk export control licensing management information Israel
      - gov.uk Israel export licences suspension (search API, 2024-08-30 to 2026-09-30)
