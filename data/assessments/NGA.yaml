# Coverage record for Nigeria (docs/03 §6). P-D research session, wave 9, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-422):
# - Ministry of Foreign Affairs (foreignaffairs.gov.ng): a static home page over a WordPress site at
#   /news/. Its REST API was read by script on 2026-09-29: all 702 posts dated 1 October 2023 to 28
#   September 2026 (full texts) and all 72 press releases ("media items", many published as PDFs;
#   the PDFs of those whose titles concern Israel, Gaza or Palestine were downloaded). The listing
#   has gaps: no post for June 2024 or September to December 2024, and no press release between
#   May 2024 and July 2025. Titles and texts were searched for Gaza, Palestine, Israel, UNRWA,
#   ceasefire, Rafah, genocide, Netanyahu, two-state, ICJ, International Criminal Court, Hamas, West
#   Bank, occupied, OIC, Arab, Riyadh, humanitarian, condemn, civilians, Jerusalem. The Wayback
#   Machine's index of the site (October 2023 to September 2026, 6,882 URLs) was searched for the
#   same terms.
# - State House (statehouse.gov.ng): WordPress; its REST API was searched for gaza, palestin, israel,
#   riyadh, saudi, arab-islamic, ceasefire, two-state, middle east, United Nations General, doha,
#   islamic, hamas, humanitarian crisis, cairo (posts from 1 October 2023). It lists only 16 posts
#   from September to December 2024; the Wayback Machine's index of the site for November 2023 to
#   January 2025 (5,304 URLs) has no page on Gaza or the Arab-Islamic summits.
# - UN Official Document System: A/79/PV.8 (24 September 2024), where the Vice-President spoke in
#   the general debate. gadebate.un.org answers with a CAPTCHA (not attempted). UNISPAL: Nigeria's
#   national statement at the two-state conference of 28-30 July 2025, delivered by "the
#   representative of Nigeria" (UN press release PAL/2250, read from its Wayback capture).
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, fts_plan_totals.csv, gni.csv,
#   unga_votes.csv, unsc_vetoes.csv, recognitions.csv, the UN press releases archived in votes.yaml.
# - Web search (English): the Arab-Islamic summits of November 2023, November 2024 and September
#   2025, the Minister's statement on Rafah of May 2024, the OIC Council of Foreign Ministers
#   (June 2025), the ICC warrants, Nigeria's recognition of Palestine, agreements with Israel,
#   humanitarian aid for Gaza.
# Speakers (B9): President Bola Ahmed Tinubu (head of state and of government); Ministers of Foreign
# Affairs Yusuf Maitama Tuggar (to early 2026) and Bianca Odumegwu-Ojukwu (Minister of State until
# spring 2026, Minister by 26 May 2026). Not B9 speakers: the Vice-President, the Ministers of State,
# the Permanent Secretary, the Permanent Representative, the Ministry's spokesperson.
# Statements read and not filed (docs/10 B-423): the Minister's press statement of 7 October 2023
# (a call for "de-escalation and ceasefire" between Israel and Hamas, published as an image-only
# PDF with no text layer, so no archived text can hold its quote, and not citing Gaza); the State
# House item of 10 November 2023 (the President "reiterated Nigeria's call for an immediate
# ceasefire", indirect speech); the Vice-President's general-debate statements of 24 September 2024
# (A/79/PV.8: the situation in Gaza, the two-State solution; no ceasefire call, no violation named)
# and of 2025 (State House, 7 October 2025: violence and aggression against civilians in Gaza, the
# two-state solution; no ceasefire call, no violation named) and 2026 (no passage on Palestine,
# per press reports); the national statement at the two-state conference of July 2025 (the
# Permanent Mission); the Minister of State's statement at the OIC Council of Foreign Ministers,
# Jeddah, 27 August 2026 (reported speech on the Ministry's page: protection of civilians,
# humanitarian access, an enduring cessation of hostilities, opposition to forced displacement);
# the Ministers' audiences with the Palestinian and Israeli ambassadors (31 October 2023, 4 February,
# 26 February, 17 April, 26 May, 3 August 2026).
# Not searched or not readable: the Ministry of Defence and the armed forces (A5, D4), the Federal
# Ministry of Industry, Trade and Investment and the National Bureau of Statistics (C3, C4), the
# Nigeria Sovereign Investment Authority, PenCom and the Central Bank (C5), the Bureau of Public
# Procurement (C6), the Ministry of Justice and courts (E1, E3), the Ministry of Interior and the
# police (D5, E2), the National Assembly; the President's and the Ministry's social media accounts.
country: NGA
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build. No record of
      Nigerian deliveries of arms to Israel was found.
  A2:
    status: no-data
    checked_at: 2026-09-29
    note: >-
      Generated from Comtrade. Nigeria had no Comtrade rows (docs/10 B-194); `pnpm fetch:comtrade
      --reporters NGA` was run on 2026-09-29 and stopped before any trade query: Save Page Now
      refused to capture the Comtrade reporter list, already captured five times that day
      (error:too-many-daily-captures, as docs/10 B-407 (5), B-412 (5) and B-417 (5)). The empty
      index row the failed run appended was removed. No row, so the build shows no-data; the same
      command resumes the fetch on another day. No row added to a2_confirmed_military.csv; no
      licence register, parliamentary answer or investigation on Nigerian exports to Israel under
      HS 8526 or 8802 was found.
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Nigeria is not a partner, supplier or customer of the F-35 programme; no document naming
      Nigerian companies as suppliers of F-35 parts or maintenance was found.
    queries:
      - Nigeria F-35 supplier parts company
      - foreignaffairs.gov.ng posts 2023-10 to 2026-09, term F-35
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no SIPRI release can be archived yet (docs/10 B-187,
      B-199, B-902); left to the build. Nigeria's orders of Israeli equipment in the window, if any,
      will come from the release; none was hand-authored.
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No official record of a named exercise, a transit authorisation, a basing agreement or
      intelligence sharing related to the Gaza campaign was found. The Ministry's releases record
      bilateral talks with Israel on defence, intelligence and border security (the Minister of
      State, 26 February 2026) and the Minister's readiness to expand cooperation in counter-terrorism
      and intelligence sharing (3 August 2026); these concern Nigeria's own insurgency, are not
      activated for the Gaza campaign and are not instances (docs/02 §2 A5).
    queries:
