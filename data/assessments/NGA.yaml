  B8:
    status: unchecked
    note: >-
      Generated from recognitions.csv, which has no Nigerian row (docs/10 B-192). Nigeria recognised
      the State of Palestine on 18 November 1988 (the registry's `recognises_palestine.since`), but
      no official Nigerian document stating the recognition was found: the Ministry's items speak of
      relations with the State of Palestine and support for its independence (4 February and 17
      April 2026), not of the act of recognition, and no letter of Nigeria to the UN of 1988 was
      found in UNISPAL. No row was added, so the build shows no B8 event for Nigeria until one is
      (docs/10 B-424 (3), as for Malaysia, B-414 (2)).
    queries:
      - foreignaffairs.gov.ng posts, terms recognise, recognition, Palestine
      - Nigeria recognised the State of Palestine 1988 Ministry of Foreign Affairs statement
      - unispal Letter from Nigeria 1988 Palestine declaration of independence recognition
  B9:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement of the President or the Minister of Foreign Affairs with a formal ceasefire call
      or a named violation in Gaza was found in an official text that can be archived and quoted
      (docs/10 B-423). Two such statements are reported by the press and are leads: the President's
      speech to the Arab-Islamic summit in Riyadh of 11 November 2024 (lead_20260929_NGA_1) and the
      Minister's statement of 30 May 2024 on the Rafah strikes (lead_20260929_NGA_2); neither is on
