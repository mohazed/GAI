# Coverage record for Kenya (docs/03 §6). P-21 light protocol, session T-P21-37, 2026-11-04.
# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the Office of the President's site (president.go.ke, WordPress REST API, full-text search /wp-json/wp/v2/posts?search= for Gaza, Palestine, Palestinian, Israel, Israeli, ceasefire, Hamas, Middle East, ICC,
# International Criminal Court, genocide, Netanyahu, hostages, humanitarian, UNRWA, two-state, Rafah, terror, terrorist, solidarity, condemn, Holy Land, Jerusalem, Cyber Directorate, National Cyber, cabinet, United Nations, foreign
# policy; the items that matched opened), the Ministry of Foreign and Diaspora Affairs' site (mfa.go.ke, Drupal; the site search returns no results page to a scripted request, so the lists /speeches-statements, /press-release,
# /allnews and /news-update were read page by page, ?page=0 to 12, by title, and the files they link opened: the Ministry's statement of 6 March 2026, the third quarterly briefing of 12 November 2025, the joint statement with China,
# the Nairobi Declaration of 12 May 2026, the TICAD 9 declaration and the Kenya-Norway press release), the Kenya News Agency (kenyanews.go.ke, WordPress REST; its search is fuzzy, the titles were screened for Gaza, Palestine, Israel,
# ceasefire, Hamas, Netanyahu, cyber and the like), the UN's General Debate pages and files (79th, 80th, 81st), the ICJ's case 192 page (live), the UN Treaty Collection's status page of the Rome Statute (live), the generated tables,
# UNRWA donor rankings (2022 to 2024), the SIPRI register and the Article 19 documents. Web searches were not available to this session (the run's search budget was spent): no press item outside the Government's own sites was read and
# nothing is filed from one; the 'one search per indicator group' of docs/06 §5 is left for P-23.
# Events: one (B9); see docs/10 B-802. Leads: three (B9 twice, C2); see docs/10 B-803.
