  B9:
    status: has-events
    note: 'One event filed: evt_2025_09_24_KEN_B9 (the President, 80th General Debate, call for a permanent ceasefire, +2, flagged for the ''disproportionate military operations'' wording; docs/10
      B-802). The President is head of state and head of government (R3). Not filed: (1) his 79th statement (26 September 2024, src_20240926_un-gadebate_ke-ruto-ag79, line 66; 769 days, expired)
      lists ''From Gaza to Darfur, Ukraine, Yemen, Eastern Democratic Republic of Congo'' among conflicts inflicting destruction: no call, no violation, neither tier. (2) His 81st statement (23
      September 2026; the file ke_en.pdf read live, not recorded: no Wayback capture and gadebate.un.org fails Save Page Now) speaks of civilians paying the price ''from Europe to the Middle East''
      and never names Gaza or Palestine (R7). (3) The Presidency''s report of 29 January 2025 (src_20250129_presidency-ke_kenya-egypt-partnership, line 21): ''remains committed to UN Security
      Council Resolution 2728 of 2024, which calls for an immediate ceasefire'' does not name Gaza (R7) and Gaza sits in the report''s indirect speech: lead_20261104_KEN_1. (4) The joint statement
      with China of April 2025 (src_20250426_mfa-ke_kenya-china-joint-statement, lines 255 to 257) is a statement of ''the two sides'' that opposes ''the forced transfer of people in Gaza'': lead_20261104_KEN_2.
      (5) The Prime Cabinet Secretary and Cabinet Secretary for Foreign and Diaspora Affairs, Musalia Mudavadi, is a B9 speaker; the Ministry''s lists show no statement of his on Gaza: his statement
      of 6 March 2026 on the Middle East (the war of that month) names neither Gaza nor Palestine, and the quarterly briefing of 12 November 2025 calls for a ceasefire in Sudan only. The Nairobi
      Declaration (12 May 2026) names the conflict in the Middle East in a paragraph on its economic consequences, with no call.'
    queries:
    - 'president.go.ke REST search: Gaza (9 posts), Palestine, Palestinian, Israel, Israeli, ceasefire, Hamas, Middle East, genocide, Netanyahu, hostages, two-state, humanitarian, UNRWA, Rafah,
      terror, solidarity, condemn, Holy Land, Jerusalem; the matches that bore on Gaza opened'
