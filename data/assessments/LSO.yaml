# Search method (docs/06 §5): the Government of Lesotho's portal (gov.ls, WordPress with an open REST API, full-text search /wp-json/wp/v2/posts?search= for Gaza, Palestine, Palestinian, Israel, Israeli, ceasefire, Hamas, Middle East,
# ICC, International Criminal Court, genocide, UNRWA, two-state, Netanyahu, hostages, Jerusalem, Holy Land, Gaza ceasefire, humanitarian crisis, ICJ, International Court of Justice, Security Council, Mpotjoane; the portal prints the
# Prime Minister's and the Minister's speeches and its documents library holds PDFs by a download manager), the Ministry of Foreign Affairs and International Relations' site (foreignaffairs.gov.ls, ASP.NET; /Post, /Documents, /Home/Docs read),
# the UN's General Debate pages and files (79th, 80th, 81st), the ICJ's case 192 page (live), the UN Treaty Collection's status page of the Rome Statute (live), the Assembly of States Parties' list, the generated tables, UNRWA donor
# rankings (2022 to 2024), the SIPRI register and the Article 19 documents. Web searches were not available to this session (the run's search budget was spent): no press item outside the Government's own sites was read and nothing is
# filed from one; the 'one search per indicator group' of docs/06 §5 is left for P-23. The portal answers slowly (Save Page Now got 504 and 503 on it; the Government's page of the 80th statement was recorded from an existing Wayback capture).
# Events: three (B9); see docs/10 B-807, B-808. Leads: one (B9); see docs/10 B-807.
