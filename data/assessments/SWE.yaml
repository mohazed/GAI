    status: "has-events"
    checked_at: 2026-09-30
    note: "No Swedish listing: Sweden has no law allowing national sanctions against third countries (answer of 14 July 2026, read, not archived). The Government says it was a driving force for the EU settler listings (April and July 2024, May 2026) and pushes for EU sanctions on Israeli ministers, which were not adopted. EU settler listings are not filed until P-15 decides how EU listings adopted by unanimity count (docs/10 B-229 (3) on data/wave-2, as for Belgium). P-16 (docs/10 B-446): the EU Council's settler listings of 19 April 2024 (west-bank), 15 July 2024 (Tzav 9, blocking aid to Gaza: gaza and west-bank) and 28 May 2026 (Nachala, the Gaza Strip: gaza and west-bank), adopted by unanimity, are filed as evt_2024_04_19_SWE_B11, evt_2024_07_15_SWE_B11 and evt_2026_05_28_SWE_B11 under the reading R8 of docs/calibration/README.md."
    queries:
