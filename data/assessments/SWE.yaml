    queries:
      - regeringen.se search (Netanyahu, "Internationella brottmålsdomstolen")
      - data.riksdagen.se frs and ip (Netanyahu, brottmålsdomstolen, ICC)
  B7:
    status: none-found
    checked_at: 2026-09-28
    note: Sweden has not sanctioned ICC officials; the Minister stated concern at the US sanctions and support for activating the EU blocking statute (answer of 7 May 2025, read, not archived).
    queries:
      - data.riksdagen.se frs (brottmålsdomstolen, ICC)
  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv: Sweden recognised the State of Palestine on 30 October 2014
      (the Government's release of that day, archived from the Wayback capture of 18 September
      2016 as src_20141030_regeringen_erkanner-palestina; row added by this session, docs/10
      B-192), so B8 is the pre-existing tier (+3) from 2023-10-07. The present Government calls the
      2014 decision premature but has not withdrawn it (answers of 19 and 25 October 2023, read,
      not archived).
  B9:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Twelve events (2024-02-14 to 2026-02-18): the foreign policy statements of 2024 and 2026,
      the statements of government policy of 2024 and 2025, the Minister's statements of 11 and 19
      May 2025, the op-eds of 23 May and 4 September 2025, the joint statement of 22 July 2025, the
      General Assembly statement of 25 September 2025 and two written answers to the Riksdag.
      Other written answers repeating the same calls (for example 11 September 2024, 9 October
      2024, 21 May 2025, 3 September 2025, 3 December 2025, 15 June 2026) were not filed as
      separate events; the B9 cap is reached in the trailing year either way.
