    note: 'One event: the 80th General Debate statement, 25 September 2025, the President''s declaration delivered by the Prime Minister, Allamaye Halina (+5; evt_2025_09_25_TCD_B9: ''bombardements
      indiscriminés'', ''destruction systématique d''infrastructures vitales'' at Gaza; scanned file, read by OCR and compared with the page images; flagged under R3, docs/10 B-836). Not filed:
      (1) the President''s speech at the extraordinary Arab-Islamic summit, Riyadh, 11 November 2024 (Presidency page 23166, first person: ''La trêve immédiate souhaitée, tant à Gaza qu''au Liban,
      devra permettre l''acheminement de l''aide et la protection des civils par la mise en place de corridors humanitaires'', a call at the +2 tier, 723 days old on 4 November 2026): presidence.td
      answers Save Page Now with HTTP 403 and Wayback holds no capture, so there is no archived copy (docs/10 B-837); an `official` source cannot support a lead. (2) The New Year message of 31
      December 2023 (President, first person: ''notre condamnation a été absolue contre la réaction de l''Etat d''Israël qui fait usage de force brute dans sa punition collective contre les civils
      palestiniens''): the passage never names Gaza (R7) and is 1,039 days old (expired). (3) The Presidency''s report of the Arab-Islamic summit of 11 November 2023 (third person: the President
      ''a dénoncé le recours à la punition collective contre les palestiniens par Israël''): indirect speech (R4). (4) The 79th statement (the Prime Minister, 25 September 2024) condemns ''les
      violences et exactions commises contre des civils innocents'' and speaks of ''des images insoutenables qui nous proviennent de la bande de Gaza'': no call and no named violation (neither
      tier). (5) The 81st statement (25 September 2026) is delivered by the Minister of Public Health, not a B9 speaker (R3), and voices concern at ''la détresse humanitaire à Gaza'' with no call.
      (6) The Foreign Minister''s words of 10 November 2023 (''Notre pays appelle à un cessez-le-feu'', Tchadinfos, a lead, expired). (7) The Presidency''s reports of the Eid prayers and the President''s
      replies of 10 April and 16 June 2024 pray for peace for Gaza and Sudan without a call.'
