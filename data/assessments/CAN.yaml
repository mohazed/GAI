# Coverage record for Canada (docs/03 §6). P-D research session, wave 3, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-261): no web search was available to this session (the run's allowance
# was used up, as for Italy and the Netherlands, B-251, B-256). The protocol's searches (docs/06
# §4 step 3) were run as keyword filters of the Wayback CDX listings of the official sites, then
# reads of the matching pages: Global Affairs Canada news (www.canada.ca/en/global-affairs/news/,
# 1,328 URLs from October 2023), the Prime Minister's news (www.pm.gc.ca/en/news/, 2,705 URLs from
# October 2023: statements, speeches, readouts, releases), international.canada.ca (1,306 URLs:
# export-control reports) and international.gc.ca (41,315 URLs: country pages, export-control
# pages), National Defence news and the F-35 pages (canada.ca and ised-isde.canada.ca), and
# Immigration, Refugees and Citizenship Canada news and public policies. Keywords: israel, gaza,
# palestin, unrwa, west-bank, settler, hamas, icj, icc, criminal-court, arms, export, ceasefire,
# hostage, netanyahu, two-state, humanitarian, f-35, sanction. English only: every page used has a
# French version on the same sites (official languages), not searched separately. The House of
# Commons publication search (ourcommons.ca) answered 403 to a scripted request, so Hansard and
# written answers were not searched.
country: CAN
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build.
      Canada's report to Parliament for 2023 records exports of military goods and technology to
      Israel of CAD 30.6 million in 2023, only non-lethal items after 7 October 2023
      (src_20240531_gac_military-goods-2023).
  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade (Canada's rows existed from P-14, so no fetch was needed). Own
      reports of HS 93 exports to Israel: USD 188,889 (2022), 106,554 (2023, −3 from 2024-02-14),
      288,524 (2024, −3 from 2025-02-27) and 500,673 (2025, −3 from 2026-04-21); HS 8710 USD 25,335
      (2023) and 176,642 (2024). HS 8526 (own USD 2.5 million in 2025) and 8802 (own USD 4.7
      million in 2025) are not counted without a confirming document (docs/02 §2); the export
      reports to Parliament give values by Export Control List item, not by customs code, so no
      row was added to a2_confirmed_military.csv. Disagreement reported, not corrected: the
      Government's own reports record exports of military goods and technology (Export Control
      List Group 2, parts and components included) to Israel of CAD 30.6 million in 2023
      (src_20240531_gac_military-goods-2023), CAD 18.9 million in 2024 (the 2024 report, read, not
      archived) and CAD 14.7 million in 2025 (src_20260512_gac_strategic-goods-2025), values that would reach the −15 tier if they were
      customs values in HS 93; the Government states that permits issued since 7 October 2023 were
      for non-lethal items. Left to the author (docs/10 B-263).
  A3:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2023_10_07_CAN_A3, standing from 2023-10-07 on the Minister of National Defence's
      statement that every F-35 produced includes Canadian components
      (src_20230109_dnd_f-35-acquisition). A/HRC/59/23 does not name Canada. No halt of F-35 part
      exports to Israel found.
    queries:
      - "CDX: canada.ca/en/department-national-defence/news/ and services/procurement/fighter-jets, filtered f-35"
      - "CDX: ised-isde.canada.ca/site/aerospace-defence (F-35 industrial participation pages)"
      - "archive/text/src_20250616_un-unispal_a-hrc-59-23.txt searched for Canada"
  A4:
    status: unchecked
