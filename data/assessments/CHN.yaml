  B1:
    status: has-events
    note: >-
      Generated from unga_votes.csv (seven votes to December 2024, docs/10 B-186): yes on
      ES-10/21 to ES-10/26 and 79/232. China's own statements agree: the President's remarks of
      21 November 2023 say China supports the resolution adopted at the emergency special session
      on 27 October (evt_2023_11_21_CHN_B9), the Foreign Minister supported Palestine's full
      membership (ES-10/23) throughout, and the joint statement with the Arab States of 30 May
      2024 welcomes ES-10/23. No Chinese document read contradicts the rows. The five later votes
      have no rows (B-199 (1)); the joint statement with France of 5 December 2025 welcomes the
      New York Declaration of 12 September 2025 (A/DEC/80/506); no Chinese record of the other
      votes was read.
  B2:
    status: has-events
    note: >-
      Generated from unsc_vetoes.csv: China, a permanent member, vetoed the United States drafts
      S/2023/792 (25 October 2023) and S/2024/239 (22 March 2024), both calling for humanitarian
      pauses or a ceasefire (−20 each; both events have passed 730 days and count 0 today). The
      meeting records agree (S/PV.9453: China's representative said China voted against
      S/2023/792; S/PV.9584 lists China against S/2024/239). The rule scores any veto of such a
      draft regardless of the vetoing member's stated reasons (docs/02 §2); China's explanations
      of vote are on the record in the same documents.
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      China filed no declaration of intervention in ICJ case 192. It took part in the oral
      proceedings of the advisory opinions on the Occupied Palestinian Territory (February 2024)
      and on Israel's obligations regarding humanitarian aid (May 2025), which are not case 192.
      The joint statement with the Arab States of 30 May 2024 supports the provisional-measures
      orders of 26 January, 28 March and 24 May 2024 (evt_2024_05_30_CHN_B9), a statement, not an
      intervention.
    queries:
      - fmprc.gov.cn title "International Court of Justice"; mfa.gov.cn title 国际法院
  B4:
    status: none-found
    checked_at: 2026-09-29
    note: No statement rejecting the ICJ's provisional measures or their binding character was found.
    queries:
      - fmprc.gov.cn title "International Court of Justice"; mfa.gov.cn title 国际法院
  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      China is not a party to the Rome Statute. Asked about the warrants of 21 November 2024, the
      Spokesperson (22 November 2024) said China hopes the Court "will maintain an objective and
      just position, lawfully perform its duties" (a spokesperson, and no position on executing
      the warrants); on 10 October 2025 the Spokesperson restated China's opposition to all acts
      that violate international law. No statement by the President, the Premier or the Foreign
      Minister on the warrants was found.
    queries:
      - fmprc.gov.cn full text "International Criminal Court", "arrest warrant", "Rome Statute"
      - mfa.gov.cn title 国际刑事法院
  B6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No stated refusal to execute the warrants and no official visit by a person under warrant
