  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv. China recognised the State of Palestine on 20 November
      1988 (a pre-existing recognition, +3 standing from 2023-10-07). The row CHN,1988-11-20 was
      added in this session, citing the Ministry's page "China and Palestine"
      (src_20260929_fmprc_china-palestine-relations), which states the date (docs/10 B-192,
      B-343 (4)); the joint statement with France of 5 December 2025 also says China has
      recognised the State of Palestine since 1988.
  B9:
    status: has-events
    note: >-
      Fifteen events (evt_2023_11_21 to evt_2025_12_05): three at the names-violations tier (+5:
      the President's remarks of 21 November 2023 on collective punishment and forced transfer;
      the joint statements with Egypt of 14 January 2024 and with the Arab States of 30 May 2024
