# Coverage record for China (docs/03 §6). P-D research session, wave 6, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-341): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Japan and Korea, B-331, B-336). The registry's gov_sources were
# used, read by script, read only. www.fmprc.gov.cn / www.mfa.gov.cn answer scripted requests; the
# Ministry's list pages stop at about 1,000 items (143 pages), so the site's own search service
# (the JSON API behind "search_eng.shtml" and "search.shtml") was used, sorted by date, from
# October 2023 to September 2026:
# - English site, title search: Gaza, Palestine, Palestinian, Israel, Middle East, UNRWA,
#   two-State, Ceasefire, Rafah, Hamas, West Bank, International Criminal Court, International
#   Court of Justice, Lebanon (652 items; the 161 whose titles name Gaza, Palestine, Israel, UNRWA,
#   a ceasefire or the two Courts listed and the relevant ones read); full-text search: Gaza
#   (1,160 hits), Palestine (960), UNRWA (80), every item by or about the President, the Premier or
#   the Foreign Minister among them listed by title and the speeches read; titles "Remarks by H.E.
#   Wang Yi", "Statement by H.E. Wang Yi", "Remarks by H.E. Li Qiang", "Speech by H.E. Li Qiang",
#   "General Debate", "Security Council High-Level Meeting", "Two-State Solution"; full text
#   "arms sales to Israel", "weapons to Israel", "export control Israel", "dual-use Israel",
#   "F-35", "settler", "settlements sanctions", "recall ambassador Israel", "medical evacuation
#   Gaza", "patients from Gaza", "humanitarian assistance Gaza airdrop", "UNRWA donation",
#   "Rome Statute", "Israel free trade agreement", "arrest warrant" (the Spokesperson's answers
#   of November 2024 and October 2025 read).
# - Chinese site, title search: 加沙, 巴勒斯坦, 以色列, 近东救济工程处, 国际刑事法院, 国际法院,
#   巴以, 停火 (154 items; those not by the Spokesperson or envoys read by title, the joint
#   statements and the Foreign Minister's remarks read in full).
# - The Ministry's pages "China and Palestine" and "China and Israel" (Countries and Regions).
# - The speeches of the President (BRICS summits of November 2023, October 2024 and September
#   2025; China-Arab States Cooperation Forum, May 2024; G20, November 2024; the joint press
#   remarks with the President of France, May 2024), the Premier (General Assembly, September
#   2025; East Asia Summits of 2024 and 2025; SCO heads of government, October 2024) and the
#   Foreign Minister (General Assembly, September 2024; G20 foreign ministers, September 2024 and
#   February 2025; Security Council high-level meetings of February 2025 and May 2026; BRICS
#   foreign ministers, April 2025; Lanting Forum, October 2025; year-end speech, December 2025;
#   Munich, February 2026; Human Rights Council, February 2026) read for Gaza passages.
# Not searched: the press; the National People's Congress; the State Council's site
# (english.www.gov.cn) beyond the Premier's speeches republished by the Ministry; the Ministry of
# Commerce (export controls, licences, trade measures); the Ministry of National Defense
# (exercises, cooperation); the China International Development Cooperation Agency (aid,
# medical programmes); the National Immigration Administration (D5); the courts and public
# security organs (E1–E3); the Permanent Mission to the UN beyond the items the Ministry's search
# returned.
country: CHN
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build.
  A2:
    status: has-events
    note: >-
      Generated from Comtrade (China had rows from P-14, so no fetch was run). China's own reports
      carry HS 93 exports to Israel of USD 10,326 (2022), 28,987 (2023), 25,170 (2024) and 9,178
      (2025), under USD 100,000 each year: 0 throughout. Israel's mirror records HS 93 imports
      from China of USD 1,616,000 (2022), 2,277,000 (2023), 1,625,000 (2024) and 3,207,000 (2025),
      which would give −8 each year if the mirror were used; the generator uses the reporter's
      own data when it exists (reported to the author with Korea's per-heading question, docs/10
      B-343 (3)). HS 8526 (own USD 9.6 million to 16.3 million a year; mirror 7.0 million to 13.5
      million) and HS 8802 (mirror USD 16,000 in 2022) are not counted: no licence register,
      parliamentary answer or investigation confirming a military nature was found, and no row
      was added to a2_confirmed_military.csv. No Chinese document on arms exports to Israel was
      found in the sources searched; the Ministry of Commerce was not searched. Nothing Chinese
      contradicts the generated value.
    queries:
      - fmprc.gov.cn full text "arms sales to Israel", "weapons to Israel", "export control Israel", "dual-use Israel"
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
