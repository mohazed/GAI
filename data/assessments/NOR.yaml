  B1:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated. Rows for the seven votes to December 2024 (docs/10 B-186): yes on ES-10/21,
      ES-10/22, ES-10/23, ES-10/24, ES-10/25, ES-10/26 and 79/232. The archived UN press releases
      never list Norway against or abstaining; GA/12670 reports Norway's delegate introducing the
      draft of 79/232 (the request for the advisory opinion on Israel's obligations regarding UN and
      humanitarian organisations, a Norwegian initiative), and GA/12743 reports Norway's
      representative introducing the text welcoming the advisory opinion (A/RES/80/116). The
      Minister's written answer of 7 November 2023 states that Norway voted for the resolution of 27
      October 2023, and the Ministry's release of 10 May 2024 states Norway's vote for Palestine's
      membership (ES-10/23). No disagreement. The later qualifying votes have no rows (B-199 (1)).
