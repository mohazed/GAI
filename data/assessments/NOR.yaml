# Coverage record for Norway (docs/03 §6). P-D research session, wave 4, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-277): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for the wave-3 countries). The protocol's searches (docs/06 §4
# step 3) were run as (1) keyword filters of the Wayback CDX listings (URLs captured since
# 2023-10-07) of the Government's news pages regjeringen.no/no/aktuelt and /en/aktuelt (27,386
# addresses: press releases, statements, speeches, and the ministers' published answers to the
# Storting), in Norwegian (bokmål and nynorsk) and English, with the keywords gaza, palest, israel,
# unrwa, midtøsten / middle-east, straffedomstol, folkerett, vestbredd / west-bank, netanyahu,
# ben-gvir, smotrich, bosett / settler, våpen / arms, hamas, rafah, tostat / two-state, etikk /
# ethic, pensjonsfond, sanksjon / sanction, arrest, eksport / export, forsvarsmateriell, f-35,
# pasient / patient, evakuer, icj, domstol, okkup / occup, genocid / folkemord, visum / visa,
# then reads of about 300 matching pages through Wayback (regjeringen.no answers scripted requests
# and Save Page Now with a Cloudflare challenge, HTTP 403); (2) the Storting's open data
# (data.stortinget.no, all written questions of the sessions 2023–24, 2024–25 and 2025–26) filtered
# by title for Israel, Gaza, Palestin*, Netanyahu, UNRWA, straffedomstol, Vestbredden, F-35 and
# folkemord (194 questions), and reads of every answer; (3) Norges Bank Investment Management's
# press releases (2023–2026) and exclusion list, and the Council on Ethics' pages; (4) the full
# listing of regjeringen.no/no/aktuelt in Wayback (98,081 addresses, any date) for F-35 industry
# pages. Sámi was not searched; the Storting's plenary records, Lovdata (laws and regulations),
# the police and prosecution authorities (Kripos, Riksadvokaten), KLP's exclusion decisions and
# the press were not searched. Each `queries` entry names the listing or query used.
country: NOR
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199), so A1 stays unchecked for every country, not none-found; left to the build.
      The Government states that it does not permit exports of weapons, ammunition, other defence
      materiel or dual-use goods for military end use to Israel (written answers of the Minister of
      Foreign Affairs of 26 February 2024, 23 April 2024 and 20 October 2025, read, not archived).
  A2:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from Comtrade (Norway's rows existed from P-14, so `pnpm fetch:comtrade` was not
      run). Norway's own reports show no HS 93 or 8710 exports to Israel in 2022–2025; Israel's
      mirror imports under HS 93 are USD 9,000 (2022) and USD 1,000 (2024); A2 is 0 in every year.
      HS 8526 (own USD 8,888–559,306 a year, USD 559,306 in 2025; mirror USD 7,000–49,000) and 8802
      (own USD 120,787 and mirror USD 130,000 in 2022) are not counted without a confirming
      document (docs/02 §2); none was found, so no row was added to a2_confirmed_military.csv. No
      disagreement with the country's record: the Government states that no weapons, ammunition,
      defence materiel or dual-use goods for military end use are exported to Israel. The Minister
      of Foreign Affairs told the Storting (21 June 2024) that the Armed Forces' own-materiel
      shipments to Israel in 2023 listed in the annual export report (table 10.12) were equipment for
      Norwegian UN personnel in the area, not exports or sales. Parts and components shipped to
      allies under cooperation agreements (for example to the United States) are not recorded as
      exports to Israel; Storting questions (30 November 2023, 2 October 2025) cite press reports
      of Nammo's United States subsidiary delivering to Israel and of Chemring Nobel supplying
      propellant for Hellfire missiles, which are outside Norway's export records (the Minister's
      answer of 20 October 2025 says end-user declarations are not required for component
      deliveries to allies).
    queries:
      - data.stortinget.no written questions 2023–2026 (våpen, forsvarsmateriell, F-35, eksport)
      - regjeringen.no aktuelt CDX listing (eksport av forsvarsmateriell 2023, 2024, 2025)
  A3:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2023_10_07_NOR_A3: Norway is an F-35 partner; the Ministry of Defence's release of 15 May
      2019 names Kitron as producer of an F-35 component and states Norwegian contracts for parts
      production of over NOK 4.5 billion with deliveries planned to 2034. A/HRC/59/23 (archived on
      data/wave-1) names no Norwegian company. No halt of F-35 part exports was found. Storting
      questions of 16 February and 2 April 2024 cite press reports (Fri Fagbevegelse) that nine
      Norwegian companies supply F-35 components and that Lockheed Martin confirmed hull parts from
      Kongsberg on Israel's F-35s; the press articles were not read (no web search), so no lead
      was filed.
    queries:
      - regjeringen.no/no/aktuelt full CDX listing (f-35, kampfly with industri, kongsberg, kontrakt, leverandør)
      - data.stortinget.no written questions (F-35)
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no release archived yet (docs/10 B-187). Left to the
      build. Storting questions of 26 June 2025 and 1 September 2025 concern a possible Norwegian
      purchase of long-range precision fires developed by the Israeli defence industry and an Israeli
      subcontractor for electronic warfare in the new frigates (question texts, answers not read in
      full); no order placed with Israel was confirmed in the documents read.
  A5:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No named exercise, transit authorisation, basing agreement or intelligence sharing with Israel
      related to the Gaza campaign found. The Armed Forces' 2023 shipments to Israel were equipment
      for Norwegian UN personnel (Minister's answer of 21 June 2024). The Minister of Defence told
      the Storting (2024) that F-35 spare parts held in Norway are United States-owned pool parts and
      that the Ministry knows of no use other than return to the United States. Press reports were
      not searched (no web search).
    queries:
      - data.stortinget.no written questions (F-35-komponenter, Forsvaret, Israel)
      - regjeringen.no aktuelt CDX listing (forsvar, israel)
  A6:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No government decision in the window suspending or refusing a class of licences to Israel was
      found: Norway's refusal to export weapons, ammunition and dual-use goods for military end use
      to Israel is a pre-existing policy based on the Storting's decision of 1959 ("Norge har aldri
      åpnet for eksport av forsvarsmateriell til Israel", Minister's answer of 7 November 2023; the
      Ministry of Foreign Affairs' review of 4 June 2024 on the Genocide Convention restates it). A
      policy that predates the window is not an event, as for Belgium's 2009 position (docs/10 B-272 (1) on
      data/wave-3); flagged (docs/10 B-278 (2)).
    queries:
      - data.stortinget.no written questions (våpen, eksport, Israel) and answers of 7 Nov 2023, 26 Feb 2024, 23 Apr 2024, 21 Jun 2024, 20 Oct 2025
      - regjeringen.no aktuelt CDX listing (gjennomgang av Norges forpliktelser, 4 June 2024)
  A7:
    status: none-found
    checked_at: 2026-09-28
