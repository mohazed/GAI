  B7:
    status: none-found
    checked_at: 2026-09-29
    note: "Indonesia has imposed no sanctions on ICC officials."
    queries:
      - Indonesia sanctions ICC
  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv. Indonesia recognised the State of Palestine after the
      declaration of 15 November 1988; this session added the row IDN,1988-11-15 citing the
      Ministry's country brief (src_20250902_kemlu_hubungan-bilateral-indonesia-palestina, page 1),
      docs/10 B-192, B-409 (3). Pre-existing recognition: +3 standing from 2023-10-07.
  B9:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Seven events: the Foreign Minister's statements of 18 October 2023, 28 November 2023,
      23 February 2024, 4 May 2024, 30 April 2025, 26 May 2026 and 26 September 2026 (B-408). Filed
      on the full texts the Ministry publishes, citing Gaza; not on the Ministry's unsigned
      statements, the Vice Ministers' statements, or further statements in the same weeks. Two
      statements that qualify could not be archived on 2026-09-29 and are not filed (B-408 (4)):
      the Foreign Minister's statement at the OIC Council of Foreign Ministers in Jeddah on
      7 March 2025 (naming Israel's blocking of aid to Gaza as a violation of international
      humanitarian law; Save Page Now's captures were not served by the Wayback Machine within
      the wait, three times) and the President's remarks at the two-state conference in New York
      on 22 September 2025 (a call to end the war in Gaza, +2; the Cabinet Secretariat's page
      answered Save Page Now with a bot-check page). The President's General Assembly address of
      23 September 2025 names no violation and makes no ceasefire call; not filed.
    queries:
      - kemlu API sections Pidato Menteri, Pidato Presiden, Siaran Pers, full text 2023-10-07 to 2026-09-29
      - setkab.go.id search feed Gaza
  B10:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement of unconditional support for Israel or denial of documented violations was
      found. The President said on 22 and 23 September 2025 that Indonesia would recognise Israel
