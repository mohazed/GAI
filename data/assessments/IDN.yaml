# Coverage record for Indonesia (docs/03 §6). P-D research session, wave 9, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-407):
# - Ministry of Foreign Affairs (Kementerian Luar Negeri, kemlu.go.id): the site is a client-rendered
#   application whose pages carry no text in the served HTML. It loads its content from a public
#   API (backpanel.kemlu.go.id/public-content-service/api/…), the site's own listing and article
#   endpoints. Every item of the Ministry's sections "Berita" (3,811 items, September 2019 to
#   September 2026), "Siaran Pers" (237), "Pidato Menteri" (222), "Pidato Presiden" (57) and
#   "Pidato Lainnya" (38) was listed through that API with its full text (Indonesian and English);
#   467 items dated from 7 October 2023 mention Gaza, Palestine, Israel, UNRWA, Rafah, the Courts,
#   Netanyahu, genocide or the Board of Peace, and were searched by script for the terms of each
#   indicator; about 40 were read in full. The article records are archived with pnpm archive
#   through Save Page Now (the API URL of each page) and their text extracted by the new
#   json-content method (docs/10 B-407). Save Page Now received the API's JSON.
# - Cabinet Secretariat (setkab.go.id, English): its search RSS feed for "Gaza" (80 items,
#   November 2024 to September 2026) listed the President's statements and remarks; the page for
#   the remarks of 22 September 2025 was read in full, but Save Page Now captured a bot-check page
#   instead of it (removed; not filed). The site's search pages timed
#   out to scripted requests after the first requests; the feed does not reach back before November
#   2024, so the statements of President Joko Widodo (to 20 October 2024) were not read on it.
# - The President's site (presidenri.go.id) refuses scripted requests (HTTP 403, registry note).
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, gni.csv, unga_votes.csv, the UN press
#   releases archived in votes.yaml, and the Ministry's country brief "Hubungan Bilateral
#   Indonesia-Palestina" (PDF, kemlu.go.id/files/repositori).
# - Web search (English and Indonesian): the ICC warrants, medical evacuation and the Galang Island
#   plan, recognition of Palestine in 1988.
# Items read in full on kemlu.go.id (Foreign Minister's statements, all filed as B9 unless noted):
# 18 October 2023 (OIC, Jeddah), 28 November 2023 (General Assembly) with the press briefing of the
# day, 12 December 2023 (Geneva, not filed: two weeks after a filed one), 23 January 2024 (Security
# Council, not filed), 23 February 2024 (ICJ advisory proceedings) with the briefing of the day,
# 4 May 2024 (OIC Summit, Banjul) with its briefing, 7 March 2025 (OIC, Jeddah), 30 April 2025 (ICJ
# advisory proceedings) with its briefing, 15 September 2025 (Arab-Islamic summit in Doha, on
# Israel's strike on Qatar, no Gaza passage; not filed), 26 May 2026 (Security Council) with the
# news item of 27 May 2026, 26 September 2026 (General Assembly); the President's General Assembly
# address of 23 September 2025 (not filed, B-408 (2)); the Ministry's items on the hospital ship
# (13 February 2024), the International Stabilization Force (14 February 2026) and the walkout from
# the Israeli Prime Minister's address (25 September 2026).
# Not searched or not readable: the Ministry of Defence and the armed forces (A5, D4), the Ministry
# of Trade and Statistics Indonesia (C3, C4), Danantara and the state pension funds (C5), the
# Attorney General and courts (E1, E3), Parliament.
country: IDN
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build. Indonesia
      has no diplomatic relations with Israel and no record of Indonesian deliveries of arms to
      Israel was found.
  A2:
    status: no-data
    checked_at: 2026-09-29
    note: >-
      Generated from Comtrade. Indonesia had no Comtrade rows (docs/10 B-194); `pnpm fetch:comtrade
      --reporters IDN` was run on 2026-09-29 and stopped before any trade query: Save Page Now
      refused to capture the Comtrade reporter list, already captured five times that day
      (error:too-many-daily-captures, as docs/10 B-383 to B-404 on data/wave-8). The empty index row
      the failed run appended was removed. No row, so the build shows no-data; the same command
      resumes the fetch on another day. No row added to a2_confirmed_military.csv; no licence
      register, parliamentary answer or investigation on Indonesian exports to Israel under HS 8526
      or 8802 was found.
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Indonesia is not a partner, supplier or customer of the F-35 programme; no document naming
      Indonesian companies as suppliers of F-35 parts or maintenance was found.
    queries:
      - Indonesia F-35 supplier parts company
      - kemlu F-35 Israel
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no SIPRI release can be archived yet (docs/10 B-187,
      B-199, B-902); left to the build. No official record of an Indonesian order of Israeli arms
      in the window was found.
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No official record of a named exercise, a transit authorisation, a basing agreement or
      intelligence sharing with Israel was found; Indonesia has no diplomatic relations with Israel.
      The planned contribution of Indonesian troops to the International Stabilization Force in
      Gaza under Security Council resolution 2803 (2025) is not cooperation with Israel's armed
      forces (the Ministry's statement of 14 February 2026 says participation is not recognition or
      normalisation).
    queries:
      - kemlu API full text 2023-10-07 to 2026-09-29, terms Israel, latihan, militer, TNI
      - Indonesia Israel military exercise 2024 2025
  A6:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No decision suspending or refusing licences for arms exports to Israel was found; no record
