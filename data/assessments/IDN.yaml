      - kemlu API full text, terms Afrika Selatan, Konvensi Genosida, ICJ
  B4:
    status: none-found
    checked_at: 2026-09-29
    note: "No statement or act rejecting the ICJ's provisional measures was found; the Ministry supports them."
    queries:
      - kemlu API full text, terms ICJ, Mahkamah Internasional, provisional measures
  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Indonesia is not a party to the Rome Statute. The press reports a Ministry statement of
      November 2024 supporting the ICC warrants for Benjamin Netanyahu and Yoav Gallant and saying
      they must be carried out in accordance with international law (lead_20260929_IDN_1); the
      statement is not among the Ministry's items on its site (every item of November 2024 was
      searched) and no statement of the Foreign Minister or the President on executing the warrants
      was found.
    queries:
      - Indonesia Kemlu statement ICC arrest warrant Netanyahu November 2024
      - kemlu API full text, terms Netanyahu, Gallant, Mahkamah Pidana Internasional, ICC
  B6:
    status: none-found
    checked_at: 2026-09-29
    note: "No stated refusal to execute the warrants and no visit by a person under warrant was found."
    queries:
