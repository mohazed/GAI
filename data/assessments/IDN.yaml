  B1:
    status: has-events
    note: >-
      Generated from unga_votes.csv (seven rows, yes on ES-10/21 to ES-10/26 and 79/232). Checked
      against the Ministry's items (Indonesia co-sponsored and voted for the resolution of
      27 October 2023; it mobilised support for the ceasefire resolution of 12 December 2023) and
      the archived UN press releases for the five later votes (B-409 (1)). No difference.
  B2:
    status: not-applicable
    note: "Not a Security Council member in the window (its last term was 2019-2020)."
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Indonesia filed no declaration of intervention in ICJ case 192 (not on the Court's list,
      docs/06 §8); it is not a party to the Genocide Convention. The Foreign Minister said on
      16 January 2024 that Indonesia supported South Africa's case. Indonesia took part in the
      advisory proceedings of February 2024 and April 2025 (filed as B9 statements), which are not
      case 192.
    queries:
