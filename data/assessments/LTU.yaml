      ''truly dire'': no call, press only); (3) the President''s 79th statement (2024, no Gaza text) and 81st statement (2026: supports efforts to ''maintain and consolidate the ceasefire'' and
      the Comprehensive Plan; live file, no Wayback capture; no call); (4) the Foreign Minister''s visit to Israel and Palestine, 16-17 June 2026 (a working visit reported by the Ministry, search
