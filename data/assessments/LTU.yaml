# Search method (docs/06 §5): the Ministry of Foreign Affairs (urm.lt, also mfa.lt), the Government (lrv.lt) and the President's site (lrp.lt) answer a Cloudflare challenge to every scripted request and Save Page Now fails with HTTP 403: their pages were read through the Wayback captures that exist (the Ministry's release of 29 August 2025 is one) and the rest only through the press (LRT English, BNS, LSM: read live) and the General Debate statements (gadebate.un.org, the 78th to 81st sessions; the 80th archived). The joint statements already archived for the 45 (archive/text searched for Lithuania, Lituanie), the EU Council's settler listings (archived), the UNRWA donor rankings of 2022 to 2024, the SIPRI register, the ICJ's case 192 page, the Assembly of States Parties' list, the generated events and tables; web searches in English and Lithuanian per indicator group. Lithuania is an EU member: B11 from the Council's listings (R8) and B9 from the joint statements (B-444). Time: about 60 minutes of research on Lithuania, inside the 90-minute budget of the session.
