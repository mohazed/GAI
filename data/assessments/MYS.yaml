      among the states against or abstaining on A/DEC/80/506 (GA/12707), 80/1 (GA/12708), 80/78
      (GA/12739) or the vote of 17 September 2026 (GA/12784); the releases of ES-10/27 and 80/116
      do not list states. The Ministry's items say Malaysia voted for A/DEC/80/506 (12 September
      2025) and welcomed ES-10/27 and 80/116. No difference.
