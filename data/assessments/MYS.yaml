# Coverage record for Malaysia (docs/03 §6). P-D research session, wave 9, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-412):
# - Ministry of Foreign Affairs (Wisma Putra, kln.gov.my): the site serves its listings as HTML. Every
#   item of its two listings was read by script back to September 2023: "Press Releases / MFA News"
#   (78 pages, 1,170 items, 19 September 2023 to 27 September 2026; the Ministry's own statements and
#   Bernama reports it republishes) and "Speeches & Statements" (15 pages, 225 items, 29 September 2023
#   to 27 September 2026). The titles were searched for Gaza, Palestine, Israel, UNRWA, the Courts,
#   Rafah, Netanyahu, genocide, the flotillas, Al-Aqsa, ceasefire and humanitarian terms in English and
#   Malay (Palestin, gencatan senjata, kemanusiaan, mahkamah, iktiraf); 21 statements of the Prime
#   Minister and the Foreign Minister were read in full (list below). Statements of 2026 are PDFs
#   embedded in the page (kln.gov.my/uploads/post/{id}/pdf).
# - Prime Minister's Office (pmo.gov.my): a WordPress site; its REST API refuses scripted requests
#   (HTTP 403) and its site search matches words loosely (a search for "ZIM" or "ICC" lists unrelated
#   speeches), so it was used for the search terms Gaza, Netanyahu and ICC only (first pages); the
#   Prime Minister's formal statements abroad are on the Ministry's site.
# - Ministry of Defence (mod.gov.my) and National Security Council (mkn.gov.my): the medical
#   programme of August to November 2024 (D4).
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, gni.csv, unga_votes.csv and the UN press
#   releases archived in votes.yaml.
# - Web search (English and Malay): the ICC warrants, recognition of Palestine in 1988, the medical
#   programme, the shipping ban of December 2023.
# Statements read (downloaded from the Ministry's site and searched for their Gaza passages; the filed
# ones read in full): the Prime Minister at the Arab-Islamic summits in Riyadh (11 November 2023, 11
# November 2024) and the emergency summit in Doha (15 September 2025, not filed: on Israel's strike on
# Qatar, two mentions of Gaza, no violation in Gaza named); Foreign Minister Zambry Abd Kadir at the
# Security Council (29 November 2023, not filed: 18 days after a filed statement); Foreign Minister
# Mohamad Hasan at the Security Council (23 January 2024), the ICJ advisory proceedings (22 February
# 2024), the open forum on Palestine in Kuala Lumpur (19 March 2024, not filed: a domestic forum), the
# OIC Summit in Banjul (4-5 May 2024, not filed: its text does not mention Gaza), the D-8 meeting on
# Gaza in Istanbul (June 2024, not filed: days before a filed statement), the Dead Sea conference (11
# June 2024), the OIC Executive Committee (7 August 2024, not filed: on the killing of Ismail Haniyeh,
# naming no violation in Gaza), the Security Council (25 September 2024, not filed: three days before
# a filed one), the General Assembly (28 September 2024, 27 September 2025, 26 September 2026), the
# OIC Council of Foreign Ministers (7 March 2025, 25 August 2025, 27 August 2026), his press statement
# on Gaza (2 August 2025, not filed: three weeks before a filed statement) and the UNRWA ministerial
# meeting (25 September 2025, not filed: two days before a filed one); the Ministry's summary of the
# OIC Executive Committee meeting of 18 October 2023 (not filed: the Ministry's words, not the
# Minister's).
# Not searched or not readable: Parliament (Hansard), the Ministry of Investment, Trade and Industry
# and the Department of Statistics (C3, C4, C6), Khazanah, the Employees Provident Fund and KWAP (C5),
# the Attorney General's Chambers and the courts (E1, E3), the Ministry of Home Affairs (D5, E2).
