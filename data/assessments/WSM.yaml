  B9:
    status: none-found
    note: 'No B9 event. (1) The Prime Minister Fiame Naomi Mata''afa''s General Debate statement of 27 September 2024 (79th session, archived: src_20240927_un-gadebate_wsm-fiame-en, line 128)
      says ''We remain concerned that the wars in Ukraine and the conflict in Gaza and surrounding areas are still ongoing with no resolution in sight. The terrible loss of civilian lives, displacement
      of people as well as the destruction of infrastructure and the environment is something we do not condone. The provision of arms to these conflicts needs to cease.'' It cites Gaza, but it
      neither calls for a ceasefire or an end to the blockade nor names a violation (it names harms, with no party), and a call to stop arms supplies is not a tier of B9: read as no event, flagged
      for the author (as a call it would be +2). (2) The statement of 27 September 2025 (80th session, src_20250927_un-gadebate_wsm-toelupe-en) repeats the passage (''The continued supply of weapons
      to fuel conflicts must end'') but its speaker is the Deputy Prime Minister, who does not hold the foreign affairs portfolio (the Prime Minister does: samoagovt.ws directory page, read),
      so it is not a B9 statement (R3). (3) The 78th session''s statement (23 September 2023) predates the window and has no passage on Gaza; Samoa has no statement at the 81st session in the
      General Debate record (no file). (4) The Government''s site (samoagovt.ws) and the Ministry''s (mfat.gov.ws) have no item on Gaza.'
