  B9:
    status: none-found
    note: 'No event filed; one lead (lead_20261104_GHA_1). (1) The President, John Dramani Mahama, is head of state and head of government (R3). His 80th General Debate statement (25 September
      2025, src_20250925_un-gadebate_gh-mahama-ag80, lines 143 to 148) deplores the denial of visas to President Abbas, states that Ghana "has long recognised the state of Palestine and supported
      a two-state solution" and speaks of "hundreds of thousands of innocent people who have been facing collective punishment and forced starvation for no reason other than the fact that they
      are Palestinian"; it never names Gaza (R7), so no event (read as citing Gaza it would be a +5 event, 405 days old: flagged for the author, in the lead). (2) At the 65th anniversary summit
      of the Non-Aligned Movement in Belgrade (1 September 2026) the Presidency''s report puts the call on Gaza in indirect speech (src_20260901_presidency-gh_mahama-nam-belgrade, line 3; R4):
      the lead. (3) President Nana Addo Dankwa Akufo-Addo''s 79th statement (25 September 2024, src_20240925_un-gadebate_gh-akufo-addo-ag79, line 117; 770 days, expired) names Gaza only to say
      that the Security Council "is struggling to make a decisive intervention in the tragic, ongoing war in Gaza": no call, no violation, neither tier. (4) The 81st statement (September 2026):
      the UN''s page has no Wayback capture and the live site answers a bot check (not worked around), so the text was not read; the Presidency''s search for Gaza returns no report of the Assembly
      week. (5) The Ministry''s releases on Palestine and Israel are meetings (the Deputy Minister with the Ambassador of Palestine, 5 November 2025: "Ghana''s position for a two-state solution";
      the Non-Aligned Movement mid-term review, 22 October 2025: "the question of Palestine").'
    queries:
    - 'presidency.gov.gh REST search: Gaza (2 hits: 1 September 2026, 7 November 2025), Palestine, Palestinian, Israel (1), genocide (3), ceasefire, hostages, two-state, Hamas (none)'
    - 'presidency.gov.gh REST search: Belgrade, Non-Aligned, General Assembly, UNGA, United Nations (the pages that matched opened)'
