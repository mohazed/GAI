      Nana Addo Dankwa Akufo-Addo''s 79th statement (25 September 2024, src_20240925_un-gadebate_gh-akufo-addo-ag79, line 117; 770 days, expired) names Gaza only to say that the Security Council
      "is struggling to make a decisive intervention in the tragic, ongoing war in Gaza": no call, no violation, neither tier. (4) The 81st statement (September 2026): the UN''s page has no Wayback
      capture and the live site answers a bot check (not worked around), so the text was not read; the Presidency''s search for Gaza returns no report of the Assembly week. (5) The Ministry''s releases
      on Palestine and Israel are meetings (the Deputy Minister with the Ambassador of Palestine, 5 November 2025: "Ghana''s position for a two-state solution"; the Non-Aligned Movement mid-term
      review, 22 October 2025: "the question of Palestine"). Completion of 2026-11 (2026-11-10): 3News prints the full text of the President''s speech at the Non-Aligned Movement summit in Belgrade
      (1 September 2026; read, press, no official transcript found on the Presidency''s or the Ministry''s REST APIs): ''In Gaza, the humanitarian situation remains catastrophic. Civilians continue
      to face severe constraints on humanitarian access and critical shortages affecting food, water, health care and electricity. We must insist on the protection of civilians’ full and unhindered
      humanitarian access.'' The words name Gaza (R7) and ask for aid access, with no ceasefire or end of blockade named: lead lead_20261104_GHA_1 updated, no event (B9 needs the official transcript
      or video, docs/02 §2; docs/10 B-2054).'
