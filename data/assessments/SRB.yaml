d 17 ammunition flights from Belgrade to Israel since 1 January 2026 (N1), and a Serbia-Israel agreement on classified defence information and joint drone production (021.rs, bne IntelliNews); no decision suspending or refusing licences to Israel; status kept, lead_20261110_SRB_2 unchanged.'
