  B9:
    status: has-events
    note: 'Two events, both at the call tier: the President of the Transitional Sovereign Council at the 79th General Debate, 26 September 2024 (evt_2024_09_26_SDN_B9, +2, the Assembly''s verbatim
      record A/79/PV.11; expired, 747 days) and at the extraordinary Arab Summit in Cairo, 4 March 2025 (evt_2025_03_04_SDN_B9, +2, the Sudan News Agency''s text of the speech; 588 days old, counts at weight 0.54 and does not end the passivity penalty). Read and not filed: (1) the President at the Arab League summit in Doha, 15 September 2025 (SUNA, archived: src_20250915_suna_burhan-doha-summit):
      Gaza appears only as the ''humanitarian tragedy'' whose settlement the attack on Qatar undermines, with no call and no violation named in Gaza (the ''flagrant violation'' named is of Qatar''s
      sovereignty); (2) the Prime Minister at the 80th General Debate, 25 September 2025 (SUNA''s text dated 26 September, archived: src_20250926_suna_idris-unga80-speech): ''the catastrophic
      conditions in occupied Palestine and the Gaza Strip'' warn of grave consequences, with no call and no violation named; (3) the Foreign Ministry''s statement of January 2025 welcoming the
      entry into force of the Gaza ceasefire and its communiqué of 5 September 2024 on the Israeli Prime Minister''s remarks on Egypt (communiqués with no named speaker, R3; seen in search results,
      not read); (4) the Arab summit in Baghdad, 17 May 2025: the Sudan''s delegation was led by a member of the Sovereignty Council, who is not a B9 speaker (R3; press, seen in search results);
      (5) the Foreign Minister, Mohieldin Salem: no statement on Gaza found in the searches (his remarks of 25 September 2026 in New York concern the war in the Sudan).'
