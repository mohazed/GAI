# Coverage record for the Sudan (docs/03 §6). P-21 light protocol, session T-P21-18, 2026-10-13.
# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the Ministry of Foreign Affairs (mfa.gov.sd and mofa.gov.sd do not serve a site: the first answers a connection error and its Wayback capture of 2025-11-13 is a hosting default page, the second no DNS answer; the Ministry's reports are read through the Sudan News Agency), SUNA (suna.sd, the state news agency, whose site search page does not return a search result list to a scripted request: pages found by web search in Arabic and English and read), the General Debate statements of the 79th and 80th sessions (the 79th through the Assembly's verbatim record A/79/PV.11; the 80th through SUNA's text and the UN's page, which names the date 25 September 2025), the ICJ's and the ICC's lists, UNRWA's donor tables and web searches in Arabic and English for each indicator group.
# The Sudan has two rival authorities in a war: the B9/B10 speakers are those of the government that represents the Sudan at the UN: the President of the Transitional Sovereign Council (Abdel-Fattah Al-Burhan), the Prime Minister (Kamil El-Tayeb Idris from 31 May 2025) and the Minister of Foreign Affairs and International Cooperation (Mohieldin Salem from 2025). The Rapid Support Forces' parallel authority is not a B9 speaker.
# Two B9 events. No lead.
