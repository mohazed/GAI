    queries:
      - "SRU: w.dossiernummer==23432 (letters 569, 572, 749)"
      - "rijksoverheid.nl news CDX listing: sancties, kolonisten, nederzettingen"
  B12:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      The Israeli ambassador was summoned (9 April 2025, Kamerstuk 23432-560; announced again on 28
      July 2025); no recall of the Dutch ambassador, downgrade or severance found.
    queries:
      - "SRU: w.dossiernummer==23432 (titles: ontbieden, ambassadeur)"
  C1:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2025_05_20_NLD_C1: the Netherlands asked the High Representative on 6 May 2025 to review
      Israel's compliance with Article 2 of the Association Agreement; the Foreign Affairs Council
      launched the review on 20 May 2025. No suspension adopted: the Netherlands states it would
