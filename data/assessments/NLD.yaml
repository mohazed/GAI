      page did not load by script).
    queries:
      - "rijksoverheid.nl documents CDX listing: toespraken 2023-10-11, 2023-10-24"
      - "SRU: w.dossiernummer==23432 AND dt.date>=2023-10-07"
  B11:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      evt_2025_07_28_NLD_B11: the Government declared Ministers Smotrich and Ben-Gvir persona non
      grata and set out to register them as undesirable aliens in the Schengen Information System
      (an entry ban, the national measure available without EU unanimity; docs/10 B-257 (3)). Settler
      sanctions: the Netherlands states it initiated the EU's third package of sanctions against
      violent settlers (agreed April 2026, listed 28 May 2026) and supported the earlier listings;
