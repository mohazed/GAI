      the country's own report first (docs/02 §5).
  C4:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No ban or labelling rule concerning goods from Gaza. The national temporary sanctions decree
      barring goods from Israeli settlements from the Dutch market, in force from 22 September 2026,
      is filed as evt_2026_09_22_NLD_C4 with scope west-bank, tracked and unscored in v1; the build
