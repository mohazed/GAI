  E1:
    status: none-found
    checked_at: 2026-09-28
    note: No domestic investigation of Dutch nationals or companies for conduct in Gaza found in the parliamentary papers searched (the Public Prosecution Service's site was not searched).
  E2:
    status: none-found
    checked_at: 2026-09-28
    note: >-
