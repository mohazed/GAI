      - "Wayback CDX: pfzw.nl/over-ons/ (israel, uitsluit)"
  C6:
    status: none-found
    checked_at: 2026-09-28
    note: No national procurement exclusion of companies over conduct in Gaza or the occupied territories found in dossiers 23432 and 22054.
    queries:
      - "SRU: w.dossiernummer==23432 AND dt.date>=2023-10-07 (titles: aanbesteding)"
  D1:
    status: has-events
    checked_at: 2026-09-28
    note: >-
      Generated from FTS. Window 2025-09…2026-08: USD 73,010,530 ÷ GNI USD 1,239,617,957,503 =
