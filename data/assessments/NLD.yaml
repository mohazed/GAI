    queries:
      - "SRU: w.dossiernummer==23432 (letters 749, 1266322, 1268606)"
  C5:
    status: none-found
    checked_at: 2026-09-28
    note: >-
      No exclusion decision by a Dutch sovereign fund or public pension fund over conduct in Gaza
      was archived. The Netherlands has no sovereign fund. ABP (civil-service pension fund) and PFZW
