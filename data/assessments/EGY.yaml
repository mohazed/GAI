    status: "none-found"
    checked_at: 2026-09-30
    note: "No named exercise with Israel, basing agreement, documented transit of military cargo to Israel or official confirmation of intelligence sharing related to the Gaza campaign was found in the official listings searched. Security coordination under the 1979 treaty and its annexes (the Rafah and Philadelphi arrangements) pre-dates the window and is not an instance unless activated for the campaign; the State Information Service reports Egypt's position that an Israeli retaking of the Philadelphi corridor would violate the treaty (stories 190755, 191152). Press claims of Israel-bound military cargo passing Egyptian ports could not be searched (no web search in this session) and are not recorded as leads for want of a verified source; the next session or P-16 should search them. P-16 web search (English; docs/10 B-244 (2)): the MV Kathrin reports of October 2024 (explosives for an Israeli contractor docking at Alexandria) are met by the Armed Forces' denial and the Ministry of Transport's statement that the ship unloaded a cargo for the Ministry of Military Production; no confirmed instance, lead lead_20260930_EGY_1."
