# Coverage record for Egypt (docs/03 §6). P-D research session, wave 2, 2026-09-28.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search facilities used: the Wayback CDX listings of presidency.eg (the English and Arabic
# speech and event pages, captured since 2023), sis.gov.eg (the State Information Service's
# stories in English, French and Arabic, filtered by keywords such as Gaza, Rafah, wounded, UNRWA,
# ICJ, ICC, ship, recognition) and mfa.gov.eg (whose pages since 2025 carry numeric ids without
# titles, so it could not be searched by topic). presidency.eg refuses direct requests (HTTP 403)
# and a SIS story of 2023 answers 404 live, so every source was recorded from an existing Wayback
# capture. The session's web-search allowance was already exhausted when it started (200 of 200
# calls used by the earlier wave-2 sessions), so no general web or press search was possible:
# the queries below are keyword filters of those listings plus direct reads of archived pages.
country: EGY
protocol_version: 1
last_full_check: 2026-09-28
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
