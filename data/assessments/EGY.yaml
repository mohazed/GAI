  B8:
    status: unchecked
    checked_at: '2026-11-10'
    note: 'Generated from recognitions.csv, which has no row for Egypt. The registry gives recognition since 1988-11-18 (pre-existing, +3 standing from 2023-10-07 once confirmed). The State Information Service''s
      page "Egypt and the Palestinian cause" (story 136421) recounts the 1988 declaration of the State of Palestine but gives no date of Egypt''s recognition, and no Ministry of Foreign Affairs page dating
      it was found (the ministry''s site has no searchable listing), so no row was added and the build decides nothing from the missing row (docs/03 §7; as South Africa, docs/10 B-231 (7)). Finish run of
      2026-11-09 (T-F-W2): the State Information Service''s issue page ''The Palestinian cause'' and its sitemap (Palestine pages outside the news section) were read for a dated statement of Egypt''s recognition;
      none states the date, so B8 stays unchecked for the author''s decision (docs/10 B-860). T-G-B8, 2026-11-10 (docs/10 B-2115): Still no document of the state itself dating the recognition (searches below).
      Not added from A/78/846 alone (annex: 18 November 1988): rule 4 of the run keeps B8 for the full-protocol countries to a document of the state itself, so the CHECKUP §2b default (a flagged A/78/846
      row) is left to the author; one line in recognitions.csv applies it (B-2115). Egypt''s statement at the Conference of 28-30 July 2025 (UNISPAL file Egypt_nyc_ar.pdf, read in its Wayback copy) speaks
      of ''the states that recognised the Palestinian state'' sharing Egypt''s view, without dating Egypt''s recognition.'
