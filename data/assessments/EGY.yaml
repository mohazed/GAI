      an Israeli retaking of the Philadelphi corridor would violate the treaty (stories 190755,
      191152). Press claims of
      Israel-bound military cargo passing Egyptian ports could not be searched (no web search in
      this session) and are not recorded as leads for want of a verified source; the next session
      or P-16 should search them.
