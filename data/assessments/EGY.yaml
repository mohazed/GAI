    - 'UNISPAL media API 2026-11-10: the statements of the High-level Conference of 28-30 July and 22 September 2025 (about 110 files read for a dated statement of the speaker state''s own recognition)'
  B9:
    status: has-events
    checked_at: 2026-11-09
    note: >-
      Six formal statements of the President filed: the Cairo Summit for Peace (21 October 2023,
      +5), the "Long Live Egypt-Long Live Palestine" address (23 November 2023, +2), the D-8 summit
      (19 December 2024, +5), the press conference with the President of Viet Nam (5 August 2025,
