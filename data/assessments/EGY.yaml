      which welcomes the agreement to end the war without a call or a named violation; the joint
      press conference with the President of Türkiye (Presidency page speeches422026, captured in March 2026, no date printed), which asks for the
      agreement's implementation in general terms; the Foreign Ministry's statements (the 12 May
      2024 ICJ statement, the 11 June 2025 statement naming starvation tactics, the 24 July 2025
      statement), which carry no named speaker (B9 requires one); and statements by the Minister of
      Foreign Affairs reported by the State Information Service in 2024–2025, which would not raise
      the capped value. Egypt's national statements at the General Assembly (September 2024, 2025,
      2026) were not searched (gadebate.un.org refuses Save Page Now, B-225). Finish run of 9 November 2026 (T-F-W2): the State Information Service's XML sitemap (948 entries dated from 27 September 2026) served as the list; every item of 'Speeches, Telegrams and Posts' and every news item whose address names Gaza, Palestine, Israel, the West Bank or Al-Aqsa (39 pages) was read in full; the Presidency's speech index is built by script. Filed: the President's speeches of 5 October (October War anniversary), 10 October (press conference with Malaysia's Prime Minister) and 11 October 2026 (with Indonesia's President; +2, +2 and +5: calls to implement the ceasefire plan and for the delivery of humanitarian aid to Gaza, and on 11 October systematic attacks against Palestinians in Gaza named), the R4 ministers' statement of 23 October 2026 (evt_2026_10_23_EGY_B9, +2) and the mediators' statements of 3 and 20 August 2026 (+5, +2) and the eight ministers' West Bank and Jerusalem statements of 2 June, 23 July, 21 August and 9 September 2026 (+5 each, west-bank, unscored) from the Turkish Ministry's copies. Not archived: the President's press conference with Slovenia's President of 3 November 2026 (all parties to implement the peace plan and ensure the unhindered delivery of humanitarian aid; Save Page Now answered 'service unavailable' twice on 2026-11-09, no Wayback copy; a call, +2, for a later session). Not filed: the Ministry's unattributed statements on Al-Aqsa and the West Bank (27 September, 1 and 26 October, 8 November), the readout of the Minister's meeting with Jibril Rajoub (6 October, third person), the President's press conference in Seoul (8 October, no call) and the Minister of State for Information (not a B9 speaker). B9 is at its cap; no score effect.
