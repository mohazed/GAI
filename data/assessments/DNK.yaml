      million). Israel's mirror data show a larger baseline (USD 599.7 million). No government
      statement on trade volumes found; no disagreement.
  C4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No labelling or ban regulation adopted in the window. The Folketing asked in September 2025
      about higher tariffs on and a ban of settlement goods (S 1502–S 1506) and about updating the
      Ministry's guidance on trade and investment in the settlements (URU 115); the answers were not
      archived (no capture or a 404 capture). West Bank measures would be tagged `west-bank`.
    queries:
      - oda.ft.dk titles (bosættelser, varer, told, mærkning)
  C5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No exclusion decision by a public pension fund or the central bank in the window citing Gaza
      or the occupied territories found. The Folketing's questions on ATP concern its investment in
      the defence company Terma (S 210, BEU 199 and 201); the other Danish pension companies named
      in the press are labour-market or commercial funds, not public funds (as KLP for Norway,
      docs/10 B-281 (4)). ATP's own pages were not searched.
    queries:
      - oda.ft.dk titles (ATP, pension, investering, Israel)
  C6:
    status: none-found
    checked_at: 2026-09-29
    note: No procurement exclusion of implicated companies found.
    queries:
      - oda.ft.dk titles (udbud, indkøb, Israel)
  D1:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Generated from FTS: +9 in the window 2025-09…2026-08 (USD 35,392,474 ÷ GNI USD 463.9 billion =
      0.0076 %), between +6 and +12 since November 2023. The Ministry reports about DKK 700 million
      of humanitarian support to the Palestine crisis from 2023 to December 2024 (release of 2
      December 2024), consistent with the tiers. No disagreement.
  D2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Denmark did not announce a suspension. Its planned 2024 core contribution (DKK 105 million)
      was due in the first quarter; the Ministry's fact sheet of 1 February 2024 says the Government
      could await the UN investigation before paying, and the Ministry announced the payment on 14
      March 2024 after UN steps (src_20240314_um_udbetaler-unrwa). Read as a wait for a payment not
      yet due, not a suspension (docs/10 B-288 (3)); the fact sheet lists Denmark apart from the
      donors that suspended.
    queries:
      - via.ritzau.dk press room (UNRWA)
      - oda.ft.dk titles (UNRWA)
  D3:
    status: has-events
    checked_at: 2026-09-29
    note: evt_2024_12_31_DNK_D3 (increased tier, from 31 December 2024).
  D4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No Danish medical-evacuation programme or field hospital. The Government decided not to
      receive medically evacuated patients from Gaza (the Minister of the Interior and Health, S
      1365, 25 August 2025; the Minister of Justice, S 1287, 9 July 2025; read through Wayback, not
      archived). Denmark funded the ICRC's field hospital in Gaza with DKK 5 million (release of 14
      May 2024; Danish Red Cross staff), offered staff, equipment and funding for treatment of Gaza
      patients in the West Bank (joint statement of 23 September 2025), and its Hercules aircraft
      dropped aid over Gaza (the Prime Minister's speech of 5 September 2025): funding, offers and
      airdrops, not a Danish medical-evacuation programme or field-hospital deployment, as for
      Sweden (docs/10 B-283 (3)).
    queries:
      - oda.ft.dk titles (patient, evakuering, felthospital)
      - via.ritzau.dk press room (felthospital, patienter, medicinsk)
  D5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No visa or protection instrument for Gaza residents found. The immigration authorities put
      asylum cases of stateless Palestinians from Gaza on hold in autumn 2023 (UUI 49, 134, 188,
      titles read), which is not a pathway opened.
    queries:
      - oda.ft.dk titles (asyl, opholdstilladelse, familiesammenføring, visum, Gaza)
  E1:
    status: none-found
    checked_at: 2026-09-29
    note: No investigation or prosecution concerning Gaza found in the Folketing's records or the Ministry's releases; the police and prosecution service were not searched.
  E2:
