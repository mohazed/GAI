  B8:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Japan has not recognised the State of Palestine (registry note). The Prime Minister told the
      General Assembly on 23 September 2025 that "the question is not whether to recognize a
      Palestinian state, but when" (src_20250923_kantei_unga80-address, line 35), and the Foreign
