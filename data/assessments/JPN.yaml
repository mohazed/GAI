      - kantei.go.jp General Assembly addresses of 2025 and 2026
  B9:
    status: has-events
    note: >-
      Ten gaza events, all at the call tier (+2): the Foreign Minister's statements of 2 June 2024,
      9 August 2024, 7 October 2024, 16 January 2025, 9 August 2025, 17 September 2025, 9 October 2025
