  B4:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement rejecting the ICJ's provisional-measures orders or their binding character; the
      Foreign Minister's statement of 27 January 2024 affirms their binding character (see B3).
    queries:
