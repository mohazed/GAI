# Coverage record for Japan (docs/03 §6). P-D research session, wave 6, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-331): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for the wave-5 countries, docs/10 B-303 on data/wave-5). The
# registry's two gov_sources were used. www.mofa.go.jp refuses scripted requests and Save Page Now
# (HTTP 403 from its CDN) but answers in the built-in browser, where the Ministry's English site was
# read, read-only, through its own index pages: the monthly press-release indexes of October 2023
# to September 2026 (every title read and filtered for Gaza, Palestin*, Israel, UNRWA, settler,
# Criminal Court, ICC, Court of Justice, ICJ, West Bank, Hamas, Rafah, evacuat*, asset, freez*,
# sanction, Middle East Peace, two-state; about 150 matches read by title, about 40 in full); the
# topic lists of all 1,962 English press-conference entries of the same period (filtered for
# Criminal, ICC, warrant, Netanyahu, UNRWA, sanction, settler, recogni*, genocide, ICJ, student,
# evacuat*, F-35, arms, export, Israel with agree*, cooperat* or defen*; the relevant answers read in
# full); the pages "Situation in the Gaza Strip" (EN and JA), Japan-Israel and Japan-Palestine
# relations and their archives, and the statement lists of the Prime Minister, the Chief Cabinet
# Secretary and the Foreign Minister. japan.kantei.go.jp (English) answers scripted requests: the
# statement lists of the Ishiba and Takaichi cabinets for September 2025 and September 2026 and the
# two General Assembly addresses were read. Every MOFA source was recorded from an existing Wayback
# capture (--capture, B-188); pages without a capture (the Foreign Minister's press conference in
# Jerusalem of 11 January 2026, his statement of 24 September 2026) could not be archived.
# Not searched: the press; the National Diet (questions, answers, resolutions); the Ministry of
# Defense and the Acquisition, Technology and Logistics Agency (F-35 industrial participation,
# exercises, purchases of Israeli systems); the Ministry of Economy, Trade and Industry (export
# licences, A2, A6); the Japanese-language MOFA pages beyond the Gaza situation page and the
# Foreign Minister's Japanese press conferences; GPIF and other public funds (C5); the police and
# courts (E1–E3).
country: JPN
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
      B-187, B-199, B-902), so A1 stays unchecked for every country; left to the build.
  A2:
    status: has-events
    note: >-
      Generated from Comtrade (Japan had rows from P-14, so no fetch was run). Japan's own reports
      carry HS 93 exports to Israel of USD 3,483 (2022) and 2,497 (2024); Israel's mirror HS 93 imports
      from Japan are USD 3,000 (2022), 31,000 (2023), 9,000 (2024) and 14,000 (2025): 0 throughout
      (all below USD 100,000). HS 8526 (own USD 13,955 to 22,553 a year; mirror 190,000 to 359,000)
      and HS 8802 (mirror USD 3,492,000 in 2024) are not counted: no licence register, parliamentary
      answer or investigation confirming a military nature was found, and no row was added to
      a2_confirmed_military.csv. No Japanese document on arms-export licences to Israel was found in
      the sources searched; METI's licensing records and the Diet were not searched. Nothing Japanese
      contradicts the generated value.
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No official document naming Japanese companies as Tier-1 or Tier-2 suppliers of parts or
      maintenance for the global F-35 programme was found in the sources searched. The UN Special
      Rapporteur's report A/HRC/59/23 (archived on data/wave-1) names a Japanese company (FANUC) as a
      supplier of robotic machinery for weapons production lines, not as an F-35 part supplier. The
      Ministry of Defense, the Acquisition, Technology and Logistics Agency and industry records were
      not searched (P-16).
    queries:
      - mofa.go.jp press-conference topics (F-35, arms, export, defen*)
      - A/HRC/59/23 text (Japan, F-35)
  A4:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_orders.csv); no SIPRI release can be archived yet (docs/10 B-187,
      B-902); left to the build.
  A5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No named exercise, documented transit, basing agreement or confirmed intelligence sharing with
      Israel related to the Gaza campaign was found. The Japan-Israel politico-military dialogues of
      18 March 2025 (fourth, Tel Aviv) and 28 January 2026 (fifth, Tokyo), between foreign and defence
      ministry officials, and the strategic consultation of 28 July 2026 are meetings of frameworks set
      up in 2018 and 2006 (routine pre-existing arrangements, docs/02 §2), not instances. The Ministry
      of Defense was not searched.
    queries:
      - mofa.go.jp press releases 2023-10 to 2026-09 (Israel)
      - mofa.go.jp Japan-Israel relations page and archives
  A6:
    status: none-found
    checked_at: 2026-09-29
