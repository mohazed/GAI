  B1:
    status: has-events
    note: >-
      Generated. Rows for the seven votes to December 2024 (docs/10 B-186): abstention on
      A/RES/ES-10/21; yes on ES-10/22, ES-10/23, ES-10/24, ES-10/25, ES-10/26 and 79/232. The UN press
      releases of these votes do not name Japan, except GA/12626 (ES-10/24), which lists Japan among
      the representatives who underscored international law and the role of the World Court; no
      Japanese document read contradicts the rows. Later votes without rows (B-199 (1)): GA/12690
      records that Japan explained its vote in favour of ES-10/27 (12 June 2025); A/DEC/80/506, 80/1,
      80/78 and 80/116 are not named in their press releases, and Japan's votes on them were not
      found in the sources searched.
  B2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Japan was an elected member of the Security Council in 2023 and 2024 (applicable). An elected
      member has no veto; unsc_vetoes.csv has no Japanese row. The Foreign Minister's statements
      record that Japan co-held the pen on resolution 2728 (25 March 2024) and voted for resolutions
      2728 and 2735; the Foreign Minister called the non-adoption of the draft vetoed on 20 November
      2024 regrettable (press conference of 22 November 2024).
    queries:
      - mofa.go.jp Foreign Minister's statements on Security Council resolutions 2728, 2735 and 2803
      - mofa.go.jp press conference of 22 November 2024
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Japan has filed no declaration of intervention in ICJ case 192 (the seed list of docs/06 §8; the
      Court's page was not re-read by this session). Positive statement recorded, not an event: the Foreign
      Minister's statement of 27 January 2024 says the Court's order of provisional measures "is
      legally binding on the parties to the dispute, and to be observed in good faith"
      (https://www.mofa.go.jp/press/release/pressite_000001_00120.html, read in the browser, not
      archived).
    queries:
