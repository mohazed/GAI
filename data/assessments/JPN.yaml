  B5:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No statement by the Prime Minister, the Foreign Minister or the Minister of Justice committing
      to execute the warrants of 21 November 2024 was found. Asked about the Prosecutor's applications,
      the Foreign Minister said on 21 and 24 May 2024 that Japan "will continue to closely follow the
      developments with serious concern as a state party to the ICC" and declined to speculate on the
      Court's decision; the English press-conference records of November and December 2024 hold no
