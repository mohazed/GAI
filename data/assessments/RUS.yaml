# Coverage record for the Russian Federation (docs/03 §6). P-D research session, wave 6, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-346): no web search was available to this session (the run's allowance
# of 200 calls was used up, as for Japan, Korea and China, B-331, B-336, B-341). The registry's
# gov_sources were used, read by script, read only, from October 2023 to September 2026:
# - en.kremlin.ru (the President): the site's own search, every result page, for Gaza (95
#   items, the 60 of the window read for Gaza passages), Palestine, Palestinian, "Middle East",
#   ceasefire, UNRWA, two-state (268 items of the window, the 209 not already read searched for
#   Gaza, Palestin, UNRWA), "International Criminal Court", Netanyahu, "arms Israel", "sanctions
#   Israel", "medical evacuation", "recognised Palestine", "1988 Palestine"; the site's search
#   joins words with OR, so the last queries returned mostly unrelated items, read by title.
# - government.ru (the Prime Minister): the site's search for Gaza and Palestine (the two
#   meetings of the window read: no Gaza passage in the Prime Minister's own words).
# - mid.ru (the Ministry of Foreign Affairs): not readable by script (an F5 bot challenge answers
#   every request with a JavaScript page), and its Wayback captures are the same 3 KB challenge
#   pages, so its texts cannot be archived; not searched (docs/10 B-346 (2)).
# - russiaun.ru (the Permanent Mission to the United Nations, part of the Ministry): the English
#   list of all statements, 69 pages from September 2026 back to June 2023 (1,104 titles), every
#   title by or naming the Foreign Minister or the President read, and the 60 items whose titles
#   name Palestine, the Middle East, Gaza or UNRWA searched for "1988" and recognition.
# - gadebate.un.org: the Foreign Minister's General Debate statements of 2024, 2025 and 2026 (the
#   PDFs of 2024 and 2026 have no usable text layer; that of 2025 could not be archived).
# - UN press releases of the qualifying votes (archived in votes.yaml) for Russia's explanations.
# - UNRWA's donor tables for 2022, 2023 and 2024 (Wayback copies).
# Not searched: the press and NGO reports (no leads were read); the State Duma and Federation
# Council; the Ministry of Defence, the Federal Service for Military-Technical Cooperation and
# Rosoboronexport (A2, A4–A6); the Ministry of Industry and Trade and the customs service (A6,
# C1–C6); EMERCOM and the Ministry of Health beyond the Kremlin's records (D4); the Ministry of
# Internal Affairs (D5); the Investigative Committee, the Prosecutor General and the courts
# (E1–E3); the Kremlin's /supplement/ documents (joint statements), which its search does not
# return.
country: RUS
protocol_version: 1
last_full_check: 2026-09-29
indicators:
  A1:
    status: unchecked
    note: >-
      Generated from SIPRI (sipri_deliveries.csv). No SIPRI release can be archived yet (docs/10
