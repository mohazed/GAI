  B8:
    status: has-events
    note: >-
      Generated from recognitions.csv. The Soviet Union recognised the State of Palestine in 1988 and
      Russia maintains that position (a pre-existing recognition, +3 standing from 2023-10-07). The
      row RUS,1988-11-19 was added in this session, citing the President's opening remarks at the
      Russian-Palestinian talks of 22 January 2026 (src_20260122_kremlin_russia-palestine-talks),
      which state the year; the day is the registry's (data/countries.yaml, a lead), as no archived
      Russian document gives it (docs/10 B-348 (4), B-350 (4)).
  B9:
    status: has-events
    note: >-
      Nine events (evt_2023_10_13 to evt_2025_09_27): one at the call tier (+2: the President's CIS
      address of 13 October 2023) and eight at the names-violations tier (+5): the President's
      remarks of 30 October 2023 (collective responsibility, indiscriminate killing), 21 November
      2023 (mass expulsion of civilians) and 10 May 2025 (ban on humanitarian aid, electricity), and
      the Foreign Minister's statements at the Security Council (23 January, 17 July and 27
      September 2024) and the General Assembly (28 September 2024, 27 September 2025) naming the
      collective punishment of the Palestinians, forcible relocation, blockade and starvation. Not
      filed (docs/10 B-347 (1)): the Kremlin's accounts of telephone conversations (with the
      Presidents of Brazil, 23 October 2023, of Türkiye, 24 October 2023, of Egypt, 14 November
      2023, of the UAE, 5 February 2024, of Iran, 16 April 2024: a ceasefire, an end to the
      bloodshed or strikes on residential areas, in indirect speech); the President's answers to questions (Valdai, 2 October 2025 and 7 November 2024;
      Results of the Year, December 2023 and 2024; news agencies, June 2024 and 2025; news
      conferences); the President's remarks naming Gaza without a call (extraordinary G20 summit, 22
      November 2023; BRICS Plus, 24 October 2024; SCO, 4 July 2024; Russia–Central Asia summit, 9
      October 2025, a hope that the United States plan be implemented; the Security Council meeting
      of 21 January 2026 on the Board of Peace); his greetings to the Arab League summits (16 May
      2024, 17 May 2025) and to the President of Palestine (28 November 2023), which name no call;
      the Foreign Minister's General Debate statement of 26 September 2026 (civilians "continue to
      lose their lives", no call); statements of the Permanent Representative and his deputies at
      the Security Council; the Ministry's Spokesperson. Same-day rule: the Foreign Minister's
      statements of 27 and 28 September 2024 are different days, hence two events.
    queries:
      - en.kremlin.ru search Gaza, Palestine, Palestinian, "Middle East", ceasefire, UNRWA, two-state
      - russiaun.ru statement titles naming the Foreign Minister or the President
      - government.ru search Gaza, Palestine
