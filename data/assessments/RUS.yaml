  B1:
    status: has-events
    note: >-
      Generated from unga_votes.csv (seven votes to December 2024, docs/10 B-186): yes on ES-10/21
      to ES-10/26 and 79/232. The press releases agree where they name Russia: GA/12548 (27 October
      2023, Russia's speaker called the adoption "extremely important and necessary") and GA/12599
      (10 May 2024, explanation before the vote); the President's speech of 21 November 2023 refers
      to the vote on the humanitarian truce (evt_2023_11_21_RUS_B9). No Russian document read
      contradicts the rows. The five later votes have no rows (B-199 (1)): GA/12690 records Russia's
      explanation before its vote on ES-10/27 (12 June 2025), GA/12708 Russia's delegate on the visa
      denial before 80/1 (19 September 2025), GA/12743 Russia welcoming the adoption of 80/116 on the
      ICJ advisory opinion (12 December 2025, with a reservation on advisory opinions), and GA/12784
      Russia's vote in favour on the participation of Palestine (17 September 2026); Russia is not
      named in GA/12707 (A/DEC/80/506) or GA/12739 (80/78).
  B2:
    status: has-events
    note: >-
      Generated from unsc_vetoes.csv: Russia, a permanent member, vetoed the United States drafts
      S/2023/792 (25 October 2023) and S/2024/239 (22 March 2024), both calling for humanitarian
      pauses or a ceasefire (−20 each; both have passed 730 days and count 0 today). The meeting
      records S/PV.9453 and S/PV.9584 (archived in P-14) are the sources. The rule scores any veto of
      such a draft regardless of the vetoing member's stated reasons (docs/02 §2); the Foreign
      Minister's statements filed under B9 give Russia's own account of its ceasefire drafts. No
      Russian veto of a Gaza draft since March 2024 was found.
  B3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Russia filed no declaration of intervention in ICJ case 192 (the Court's list, docs/06 §8,
      names none). No statement in the sources read on the provisional-measures orders was found.
    queries:
