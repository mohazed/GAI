  A2:
    status: has-events
    note: >-
      Generated from Comtrade. Russia has not reported trade with Israel to Comtrade for 2022–2025
      (no own rows, docs/10 B-194), so Israel's mirror is used: HS 93 imports from Russia of USD
      30,000 (2022) and 5,000 (2025), none in 2023 and 2024, and no HS 8710 row; under USD 100,000,
      so 0 throughout. The mirror has no HS 8526 or 8802 imports from Russia (only Israeli exports
      of HS 8526 to Russia, USD 57,000 to 491,000 a year, which A2 does not count); no row was added
      to a2_confirmed_military.csv. No Russian document on arms exports to Israel was found in the
      sources searched; the Federal Service for Military-Technical Cooperation was not searched.
    queries:
      - en.kremlin.ru search "arms Israel", "sanctions Israel"
  A3:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      Russia is not a participant, supplier or customer in the F-35 programme; no document naming
      Russian companies as suppliers of F-35 parts or maintenance was found.
    queries:
      - en.kremlin.ru search "arms Israel"
  A4:
    status: unchecked
