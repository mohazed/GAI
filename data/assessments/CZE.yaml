  C2:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Two events: the declaration establishing a joint commission of the Czech and Israeli ministries
      of foreign affairs, signed by the two foreign ministers during Minister Macinka's visit to Israel
      of 14 April 2026 (evt_2026_04_14_CZE_C2), and the joint statement or agreement on economic
