    checked_at: 2026-09-29
    note: No public procurement exclusion of implicated companies found.
    queries:
      - mzv.gov.cz search (veřejné zakázky, vyloučení, osady)
  D1:
    status: has-events
    checked_at: 2026-09-29
    note: >-
      Generated. +1 in every window from 2023-02 on (the +3 tier needs 0.0005 % of GNI, about USD 1.79
      million): the highest twelve-month total is USD 1,621,646 (window 2025-04…2026-03, 0.00045 % of GNI
      USD 358.85 billion), the current window 2025-09…2026-08 USD 248,471. FTS totals by plan: USD 649,292
