  C1:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No Czech support for a review or suspension of the EU–Israel Association Agreement was found.
      Foreign Minister Macinka stated on 20 May 2026: "Nebudeme souhlasit s žádnými dalšími obchodními
      sankcemi, jakož ani s dalšími pokusy suspendovat či omezovat Asociační dohodu mezi EU a Izraelem"
      (src_20260520_mzv-cz_macinka-saar-forum). The Ministry's release on the Council of 20 May 2025
