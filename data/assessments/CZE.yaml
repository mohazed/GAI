      hospitals (D4 note). Part is in kind or outside the flash appeals, the known FTS gap (docs/06 §7);
      no disagreement with the generated value as defined.
  D2:
    status: none-found
    checked_at: 2026-09-29
    note: >-
      No UNRWA suspension found. Czechia is not listed as a donor in UNRWA's tables for 2022 and 2024
      (src_20221231_unrwa_donor-ranking-2022, src_20241231_unrwa_donor-ranking-2024), so there was no
      contribution to suspend. The Ministry stated on 23 October 2023 that development aid to the
      Palestinian territories was under review and no payments were planned until the review ended
      (release of the Foreign Affairs Council, not archived); that is not UNRWA funding. Czechia
      abstained on the UNRWA resolution of 11 December 2024, citing "operational shortcomings within
      UNRWA" (src_20241211_mzv-cz_eov-es-10-25-26).
    queries:
      - mzv.gov.cz search (UNRWA)
  D3:
