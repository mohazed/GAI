  B9:
    status: has-events
    note: 'evt_2024_09_25_SEN_B9 (+2, expired, flagged R7) and evt_2025_09_24_SEN_B9 (+5, flagged): President Bassirou Diomaye Diakhar Faye in the General Debate of the 79th session (25 September 2024:
      ''appelle à un cessez-le-feu immédiat et durable'', as Chair of the Committee on the Exercise of the Inalienable Rights of the Palestinian People) and of the 80th (24 September 2025: ''Gaza ne vit
      plus'', men, women and children ''privés de nourriture, d’eau et de soins de santé'', ''ferme condamnation de cette tragédie''). Read and not filed: (1) the 81st statement (24 September 2026, the
      President; sn_en.pdf and sn_fr.pdf, printouts of the Presidency''s page of 25 September 2026 that give the full text, read live): ''In Gaza, as throughout all occupied Palestinian territories, the
      human suffering is unacceptable, and the systematic violation of international law is intolerable'' and ''The time has come to act to put an end to the horror of massacres and destruction''. It is
      a +5 reading (a violation named as systematic, a call to end massacres) by a B9 speaker (R3, head of state), **not filed because the document cannot be archived**: the UN''s file has no Wayback capture
      and Save Page Now answers 405 (the attempt of 2026-11-04 failed and its index row was removed), and the Presidency''s page loads its text by script from an API that was not found, so no archived copy
      carries the words (docs/10 B-823; for the author and Task C: file it as a B9 event of +5 if an archived copy is made). (2) The Prime Minister''s Office''s reports in indirect speech (R4): the audience
      of the UN Committee (a Wednesday, 9 July, no year on the page: 2025), where the Prime Minister ''a réitéré le soutien indéfectible du Sénégal à la cause palestinienne''; the audience of the President
      of Türkiye, where the two ''ont exprimé ensemble leur indignation et condamné le génocide qui se déroule en Palestine'' (undated in the text read); the Council of Ministers of 1 October 2025, where
      the Prime Minister congratulates the President on his ''prises de position fermes et courageuses [...] particulièrement à Gaza''; the Council of 11 June 2025, where the President announces he will
      attend the Conference on Palestine of 17 to 19 June 2025. The Foreign Minister is not quoted in a statement. The Presidency''s own texts of the period were not searchable.'
    queries:
