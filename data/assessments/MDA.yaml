# `has-events` is set by the build from published events; hand-set values below are the research status for review.
# Generated indicators (D-08) are noted, never hand-authored.
# Search method (docs/06 §5): the Ministry of Foreign Affairs (mfa.gov.md) and its Embassy in Israel (israel.mfa.gov.md: the page of the bilateral legal
#   framework lists every signed instrument and is archived), the Government (gov.md, through a Wayback capture for the page of 2024), the Presidency
#   (presedinte.md), the Ministry of Justice (justice.gov.md), MOLDPRES, Radio Moldova, Radio Chișinău and Europa Liberă Moldova, the General Debate
#   statements of the United Nations (gadebate.un.org: the Moldovan statements of the 79th session through a Wayback capture and of the 80th by a direct
#   request, in English, searched for Gaza, Palestine, Israel and the Middle East: no passage; the 78th and 81st could not be read, no capture and not served),
#   the generated events and the structured tables; web searches in English and in Romanian per indicator group. Time: about 10 minutes.
# Statements read and not filed as B9 or B10: the Parliament's declaration of 19 October 2023 (condemns the attack of 7 October, recalls Israel's right of
#   self-defence, demands the release of the hostages, no word on Palestinian civilians; a parliament, not a B10 speaker), the President's and the Prime
#   Minister's messages of 7 to 9 October 2023 (condemnation and solidarity, press), the Foreign Minister's remarks of May 2024 on recognition (Moldova
#   'is not in a position to move further', two-state solution, Europa Liberă).
