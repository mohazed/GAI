      intelligence sharing with Israel related to the Gaza campaign was archived. Two leads: the
      IDF's participation in the US-led exercise African Lion 2025 in Morocco (press;
      lead_20260929_MAR_1), and Maersk ships carrying F-35 components that called at Tangier Med and
      Casablanca in November 2024 and April 2025 (press and NGO; the port authority said it did not
