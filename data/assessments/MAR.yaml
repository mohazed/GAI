# Coverage record for Morocco (docs/03 §6). P-D research session, wave 8, 2026-09-29.
# `has-events` is set by the build from published events; hand-set values below are the research
# status for review. Generated indicators (D-08) are noted but never hand-authored.
# Search method (docs/10 B-402):
# - Ministry of Foreign Affairs, African Cooperation and Moroccan Expatriates (diplomatie.ma,
#   Drupal, English and French): answers the first scripted request and then serves a JavaScript
#   bot check ("Request Rejected" or a challenge page), which was not bypassed. Its pages were read
#   in the built-in browser; its site search returns only the five best matches per query, so
#   candidate items were listed from the Wayback Machine's index of the site's English and French
#   addresses containing gaza, palestin, israel, al-qods/al-quds, unrwa, cessez or ceasefire (about
#   175 addresses) and from web searches restricted to diplomatie.ma, and about 15 items were read
#   in full (listed below). Fresh captures with pnpm archive succeeded (Save Page Now's crawler
#   received the pages).
# - UN general debate pages (gadebate.un.org) for sessions 78 to 81: the 79th-session statement of
#   the Head of Government (30 September 2024) is an Arabic PDF whose text layer is garbled; the 80th
#   and 81st sessions have only the UN's summaries (indirect speech), so none is filed (B-403 (3)).
# - UNRWA's donor tables for 2022 and 2024, fts_funding.csv, gni.csv, unga_votes.csv, the UN press
#   releases archived in votes.yaml, the joint statements of foreign ministers archived for Saudi
#   Arabia and the United Arab Emirates (Morocco is not a signatory of those of 2026).
# - Web search (English and French): the Foreign Minister's speeches on Gaza; the General Assembly
#   speeches of 2025 and 2026; the field hospital and the stabilisation force; agreements with Israel;
#   African Lion; the Maersk port calls; the liaison offices; protests and prosecutions.
# Items read in full on diplomatie.ma: 9 November 2023 (Paris conference, speech by a Director
# General, not a B9 speaker), 5 March 2024 (OIC, filed), 30 May 2024 (Beijing, filed), 24 June 2024
# (medical aid), 10 September 2024 (Cairo, indirect speech only), 11 September 2025 (filed),
# 26 March 2026 (West Bank, filed unscored); titles of the King's messages and speeches, the
# Ministry's statements of 20 March 2025 and 9 October 2025 and the Head of Government's
# representation of the King on 11 June 2024.
# Not searched or not readable: Arabic pages (the Ministry's Arabic service, the Maghreb Arabe
# Presse agency), the Head of Government's site (cg.gov.ma refuses scripted requests), the Royal
# Armed Forces and the Administration of National Defence, the Bulletin officiel, Parliament, the
# Ministry of Industry and Trade, the Caisse de dépôt et de gestion and pension funds (C5), the
# Public Prosecution and courts (E1, E3).
# Finish run, T-F-W8 (2026-11-09, docs/10 B-917 to B-920): window 27 September to 9 November 2026 read
# through maroc.ma (royal speeches: the speech at the opening of Parliament of 9 October 2026 does not
# mention Gaza or Palestine; news) and the Wayback index of diplomatie.ma (the site serves a bot check);
# no Moroccan act of the window found; the field hospital (lead_20260929_MAR_3) has no official record
# of deployment. E1 and E3 stay unchecked (web-search allowance used up). B8 unchanged.
