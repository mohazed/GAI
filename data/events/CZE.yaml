        Lines 3 to 9 of the Government Office's release re-read: the Prime Minister's quoted words state support without a time limit (line 4) and that the Czech Republic stands firmly by Israel's side (line 6); the release mentions no humanitarian law and no civilians in Gaza. B10 agrees.
    notes: >-
      The Government Office's release on the Prime Minister's visit to Israel (meetings with Prime Minister
      Netanyahu and President Herzog, 25 October 2023), quoting the Prime Minister. Read as a declaration of
      unconditional support under the standard applied to Germany's Chancellor (evt_2023_10_12_DEU_B10 on
