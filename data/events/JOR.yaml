# Hand-authored events for Jordan (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: King Abdullah II is head of state and is not a B9 speaker (as the King of Saudi Arabia, the President of
# the UAE and the Amir of Qatar, docs/10 B-382, B-390 (2), B-391 (3)). Ayman Safadi has been Deputy Prime Minister and
# Minister of Foreign Affairs and Expatriates throughout the window, the foreign-minister speaker; the Prime Ministers
# were Bisher Al-Khasawneh (to September 2024) and Jafar Hassan (from September 2024). Statements are read in the
# English service of the Jordan News Agency (Petra), the government's news agency; its items before about February 2026
# are no longer served by its site and are recorded from existing Wayback captures of their former addresses (docs/10
# B-397). B9 events are filed only on the speaker's own words (the full text of a speech, words the agency quotes
# directly) and on joint statements of foreign ministers, not on words reported in indirect speech, statements of the
# spokesperson or the Ministry, or further statements in the same weeks as a filed one, and only when the document
# cites Gaza (docs/10 B-381 (4), B-32). The English texts are the agency's own; the Arabic originals were not compared.

- id: evt_2023_11_01_JOR_B12
  revision: 1
  country: JOR
  indicator: B12
  type: standing
  date: '2023-11-01'
  end: null
  points: 5
  points_rationale: >-
    Ambassador recalled (+5): the Foreign Minister announced the immediate recall of the Jordanian ambassador to Israel
    on 1 November 2023, citing the war on Gaza, and told Israel that its ambassador, who had left Jordan, should not
    return; the return of ambassadors was tied to an end of the war on Gaza. No downgrade or severance of relations
    followed. No return of the ambassador was found to 29 September 2026, so the state is open.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Foreign Minister recalled Jordan's ambassador to Israel, citing the war on Gaza, and told Israel that its
      ambassador should not return.
    fr: >-
      Le ministre des Affaires étrangères a rappelé l'ambassadeur de Jordanie en Israël, en invoquant la guerre à Gaza,
      et a signifié à Israël que son ambassadeur ne devait pas revenir.
  actor:
    en: "Deputy Prime Minister and Minister of Foreign Affairs and Expatriates"
    fr: "Vice-Premier ministre et ministre des Affaires étrangères et des Expatriés"
    name: Ayman Safadi
  evidence:
  - source: src_20231101_petra_jordan-recalls-ambassador-israel
    quote: "Amman, Nov. 1 (Petra) -- Deputy Prime Minister and Minister of Foreign Affairs and Expatriates, Ayman Safadi, announced on Wednesday the immediate recall of the Jordanian ambassador to Israel."
    quote_lang: en
    locator: line 1
  - source: src_20231101_petra_jordan-recalls-ambassador-israel
    quote: "This decision stands as a firm representation of Jordan's condemnation and rejection of the raging Israeli war on Gaza, which has led to the killing of innocent civilians and an unprecedented severe humanitarian crisis."
    quote_lang: en
    locator: line 2
  - source: src_20231101_petra_jordan-recalls-ambassador-israel
    quote: "Moreover, Safadi directed the relevant department within the Ministry of Foreign Affairs and Expatriates to notify the Israeli foreign ministry that its ambassador, who had previously departed from Jordan, should not return for the time being."
    quote_lang: en
    locator: line 4
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The agency's item of 1 November 2023 (Wednesday; dated 01/11/2023 17:30:21 on line 9): line 1 the recall
        announced by the Foreign Minister, line 2 the decision tied to the war on Gaza, line 4 Israel's ambassador not
        to return, line 5 the return of ambassadors conditioned on Israel ceasing its war in Gaza. Recall tier agrees;
        scope gaza (the document cites Gaza).
    notes: >-
      No official record of a return was found; a press analysis read only in a search summary (Jordan News, "Jordan
      Between Two Costs in the West Bank File") says a new ambassador to Israel was appointed after the previous one
      retired but has not been dispatched. The end date stays null until an official record of a return is archived.

