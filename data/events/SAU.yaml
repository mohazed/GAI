# Hand-authored events for the Kingdom of Saudi Arabia (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: King Salman bin Abdulaziz Al Saud is head of state; Crown Prince Mohammed bin Salman bin Abdulaziz Al Saud has
# been Prime Minister (head of government) since September 2022 and is the B9/B10 speaker with the Minister of Foreign
# Affairs, Prince Faisal bin Farhan bin Abdullah. The statements are read in the English service of the Saudi Press Agency
# (spa.gov.sa), the official channel of the Royal Court, the Council of Ministers and the Ministry of Foreign Affairs; its
# pages carry their text in the page's Next.js data, extracted from the archived bytes (docs/10 B-381 (2)). B9 events are
# filed only on the speaker's own words (full texts of speeches, words the agency quotes directly) and on joint statements
# of foreign ministers, not on the Ministry's unsigned statements, the Council of Ministers' statements or words reported
# in indirect speech, and only when the document cites Gaza (the scope rule, docs/10 B-32, read literally as B-371 (4);
# docs/10 B-381 (4)). The English texts are the agency's own; the Arabic originals were not compared.

- id: evt_2023_10_24_SAU_B9
  revision: 1
  country: SAU
  indicator: B9
  type: repeatable
  date: '2023-10-24'
  points: 5
  points_rationale: >-
    Specific violations named (+5): at the Security Council the Foreign Minister called for an immediate stop to the
    collective punishment of the people of Gaza and to attempts at forced displacement, and named the blockade and the
    targeting of schools and hospitals in the Gaza Strip.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Foreign Minister called at the UN Security Council for an immediate stop to the collective punishment of the
      people of Gaza and to attempts at forced displacement.
    fr: >-
      Le ministre des Affaires étrangères a appelé au Conseil de sécurité des Nations unies à l'arrêt immédiat de la
      punition collective de la population de Gaza et des tentatives de déplacement forcé.
  actor:
    en: "Minister of Foreign Affairs"
    fr: "Ministre des Affaires étrangères"
    name: Faisal bin Farhan bin Abdullah
  evidence:
  - source: src_20231025_spa_fm-security-council-gaza
    quote: "He added: \"What we have witnessed is the international community's negligence so far to work to immediately stop the collective punishment carried out by the Israeli war machine against the people of Gaza and attempts at forced displacement that will not bring us any closer to the security and stability that we all seek.\""
    quote_lang: en
    locator: line 9
  - source: src_20231024_un-press_sc15462
    quote: "Condemning the targeting of civilians, he called for an end of the escalation of military operations, adding that the blockade and hostilities are causing suffering for the Palestinians."
    quote_lang: en
    locator: line 81
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 2 names the Minister and the Security Council session on the Middle East, including the Palestinian
        question (dateline New York, 25 October 2023); line 9 quotes him directly. Line 8 (reported speech) names the
        blockade and the targeting of schools and hospitals in the Gaza Strip. Specific-violations tier agrees
        (collective punishment, forced displacement). SC/15462 (the 9451st meeting, 24 October 2023, in the page
        header) line 81 records the Minister's statement at that meeting, with the blockade and collective punishment
        on Gaza: the date agrees.
    notes: >-
      Dated on the day of the Council's 9451st meeting (24 October 2023), where the UN's meetings coverage SC/15462
      records his statement (line 81); the agency's item is datelined New York, 25 October 2023, and does not state the
      day of the session (docs/10 B-382 (1)). His statement at the Council of 30 November 2023 ("what brings us closer to the solution is a ceasefire") is not
      filed as a separate event (docs/10 B-381 (4)).

- id: evt_2023_11_11_SAU_B9
  revision: 1
  country: SAU
  indicator: B9
  type: repeatable
  date: '2023-11-11'
  points: 5
  points_rationale: >-
    Specific violations named and a legal characterisation (+5): opening the Joint Arab-Islamic Extraordinary Summit,
    the Crown Prince and Prime Minister demanded an immediate halt to military operations, rejected the forced
    displacement of the population of Gaza, called for lifting the siege and spoke of flagrant Israeli violations of
    international humanitarian law.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Crown Prince and Prime Minister demanded an immediate halt to military operations in Gaza and rejected the
      forced displacement of its population.
    fr: >-
      Le prince héritier et Premier ministre a exigé l'arrêt immédiat des opérations militaires à Gaza et rejeté le
      déplacement forcé de sa population.
  actor:
    en: "Crown Prince and Prime Minister"
    fr: "Prince héritier et Premier ministre"
    name: Mohammed bin Salman bin Abdulaziz Al Saud
  evidence:
  - source: src_20231111_spa_crown-prince-arab-islamic-summit
    quote: "We now reiterate our demands for an immediate halt to military operations, for the provision of humanitarian corridors to aid civilians, and for enabling international humanitarian organizations to perform their role."
    quote_lang: en
    locator: line 16
  - source: src_20231111_spa_crown-prince-arab-islamic-summit
    quote: "The Kingdom categorically rejects the continued aggression, occupation and forced displacement of the population of Gaza."
    quote_lang: en
    locator: line 21
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 2: Riyadh, 11 November 2023, the Crown Prince and Prime Minister, deputizing for the King, chaired and
        inaugurated the summit; line 5 introduces his speech, lines 6 to 22 are its text. Line 16 demands an immediate
        halt to military operations; line 18 names flagrant Israeli violations of international humanitarian law;
        line 19 calls for lifting the siege; line 21 rejects forced displacement of the population of Gaza. Tier
        agrees.
    notes: >-
      Speaking on behalf of the King does not change the speaker: the words are the head of government's. The summit's
      collective resolution (agency item of the same day) is not a Saudi statement and is not filed.

