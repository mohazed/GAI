# Hand-authored events for the Kingdom of Saudi Arabia (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: King Salman bin Abdulaziz Al Saud is head of state; Crown Prince Mohammed bin Salman bin Abdulaziz Al Saud has
# been Prime Minister (head of government) since September 2022 and is the B9/B10 speaker with the Minister of Foreign
# Affairs, Prince Faisal bin Farhan bin Abdullah. The statements are read in the English service of the Saudi Press Agency
# (spa.gov.sa), the official channel of the Royal Court, the Council of Ministers and the Ministry of Foreign Affairs; its
# pages carry their text in the page's Next.js data, extracted from the archived bytes (docs/10 B-381 (2)). B9 events are
# filed only on the speaker's own words (full texts of speeches, words the agency quotes directly) and on joint statements
# of foreign ministers, not on the Ministry's unsigned statements, the Council of Ministers' statements or words reported
# in indirect speech, and only when the document cites Gaza (the scope rule, docs/10 B-32, read literally as B-371 (4);
# docs/10 B-381 (4)). The English texts are the agency's own; the Arabic originals were not compared.

