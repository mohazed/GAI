- id: evt_2024_04_05_COL_B3
  revision: 1
  country: COL
  indicator: B3
  type: standing
  date: '2024-04-05'
  end: '2026-09-18'
  points: 15
  points_rationale: >-
    Declaration of intervention (+15) under Article 63 in ICJ case 192, supporting the applicant: Colombia states that
    it intervenes to assist the Court in finding the responsibility of any State Party for failing to comply with the
    Convention, in the situation in the Gaza Strip. Ended on 18 September 2026, when the withdrawal was filed.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The government filed a declaration of intervention in the ICJ case South Africa v. Israel on genocide in Gaza, and
      withdrew it on 18 September 2026.
    fr: >-
      Le gouvernement a déposé une déclaration d'intervention dans l'affaire Afrique du Sud c. Israël devant la CIJ sur
      le génocide à Gaza, puis l'a retirée le 18 septembre 2026.
  actor:
    en: "Government of Colombia"
    fr: "Gouvernement de la Colombie"
  evidence:
  - source: src_20240405_cancilleria_declaracion-intervencion-cij
    quote: "The Government of Colombia submits the present Declaration of Intervention in the genuine belief that the States parties to the Genocide Convention should do everything in their power to contribute to ensure the prevention, suppression and punishment of genocide and therefore, to assist the Court in finding the responsibility of any State Party to the Convention, for its failure to comply with the obligations contained therein, especially in the context of such a dramatic situation as that unfolding in the Gaza Strip."
    quote_lang: en
    locator: lines 1894–1899 (paragraph 186)
  - source: src_20260922_cancilleria_retiro-intervencion-cij
    quote: "La comunicación de retiro fue radicada ante la Corte el 18 de septiembre de 2026."
    quote_lang: es
    quote_en: "The communication of withdrawal was filed with the Court on 18 September 2026."
    locator: line 75
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The declaration is dated 5 April 2024 (line 1942), signed by the Agent, Ambassador Juan José Quintana; its
        conclusion (paragraphs 185–189) states the purpose of assisting the Court in finding responsibility for
        failure to comply with the Convention in the Gaza Strip, and paragraph 188 asks the Court to ensure the
        existence of the Palestinian people as a protected group, citing the provisional-measures orders of 26 January
        and 28 March 2024: the direction supports the applicant, so B3, not B4. The withdrawal (line 73 names the
        declaration "presentada el 5 de abril de 2024"; line 75 the filing of the withdrawal on 18 September 2026)
        ends the standing state, as docs/02 §2 states for Colombia.
    notes: >-
      Section IV of the declaration (paragraphs 29–183) sets out Colombia's construction of Articles I to III; it was
      read for direction, not summarised here. The ICJ's own press releases (5 April 2024, 22 September 2026) answer
      403 to scripted requests and were not archived.

