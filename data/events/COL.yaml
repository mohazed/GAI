# Hand-authored events for the Republic of Colombia (P-D research session, wave 7, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: President Gustavo Petro (head of state and government to 7 August 2026), the Ministers of Foreign
# Affairs Luis Gilberto Murillo (acting, then Minister, 2024) and Rosa Yolanda Villavicencio (acting from July 2025,
# then Minister). B9 events are filed only on the speaker's own words quoted verbatim in an official publication, and
# on joint statements the Minister agreed with counterparts (as data/wave-6, B-351 (1)); not on the Ministry's
# unsigned communiqués issued in the name of "el Gobierno de Colombia" or "el Ministerio", nor on posts on X that the
# Presidency reported (docs/06 §7; docs/10 B-356). Spanish texts are quoted in Spanish with this session's English
# translation beside them, except where the Ministry published its own English version.

