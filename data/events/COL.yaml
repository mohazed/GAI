- id: evt_2024_08_14_COL_A6
  revision: 1
  country: COL
  indicator: A6
  type: standing
  date: '2024-08-14'
  end: null
  points: 10
  points_rationale: >-
    Partial suspension (+10): a decree prohibiting exports of thermal coal to Israel until the ICJ's provisional
    measures in the Gaza genocide case are fully complied with; tightened by Decree 0949 of 2025 to apply without
    exception. Filed as A6 as Türkiye's export restriction of 9 April 2024 (data/wave-2), flagged for the author.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The President signed Decree 1047 of 2024 prohibiting exports of thermal coal to Israel until the ICJ's provisional
      measures on Gaza are complied with.
    fr: >-
      Le président a signé le décret 1047 de 2024 interdisant les exportations de charbon thermique vers Israël jusqu'à
      l'exécution des mesures conservatoires de la CIJ sur Gaza.
  actor:
    en: "Government of Colombia (Ministry of Commerce, Industry and Tourism)"
    fr: "Gouvernement de la Colombie (ministère du Commerce, de l'Industrie et du Tourisme)"
  evidence:
  - source: src_20240814_mincit_decreto-1047-carbon-israel
    quote: "Artículo 1°. Prohibición de exportaciones. Se prohíben las exportaciones al Estado de Israel de las Hullas térmicas (Carbón), clasificadas por la subpartida arancelaria 2701 .12.00.10."
    quote_lang: es
    quote_en: "Article 1. Prohibition of exports. Exports to the State of Israel of thermal coal, classified under tariff subheading 2701.12.00.10, are prohibited."
    locator: lines 250–251
  - source: src_20240814_mincit_decreto-1047-carbon-israel
    quote: "tendrá vigencia hasta que se cumplan a cabalidad las ordenes de medidas provisionales emitidas por la Corte Internacional de Justicia en el Proceso de la aplicación de la Convención para la Prevención y la Sanción del Delito de Genocidio en la Franja de Gaza (Sudáfrica c. Israel)."
    quote_lang: es
    quote_en: "shall remain in force until the provisional-measures orders issued by the International Court of Justice in the proceedings on the application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip (South Africa v. Israel) are fully complied with."
    locator: lines 295–298 (Article 4)
  - source: src_20241231_mincit_decretos-2024
    quote: "Decreto 1047 del 14 de agosto de 2024, \"por el cual se establece una prohibición a las exportaciones de carbón a Israel\"."
    quote_lang: es
    quote_en: "Decree 1047 of 14 August 2024, \"establishing a prohibition on exports of coal to Israel\"."
    locator: line 15
  - source: src_20250828_mincit_decreto-0949-carbon-israel
    quote: "Artículo 3. A partir de la entrada en vigor del presente Decreto, queda estrictamente prohibida la realización de exportaciones de carbón al Estado de Israel bajo cualquier circunstancia."
    quote_lang: es
    quote_en: "Article 3. From the entry into force of this Decree, exports of coal to the State of Israel are strictly prohibited under any circumstances."
    locator: lines 465–467
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The decree's title and Article 1 (lines 250–251) prohibit coal exports to Israel; Article 4 (lines 294–298)
        ties the measure to the ICJ's orders in the Gaza case; the recitals (from line 44) cite the Gaza orders and
        link coal to electricity used by Israel's military industry. The date (14 August 2024) is the Ministry's
        listing (line 15), the decree's own date line being illegible in the scan; it entered into force five days
        after publication in the Diario Oficial (not read). Decree 0949 of 28 August 2025 removed the exceptions
        (Articles 1 to 3, lines 459–467). No repeal was found to 29 September 2026 (the Ministry's 2026 decree list
        has no decree on coal or Israel). Indicator choice flagged (docs/10 B-357 (1)).
    notes: >-
      A6 by analogy with Türkiye's restriction of exports of product groups to Israel (evt_2024_04_09_TUR_A6 on
      data/wave-2); coal is not a military good, so the author may read this as a trade measure outside A6 (docs/10
      B-357 (1)). Decree 0949 of 2025 is the same standing measure, not a second event.

