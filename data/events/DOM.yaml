    notes: 'Signed on 31 October 2024 in Santo Domingo, as the Ministry''s treaties database records it (entry into force the same day) and its news item of 2 November 2024 confirms; the two Ministry
      pages are the primaries (kind official). Flagged, as the technical instruments filed for other countries under R18 (docs/10 B-526, B-536): the counterpart is Israel''s development cooperation
      agency, signing through the Israeli Ambassador, and the project is a technical-education programme financed by a reimbursable cooperation, not a trade or security instrument; a reader who
      counts only instruments with a trade or security purpose would remove it. The agreement is a standing C2 event (-10, no decay, category C capped at -20). It is 705 days old, so it is not
      a qualifying event for the passivity penalty (the window is 365 days): it lowers the score without lifting the penalty. The other Israeli instruments in the Ministry''s treaties database
      pre-date the war (air services agreement of 21 February 2019, a memorandum with Achva Academic College of 6 September 2023, an export agreement of 1997, an aerospace training agreement of
      2010) and are not filed. President Abinader''s meeting with Israel''s President Isaac Herzog in San José on 9 May 2026 produced no instrument (the Ministry''s release names none).'
