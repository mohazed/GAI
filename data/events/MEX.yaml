- id: evt_2024_05_24_MEX_B3
  revision: 1
  country: MEX
  indicator: B3
  type: standing
  date: '2024-05-24'
  end: null
  points: 15
  points_rationale: >-
    Declaration of intervention (+15) under Article 63 in ICJ case 192, filed on 24 May 2024 (the Court's report to
    the General Assembly). Read as supporting the applicant: the Foreign Secretary presented it to the General
    Assembly as Mexico's answer to the situation in Gaza, and the President describes it as accompanying the
    complaint in The Hague. No withdrawal found.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The government filed a declaration of intervention in the ICJ case South Africa v. Israel on genocide in Gaza.
    fr: >-
      Le gouvernement a déposé une déclaration d'intervention dans l'affaire Afrique du Sud c. Israël devant la CIJ
      sur le génocide à Gaza.
  actor:
    en: "Government of Mexico"
    fr: "Gouvernement du Mexique"
  evidence:
  - source: src_20240801_undocs_a-79-4-icj-report
    quote: "On 24 May 2024, Mexico, invoking Article 63 of the Statute of the Court, filed a declaration of intervention in the case."
    quote_lang: en
    locator: "paragraph 231 (lines 2332-2333)"
  - source: src_20240928_sre_barcena-debate-general-onu
    quote: "“La humanidad se quiebra en Gaza ante la inacción de la comunidad internacional”. Por eso, México solicitó intervenir en el caso iniciado por Sudáfrica ante la Corte Internacional de Justicia (CIJ) sobre la aplicación de la Convención Internacional contra el Genocidio."
    quote_lang: es
    quote_en: "\"Humanity is breaking in Gaza in the face of the international community's inaction.\" That is why Mexico requested to intervene in the case brought by South Africa before the International Court of Justice (ICJ) on the application of the International Convention against Genocide."
    locator: line 16
  - source: src_20251006_presidencia_conferencia-6-octubre-2025
    quote: "Y hemos, desde el primer momento, incluso cuando estaba el Presidente López Obrador, acompañamos con distintos países una denuncia en La Haya."
    quote_lang: es
    quote_en: "And from the first moment, even when President López Obrador was in office, we accompanied, with various countries, a complaint in The Hague."
    locator: line 361
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        A/79/4 paragraph 231, in the section on case 192 (South Africa v. Israel), between the order of 24 May 2024
        and Palestine's filing of 31 May 2024: the filing date and Article 63 agree. The direction is read from the
        Foreign Secretary's words at the General Debate (Ministry release of 28 September 2024, which puts the
        request to intervene right after her sentence on Gaza) and the President's words of 6 October 2025 (the
        intervention "accompanied" the complaint); the declaration itself could not be read (the ICJ's copy is HTTP
        403 in every Wayback capture), so B3 rather than B4 rests on these statements, as Chile's rested on its
        Ministry's summary. No withdrawal was found in the Ministry's listing or the President's transcripts to 28
        September 2026; the President said on 2 October 2025 that the government is following the case up.
    notes: >-
      No Ministry release announcing the filing was found in the Ministry's press listing (May and June 2024), and
      the President's transcripts of May 2024 (López Obrador) could not be read (docs/10 B-366 (2)). The
      declaration's text should be read when the ICJ copy can be archived (P-16).

- id: evt_2024_12_31_MEX_D3
  revision: 1
  country: MEX
  indicator: D3
  type: standing
  date: '2024-12-31'
  end: null
  points: 8
  points_rationale: >-
    Increased tier (+8): UNRWA's tables give a confirmed pledge of USD 1,000,000 from Mexico for 2024 against USD
    750,000 pledged for 2022; Mexico never suspended (D2 none-found). The 2024 table shows nothing received by 31
    December 2024; the comparison is pledge with pledge, the 2022 table being a table of pledges (docs/10 B-367 (3)).
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      Mexico's pledge to UNRWA for 2024 exceeded its 2022 pledge in UNRWA's donor tables.
    fr: >-
      L'annonce de contribution du Mexique à l'UNRWA pour 2024 a dépassé celle de 2022 dans les tableaux des
      donateurs de l'UNRWA.
  actor:
    en: "Government of Mexico"
    fr: "Gouvernement du Mexique"
  evidence:
  - source: src_20241231_unrwa_donor-ranking-2024
    quote: "Mexico 1,000,000 - - - 1,000,000 - - - - - - - - - - - - - - - 1,000,000 56 - -"
    quote_lang: en
    locator: line 92 (row Mexico)
  - source: src_20221231_unrwa_donor-ranking-2022
    quote: "Mexico 750,000 0 750,000 0 0 0 750,000 39"
    quote_lang: en
    locator: line 48 (row Mexico)
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The 2024 table ("Confirmed pledges and received ... as of 31 December 2024") lists Mexico with USD 1,000,000
        pledged to the programme budget and "-" received; the 2022 table ("2022 Pledges to UNRWA's Programmes ... as
        31 Dec 2022") lists USD 750,000. 1,000,000 > 750,000 in nominal USD: increased tier agrees on pledges. The
        Ministry's release of 30 July 2024 (read, not archived) reaffirms Mexico's financial support for UNRWA and
        mentions no suspension.
    notes: "Dated at the end of the 2024 table, as evt_2024_12_31_COL_D3 and evt_2024_12_31_CHL_D3. Flagged: nothing had been received by 31 December 2024 (docs/10 B-367 (3)). P-16 (docs/10 B-445): UNRWA's table for 2023, archived since, shows the 2023 contribution above 2022 as well: evt_2023_12_31_MEX_D3 holds the increased tier from 31 December 2023, and this event from 31 December 2024."

