# Hand-authored events for the United Mexican States (P-D research session, wave 7, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: President Andrés Manuel López Obrador (head of state and government to 30 September 2024) and
# Foreign Secretary Alicia Bárcena Ibarra (to 30 September 2024); President Claudia Sheinbaum Pardo from 1 October
# 2024, with Foreign Secretaries Juan Ramón de la Fuente and, by September 2026, Roberto Velasco Álvarez. B9 events
# are filed only on the speaker's own words: the President's words in the Presidency's official transcripts
# (versiones estenográficas) and the Secretary's words quoted verbatim in the Ministry's releases; not on the
# Ministry's unsigned communiqués issued in the name of "el Gobierno de México" or "México", nor on addresses by
# ambassadors (docs/10 B-366 (3), as B-356 (3) and B-361 (4)). Spanish texts are quoted in Spanish with this
# session's English translation beside them.

