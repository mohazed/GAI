- id: evt_2025_09_23_LBN_B9
  revision: 1
  country: LBN
  indicator: B9
  type: repeatable
  date: '2025-09-23'
  points: 2
  points_rationale: 'Formal call for a ceasefire (+2): the President says that Lebanon''s moral, human and political duty is to put an immediate end to what is happening in Gaza and calls for a new political
    process; no violation is named (flagged: read as a call to end the war, as ''This war must end now'').'
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The President told the General Assembly that ending the situation in Gaza immediately was a moral, human and political duty, and called for a new political process.
    fr: Le président a déclaré devant l'Assemblée générale que mettre fin immédiatement à la situation à Gaza était un devoir moral, humain et politique, et a appelé à un nouveau processus politique.
  actor:
    en: President of the Republic
    fr: Président de la République
    name: Joseph Aoun
  evidence:
  - source: src_20250923_un-gadebate_lbn-aoun-fr
    quote: Pour cela notre devoir moral, humain et politique est de mettre une fin immédiate à la tragédie qui se déroule à Gaza. Nous appelons à la relance d’un nouveau processus politique
    quote_lang: fr
    quote_en: For this reason our moral, human and political duty is to put an immediate end to the tragedy unfolding in Gaza. We call for the relaunch of a new political process
    locator: lines 195 to 198
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-11-04'
    second_read:
      by: claude-opus-5-5
      at: '2026-11-04'
      verdict: agree
      notes: 'Lines 1 to 5 (the President Joseph Aoun, Tuesday 23 September 2025) and lines 184 to 200 re-read: the sentence follows the passage on Lebanon''s southern border and resolution 1701 and
        precedes the call for a political process on the two-State solution. ''Mettre une fin immédiate à la tragédie qui se déroule à Gaza'' read at the call tier; no violation is named in the passage;
        flagged.'
    notes: 'The 80th General Debate statement of Lebanon, delivered in French by the President Joseph Aoun (head of state, R3), archived from its Wayback capture (no English or Arabic file). Flag: the
      sentence says it is Lebanon''s duty to put an immediate end to the tragedy unfolding in Gaza, which is read as a call to end the war at the call tier, as ''This war must end now'' (evt_2024_09_25_CYP_B9)
      and ''It is time for the war to end'' (evt_2024_06_06_PRT_B9); without that reading there is no B9 event for Lebanon. The President''s demand for an end to ''the Israeli aggressions'' on Lebanon (line
      184) concerns Lebanon, not Gaza. The event is 407 days old at the build date and is not a qualifying event inside 365 days. Not filed: the 79th statement (the Foreign Minister Abdallah Bou Habib,
      26 September 2024, Arabic, more than 730 days old); the 81st statement (September 2026, Arabic, no speaker in the file: ''the tragedy of wounded Gaza has put the conscience of the world … to a test'',
      no call, no violation named); the Presidency''s pages of 16 January 2025 and 30 September 2025 (the President''s welcome of the Gaza agreement and of the US plan, in the Presidency''s indirect speech,
      R4). Filed in the light protocol (docs/10 B-765 ff.).'

