# Hand-authored events for Hungary (P-D research session, wave 5, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: the Prime Minister is the head of government (Viktor Orbán to May 2026, then Péter
# Magyar); the Minister of Foreign Affairs and Trade is the foreign minister (Péter Szijjártó to May
# 2026; Anita Orbán, Deputy Prime Minister and Minister of Foreign Affairs, from May 2026).
# Releases of the Ministry are filed as B9 events only for the Minister's own words quoted in them
# (docs/10 B-314). The previous government's pages are served from the archive site
# 2020-2025.kormany.hu since the change of government.
- id: evt_2024_01_03_HUN_B10
  revision: 1
  country: HUN
  indicator: B10
  type: repeatable
  date: '2024-01-03'
  points: -5
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Prime Minister stated that the Israeli state had the right to defend itself and to do everything so that such an
      attack would not happen again.
    fr: >-
      Le Premier ministre a déclaré que l'État israélien avait le droit de se défendre et de tout faire pour qu'une telle
      attaque ne se reproduise pas.
  actor:
    en: Prime Minister
    fr: Premier ministre
    name: Viktor Orbán
  evidence:
  - source: src_20240103_kormany-hu_orban-nemzetkozi-sajtotajekoztato
    quote: >-
      Magyarország abba a csoportba tartozik – nem vagyunk sokan –, amely azt mondja ennek a konkrét esetnek a kapcsán, hogy
      nekünk stratégiai érdekünk fűződik Izrael stabilitásához. Ezért az izraeli államnak joga van magát megvédeni, és joga van
      mindent megtenni azért, hogy még egyszer ilyen helyzetbe, terrortámadott helyzetbe ne kerüljön.
    quote_lang: hu
    quote_en: >-
      Hungary belongs to the group – there are not many of us – that says in this specific case that we have a strategic
      interest in Israel's stability. Therefore the Israeli state has the right to defend itself, and has the right to do
      everything so that it never again gets into such a situation, a situation of terrorist attack.
    locator: line 44
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 44 re-read: the Prime Minister's answer at the press conference; the right "to do everything" without reference to humanitarian law; B10 agrees.
    notes: >-
      The Prime Minister's answer at his international press conference of 3 January 2024 (official transcript), on
      the EU Council's discussion of Israel's war. Filed under the standard applied to Germany's Chancellor and
      Czechia's Prime Minister (docs/10 B-308): support stated as a right "to do everything", without reference to
      international humanitarian law or to civilians in Gaza. The Prime Minister's radio interview of 13 October 2023
      also stated Israel's right to take steps but paired it with a call for de-escalation, and is not filed. Decayed to
      zero.

