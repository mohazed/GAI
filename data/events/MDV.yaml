    quote: THE HAGUE, 2 October 2024. Yesterday, the Maldives, invoking Article 63 of the Statute of
    quote_lang: en
    locator: line 13
  - source: src_20241001_icj_192-declaration-maldives
    quote: genocide and supports the work of the Court in these proceedings.
    quote_lang: en
    locator: line 73 (paragraph 6)
  - source: src_20241001_icj_192-declaration-maldives
    quote: definition require a genocidal policy or plan.
    quote_lang: en
