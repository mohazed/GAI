  summary:
    en: >-
      Norway took part in the F-35 supply chain through Norwegian companies that produce and maintain
      parts for the aircraft, with deliveries planned to 2034.
    fr: >-
      La Norvège a participé à la chaîne d'approvisionnement du F-35 par des entreprises norvégiennes
      qui produisent et entretiennent des pièces de l'appareil, avec des livraisons prévues jusqu'en 2034.
  actor:
    en: Ministry of Defence
    fr: Ministère de la Défense
  evidence:
  - source: src_20190515_regjeringen_kitron-f-35
    quote: >-
      Det norske elektronikkprodusenten Kitron er tildelt en kontrakt fra Harris Corporation for produksjon
      av Integrated Backplane Assembly (IBA) for F-35 Joint Strike Fighter.
    quote_lang: nb
    quote_en: >-
      The Norwegian electronics manufacturer Kitron has been awarded a contract by Harris Corporation
      for the production of the Integrated Backplane Assembly (IBA) for the F-35 Joint Strike Fighter.
    locator: line 2
  - source: src_20190515_regjeringen_kitron-f-35
    quote: >-
      Så langt i produksjonsfasen har dette gitt kontrakter til en verdi av i overkant av 4,5 mrd. kroner,
      og det planlegges med leveranser frem til 2034.
    quote_lang: nb
    quote_en: >-
      So far in the production phase this has given contracts worth just over NOK 4.5 billion, and deliveries
      are planned until 2034.
    locator: line 8
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: >-
        Lines 2, 8 and 9 of the Ministry of Defence release re-read: Kitron produces the IBA for the F-35;
        contracts over NOK 4.5 billion, deliveries planned to 2034; European component maintenance for
        the F-35 partnership. A national ministry statement naming a Norwegian supplier of F-35 parts;
        A3 standing agrees.
    notes: >-
      Pre-existing participation, a standing state from 2023-10-07 (docs/02 §2 A3), on a national ministry
      statement, one of the three document kinds the indicator names: the Ministry of Defence's release
      of 15 May 2019 names Kitron as producer of the Integrated Backplane Assembly for the F-35, states
      Norwegian industry contracts of over NOK 4.5 billion for parts production for the aircraft and engine
      with deliveries planned to 2034, and European component-maintenance assignments for the F-35 partnership
      (line 9). Israel is an F-35 user; A/HRC/59/23 does not name Norway. No halt was found: the Minister
      of Foreign Affairs told the Storting on 23 April 2024 that exports of parts and components to the
      United States are assessed with the United States as recipient (Dokument nr. 15, answer to Ingrid
      Fiskaa, read, not archived), and on 26 February 2024 that Norway has no F-35 parts depot like the
      Dutch one; Norway does not permit exports of weapons, ammunition or dual-use goods for military
      end use to Israel (A6 none-found, pre-existing policy). No end (docs/10 B-278 (1)).

