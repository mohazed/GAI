    quote: "First, the parties to the conflict must end hostilities and achieve a ceasefire immediately, stop all violence and attacks against civilians, release civilians held captive, and act to prevent loss of more lives and spare people from more miseries. Second, humanitarian corridors must be kept secure and unimpeded, and more humanitarian assistance should be provided to the population in Gaza. The collective punishment of people in Gaza in the form of forced transfer or water, electricity and fuel deprivation must stop."
