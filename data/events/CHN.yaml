    locator: line 10
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 1-6 re-read: remarks of President Xi Jinping at the extraordinary joint meeting of BRICS leaders on the
        Middle East with particular reference to Gaza, 21 November 2023. Line 10 holds the call for an immediate
        ceasefire and the sentence on collective punishment in the form of forced transfer and deprivation of water,
        electricity and fuel. Names-violations tier agrees.
    notes: >-
      Remarks at the extraordinary joint meeting of BRICS leaders and leaders of invited members (virtual), 21
      November 2023; the English text of the Ministry's Speeches page. The President is the head of state; he is filed
      as a B9 speaker as France's President is on data/wave-1 (docs/10 B-342 (2)).

