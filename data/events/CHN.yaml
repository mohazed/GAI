  scope:
  - gaza
  summary:
    en: >-
      The Minister of Foreign Affairs and Arab ministers condemned the famine and blockade imposed on Gaza's
      population and the forced displacement of Palestinians.
    fr: >-
      Le ministre des Affaires étrangères et les ministres arabes ont condamné la famine et le blocus imposés à la
      population de Gaza et le déplacement forcé des Palestiniens.
  actor:
    en: "Minister of Foreign Affairs"
    fr: "Ministre des Affaires étrangères"
    name: Wang Yi
  evidence:
  - source: src_20240530_mfa-cn_china-arab-joint-statement-palestine
    quote: "双方谴责以色列对巴勒斯坦人民的持续侵犯。加沙地带已有12.5万巴勒斯坦平民死伤，其中大部分是妇女和儿童。加沙地带巴勒斯坦民众被迫遭受致命饥荒与封锁，断绝一切生计，加沙地带居民区、医院、学校、清真寺、教堂和基础设施均遭系统性破坏，数千名巴勒斯坦囚犯遭扣押与虐待。"
    quote_lang: zh
    quote_en: "The two sides condemn Israel's continuing aggression against the Palestinian people. 125,000 Palestinian civilians in the Gaza Strip have been killed or injured, most of them women and children. The Palestinian people in the Gaza Strip are forced to endure deadly famine and blockade and are cut off from all means of livelihood; residential areas, hospitals, schools, mosques, churches and infrastructure in the Gaza Strip have been systematically destroyed, and thousands of Palestinian prisoners are detained and abused."
    locator: line 3
  - source: src_20240530_mfa-cn_china-arab-joint-statement-palestine
    quote: "双方要求安理会出台有约束力的决议，实现立即全面持续停火，停止强制迁移巴勒斯坦人民，保障救援物资运送至加沙全境"
    quote_lang: zh
    quote_en: "The two sides ask the Security Council to adopt a binding resolution to achieve an immediate, comprehensive and sustained ceasefire, stop the forced displacement of the Palestinian people and guarantee the delivery of relief supplies to the whole of Gaza"
    locator: line 6
  - source: src_20240530_fmprc_wang-yi-china-arab-ministerial
    quote: "The current situation in Gaza is unsustainable. An unconditional and immediate ceasefire is an international consensus. Improvement of humanitarian conditions on the ground is an urgent imperative."
    quote_lang: en
    locator: line 19
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Lines 1-6 of the joint statement re-read: adopted at the 10th Ministerial Conference of the China-Arab States
        Cooperation Forum, Beijing, 30 May 2024 (line 1); point 1 (line 3) condemns the famine and blockade and the
        systematic destruction of hospitals and other facilities; point 4 (line 6) asks for a binding Security Council
        resolution for an immediate ceasefire and an end to forced displacement. The Minister's remarks of the same
        day (line 19) re-read: immediate ceasefire as an international consensus. The translations match the Chinese.
        Names-violations tier agrees.
    notes: >-
      The joint statement is published in Chinese only (translations are this session's). The Foreign Minister led
      China's side at the ministerial conference; his remarks of the same day are the second evidence. Point 5 of the
      joint statement supports the ICJ's provisional-measures orders of 26 January, 28 March and 24 May 2024 (recorded
      in the B3 note; no intervention was filed). The President's keynote of the same day ("War should not continue
      indefinitely") names no ceasefire and is not a separate event.

