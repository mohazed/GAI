# Hand-authored events for China (P-D research session, wave 6, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: President Xi Jinping (head of state; filed as a B9 speaker as France's President is on
# data/wave-1, docs/10 B-342 (2)), Premier Li Qiang (head of government; no Gaza call found in his
# speeches read) and Foreign Minister Wang Yi. B9 events are filed only on the speaker's own formal
# words: speeches and statements published in full in his name, and joint statements he agreed with
# his counterparts; not on the Ministry's accounts of meetings, telephone talks or messages in
# indirect speech, on answers at press conferences (the Foreign Minister's annual press conference
# included), or on the Spokesperson's remarks and briefings (docs/10 B-342 (1); B-332 and B-337 for
# Japan and Korea). English quotes are from the Ministry's English texts (the Chinese text is the
# original); texts published in Chinese only are quoted in Chinese with this session's translation.

- id: evt_2023_11_21_CHN_B9
  revision: 1
  country: CHN
  indicator: B9
  type: repeatable
  date: '2023-11-21'
  points: 5
  points_rationale: >-
    Names violations (+5): the President said the collective punishment of people in Gaza in the form of forced
    transfer or water, electricity and fuel deprivation must stop, and called for an immediate ceasefire.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The President of the People's Republic of China called for an immediate ceasefire in Gaza and for an end to the
      collective punishment of its people through forced transfer and deprivation.
    fr: >-
      Le président de la République populaire de Chine a appelé à un cessez-le-feu immédiat à Gaza et à la fin de la
      punition collective de sa population par le transfert forcé et les privations.
  actor:
    en: "President of the People's Republic of China"
    fr: "Président de la République populaire de Chine"
    name: Xi Jinping
  evidence:
