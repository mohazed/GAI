- id: evt_2024_05_30_CHN_B9
  revision: 1
  country: CHN
  indicator: B9
  type: repeatable
  date: '2024-05-30'
  points: 5
  points_rationale: >-
    Names violations (+5): the joint statement adopted with the Arab States at the ministerial conference the Foreign
    Minister attended condemns the famine and blockade imposed on Gaza's population and the systematic destruction of
    hospitals and other civilian infrastructure, opposes the forced displacement of Palestinians and calls for an
    immediate ceasefire; the Minister's own remarks the same day call an immediate ceasefire an international
    consensus. Same speaker, same day: one event.
