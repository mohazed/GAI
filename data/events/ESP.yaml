- id: evt_2024_06_28_ESP_B3
  revision: 1
  country: ESP
  indicator: B3
  type: standing
  date: '2024-06-28'
  end: null
  points: 15
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The government filed a declaration of intervention under Article 63 in the ICJ case South Africa v. Israel on the Genocide Convention in the Gaza Strip.
    fr: Le gouvernement a déposé une déclaration d'intervention au titre de l'article 63 dans l'affaire Afrique du Sud c. Israël devant la CIJ sur la Convention sur le génocide à Gaza.
  actor:
    en: Government of Spain
    fr: Gouvernement de l'Espagne
  evidence:
  - source: src_20240628_icj_192-press-spain
    quote: THE HAGUE, 28 June 2024. Today, Spain, invoking Article 63 of the Statute of the Court, filed in the Registry of the Court a declaration of intervention in the case concerning Application of
      the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip (South Africa v. Israel).
    quote_lang: en
    locator: lines 13–16
  - source: src_20240628_icj_192-declaration-spain
    quote: 24. In Spain' s opinion, precisely because direct evidence of genocidal intent is rare, it is crucial to interpret the do/us specialis requirement with a balanced approach that recognizes the
      singular gravity ofthe crime of genocide, without rendering the threshold for inferring genocidal intent so difficult to meet so as to make findings of genocide near- impossible.
    quote_lang: en
    locator: paragraph 24
  - source: src_20240628_exteriores_intervencion-cij
    quote: En esta declaración de intervención, España se pronuncia sobre algunos aspectos que considera de particular relevancia como el interés en que la Corte examine la obligación de prevenir la comisión
      de genocidio a la luz, por un lado, de las medidas cautelares dictadas por la Corte, que son de obligado cumplimiento; y, por otro, de la situación provocada por la falta de acceso de la ayuda humanitaria
      a la Franja de Gaza y la destrucción de infraestructuras.
    quote_lang: es
    quote_en: In this declaration of intervention, Spain addresses some aspects it considers particularly relevant, such as the interest in the Court examining the obligation to prevent the commission of
      genocide in the light, on the one hand, of the provisional measures ordered by the Court, which are binding; and, on the other, of the situation caused by the lack of access of humanitarian aid to
      the Gaza Strip and the destruction of infrastructure.
    locator: line 5
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: ICJ press release lines 13–16, declaration paragraph 24 and ministry communiqué line 5 re-read. B3 matches.
    notes: 'Standing from the filing registered on 28 June 2024 (ICJ press release). The declaration''s construction supports the applicant''s reading (docs/02 §2 B3): it argues that the intent requirement
      must not be read so as to make findings of genocide near-impossible (paragraph 24) and asks the Court to examine the obligation to prevent in the light of its binding provisional measures (ministry
      communiqué). Both ICJ documents are the copies UNISPAL publishes (docs/10 B-203). No withdrawal found.'

