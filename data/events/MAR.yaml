# Hand-authored events for Morocco (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: King Mohammed VI is head of state and is not a B9 speaker (as the King of Saudi Arabia, the President of
# the UAE, the Amir of Qatar and the King of Jordan, docs/10 B-382, B-390 (2), B-391 (3), B-397 (4)); his speeches and
# the messages read on his behalf are not filed. Aziz Akhannouch has been Head of Government throughout the window and
# Nasser Bourita Minister of Foreign Affairs, African Cooperation and Moroccan Expatriates. Statements are read on the
# Ministry's site (diplomatie.ma, English and French), which reports most of the Minister's positions in indirect
# speech. B9 events are filed only on the speaker's own words (words the Ministry quotes directly) and on joint
# statements of foreign ministers, not on words reported in indirect speech, statements of the Ministry, of
# ambassadors or of officials, and only when the document cites Gaza (docs/10 B-381 (4), B-32, B-402).
# Finish run (T-F-W8, 2026-11-09): R3 (docs/calibration/README.md §6) made the head of state a B9 speaker; the King's
# speeches and messages on maroc.ma that cite Gaza are filed from then on (docs/10 B-921). The lines above predate R3.

