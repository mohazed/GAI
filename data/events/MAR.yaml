    quote_lang: fr
    quote_en: "But, as the regrettable confrontations that have shaken the region for more than a year continue to rage and the Israeli military invasion of the Gaza Strip goes on, the whole world is called, on this commemorative day, to mobilise urgently to stop the war and compel Israel to lift the siege of the Gaza Strip and allow the return of displaced persons, with a view to launching the reconstruction of what the war has destroyed."
    locator: line 21
  - source: src_20241126_maroc-ma_message-roi-comite-palestine
    quote: "Premièrement : la nécessité de parvenir à un cessez-le feu immédiat et durable dans la bande de Gaza et la cessation des agressions répétées visant les populations paisibles en Cisjordanie et à Al-Qods;"
