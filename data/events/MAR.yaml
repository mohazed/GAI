  confidence: confirmed
  scope:
  - gaza
  - west-bank
  summary:
    en: "The King called for a ceasefire in the Gaza Strip and for Israel to lift its siege in a message to the UN Committee on Palestinian rights."
    fr: "Le roi a appelé à un cessez-le-feu dans la bande de Gaza et à la levée du siège par Israël dans un message au Comité des Nations unies sur les droits des Palestiniens."
  actor:
    en: King of Morocco
    fr: Roi du Maroc
    name: Mohammed VI
  evidence:
  - source: src_20241126_maroc-ma_message-roi-comite-palestine
    quote: "Au vu des développements graves et sans précédent, survenus dans la bande de Gaza depuis le 7 octobre 2023, le Royaume du Maroc exprime sa vive préoccupation quant à la situation dramatique engendrée par la poursuite de l’invasion israélienne de la Bande, laquelle a fait à ce jour des dizaines de milliers de morts et de blessés parmi les civils innocents et sans défense, a privé des millions de palestiniens de leurs droits fondamentaux au logement, à la nourriture, aux soins, à l’eau salubre, à l’enseignement et à la sécurité et les a contraints à l’exode et à la migration en raison de l’ampleur des destructions massives ayant affecté globalement les infrastructures de la région."
    quote_lang: fr
    quote_en: "In view of the grave and unprecedented developments in the Gaza Strip since 7 October 2023, the Kingdom of Morocco expresses its deep concern at the dramatic situation caused by the continuing Israeli invasion of the Strip, which has so far left tens of thousands of innocent and defenceless civilians dead and wounded, deprived millions of Palestinians of their fundamental rights to housing, food, care, clean water, education and security, and forced them into exodus and migration because of the scale of the massive destruction that has affected the infrastructure of the region as a whole."
