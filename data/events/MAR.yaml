      israéliens en Cisjordanie comme des menaces pour tout processus concernant Gaza.
  actor:
    en: "Minister of Foreign Affairs, African Cooperation and Moroccan Expatriates"
    fr: "Ministre des Affaires étrangères, de la Coopération africaine et des Marocains résidant à l'étranger"
