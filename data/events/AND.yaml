- id: evt_2025_07_29_AND_B9
  revision: 1
  country: AND
  indicator: B9
  type: repeatable
  date: '2025-07-29'
  points: 5
  points_rationale: 'Names specific violations and calls for a ceasefire (+5): the Minister for Foreign Affairs tells the high-level conference that the response to the attacks of 7 October 2023 included
    ''indiscriminate aggression'' against civilians, that access to aid was obstructed and that the spiral of violence was unsustainable, and that Andorra again calls for an immediate and lasting ceasefire.'
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The Minister for Foreign Affairs, at the UN conference on Palestine, called for an immediate and lasting ceasefire and described the obstruction of aid to Gaza's civilians as unsustainable.
    fr: La ministre des Affaires étrangères, à la conférence de l'ONU sur la Palestine, a appelé à un cessez-le-feu immédiat et durable et jugé insoutenable l'obstruction de l'aide aux civils de Gaza.
  actor:
    en: Minister for Foreign Affairs
    fr: Ministre des Affaires étrangères
    name: Imma Tor Faus
  evidence:
  - source: src_20250729_un-unispal_and-tor-two-state-conference-fr
    quote: nous avons aussi profondément regretté la violence de la réponse à ces attaques et l’agression indiscriminée aux populations civiles, avec presque 60.000 victimes majoritairement des femmes et
      des enfants.
    quote_lang: fr
    quote_en: we also deeply regretted the violence of the response to these attacks and the indiscriminate aggression against civilian populations, with almost 60,000 victims, mostly women and children.
    locator: lines 39–43
  - source: src_20250729_un-unispal_and-tor-two-state-conference-fr
    quote: Cette spirale de violence, qui a engendré une situation humanitaire catastrophique, avec l’obstruction de l’accès à l’aide des populations civiles déjà éprouvées, est, je le répète, insoutenable.
    quote_lang: fr
    quote_en: This spiral of violence, which has produced a catastrophic humanitarian situation, with the obstruction of access to aid for civilian populations already tried, is, I repeat, unsustainable.
    locator: lines 44–47
  - source: src_20250729_un-unispal_and-tor-two-state-conference-fr
    quote: L’Andorre, une fois de plus, appelle à un cessez le feu immédiat et durable et au respect du droit humanitaire international ainsi qu’à la libération inconditionnelle de tous les otages.
    quote_lang: fr
    quote_en: Andorra, once again, calls for an immediate and lasting ceasefire and for respect for international humanitarian law, and for the unconditional release of all the hostages.
    locator: lines 50–53
  - source: src_20250729_govern-ad_tor-two-state-conference
    quote: Andorra, segons ha exposat la ministra, ha reiterat la seva crida per un alto el foc immediat i durador, per al respecte del dret internacional humanitari i l’alliberament incondicional de tots
      els ostatges.
    quote_lang: ca
    quote_en: Andorra, as the minister set out, reiterated its call for an immediate and lasting ceasefire, for respect for international humanitarian law and for the unconditional release of all the hostages.
    locator: line 1158
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-11-04'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-11-04'
      verdict: agree
      notes: 'The French text (lines 39 to 53 of the archived PDF text) and the Catalan release (line 1158) re-read in reverse order: the four quoted passages found verbatim; the speaker''s title and the
        conference name agree with the heading; Gaza cited in the same paragraph (R7); the +5 tier agrees (named conduct and a call for a ceasefire).'
    notes: 'Address of the Minister for Foreign Affairs of the Principality of Andorra at the High-Level International Conference for the Peaceful Settlement of the Question of Palestine and the Implementation
      of the Two-State Solution, New York, 29 July 2025 (UNISPAL, the text headed ''only the version delivered is authoritative''), and the Government''s own release of the same day in Catalan, which reports
      the same call for an immediate and lasting ceasefire, the ''spiral of violence'' and the obstruction of access to aid. Flags: (1) the text is headed ''Seule la version prononcée fait foi''; the Government''s
      release (Govern d''Andorra, 29 July 2025) restates the call and the obstruction of aid in indirect speech, which supports the passages as delivered; (2) +5 for the named conduct (indiscriminate aggression
      against civilians, obstruction of aid access) beside the call for a ceasefire; the same passage condemns the attacks of 7 October 2023 and calls for the release of the hostages (symmetry, not scored);
      the English renderings are the session''s own translation, set beside the French and Catalan; (3) the address also says that the Government ''travaille pour être en mesure de reconnaître prochainement
      l''État de Palestine'' (a note under B8: no recognition row, see the conditional announcement of 22 September 2025); (4) 463 days old at the build date: older than 365 days, so it does not end the
      passivity penalty. Filed in the light protocol (docs/10 B-718 ff.).'
