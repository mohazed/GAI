- id: evt_2025_01_30_BLZ_B3
  revision: 1
  country: BLZ
  indicator: B3
  type: standing
  date: '2025-01-30'
  points: 15
  points_rationale: 'Declaration of intervention (+15) under Articles 62 and 63 in ICJ case 192, supporting the applicant: Belize reads the Genocide Convention''s duty to prevent as arising once
    a serious risk exists and argues for an inference of intent that is not set unrealistically high. No withdrawal found.'
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The government filed an application to intervene and a declaration of intervention in the ICJ case South Africa v. Israel on the Genocide Convention in the Gaza Strip.
    fr: Le gouvernement a déposé devant la CIJ une demande d'intervention et une déclaration d'intervention dans l'affaire de la Convention sur le génocide à Gaza (Afrique du Sud c. Israël).
  actor:
    en: Government of Belize
    fr: Gouvernement du Belize
  evidence:
  - source: src_20250131_icj_192-press-belize
    quote: On 30 January 2025, Belize, referring to Articles 62 and 63 of the Statute, filed in the Registry of the Court a document containing an application for permission to intervene and a
      declaration of intervention in the case concerning Application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip (South Africa v. Israel).
    quote_lang: en
    locator: lines 13–17
  - source: src_20250130_icj_192-declaration-belize
    quote: 61. Although this standard is high, the Court has endorsed a “notion of ‘reasonableness’” in the exercise of inferring intent, mindful to avoid a situation that “would make it impossible
      to reason conclusions by way of inference”.118 This notion of reasonableness is key to the Court’s evaluation of the evidence in a way that ensures unreasonable inferences are disregarded,
      but also that avoids the evidential standard for establishing genocidal intent being set unrealistically high.
    quote_lang: en
    locator: lines 873–878 (paragraph 61)
  - source: src_20250130_icj_192-declaration-belize
    quote: 29. Belize takes extremely seriously its obligation to prevent genocide in all its manifestations, including not to recognise any situation arising from the commission of genocide and
      to cooperate in bringing genocide immediately to an end. In intervening in these proceedings, Belize is acting in furtherance of its obligation to prevent and suppress genocide, and its
      interest in avoiding impunity where breaches of the Genocide
    quote_lang: en
    locator: lines 414–418 (paragraph 29)
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-06'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-06'
      verdict: agree
      notes: 'Press release lines 13 to 16 (the filing and its date), declaration paragraphs 29 (lines 414 to 418) and 61 (lines 873 to 878) re-read; paragraphs 51 and 58 read for the direction.
        The construction supports the applicant: B3 agrees. The filing date is the ICJ''s own (30 January 2025).'
    notes: 'Standing from the filing of 30 January 2025 (ICJ press release 2025/6; both documents are the copies UNISPAL publishes, docs/10 B-203). The declaration (Article 63) offers Belize''s
      construction of Articles I, II, III, VI and IX; the direction is read from its text: the duty to prevent arises at the instant a State learns of a serious risk (paragraph 51), the specific
      intent may be inferred from a pattern of conduct with a notion of reasonableness that keeps the standard from being set unrealistically high (paragraph 61), and there is no requirement of
      exclusivity of intent (paragraph 58): a construction that supports the applicant''s reading, so B3, not B4. The Article 62 application is filed in the same document. No withdrawal found
      to 6 October 2026.'

