  points: 5
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: 'The government evacuated Gazan patients by air, among them 55 seriously ill children: eight flights by 17 February 2026.'
    fr: 'Le gouvernement a évacué par avion des patients de Gaza, dont 55 enfants gravement malades : huit vols au 17 février 2026.'
  evidence:
  - source: src_20241220_gov-ie_medevac-first-group
    quote: The group travelled on a plane provided by the Slovakian Government for the medical evacuation
    quote_lang: en
    locator: line 6
  - source: src_20260217_mzv-sk_blanar-palestinian-minister-visit
    quote: The Slovak Republic has thus far conducted eight such specialised flights and transported almost 200 civilians, including 55 seriously ill paediatric patients.
    quote_lang: en
    locator: line 7
  status: reviewed
  supersedes: null
  related:
  - evt_2024_12_19_IRL_D4
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-06'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-06'
      verdict: agree
      notes: 'The Irish release (lines 5 to 6: arrival in Dublin of the first group, plane provided by the Slovakian Government; Slovakia thanked by the Minister of State) and the Slovak Ministry''s
        release of 17 February 2026 (eight specialised flights, almost 200 civilians, 55 seriously ill children) re-read. D4 for the programme agrees; the date is ''no later than''.'
    notes: 'One event for the medical-evacuation programme (docs/02 §2 D4: one event per programme), dated ''no later than'' the earliest archived document that names it: the Irish Department
      of Health''s release of 20 December 2024, which says that the eight children who arrived in Dublin on the evening of Thursday 19 December 2024 travelled on a plane provided by the Slovakian
      Government (the Irish release is the first archived record; Slovakia''s own flights may be earlier, which the Slovak documents read do not say). The Ministry of Foreign and European Affairs''
      release of 17 February 2026 counts eight flights, almost 200 civilians and 55 seriously ill children: the later flights are the same programme, not new events (R11; docs/10 B-525 (3) for
      Romania). The Slovak Ministry of the Interior''s Air Unit runs the flights through the EU Civil Protection Mechanism (press: TASR, Pravda); no Slovak government release of the first flight
      could be archived (the Ministry''s pages answer HTTP 403). Decayed to zero (more than 730 days); the programme was still running on 17 February 2026.'

