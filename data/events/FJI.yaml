  summary:
    en: Fiji filed a declaration of intervention in South Africa v. Israel arguing for the strict reading of intent and against a holistic interpretation of the Genocide Convention.
    fr: Les Fidji ont déposé une déclaration d'intervention dans l'affaire Afrique du Sud c. Israël, défendant la lecture stricte de l'intention et rejetant une interprétation holistique de la
      Convention.
  actor:
    en: Government of Fiji
    fr: Gouvernement des Fidji
  evidence:
  - source: src_20260312_un-unispal_fiji-declaration-intervention
    quote: It is Fiji's concern that a more lenient and expansive interpretation of the Genocide Convention, as proposed by South Africa and certain states and NGOs, will endanger future peacekeeping
      operations
    quote_lang: en
    locator: paragraph 14 (lines 157 to 159 of the archived text)
  - source: src_20260312_un-unispal_fiji-declaration-intervention
    quote: Fiji therefore respectfully requests that this so-called holistic approach to interpretation of the Genocide Convention be disregarded.
    quote_lang: en
    locator: paragraph 24 (lines 310 and 311)
  - source: src_20260312_un-unispal_fiji-declaration-intervention
    quote: Fiji considers that armed forces, combatants and terrorists engaged in armed conflict cannot qualify as protected groups under the Genocide Convention.
    quote_lang: en
    locator: paragraph 60 (lines 784 to 786)
  - source: src_20260313_un-unispal_icj-declarations-intervention
    quote: On Thursday 12 March 2026, Namibia, the United States of America, Hungary and Fiji each filed in the Registry of the Court a declaration of intervention, under Article 63 of the Statute
      of the Court
    quote_lang: en
    locator: paragraph 13 (ICJ press release of 13 March 2026)
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-07'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-07'
      verdict: agree
      notes: 'The archived text of the declaration (lines 40 to 1060) re-read against the event in a separate pass: paragraphs 14, 22 to 24, 60 and 62 to 65 argue for a narrower reading of the
        Convention than the applicant''s and against the construction of the interventions that support it; no passage supports the applicant''s reading or the Court''s provisional measures. The
        press release re-read for the filing date. B4 agrees; a declaration that only asked the Court to keep to the standard of proof would also be read as B4 (as Paraguay''s, docs/10 B-597).'
    notes: Article 63 declaration arguing against the applicant's construction (docs/02 §2 B3/B4), filed on 12 March 2026 with those of Namibia, the United States and Hungary (the ICJ's press
      release of 13 March 2026). The declaration (about 29 pages, read in full from the archived text) asks the Court to disregard the 'holistic approach' to the interpretation of the Convention
      that other interventions propose, argues that dolus specialis must be proved by a pattern of conduct that can only point to such intent (paragraphs 62 to 65), that armed forces, combatants
      and terrorists cannot be a protected group (paragraph 60), that national military reports and the evidence of UN bodies and NGOs must be weighed under the strict standard (section IV.C),
      and that a more lenient and expansive interpretation proposed by South Africa 'and certain states and NGOs' would endanger peacekeeping operations. It does not state that Israel's conduct
      is lawful and takes no position on the facts (paragraph 26). Filed as B4, not B3, as Hungary's and Paraguay's declarations; the Court's case page (archived 25 September 2026, read) lists
      no withdrawal of Fiji's declaration. Counts from the filing date; 209 days old on 7 October 2026.
