    notes: 'Filed in the finish run (T-F-L19, 2026-11-10) at corroborated: no police statement and no notice of the Inspector General were found (the Kenyans.co.ke report says the police had not issued
      one), so the evidence is two outlets of distinct ownership, a Kenyan one (Kenyans.co.ke, 25 January 2024) and Anadolu Agency (26 January 2024), which agree on the place, the day, the use of tear
      gas and the three arrests. Amnesty International Kenya''s statement of 25 January 2024 (quoted by Anadolu; the Amnesty page itself refused a scripted request and is not filed) calls the disruption
      unlawful. Flagged for the author (docs/10 B-2060): this is a dispersal of a notified procession, not a prior ban or refusal as in the other E2 events (Fiji, Latvia, Hungary); the Fiji police''s
      instruction to stop chanting (evt_2026_06_02_FJI_E2) is the nearest precedent and is of the same standing. Anadolu and Kenyans.co.ke say the procession reportedly had a permit; Kenyans.co.ke
      reproduces the organisers'' notification, not a permit. Earlier Gaza-related police action in Nairobi (arrests on 22 October 2023 for an alleged illegal gathering, Kenyans.co.ke line 15; seven
      activists charged, January 2024, one outlet) is not filed. Not a score input in v1.0.'
