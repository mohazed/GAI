        The extracted text marks the President's opening remarks at the meeting of 30 October 2023. The paragraph
        beginning 'We remember how the current phase' names retaliation by collective responsibility and
        indiscriminate killing in Gaza; the paragraph beginning 'They do not need durable peace' refers to the
        countries insisting on an immediate ceasefire. Names-violations tier agrees. Page date 30 October 2023;
        line 4 opens the President's remarks.
