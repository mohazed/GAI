  points: 5
  points_rationale: 'Recall tier (+5), as the nearest tier, flagged: on 2 November 2023, answering the Council of Representatives'' statement that the Ambassador had been recalled and economic relations
    suspended, the Government''s National Communication Centre confirmed that Bahrain''s Ambassador to Tel Aviv had returned to the Kingdom "some time ago", that Israel''s Ambassador had left, and that
    direct flights had stopped; the same statement names the Gaza Strip. The Government does not use the word recall and gives no date for the return, so the event is dated by the Government''s statement.
    No downgrade or severance was announced (the statement does not repeat the Council''s suspension of economic relations). The press reports (The Media Line, The Jerusalem Post, 9 April 2025) that Royal
    Decree No. 21 of 2025 made the Ambassador Undersecretary for Political Affairs and left the post in Israel vacant; no return of a Bahraini ambassador to Israel was found to 27 November 2026, so the state
    is open. The reading of a confirmed return as a recall is for the author (lead_20261110_BHR_2, docs/10 B-2171).'
