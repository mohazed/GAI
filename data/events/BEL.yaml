    quote: la Wallonie a décidé de suspendre temporairement les licences d’exportation de matériel militaire en cours de validité à destination d’Israël.
    quote_lang: fr
    quote_en: Wallonia decided to temporarily suspend the valid export licences for military equipment destined for Israel.
    locator: line 16
  - source: src_20240207_wallonie_licences-israel
    quote: 3. De ne procurer aucune licence pour le transit d’armes et de biens et technologies à double usage qui renforcerait la capacité militaire des forces en présence.
    quote_lang: fr
    quote_en: 3. To grant no licence for the transit of arms and dual-use goods and technologies that would strengthen the military capacity of the forces present.
    locator: line 13
  - source: src_20240207_wallonie_licences-israel
    quote: Ce sont en effet les régions, en tant qu’entités fédérées, qui sont compétentes en matière d’octroi de licences d’exportation de biens militaires et de technologies à double usage dans notre pays.
    quote_lang: fr
    quote_en: It is the regions, as federated entities, that are competent for granting export licences for military goods and dual-use technologies in our country.
    locator: line 6
  - source: src_20240924_premier-be_discours-agnu79
    quote: La Belgique a imposé un embargo sur les armes.
    quote_lang: fr
    quote_en: Belgium has imposed an arms embargo.
    locator: line 27
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Lines 6, 13 and 16 of the Walloon release and line 27 of the Prime Minister''s General Assembly speech re-read: licensing is regional; Wallonia suspended the valid military export licences to Israel; Wallonia and Brussels refuse transit and dual-use licences that would strengthen the forces present; the Prime Minister states an arms embargo. A class of licences suspended: A6 agrees.'
    notes: >-
      Arms and dual-use export licensing is a competence of the three regions (line 6), so the
      decision of a regional government is the Belgian decision on that class of licences; read as a
      "government decision" under docs/02 §2 A6 (flagged, docs/10 B-272). Dated from the release of
      7 February 2024: Wallonia suspended the export licences for military equipment still valid
      (granted before the war) and, with the Brussels-Capital Region, extended the 2009 position of
      the three regions (no arms export licence that would strengthen the military capacity of the
      forces present) to dual-use goods and transit licences. The 2009 interregional position itself
      predates the window and is not a separate event. The Flemish Region is not a party to the
      2024 decision; the federal government's decision of 2 September 2025 asks the regions to
      extend the 2009 ban to all transit, to dual-use goods with a military end user and to all
      military goods for use by Israel (src_20250902_diplomatie-belgium_kern-palestine, measure 5);
      no regional instrument implementing it was found. No end found.

