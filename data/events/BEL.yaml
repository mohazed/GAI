  summary:
    en: The government filed a declaration of intervention under Article 63 in the ICJ case South Africa v. Israel on the Genocide Convention in the Gaza Strip.
    fr: "Le gouvernement a déposé devant la CIJ une déclaration d'intervention au titre de l'article 63 dans l'affaire de la Convention sur le génocide à Gaza (Afrique du Sud c. Israël)."
  actor:
    en: Government of Belgium
    fr: Gouvernement de la Belgique
  evidence:
  - source: src_20260927_icj-cij_case-192
    quote: Application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip (South Africa v. Israel) - Belgium files a declaration of intervention in the proceedings under Article 63 of the Statute of the Court
    quote_lang: en
    locator: lines 20–21
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Lines 20–21 of the ICJ case page re-read (23 December 2025, Belgium files a declaration of intervention under Article 63); the archived declaration (18 pages, scan) re-read for its direction: it argues for a reading of genocidal intent that does not make findings of genocide impossible in armed conflict. B3 agrees.'
    notes: >-
      Standing from 23 December 2025, the date under which the Court lists the filing. The
      declaration (dated 18 December 2025, archived as src_20251218_icj_192-declaration-belgium from
      the UNISPAL copy; the ICJ's own file refuses Save Page Now, docs/10 B-203) is a scanned PDF
      without a text layer, so no passage of it can be quoted against archive/text; it was read in
      this session from the archived file. Its stated construction supports the applicant's reading
      (docs/02 §2 B3): Belgium centres its intervention on Article II and the specific intent,
      submits that it supports a reasonable interpretation that avoids making it impossible or
      nearly impossible in practice, especially in armed conflict, to establish genocide, and
      argues (A) that an armed conflict cannot bar the identification of genocidal intent, (B) that
      the pursuit of a military objective cannot as such bar it, and (C) that considerations of
      international humanitarian law cannot bar it (paragraphs 19–20 and sections A–C). It also
      recalls the three provisional-measures orders. No withdrawal found. Flagged for the author
      (docs/10 B-272): the evidence quote is the Court's listing; the direction rests on the
      session's reading of the scanned declaration.

