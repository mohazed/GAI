      docs/06 §1 rule 1); (2) the Ministry''s representatives said Romania had announced no voluntary commitment to UNRWA for 2024, so the hold concerned new contributions, a narrower hold than
      the freezes of other donors; (3) the end date, 2024-07-19, is the date of the UK government''s release that lists Romania among the partners that had restored their funding (src_20240719_gov-uk_restart-unrwa-funding):
      Romania''s own announcement of the resumption was not found in an archivable page (the Ministry''s item of 17 October 2024 on a humanitarian contribution for UNRWA operations in Jordan,
      mae.ro/en/node/65727, could not be archived), so the end is ''no later than'' that date (lead_20261005_ROU_3).'

