    quote: Până la finalizarea investigației, MAE nu va lansa proceduri pentru noi contribuții voluntare către UNRWA.
    quote_lang: ro
    quote_en: Until the investigation is completed, the Ministry of Foreign Affairs will not start procedures for new voluntary contributions to UNRWA.
    locator: line 4
  - source: src_20240129_hotnews_romania-suspenda-unrwa
    quote: Întrebați dacă acest lucru înseamnă suspendarea fondurilor, reprezentații MAE au precizat că România a contribuit până acum voluntar iar pentru acest an nu avea angajamente, pe baze
