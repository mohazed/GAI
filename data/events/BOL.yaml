    en: >-
      The government filed a declaration of intervention in the ICJ case South Africa v. Israel on genocide in Gaza.
    fr: >-
      Le gouvernement a déposé une déclaration d'intervention dans l'affaire Afrique du Sud c. Israël devant la CIJ
      sur le génocide à Gaza.
  actor:
    en: "Government of Bolivia"
    fr: "Gouvernement de la Bolivie"
  evidence:
  - source: src_20250801_undocs_a-80-4-icj-report
    quote: "Türkiye (on 7 August 2024), Chile (on 12 September 2024), Maldives (on 1 October 2024), the Plurinational State of Bolivia (on 8 October 2024), Ireland (on 6 January 2025) and Cuba (on 10 January 2025) filed declarations of intervention in the proceedings under Article 63 of the Statute."
    quote_lang: en
    locator: "paragraph 202 (lines 1747-1750)"
  - source: src_20241008_cancilleria_intervencion-cij
    quote: "El Estado Plurinacional de Bolivia, como signatario de la Convención para la Prevención y la Sanción del Delito de Genocidio, presentó este martes la solicitud de intervención sobre las acciones, flagelos y crímenes de genocidio en contra del pueblo palestino en la Franja de Gaza, como parte del caso que Sudáfrica presentó en contra de Israel en la Corte Internacional de Justicia (CIJ)."
    quote_lang: es
    quote_en: "The Plurinational State of Bolivia, as a signatory of the Convention on the Prevention and Punishment of the Crime of Genocide, submitted on Tuesday its request to intervene on the actions, scourges and crimes of genocide against the Palestinian people in the Gaza Strip, as part of the case South Africa brought against Israel before the International Court of Justice (ICJ)."
    locator: line 1
  - source: src_20241024_cancilleria_arce-cumbre-brics
    quote: "En este contexto, es fundamental recordar que Bolivia ha presentado una declaración de intervención en el caso relativo a la Aplicación de la Convención para la Prevención y la Sanción del Delito de Genocidio en la Franja de Gaza, en el litigio Sudáfrica vs. Israel ante la Corte Internacional de Justicia."
    quote_lang: es
    quote_en: "In this context, it is essential to recall that Bolivia has submitted an intervention statement in concerning the case of the Application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip, in the South Africa versus Israel litigation before the International Court of Justice."
    locator: line 121 (Ministry's English version, line 150)
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        A/80/4 paragraph 202, in the section on case 192 (South Africa v. Israel), after Spain's filing of 28 June
        2024: Bolivia on 8 October 2024 under Article 63; the Ministry's release of 8 October 2024 (a Tuesday, "este
        martes") agrees and adds (line 3) that Bolivia states its duty as a party to prevent and punish acts of
        genocide "como es el caso de lo que actualmente ocurre en Palestina" (the direction). The declaration itself
        was not read (the ICJ site was not archivable). No withdrawal was found in the Ministry's pages to 28
        September 2026, including under the government in office from 8 November 2025, which restored relations with
        Israel.
    notes: >-
      The declaration's text should be read when the ICJ copy can be archived, and the case page checked for a
      withdrawal by the government in office from 8 November 2025 (P-16).

