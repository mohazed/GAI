# Hand-authored events for the Plurinational State of Bolivia (P-D research session, wave 7, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers named in the Ministry's pages: President Luis Arce Catacora (head of state and government to 8 November
# 2025); Foreign Minister Rogelio Mayta (October 2023), the Minister of the Presidency María Nela Prada as acting Foreign
# Minister ("Canciller interina", 31 October and 18 November 2023), Foreign Minister Celinda Sosa Lunda (March 2024 to
# October 2025); President Rodrigo Paz Pereira from 8 November 2025, with Foreign Ministers Fernando Aramayo Carrasco
# (December 2025 to June 2026) and Héctor Huanca Gutiérrez (September 2026). B9 events are filed only on the speaker's own words: the full texts of addresses published by the Ministry
# of Foreign Affairs and the speaker's words quoted verbatim in the Ministry's releases; not on the Ministry's unsigned
# communiqués issued in the name of "el Estado Plurinacional de Bolivia", nor on addresses by ambassadors or posts on
# social media (docs/10 B-371 (3), as B-356 (3), B-361 (4) and B-366 (4)). A statement is filed only when its document
# cites Gaza (the scope rule, docs/10 B-32). Spanish texts are quoted in Spanish with the Ministry's English version
# beside them where it publishes one, otherwise this session's translation.

- id: evt_2023_10_31_BOL_B9
