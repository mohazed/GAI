  date: '2023-10-31'
  end: '2025-12-09'
  points: 10
  points_rationale: >-
    Relations severed (+10): the government announced on 31 October 2023 its decision to break diplomatic relations
    with Israel, communicated to Israel in an official note, citing the military offensive in the Gaza Strip. Ended on
    9 December 2025, when the foreign ministers of both states announced the full restoration of diplomatic relations.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The government broke diplomatic relations with Israel on 31 October 2023, citing the military offensive in the
      Gaza Strip, and restored them on 9 December 2025.
    fr: >-
      Le gouvernement a rompu les relations diplomatiques avec Israël le 31 octobre 2023, en invoquant l'offensive
      militaire dans la bande de Gaza, et les a rétablies le 9 décembre 2025.
  actor:
    en: "Government of Bolivia"
    fr: "Gouvernement de la Bolivie"
  evidence:
  - source: src_20231031_cancilleria_ruptura-relaciones-israel
    quote: "La Ministra de la Presidencia, María Nela Prada, en su calidad de Canciller interina, junto al Viceministro de Relaciones Exteriores, Freddy Mamani Machaca, anunciaron la tarde de este martes la decisión del Estado Plurinacional de Bolivia de romper relaciones diplomáticas con el Estado de Israel, a través de una comunicación oficial, en repudio y condena a la agresiva y desproporcionada ofensiva militar israelí que se realiza en la Franja de Gaza y amenaza la paz y la seguridad internacionales."
    quote_lang: es
    quote_en: "The Minister of the Presidency, María Nela Prada, as acting Foreign Minister, together with the Vice-Minister of Foreign Affairs, Freddy Mamani Machaca, announced on Tuesday afternoon the decision of the Plurinational State of Bolivia to break diplomatic relations with the State of Israel, through an official communication, in repudiation and condemnation of the aggressive and disproportionate Israeli military offensive being carried out in the Gaza Strip, which threatens international peace and security."
    locator: line 1
  - source: src_20251209_cancilleria_restablecimiento-relaciones-israel
    quote: "El Gobierno del Estado Plurinacional de Bolivia a través de su canciller Fernando Aramayo Carrasco y el ministro de Relaciones Exteriores del Estado de Israel Gideon Sa’ar anunciaron este martes el restablecimiento pleno de sus relaciones diplomáticas"
    quote_lang: es
    quote_en: "The Government of the Plurinational State of Bolivia, through its Foreign Minister Fernando Aramayo Carrasco, and the Minister of Foreign Affairs of the State of Israel, Gideon Sa'ar, announced on Tuesday the full restoration of their diplomatic relations"
    locator: line 1
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Ministry release dated 31 October 2023 (a Tuesday, "la tarde de este martes"), line 1: the decision to break
        relations, communicated through an official note, citing the offensive in the Gaza Strip. Ministry release of 9
        December 2025 (a Tuesday), line 1: full restoration announced by both foreign ministers; line 2: signed in
        Washington. Severed tier, start and end agree.
    notes: >-
      The Ministry's communiqué of 2 November 2023 rejects the Israeli foreign ministry spokesman's remarks on the
      decision; the Hague Group release of 1 February 2025 adds that Bolivia also suspended visa exemptions for
      Israelis, which the government in office from 8 November 2025 lifted on 1 December 2025 (Ministry release of that
      day, read, not archived). Neither is a separate indicator.

