    fr: Le Paraguay a déposé une déclaration d'intervention dans l'affaire Afrique du Sud c. Israël, défendant une lecture stricte du crime de génocide et de la norme d'intention.
  actor:
    en: Government of Paraguay
    fr: Gouvernement du Paraguay
  evidence:
  - source: src_20260303_un-unispal_paraguay-declaration-intervention
    quote: recent attempts to broaden the definition of genocide risk diluting the specific normative function of the Convention
    quote_lang: en
    locator: page 5, paragraph 15
  - source: src_20260303_un-unispal_paraguay-declaration-intervention
    quote: This high threshold of requiring that genocidal intent be the only reasonable inference is consistent with the exceptional gravity of the crime of genocide.
    quote_lang: en
    locator: page 10, paragraph 33
  - source: src_20260303_un-unispal_paraguay-declaration-intervention
    quote: The crime of genocide must be interpreted consistently with the object and purpose of the Convention and the Court’s established jurisprudence, and should not be expanded to cover other
      violations of international law
    quote_lang: en
    locator: page 14, paragraph 49(a)
  - source: src_20260304_un-unispal_icj-press-release-paraguay
    quote: On Tuesday 3 March 2026, Paraguay, invoking Article 63 of the Statute of the Court, filed in the Registry of the Court a declaration of intervention
    quote_lang: en
    locator: paragraph 1 (ICJ press release No. 2026/3 of 4 March 2026)
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-06'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-06'
      verdict: agree
      notes: 'OCR text re-read against the page images of pages 5, 10 and 14 (paragraphs 15, 33 and 49(a) agree word for word) and the conclusions (paragraphs 48 to 51): the declaration argues
        for the strict standard and a narrow construction; the press release re-read for the filing date (Tuesday 3 March 2026). B4 agrees.'
    notes: 'Article 63 intervention arguing against the applicant''s construction (docs/02 §2 B3/B4), as Hungary''s and the United States'' of 12 March 2026: the declaration asks the Court not
      to depart from the strict standard of intent (the ''only reasonable inference'', paragraphs 32 to 38), says that expansive readings of the definition of genocide have no basis and that alleged
      breaches of international humanitarian law are beyond the Convention (paragraphs 15, 20 to 23, 49), and asks for caution with the reports of international organisations and NGOs (paragraphs
      43 to 46). Read in full (paragraphs 1 to 52; the PDF is a scan, OCR). Flagged for the author: unlike the declarations of Hungary and the United States it does not say that Israel acted in
      self-defence, and paragraph 12 states that it ''does not address the facts of the present case, nor does it seek to support the claims of either party''; the argument is the narrower construction
      against the applicant''s reading, so it is filed as B4 and not as a neutral declaration (docs/10 B-597). Filing date 3 March 2026 from the Court''s press release (the declaration is dated
      the same day). The agent is Miguel Angel Aranda, of Paraguay''s embassy in Brussels. The Court''s case page lists the declaration and no withdrawal (read 2026-10-06).'
