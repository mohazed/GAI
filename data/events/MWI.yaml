      may be the formal instrument that followed this memorandum; C2 sums per instrument, so the two events count -20 together: the author decides whether they are one instrument. Earlier departures
      (November and December 2023, ''an understanding in principle'' per the Government''s spokesperson) went through private agents and are not an instrument.'
