      April 2024, citing Maariv: the signing at the embassy''s inauguration in Tel Aviv on Thursday 18 April by the Minister of Foreign Affairs Nancy Tembo, Israel Katz and Moshe Arbel), Nyasa
      Times (21 April 2024: ''the signing of a Memorandum of Understanding (MoU) on foreign workers in Tel Aviv'') and Voice of America (25 April 2024: a memorandum signed by the delegation led
