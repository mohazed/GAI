  summary:
    en: The Ministry for Europe and Foreign Affairs stated that immunities of states not party to the ICC apply to Prime Minister Netanyahu and would have to be considered if the ICC requested his arrest.
    fr: Le ministère de l'Europe et des Affaires étrangères a déclaré que les immunités des États non parties à la CPI s'appliquent au Premier ministre Netanyahou et devraient être prises en considération.
  actor:
    en: Ministry for Europe and Foreign Affairs
    fr: Ministère de l'Europe et des Affaires étrangères
  evidence:
  - source: src_20241127_diplomatie-gouv_cpi-immunites
    quote: La France respectera ses obligations internationales, étant entendu que le Statut de Rome exige une pleine coopération avec la Cour pénale internationale (CPI) et prévoit également qu’un État
      ne peut être tenu d’agir d’une manière incompatible avec ses obligations en vertu du droit international en ce qui concerne les immunités des États non parties à la CPI. De telles immunités s’appliquent
      au Premier ministre Netanyahou et aux autres ministres concernés et devront être prises en considération si la CPI devait nous demander leur arrestation et remise.
    quote_lang: fr
    quote_en: France will respect its international obligations, it being understood that the Rome Statute requires full cooperation with the International Criminal Court (ICC) and also provides that a
      State cannot be required to act in a manner inconsistent with its obligations under international law with respect to the immunities of States not party to the ICC. Such immunities apply to Prime
      Minister Netanyahu and the other ministers concerned and will have to be taken into consideration if the ICC were to request their arrest and surrender.
    locator: paragraph 121
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Paragraph 121 re-read: "De telles immunités s’appliquent au Premier ministre Netanyahou" and must be taken into consideration if the ICC requested arrest and surrender. B6 reading kept and
        flagged.'
    notes: 'Read as a stated refusal to execute the warrants of 21 November 2024 (docs/02 §2 B6; docs/06 §8 lists "France''s immunity position of November 2024"): the statement invokes the immunity of the
      Prime Minister of a non-party state against an ICC request for arrest and surrender. It is a formal statement of the ministry, not a statement signed by the Minister; flagged for the author (docs/10
      B-217). The ministry''s earlier statement of 22 November 2024 only "took note" of the decisions (read, not archived). No later formal position of the President, the Prime Minister, the Foreign or
      Justice Minister superseding it was found; overflight authorisations for the Prime Minister''s aircraft are a lead (lead_20260928_FRA_2).'

