  summary:
    en: >-
      The Council of Ministers declared that it would ensure free and safe access for the highest representatives of
      Israel to the Auschwitz-Birkenau ceremonies of 27 January 2025.
    fr: >-
      Le Conseil des ministres a déclaré qu'il garantirait un accès libre et sûr aux plus hauts représentants d'Israël
      aux cérémonies d'Auschwitz-Birkenau du 27 janvier 2025.
  actor:
    en: Prime Minister (President of the Council of Ministers)
    fr: Premier ministre (président du Conseil des ministres)
    name: Donald Tusk
  evidence:
  - source: src_20250109_gov-pl_uchwala-rm-auschwitz
    quote: >-
      Rząd Rzeczypospolitej Polskiej oświadcza, iż zapewni wolny i bezpieczny dostęp i udział w tych obchodach
      najwyższym przedstawicielom Państwa Izrael.
    quote_lang: pl
    quote_en: >-
      The Government of the Republic of Poland declares that it will ensure free and safe access to and participation in
      these commemorations for the highest representatives of the State of Israel.
    locator: lines 10–12
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Lines 10–12 and 23–27 re-read: Resolution No 3 of the Council of Ministers of 9 January 2025, signed by the
        Prime Minister, guarantees free and safe access to the highest representatives of Israel for the ceremonies of
        27 January 2025. B6 agrees on the reading in the notes; the end date follows the resolution's own scope.
    notes: >-
      Resolution No 3 of the Council of Ministers of 9 January 2025, signed by the Prime Minister, adopted while the ICC
      warrant for Israel's Prime Minister was in force. The resolution does not name the Court or the warrant; it is read
      as a stated refusal to execute the warrant for the stated occasion, since it guarantees the highest representatives
      of Israel free access to Polish territory for the ceremonies (the seed list of docs/06 §8 names it "Poland's
      January 2025 assurance"). Its scope is the ceremonies of 27 January 2025, so the standing state ends the day after
      them (docs/10 B-321). No later statement by the Prime Minister or the foreign or justice minister on executing the
      warrants was found (B5 none-found); a Secretary of State's letter of 27 December 2024 said Poland, as a party to
      the Rome Statute, respects the Court's decisions (src_20241227_gov-pl_list-washington-times; not a B5 speaker).

