# Hand-authored events for Algeria (P-D research session, wave 9, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: President Abdelmadjid Tebboune (head of state, who holds executive power and presides over the
# Council of Ministers; a B9 speaker as the Presidents of Egypt and France on data/wave-1 and data/wave-2, and as
# for Indonesia, docs/10 B-407 (4)); Minister of Foreign Affairs Ahmed Attaf (in office throughout the window;
# styled Minister of State in the later texts). B9 events are filed on the speaker's own words, citing Gaza, one per occasion and
# not for further statements in the same weeks as a filed one; not on the Ministry's unsigned statements, the
# Permanent Representative's or the Secretaries of State's statements (docs/10 B-417, B-418). Arabic texts are
# those the Ministry of Foreign Affairs publishes (mfa.gov.dz, Arabic version); two statements are quoted from the
# UN verbatim records in English, the UN's rendering of statements made in Arabic.

- id: evt_2023_10_24_DZA_B9
  revision: 1
  country: DZA
  indicator: B9
  type: repeatable
