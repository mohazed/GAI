    en: >-
      The Minister of Foreign Affairs told the Security Council that the blockade and bombardment of Gaza and the
      displacement of its population were crimes, and called for the blockade to be lifted.
    fr: >-
      Le ministre des Affaires étrangères a déclaré au Conseil de sécurité que le blocus et le bombardement de Gaza
      et le déplacement de sa population étaient des crimes, et a demandé la levée du blocus.
  actor:
    en: "Minister of Foreign Affairs"
    fr: "Ministre des Affaires étrangères"
    name: Ahmed Attaf
  evidence:
  - source: src_20231024_mfa-dz_fm-unsc-palestine
    quote: "أولا، فك الحصار الجائر المفروض على قطاع غزة، حيث أنه يشكل لوحده جريمة حرب وجريمة ضد الإنسانية مكتملة الأركان."
    quote_lang: ar
    quote_en: "First, lifting the unjust blockade imposed on the Gaza Strip, since it constitutes in itself a war crime and a crime against humanity in all its elements."
    locator: "line 19"
  - source: src_20231024_mfa-dz_fm-unsc-palestine
    quote: "ثانياً، وقف القصف العشوائي الذي راح ضحيته آلاف الأرواح البريئة، والذي يشكل بدوره جرائم حرب وجرائم إبادة."
    quote_lang: ar
    quote_en: "Second, stopping the indiscriminate bombardment that has claimed thousands of innocent lives, and which in turn constitutes war crimes and crimes of genocide."
    locator: "line 20"
  - source: src_20231024_mfa-dz_fm-unsc-palestine
    quote: "ثالثاً، وقف تهجير السكان الذي يرقى إلى جريمة أخرى، وهي جريمة التصفية العرقية."
    quote_lang: ar
    quote_en: "Third, stopping the displacement of the population, which amounts to another crime, the crime of ethnic cleansing."
    locator: "line 21"
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The Ministry's page: line 1 names Ahmed Attaf, Minister of Foreign Affairs and National Community Abroad, at
        the Security Council session on the situation in the Middle East (the page is dated 24 October 2023, the date
        of the Council's open debate); lines 18-22 list four demands, the first three naming the blockade of the Gaza
        Strip, the indiscriminate bombardment and the displacement of the population as crimes, the fourth relief for
        the people of Gaza. Speaker, date and scope gaza agree; specific-violations tier agrees.
