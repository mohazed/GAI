  points: 5
  points_rationale: >-
    Specific violations named (+5): at the Security Council's open debate on the Middle East the Minister of
    Foreign Affairs said the blockade imposed on the Gaza Strip constituted a war crime and a crime against
    humanity, that the indiscriminate bombardment constituted war crimes and crimes of genocide, and that the
    displacement of the population amounted to ethnic cleansing, and called for the blockade to be lifted and
    relief to reach Gaza without conditions.
  confidence: confirmed
  scope:
  - gaza
