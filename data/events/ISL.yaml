      security motive ''does not conceptually preclude'' genocidal intent, that famine or a humanitarian crisis imposed on the group is an act under Article II(c), and that conduct affecting children
      weighs in the assessment of intent: a construction that supports the applicant''s, as for the Netherlands (evt_2026_03_11_NLD_B3). It also says Iceland ''unequivocally and unconditionally
      condemned'' the attacks of 7 October 2023. The Ministry announced it on 12 March 2026 and said the decision ''is a part of the Government''s implementation of Iceland''s policy on the Gaza
      conflict, including a resolution unanimously adopted by'' the Althing in November 2023. The declaration was prepared with two Icelandic scholars (Ministry''s page). The written statement
      of Iceland in the advisory proceedings (case 186, 9 May 2025, Ministry''s item) is not B3 or B4 (docs/10 B-629).'
