  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-06'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-06'
      verdict: agree
      notes: 'The press release (lines 13 to 15, 20 to 40), the application (paragraphs 6, 8, 9 and 12, lines 85 to 200 and 268 to 280 of the archived text) and the Court''s report (paragraph
        203, line 1754) re-read against the event. Direction: Nicaragua agrees that the facts listed by South Africa ''are imputable to Israel'', adopts South Africa''s reasons, and in paragraph
        9 asks the Court to adjudge that Israel has breached and continues to breach Articles I, III, IV, V and VI of the Convention and that South Africa and Israel each have a duty to take all
        reasonable measures to prevent genocide: a construction that supports the applicant, so B3, not B4. The date of filing is the Court''s (23 January 2024, in the Registry); the date of the
        withdrawal is the one in the Court''s report (the letter of 1 April 2025).'
    notes: 'Flagged: (1) the methodology text (indicators.yaml B3, docs/02 §2) names Nicaragua''s Article 62 application ''withdrawn 3 April 2025''; the Court''s own report (A/80/4, paragraph
      203, archived) says Nicaragua informed the Court on 1 April 2025, and UNISPAL''s copy of the Court''s press release on the withdrawal is headed 3 April 2025 and says ''On Tuesday 1 April
      2025, Nicaragua informed the Court'' (read on 6 October 2026; the archiver''s text of that page kept only its menu, so it is not a source of this event; the ICJ''s own page answers HTTP
      403 and Wayback holds only that page); the event ends on the date of the letter, as Colombia''s ends on the date its withdrawal was filed; the standing state ended more than a year ago,
      so the choice changes no score. (2) The filing is an Article 62 application, not a declaration under Article 63 as the other B3 events: the methodology counts ''Article 62 or 63''. (3) Nicaragua
      v. Germany (case 193, application of 1 March 2024, A/80/4 paragraph 205) is a separate case in which Nicaragua is the applicant against a third State; it is not a filing in case 192 (B3)
      and not a position against the provisional measures (B4), so it is not filed as an event (the methodology tracks joining a separate case under scope related, unscored; docs/10 B-591 (3)).'
- id: evt_2024_10_11_NIC_B12
