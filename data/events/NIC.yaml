  points: 10
  points_rationale: 'Relations severed (+10): by Presidential Agreement No. 181-2024 of 11 October 2024 the President revoked the appointment of Nicaragua''s ambassador to Israel ''por rompimiento
    de Relaciones Diplomáticas con el Gobierno de Israel'', the day the National Assembly asked the Government to consider the break because of the genocide it described in Gaza. No restoration
    found to 6 October 2026.'
  confidence: confirmed
