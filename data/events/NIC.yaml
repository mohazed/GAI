  summary:
    en: The government filed an application to intervene as a party in the ICJ case South Africa v. Israel on the Genocide Convention in the Gaza Strip, and withdrew it on 1 April 2025.
    fr: Le gouvernement a déposé devant la CIJ une demande d'intervention comme partie dans l'affaire de la Convention sur le génocide à Gaza (Afrique du Sud c. Israël), puis l'a retirée le 1er
      avril 2025.
  actor:
    en: Government of Nicaragua
    fr: Gouvernement du Nicaragua
  evidence:
  - source: src_20240208_icj_192-press-nicaragua
    quote: On 23 January 2024, Nicaragua, referring to Article 62 of the Statute of the Court, filed in the Registry of the Court an Application for permission to intervene “as a party” in the
      case concerning Application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip (South Africa v. Israel).
    quote_lang: en
    locator: lines 13–16
  - source: src_20240123_icj_192-application-nicaragua
    quote: 8. For all the above, Nicaragua coincides with the reasons and justifications that have moved South Africa to bring the case against Israel before the Court and that are stated in its
      Application.
    quote_lang: en
    locator: lines 177–178
  - source: src_20250801_undocs_a-80-4-icj-report
    quote: 203. On 1 April 2025, Nicaragua informed the Court that it had decided to withdraw the application for permission to intervene that it had submitted under Article 62 of the Statute
      of the Court on 23 January 2024.
    quote_lang: en
    locator: lines 1754–1756
  status: reviewed
  supersedes: null
