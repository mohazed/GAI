      Extraordinario y Plenipotenciario de la República de Nicaragua ante el Gobierno del Estado de
    quote_lang: es
    quote_en: Article 1. Because of the breaking of diplomatic relations with the Government of Israel, the appointment of Comrade Óscar Obidio Cubas Castro as Extraordinary and Plenipotentiary
      Ambassador of the Republic of Nicaragua to the Government of the State of … is hereby revoked.
    locator: lines 152–156
  - source: src_20241014_gaceta_acuerdo-181-2024-ruptura-israel
    quote: Frente a estas acciones atroces, criminales y crueles del gobierno de Israel contra el pueblo Palestino, la Asamblea Nacional de Nicaragua pide respetuosamente al Gobierno de Reconciliación
      y Unidad Nacional que valore la ruptura de las relaciones diplomáticas con el Gobierno genocida y sionista de Benjamín Netanyahu.
    quote_lang: es
    quote_en: Faced with these atrocious, criminal and cruel actions of the Government of Israel against the Palestinian people, the National Assembly of Nicaragua respectfully asks the Government
