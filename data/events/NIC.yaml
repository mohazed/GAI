  points: 15
  points_rationale: 'Application to intervene (+15) under Article 62 in ICJ case 192, supporting the applicant: Nicaragua asks to intervene ''as a party'', states that it ''coincides with the
    reasons and justifications that have moved South Africa to bring the case against Israel'' and asks the Court to declare that Israel has breached and continues to breach the Genocide Convention.
    Ended when Nicaragua informed the Court on 1 April 2025 that it withdrew the application.'
  confidence: confirmed
