  summary:
    en: The government broke diplomatic relations with Israel and revoked the appointment of its ambassador to Israel.
    fr: Le gouvernement a rompu les relations diplomatiques avec Israël et mis fin aux fonctions de son ambassadeur auprès d'Israël.
  actor:
    en: Government of Nicaragua
    fr: Gouvernement du Nicaragua
