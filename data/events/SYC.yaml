# Hand-authored events for Seychelles (P-21 light protocol, T-P21-43, 2026-11-04).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08). B2 is not-applicable (not a Security Council member).
# Not an EU member. Seychelles is a State Party to the Rome Statute (the ASP's list, archived: src_20261009_icc-asp_states-parties).
# Speakers for B9/B10 (R3): the President of the Republic (Wavel Ramkalawan until the swearing-in of 26 October 2025; Patrick Herminie since; head of state and of government), the Minister responsible for foreign affairs (Sylvestre Radegonde, Nation, November 2023 to September 2025). The Permanent Representative's statements (31 July 2025, two-state conference) are not B9.
# Completion of 2026-11 (T-F-L22, 2026-11-10, docs/10 B-2080): two events from the Ministry of Foreign Affairs and the Diaspora's own site (mfa.gov.sc): the Foreign Minister's remarks of 23 February 2024 (B9) and the visa exemption agreements signed with Israel on 11 January 2024 (C2).
# Not filed as events (docs/10 B-831): the Foreign Minister's remarks of 20 November 2023 (National Assembly) and 11 January 2024 (meeting with Israel's ambassador), known only from the Nation's reports in indirect speech (two leads); the 79th General Debate statement (25 September 2024) and the 81st (22 September 2026) name neither Gaza nor Palestine; the 80th has no file or page on the General Debate site.
