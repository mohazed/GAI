    notes: 'BIRN''s report (Saša Dragojlo) of 29 April 2026, republished by 021.rs, on the vote of the Serbian Assembly''s Committee on Defence and Internal Affairs of the same day, which allowed provisional
      application before the Assembly''s approval. The report quotes the Government''s explanatory note (Israel''s initiative; two video conferences; the agreement ''covers any transfer or exchange of classified
      information'' on joint ventures, contracts and sales of weapons or military know-how) and names Israel''s Directorate of Security of the Defence Establishment (Malmab) as the Israeli authority. Flags:
      (1) `reported` (weight 0.4): a single origin, BIRN (021.rs republishes it); no official text was found (the Assembly''s site and the Ministry''s did not list the bill in the searches made; the Open
      Parliament page of the committee session answers a bot challenge); (2) the signing day is not given: dated ''no later than'' the day of the report; (3) flagged under R18 (docs/10 B-621): a security
      agreement on classified information is a technical instrument that a reader who counts only trade, investment or cooperation agreements would remove, although the report ties it to arms contracts
      with Israeli firms; (4) the report''s other facts (Elbit Systems contracts of USD 335 million in early 2025 and USD 1.6 billion in August 2025; a drone production plan confirmed by the President in
      May 2026) are relayed without a primary and are listed as a lead; (5) standing, no decay; 189 days old on 2026-11-04; it is a qualifying event inside 365 days and ends the passivity penalty (the score
      without it is given in the session summary). Filed in the light protocol (docs/10 B-734 ff.).'
