- id: evt_2025_06_10_ARG_B10
  revision: 1
  country: ARG
  indicator: B10
  type: repeatable
  date: '2025-06-10'
  points: -5
  points_rationale: >-
    Declaration of support without condition (−5): the President said in Jerusalem that Argentina wanted to stand
    firmly with Israel through "these dark days" and would not bow to criticism, which he attributed to cowardice or
    complicity with barbarism, and that it would keep accompanying the people of Israel; the address states no
    condition on Israel's conduct and does not mention international humanitarian law or the civilians of Gaza.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The President said in Jerusalem that Argentina wanted to stand with Israel and would not yield to criticism of
      that position.
    fr: >-
      Le président a déclaré à Jérusalem que l'Argentine voulait se tenir aux côtés d'Israël et ne céderait pas aux
      critiques de cette position.
  actor:
    en: "President of the Nation"
    fr: "Président de la Nation"
    name: Javier Milei
  evidence:
  - source: src_20250610_casarosada_milei-palabras-jerusalen
    quote: "Queremos, como nación, estar firmes junto a ustedes mientras atraviesan estos días oscuros. No nos doblegaremos ante la crítica fruto de la cobardía o directamente la complicidad con la barbarie."
    quote_lang: es
    quote_en: "We want, as a nation, to stand firm with you while you go through these dark days. We will not bow to criticism born of cowardice or outright complicity with barbarism."
    locator: line 2
  - source: src_20250610_casarosada_milei-palabras-jerusalen
    quote: "No desistiremos en nuestra demanda por la liberación incondicional de todos los secuestrados aún cautivos en la Franja de Gaza, así como insistimos en acompañar al pueblo de Israel durante estos años trágicos."
    quote_lang: es
    quote_en: "We will not give up our demand for the unconditional release of all the hostages still held in the Gaza Strip, just as we insist on accompanying the people of Israel through these tragic years."
    locator: line 5
  status: reviewed
  supersedes: null
  related:
  - evt_2025_06_12_ARG_C2
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Casa Rosada transcript dated 10 June 2025, the President's words in Jerusalem at President Herzog's invitation
        (line 2). Line 2 carries the support and the dismissal of criticism; line 5 cites the Gaza Strip. No sentence
        of the six lines conditions the support on conduct or mentions civilians in Gaza or humanitarian law. B10
        under the reading of docs/10 B-209 (2) on data/wave-1 (support stated without any condition on conduct).
    notes: >-
      Read as a declaration of unconditional support, as Germany's statement of 12 October 2023 and India's Knesset
      address (docs/10 B-209 (2), B-246 on data/wave-1 and data/wave-2). The same visit produced two statements that
      do not cite Gaza and are therefore not filed under the literal scope rule: the Knesset address of 11 June 2025
      and the words of 12 June 2025 ("he declarado mi apoyo incondicional al Estado de Israel en su derecho a la
      autodefensa", src_20250612_casarosada_milei-memorando-democracia-libertad, line 5); flagged (docs/10 B-377 (2)).

