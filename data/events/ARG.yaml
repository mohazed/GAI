        states "sobre Gaza"; the text (lines 3 and 4) is written in the leaders' first person plural. Both passages found; call tier
        agrees (no violation named).
    notes: >-
      A joint statement signed by the head of government is read as his formal statement, as the joint statements
      filed for other countries (docs/10 B-209 (6) on data/wave-1). The other signatories' sessions filed no event on
