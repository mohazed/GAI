    quote: "Este Memorándum representa una profundización de la sociedad estratégica entre Argentina e Israel; representa un esfuerzo en materia educativa, focalizando en la conciencia del antisemitismo, considerando justamente que el próximo año Argentina sucederá a Israel en la Presidencia del IHRA, pero también iniciará una nueva etapa con mayor unión y cooperación en materia de defensa."
