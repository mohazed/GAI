# Hand-authored events for the Argentine Republic (P-D research session, wave 7, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers named in the official pages: President Alberto Fernández (head of state and government to 10 December
# 2023) with Foreign Minister Santiago Cafiero; President Javier Milei from 10 December 2023, with Foreign Ministers
# Diana Mondino (to October 2024), Gerardo Werthein (to October 2025) and Pablo Quirno. B9 and B10 events are filed
# only on the speaker's own words (official transcripts published by the Casa Rosada, the speaker's words quoted
# verbatim in the Ministry's releases) and on joint statements signed by the head of government; not on the Ministry's
# unsigned communiqués issued in the name of "la República Argentina" or "el Gobierno argentino", nor on statements by
# vice-ministers, delegations or the Minister of Defence (docs/10 B-376, as B-356 (3), B-361 (4), B-366 (4) and
# B-371 (4)). A statement is filed only when its document cites Gaza (the scope rule, docs/10 B-32, read literally as
# for Bolivia, B-371 (4)); the President's statements of support for Israel whose documents do not cite Gaza are listed
# in data/assessments/ARG.yaml (B10) and flagged (docs/10 B-377 (2)). Spanish texts are quoted in Spanish with this
# session's translation beside them.

- id: evt_2023_11_22_ARG_B9
  revision: 1
  country: ARG
  indicator: B9
  type: repeatable
  date: '2023-11-22'
  points: 2
  points_rationale: >-
    Formal call for a truce (+2): the President called at the G20 leaders' virtual summit for a humanitarian truce
    allowing international aid to arrive; the statement names no specific violation.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The President called at the G20 leaders' virtual summit for a humanitarian truce allowing international aid to
      arrive, and for the release of the hostages held in Gaza.
    fr: >-
      Le président a appelé, lors du sommet virtuel des dirigeants du G20, à une trêve humanitaire permettant l'arrivée
      de l'aide internationale et à la libération des otages détenus à Gaza.
  actor:
    en: "President of the Nation"
    fr: "Président de la Nation"
    name: Alberto Fernández
  evidence:
  - source: src_20231122_cancilleria_fernandez-g20-tregua
    quote: "el mandatario expresó su “preocupación por las terribles consecuencias del conflicto sobre las mujeres, los niños y las niñas y los civiles israelíes y palestinos”, y abogó por una “tregua humanitaria que permita la llegada de la ayuda internacional, que en parte es ayuda argentina”."
    quote_lang: es
    quote_en: "the President expressed his \"concern at the terrible consequences of the conflict for women, children and Israeli and Palestinian civilians\", and called for a \"humanitarian truce that allows international aid to arrive, part of which is Argentine aid\"."
    locator: line 5
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Ministry press information 562/23 of 22 November 2023: line 3 dates his address to the G20 leaders' virtual
        summit "hoy"; line 4 quotes his call for the release of the hostages "cautivos en Gaza" (the document cites
        Gaza); line 5 quotes his call for a humanitarian truce. Call tier agrees (no violation named).
    notes: >-
      The President's words are quoted in the Ministry's release; the Casa Rosada has no transcript of this address in
      its speech listing. His closing address of 8 December 2023 calls only for the release of the hostages held in
      Gaza (not filed).

- id: evt_2023_11_23_ARG_B9
  revision: 1
  country: ARG
  indicator: B9
  type: repeatable
  date: '2023-11-23'
  points: 2
  points_rationale: >-
    Formal call for an end to the violence (+2), read at the call tier: the Foreign Minister said an end to the
    violence was decisive for humanitarian aid to reach the population of the Gaza Strip; he named no specific
    violation.
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Foreign Minister called for an end to the violence so that international humanitarian aid could reach the
      population of the Gaza Strip.
    fr: >-
      Le ministre des Affaires étrangères a appelé à la fin des violences pour que l'aide humanitaire internationale
      parvienne à la population de la bande de Gaza.
  actor:
    en: "Minister of Foreign Affairs, International Trade and Worship"
    fr: "Ministre des Affaires étrangères, du Commerce international et du Culte"
    name: Santiago Cafiero
  evidence:
  - source: src_20231123_cancilleria_cafiero-liga-arabe-gaza
    quote: "El Canciller puntualizó que resulta determinante “el cese de la violencia para que la asistencia humanitaria internacional llegue de manera urgente y sostenible a la población afectada. La situación humanitaria es catastrófica, y por eso esperamos que el acuerdo anunciado permita aumentar el flujo de camiones que ingresan a través del Paso de Rafah”."
    quote_lang: es
    quote_en: "The Foreign Minister stated that \"an end to the violence so that international humanitarian assistance reaches the affected population urgently and sustainably\" is decisive. \"The humanitarian situation is catastrophic, and so we hope that the announced agreement will increase the flow of trucks entering through the Rafah crossing.\""
    locator: line 7
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Ministry press information 566/23 of 23 November 2023: line 3 names the Foreign Minister and the meeting with
        the ambassadors of the Arab League "con el objetivo de analizar la situación en la Franja de Gaza"; line 7
        gives his words in quotation marks. Call tier agrees; "catastrófica" describes the situation and names no violation.
    notes: >-
      Read at the call tier as a call for the cessation of hostilities ("el cese de la violencia"), as the calls for a
      truce or an end to the fighting filed for other countries. His words to the ICRC President of 2 November 2023
      (release of that day) are reported in indirect speech for the humanitarian law passage and were not filed.

- id: evt_2024_06_06_ARG_B9
