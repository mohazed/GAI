      notes: 'Re-read on 2026-11-10 against archive/text (Fana line 32, which adds that the Ethiopian Ministry of Water and Energy is the source, and lines 33 to 36 on the ceremony; Israel National News line 1): the instrument (an agreement on cooperation, no title or text published), the signatories and the date of 4 February 2025 are as stated. R18 counts a signed cooperation agreement at ministerial level; the two outlets are of distinct ownership (an Ethiopian media corporation citing the Ministry, an Israeli outlet crediting the Israeli Ministry''s spokesperson), so `corroborated`. Flagged: the instrument is known only through press (no Ministry release, treaty register or Knesset record was found); an Egyptian outlet that follows the Israeli item (Egypt Independent) says the signing was on a Wednesday (5 February), the Ethiopian outlet says 4 February (the day the Israeli item is dated); the earlier date is kept.'
    notes: 'Israel''s Energy and Infrastructure Minister, Eli Cohen, visited Addis Ababa in the first week of February 2025 (Fana, Israel National News). Fana Media Corporation reports on 4 February 2025, citing the Ethiopian Ministry of Water and Energy, that the agreement was signed in Addis Ababa by Minister Habtamu Ittefa and Minister Cohen, and names groundwater exploration, wastewater treatment and renewable energy as areas of cooperation; Israel National News (4 February 2025) gives the scope as energy, water and innovation. The Ministry of Water and Energy''s own page and the Israeli Ministry''s release (gov.il, script-rendered) were not found, so the event rests on two press sources (docs/03 §4); if the author reads one of the Ministries'' releases, it becomes `confirmed`. Found in the same searches and not filed: the Foreign Minister''s meeting with Minister Cohen of 13 March 2025 (talks, no signing) and the state visit of Israel''s President of 24 and 25 February 2026 (talks with the Prime Minister, no signing reported by the Ethiopian News Agency, whose item of 25 February 2026 was read). Cooperation in water and energy.'
