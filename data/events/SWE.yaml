      France, Ireland, the Netherlands and Belgium (data/wave-1 to data/wave-3). Sweden's support rests
      on the Minister's written answer of 21 May 2025 and the op-ed of the Prime Minister and Ministers
      of 23 May 2025. Until then the Government had called the Agreement a platform for dialogue and opposed
      pausing it (answers of 12 June and 20 November 2024, archived/read). On 4 September 2025 the Minister
      wrote that Sweden and the Netherlands wanted the trade part suspended (src_20250904_regeringen_debattartikel-hamas-och-israel);
      the Council adopted no suspension to 2026-09-28, so the tier stays at review and no end is set.
      The EEAS transcript is the one archived on data/wave-1, copied byte for byte.

