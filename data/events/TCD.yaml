    notes: 'Flagged for the author: (1) The recalled head of mission is a Chargé d''Affaires (Tchadinfos of 10 November 2023 calls him "son chef de mission"; no ambassador is named in the sources read); the event is read at the recall tier (+5)
      as Jordan''s and Belize''s recall-type measures (docs/10 B-398, B-542). A reader who requires an ambassador would drop it (+5 and the passivity effect). (2) The source is the Presidency''s daily summary of 6 November 2023, which
      reports the Ministry''s announcement of Saturday 4 November 2023 and prints one sentence of the communique in quotation marks; the communique itself is not on a Government site that could be archived (diplomatie.gouv.tg shows an
      empty directory). Tchadinfos of 4 November 2023 (press) prints the same three sentences. The event is dated 4 November 2023, the announcement. (3) The state is open: no return was found. The President sent a message to Israel''s
      President on 13 May 2024 for the national day (Presidency''s summary of 14 May 2024) and received the credentials of a non-resident Israeli Ambassador on 19 October 2026 (Presidency, post 25743): both are compatible with a
      return or with an unchanged recall; the author may end the event on the date of a documented return. (4) The same communique "appelle à un cessez-le-feu": it is a Ministry communique, not a B9 speaker''s statement (R3), so
      no B9 event comes from it; the Foreign Minister''s own words of 10 November 2023 are lead_20261104_TCD_1. (5) Save Page Now answers 403 for presidence.td: the page is recorded from the Wayback capture of 10 August 2024.'
