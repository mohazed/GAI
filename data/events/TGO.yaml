    notes: 'Flagged for the author: (1) The Ministry''s own release (the site''s WordPress API; the page itself is a script-rendered shell, so the API record is the archived document) is dated
      6 July 2026 and says the memorandum was signed ''ce jour''; the Government''s web magazine (republicoftogo.com, 8 July 2026) says ''il y a quelques jours''. The event is dated 6 July 2026.
      (2) ''Paraphé'' (initialled) is the verb used for the signatories'' act in both texts, next to ''signature solennelle'' and ''signé''; the event is read as a signed memorandum; a reader
      who takes ''paraphé'' as an initialling short of signature would drop it (R18: not an unsigned statement). (3) The text of the memorandum is not published: the release lists its purposes
      (periodic exchange of analyses, coordination of positions where appropriate, joint initiatives) and the topics to come (agriculture, water, innovation, cybersecurity, regional security);
      no defence or arms instrument is named, so no A5 is read. (4) The memorandum follows the Foreign Minister''s visit to Israel of 27 to 29 January 2026 (the Minister''s communique, archived:
      src_20260130_robertdussey_working-visit-to-israel, says both delegations stressed the need for such a memorandum); that visit is no instrument and is not filed. (5) Effect on the preview
      in the review file of light-protocol.md; Togo''s band moves with it (docs/10 B-2079).'
