# Hand-authored events for Qatar (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: the Amir, Sheikh Tamim bin Hamad Al Thani, is head of state; Sheikh Mohammed bin Abdulrahman bin Jassim
# Al Thani has been Prime Minister and Minister of Foreign Affairs since 7 March 2023, the head-of-government and
# foreign-minister speaker. The Amir is not a B9 speaker (as the King of Saudi Arabia and the President of the UAE,
# docs/10 B-382, B-386 (4), B-390 (2)). Statements are read in the English service of the Ministry of Foreign Affairs
# (mofa.gov.qa), which publishes the Prime Minister's speeches and press-conference remarks as first-person
# transcripts; its news items report his words mostly in indirect speech. B9 events are filed only on the speaker's own
# words (transcripts, direct quotes) and on joint statements of foreign ministers, not on the Ministry's unsigned
# statements, the spokesperson's words, words reported in indirect speech, or further statements in the same weeks as a
# filed one, and only when the document cites Gaza (docs/10 B-381 (4), B-32). The transcripts carry no date on the
# page; each event is dated from a dated document (the Ministry's news item of the day, or the archived page's
# metadata), docs/10 B-393. The English texts are the Ministry's own; the Arabic originals were not compared.

- id: evt_2023_10_13_QAT_B9
  revision: 1
  country: QAT
  indicator: B9
  type: repeatable
  date: '2023-10-13'
  points: 5
  points_rationale: >-
    Specific violations named (+5): the Prime Minister called for an immediate ceasefire, called the practice of
    collective punishment policies unacceptable and said the people of Gaza cannot be deprived of electricity, water and
    medicine (collective punishment, siege).
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Prime Minister called for an immediate ceasefire and said the people of Gaza could not be deprived of
      electricity, water and medicine.
    fr: >-
      Le Premier ministre a appelé à un cessez-le-feu immédiat et déclaré que la population de Gaza ne pouvait être
      privée d'électricité, d'eau et de médicaments.
  actor:
    en: "Prime Minister and Minister of Foreign Affairs"
    fr: "Premier ministre et ministre des Affaires étrangères"
    name: Mohammed bin Abdulrahman bin Jassim Al Thani
  evidence:
  - source: src_20231013_state-gov_blinken-qatar-pm-press-availability
    quote: "Qatar’s diplomatic priorities are to achieve an immediate ceasefire, protect civilians, ensure the release of prisoners, and work towards limiting the expansion of violence and the cycle of conflict in the region, which will inevitably result in serious consequences."
    quote_lang: en
    locator: line 6
  - source: src_20231013_state-gov_blinken-qatar-pm-press-availability
    quote: "I would like to stress that the killing of innocent civilians, especially children and women, and the practice of collective punishment policies, are unacceptable under any circumstance."
    quote_lang: en
    locator: line 4
  - source: src_20231013_state-gov_blinken-qatar-pm-press-availability
    quote: "We cannot deprive the people in Gaza from electricity, water, and medicine, and by all the means of life, we believe that the situation is very danger."
    quote_lang: en
    locator: line 57
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The State Department's transcript of the joint press availability in Doha (dated 13 October 2023 in the
        archived page's header and metadata, outside the extracted text; the Secretary says "yesterday in Tel Aviv",
        line 21). Lines 1 to 8 are the Prime Minister's opening remarks, given via translation: line 2 cites Gaza, line 4
        condemns collective punishment policies, line 6 states the priority of an immediate ceasefire, line 7 the
        humanitarian corridors to Gaza. Line 57 is his answer in English on Gaza. Speaker, date and Gaza citation
        confirmed; specific-violations tier agrees (collective punishment and deprivation of electricity, water and
        medicine).
    notes: >-
      A United States government transcript of the Qatari Prime Minister's words (the Ministry's news item of the day
      reports them in indirect speech and was not archived); the opening remarks are an interpretation from Arabic.

- id: evt_2023_12_25_QAT_D4
