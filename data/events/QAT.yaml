        Line 73 is the item's title and line 74 its dateline (25 December; the address carries the Hijri date
        1445/06/12, 25 December 2023); line 75 records the fifth batch's arrival on Monday under the Amir's initiative to
        treat 1,500 Palestinians. The Prime Minister's remarks of 6 February 2024, line 16, give about 200 sick and
        injured treated in Doha under the commitment to treat 1,500. One programme, one event (docs/02 §2 D4).
    notes: >-
      Dated from the earliest archived official record of the programme in operation (the fifth batch); the first
      flight was earlier in December 2023 (press), its day not confirmed from an archived primary (docs/10 B-393).
      The Ministry's items on the fourth batch (22 December 2023) and the seventh (15 January 2024) could not be
      archived (Save Page Now refused mofa.gov.qa, no usable Wayback capture found). The two Qatari field hospitals sent
      to Al-Arish for delivery to Gaza (Ministry item of 14 November 2023) were read; their deployment inside Gaza was not
      confirmed from a primary, so no second D4 event.

