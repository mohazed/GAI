# Hand-authored events for Qatar (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: the Amir, Sheikh Tamim bin Hamad Al Thani, is head of state; Sheikh Mohammed bin Abdulrahman bin Jassim
# Al Thani has been Prime Minister and Minister of Foreign Affairs since 7 March 2023, the head-of-government and
# foreign-minister speaker. The Amir is not a B9 speaker (as the King of Saudi Arabia and the President of the UAE,
# docs/10 B-382, B-386 (4), B-390 (2)). Statements are read in the English service of the Ministry of Foreign Affairs
# (mofa.gov.qa), which publishes the Prime Minister's speeches and press-conference remarks as first-person
# transcripts; its news items report his words mostly in indirect speech. B9 events are filed only on the speaker's own
# words (transcripts, direct quotes) and on joint statements of foreign ministers, not on the Ministry's unsigned
# statements, the spokesperson's words, words reported in indirect speech, or further statements in the same weeks as a
# filed one, and only when the document cites Gaza (docs/10 B-381 (4), B-32). The transcripts carry no date on the
# page; each event is dated from a dated document (the Ministry's news item of the day, or the archived page's
# metadata), docs/10 B-393. The English texts are the Ministry's own; the Arabic originals were not compared.

