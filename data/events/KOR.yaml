# are filed only on the speaker's own formal words (speeches and statements published in the
# Minister's name, joint statements the Minister signed), not on the Ministry's readouts of
# meetings and telephone talks in indirect speech, on statements and commentaries of the MOFA
# Spokesperson, or on answers at the Spokesperson's briefings (docs/10 B-337; B-332 for Japan's
# Press Secretary; B-314, B-320, B-325 on data/wave-5).
