- id: evt_2023_10_07_ITA_A6
  revision: 1
  country: ITA
  indicator: A6
  type: standing
  date: '2023-10-07'
  end: null
  points: 10
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The Government suspended the granting of new export licences for military materiel to Israel after the start of Israeli operations in Gaza, as the President of the Council stated.
    fr: Le gouvernement a suspendu l'octroi de nouvelles licences d'exportation de matériels de guerre vers Israël après le début des opérations israéliennes à Gaza, selon la présidente du Conseil.
  actor:
    en: President of the Council of Ministers
    fr: Présidente du Conseil des ministres
    name: Giorgia Meloni
  evidence:
  - source: src_20241015_governo_replica-senato-licenze-israele
    quote: dopo l’avvio delle operazioni israeliane a Gaza, il Governo ha sospeso immediatamente la concessione di ogni nuova licenza di esportazione per materiali di armamento verso Israele, ai sensi della legge 185 del 1990.
    quote_lang: it
    quote_en: after the start of the Israeli operations in Gaza, the Government immediately suspended the granting of any new export licence for military materiel to Israel, under Law 185 of 1990.
    locator: line 29
  - source: src_20241015_governo_replica-senato-licenze-israele
    quote: Noi sulle nuove licenze non facciamo una valutazione caso per caso, abbiamo bloccato tutto. Facciamo la valutazione caso per caso sulle vecchie licenze.
    quote_lang: it
    quote_en: On new licences we do not make a case-by-case assessment, we have blocked everything. We make the case-by-case assessment on the old licences.
    locator: line 31
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Lines 29 to 32 of the Senate reply re-read: all new licences for military materiel to Israel suspended after the start of the operations in Gaza, earlier licences reviewed case by case. A partial suspension (A6), not A7; date and scope agree.'
    notes: >-
      A class of licences (all new licences for military materiel to Israel) suspended by
      government decision, docs/02 §2 A6. Dated 7 October 2023 as the Spanish suspension
      (docs/10 B-221 (1)): the President of the Council states the suspension followed the start of
      the Israeli operations "immediately" and that contracts signed after 7 October found no
      application (line 29); the decision itself (by the national authority for armament exports,
      UAMA, at the Ministry of Foreign Affairs) was not found as a published act. Licences granted
      before that date were reviewed case by case, some suspended or revoked (naval demonstration
      munitions) and others kept (aircraft components, line 32), so this is a partial suspension,
      not an embargo (A7). No lifting of the suspension was found, so it has no end. Italy's own
      customs reports show HS 93 exports to Israel of USD 6.4 million in 2024 (generated A2), which
      the deliveries under earlier licences would explain (docs/10 B-253).

