    notes: 'The signing in Jerusalem on 1 December 2025 of a bilateral framework agreement and an implementing agreement between Israel''s Minister of Foreign Affairs, Gideon Sa''ar, and Cambodia''s Minister of Labour and Vocational Training (i24NEWS, archived from the Wayback capture of 1 December 2025; the Israeli Foreign Ministry''s own page and the Ministry of Labour''s release were not found, and the Khmer Times reports (501799949, 501927166) answer a Cloudflare challenge and have no Wayback capture, so they are not used). Filed as a C2 event of -10 under R18 (a signed governmental instrument of cooperation): one event for the framework agreement; the implementing agreement signed the same day is read as its implementing arrangement and is not counted separately (a reader who counts two instruments would add -10, inside the category cap of -20). Flags: (1) a labour-mobility agreement for agricultural workers is a cooperation instrument under R18, as the Indian labour mobility protocols (evt of IND) and the Sri Lankan labour-recruitment memorandum were read; a reader who limits C2 to trade, investment and political cooperation would drop it. (2) corroborated rests on i24NEWS (the signing) and Cambodian sources (cpp.org.kh, the party''s news site; AKP, the national news agency) that name the agreement and date without its text; the text of neither agreement was found. (3) The memorandum on education, youth and culture of 20 February 2025 stays a lead (lead_20261104_KHM_1). The first session did not file the labour agreement because the i24NEWS page could not be read (docs/10 B-700); the Wayback capture holds the text.'
