    quote: Türkiye Cumhuriyeti’nin 2 Mayıs 2024’te almış olduğu kararla, tam 23 aydır Türkiye’den İsrail’e bütün ürün gruplarında ihracat, ithalat, serbest bölge ve transit ticaret tamamen durdurulmuştur.
