    committing genocide against the Palestinian people of Gaza'' and recalls every State''s obligation to prevent genocide and to use all available diplomatic and legal means to stop the killings (a finding
    adopted by the speaker, as evt_2025_09_24_NAM_B9, docs/10 B-816).'
