  summary:
    en: The President of the Republic told the conference on the two-State solution that a UN commission had confirmed genocide against the Palestinian people of Gaza, in his words.
    fr: Le président de la République a dit à la conférence sur la solution des deux États qu'une commission de l'ONU avait confirmé un génocide contre le peuple palestinien de Gaza, selon ses mots.
  actor:
    en: President of the Republic
    fr: Président de la République
    name: Ismaïl Omar Guelleh
  evidence:
  - source: src_20250922_un-int-djibouti_guelleh-two-state-conference
    quote: of Inquiry, in its detailed report of 16 September, confirmed that Israeli is committing genocide against the Palestinian people of Gaza.
