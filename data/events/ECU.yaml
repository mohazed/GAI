- id: evt_2023_12_07_ECU_B9
  revision: 1
  country: ECU
  indicator: B9
  type: repeatable
  date: '2023-12-07'
  points: 2
  points_rationale: 'Formal call for a ceasefire (+2), flagged: at the United Nations Headquarters the President, asked about the draft Security Council resolution tabled by the United Arab Emirates,
    said that Ecuador ''will always be in favour of peace, in favour of the ceasefire and of ending violence not only in Gaza, but in any area or territory''; no specific violation is named.'
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The President of Ecuador said, asked about the Security Council's draft resolution, that Ecuador would always favour the ceasefire and an end to violence in Gaza and elsewhere.
    fr: Le président de l'Équateur a déclaré, interrogé sur le projet de résolution du Conseil de sécurité, que l'Équateur serait toujours favorable au cessez-le-feu et à la fin de la violence
      à Gaza.
  actor:
    en: President of Ecuador
    fr: Président de l'Équateur
    name: Daniel Noboa Azín
  evidence:
  - source: src_20231207_unifeed_noboa-stakeout-ceasefire
    quote: Ecuador will always be in favour of peace, in favour of the ceasefire and of ending violence not only in Gaza, but in any area or territory in the world that is happening, including
      in Ecuadorian territory.
    quote_lang: en
    locator: line 53
  - source: src_20231207_unifeed_noboa-stakeout-ceasefire
    quote: Asked about a draft Security Council resolution tabled by the United Arab Emirates calling for a humanitarian ceasefire in Gaza, Noboa said
    quote_lang: en
    locator: line 59
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-06'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-06'
      verdict: agree
      notes: 'Lines 49 to 59 of the archived UNifeed text re-read: the soundbite at line 53 is the President''s own words in English (''Ecuador will always be in favour of peace, in favour of
        the ceasefire and of ending violence not only in Gaza, ...'') and line 59 gives the question (the United Arab Emirates'' draft calling for a humanitarian ceasefire in Gaza). B9 +2 at the
        call tier agrees, flagged.'
    notes: 'The President''s stakeout at United Nations Headquarters on 7 December 2023 (UNifeed''s record, kind official: the UN''s shot list transcribes the English soundbite; the video is not
      archived and the page gives no timestamp). The speaker is the head of state and of government (R3). Flagged: the words are a statement of position given in answer to a question on the draft
      resolution (vetoed the next day), not a call addressed to the parties, and the same sentence extends to ''any area or territory in the world''; filed at the call tier as a B9 speaker''s
      hope for a ceasefire was (docs/10 B-510 (1)), and a reader who requires a call addressed to the parties would not file it. The same soundbite adds that Ecuador is ''against terrorist actions
      against sovereign peoples and against friendly peoples'': not unconditional support, no B10. Decayed to zero today (1,034 days): no effect on the score. The President''s General Debate statement
      of the 81st session (23 September 2026) has no passage on Gaza; the Foreign Minister''s of the 80th session (25 September 2025) has none either; the Permanent Representative''s of the 79th
      (30 September 2024) says Ecuador voted for the Security Council''s resolutions on Palestine but is not a B9 speaker (R3).'

