      at: '2026-09-29'
      verdict: agree
      notes: >-
        The Minister of Justice's answer to S 336 re-read in full: Denmark complies with its obligations and is
        as a starting point obliged to carry out the ICC's decisions on arrest and surrender; immunity may matter
        and the courts decide. Agree at B5 with the caveat recorded in the notes and flagged in docs/10 B-288 (2).
    notes: >-
      Standing state from the Minister of Justice's written answer to question S 336 (29 November 2024), which asked
      whether Denmark should follow the ICC's arrest warrant for Benjamin Netanyahu and surrender him if he comes
      to Denmark. The answer adds that the rules of international law on immunity could matter for Denmark's obligations,
      refers immunity questions to the Minister for Foreign Affairs, and declines to comment on the outcome of a
      specific case because the courts decide; it is read as a commitment at the B5 tier, flagged for the author
      (docs/10 B-288 (2)). No later statement of refusal and no visit of a person under warrant found. The Prime
      Minister referred the same question to the Minister of Justice (S 338, 26 November 2024).

