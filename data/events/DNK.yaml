    fr: Ministre de la Justice
    name: Peter Hummelgaard
  evidence:
  - source: src_20241129_ft_svar-s336-icc-arrestordre
    quote: >-
      Danmark overholder selvsagt sine folkeretlige forpligtelser og bakker fuldt op om Den Internationale Straffedomstols
      uafhængighed, ligesom Danmark i medfør af Rom-statutten er underlagt en generel samarbejdsforpligtelse over
      for Den Internationale Straffedomstol, der indebærer, at Danmark som udgangspunkt er forpligtet til at gennemføre
      domstolens beslutninger om anholdelse og udlevering.
    quote_lang: da
    quote_en: >-
      Denmark of course complies with its obligations under international law and fully supports the independence
      of the International Criminal Court, just as Denmark under the Rome Statute is subject to a general obligation
      to cooperate with the International Criminal Court, which means that Denmark is as a starting point obliged
      to carry out the court's decisions on arrest and surrender.
    locator: lines 17–22
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
