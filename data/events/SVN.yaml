# Hand-authored events for Slovenia (P-D research session, wave 5, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: the Prime Minister is the head of government (Robert Golob to June 2026, then Janez
# Janša); the Minister of Foreign and European Affairs is the foreign minister (Tanja Fajon to June
# 2026, then Tone Kajzer). Releases of the Ministry or of the Prime Minister's Office are filed as
# B9 events only for the speaker's own quoted words, or for the Ministry's report of what the named
# speaker said (docs/10 B-304).
- id: evt_2023_10_07_SVN_A6
  revision: 1
  country: SVN
  indicator: A6
  type: standing
  date: '2023-10-07'
  end: '2026-06-11'
  points: 10
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Ministry of Defence issued no licence for the export of military weapons and equipment to Israel from
      October 2023, on the ground of armed conflict.
    fr: >-
      Le ministère de la Défense n'a délivré aucune licence d'exportation d'armes et d'équipements militaires vers
      Israël à partir d'octobre 2023, au motif d'un conflit armé.
  actor:
    en: Ministry of Defence
    fr: Ministère de la Défense
  evidence:
  - source: src_20250731_gov-si_seja-345-orozje-izrael
    quote: >-
      Vlada se je seznanila z Informacijo o izdaji dovoljenj za izvoz in tranzit vojaškega orožja in opreme v Izrael,
      po kateri Ministrstvo za obrambo zaradi oboroženih spopadov (razlog iz tretje alineje tretjega odstavka 77. člena
      Zakona o obrambi) od oktobra 2023 ni izdalo nobenega dovoljenja za izvoz vojaškega orožja in opreme v Izrael.
    quote_lang: sl
    quote_en: >-
      The Government took note of the Information on the issuing of licences for the export and transit of military
      weapons and equipment to Israel, according to which the Ministry of Defence, because of armed conflict (the
      ground in the third indent of the third paragraph of Article 77 of the Defence Act), has issued no licence for
      the export of military weapons and equipment to Israel since October 2023.
    locator: line 11
  - source: src_20241123_gov-si_popravek-orozje-izrael
    quote: >-
      V obeh odgovorih je vlada odgovorila, da od začetka vojne v Gazi Republika Slovenija v Izraelu ni niti kupila
      nobenega orožja, streliva ali druge vojaške opreme niti ni izdala nobenega dovoljenja za izvoz tovrstnega blaga
      iz Republike Slovenije v Izrael.
    quote_lang: sl
    quote_en: >-
      In both answers the Government replied that since the start of the war in Gaza the Republic of Slovenia has
      neither bought any weapons, ammunition or other military equipment in Israel nor issued any licence for the
      export of such goods from the Republic of Slovenia to Israel.
    locator: line 2
  - source: src_20260611_gov-si_seja-2-orozje-izrael
    quote: >-
      Ministrstvo v zvezi z izvozom orožja v Izrael izvaja aktivnosti v skladu s predpisi na tem področju in kriteriji
      skupnega stališča Sveta EU 944/2008/SZVP, ki opredeljuje skupna pravila glede nadzora izvoza vojaške tehnologije
      in opreme.
    quote_lang: sl
    quote_en: >-
      With regard to arms exports to Israel, the Ministry acts in accordance with the regulations in this field and
      the criteria of Council Common Position 2008/944/CFSP, which defines common rules governing the control of
      exports of military technology and equipment.
    locator: line 28
  status: reviewed
  supersedes: null
  related:
  - evt_2025_07_31_SVN_A7
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 11 of the session release, line 2 of the Ministry of Defence's correction and line 28 of the release of 11 June 2026 re-read. A6 agrees; the start date (month only) and the end date stay flagged (docs/10 B-304).
    notes: >-
      A refusal of a class of licences (docs/02 §2 A6) on the ground of armed conflict under the Defence Act, stated by
      the Government on 31 July 2025 ("from October 2023") and in its answers to a deputy of 18 September and 18
      November 2024 as reported by the Ministry of Defence ("since the start of the war in Gaza"). Dated from the
      window's start, as Spain's A6 (evt_2023_10_07_ESP_A6 on data/wave-1); the documents give the month, not the day.
      Superseded by A7 from 31 July 2025 (the engine zeroes A6 while A7 holds). Ended on 11 June 2026, when the new
      Government withdrew the prohibition of 31 July 2025 and the Ministry stated that it applies the law and Common
      Position 2008/944/CFSP to arms exports to Israel, a case-by-case practice; no document says whether licences have
      been issued since. Flagged for the author (docs/10 B-304).

