  date: '2023-10-17'
  points: -5
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The Federal Chancellor said that Austria stood at Israel's side and assured Israel of full solidarity, and that
      Hamas bore responsibility for civilian casualties in the Gaza Strip.
    fr: >-
      Le chancelier fédéral a déclaré que l'Autriche se tenait aux côtés d'Israël, lui a assuré une pleine solidarité
      et a imputé au Hamas les victimes civiles dans la bande de Gaza.
  actor:
    en: Federal Chancellor
    fr: Chancelier fédéral
    name: Karl Nehammer
  evidence:
  - source: src_20231017_bundeskanzleramt_nehammer-seite-israels
    quote: >-
      Israel hat jedes Recht darauf, sich selbst zu verteidigen. Wir stehen an der Seite von Israel und vor allem an der
      Seite der Angehörigen und gedenken der Opfer
    quote_lang: de
    quote_en: >-
      Israel has every right to defend itself. We stand at Israel's side and above all at the side of the relatives,
      and we remember the victims
    locator: line 102
  - source: src_20231017_bundeskanzleramt_nehammer-seite-israels
    quote: >-
      Die Hamas trägt die Verantwortung dafür, wenn es zivile Opfer im Gazastreifen gibt
    quote_lang: de
    quote_en: >-
      Hamas bears the responsibility when there are civilian casualties in the Gaza Strip
    locator: line 104
  - source: src_20231017_bundeskanzleramt_nehammer-seite-israels
    quote: >-
      betonte der Kanzler und sicherte Israel die „volle Solidarität" zu
    quote_lang: de
    quote_en: >-
      the Chancellor stressed, and assured Israel of "full solidarity"
    locator: line 104
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        The Chancellery item re-read in full: the Chancellor's quoted words place Austria at Israel's side,
        assure it of full solidarity and assign responsibility for civilian casualties in Gaza to Hamas; the
        item also reports EU agreement that humanitarian aid must remain possible, which is not a condition on
        the support. B10 agrees, flagged (docs/10 B-298).
    notes: >-
      Read as a declaration of unconditional support, as Germany's "only one place, at Israel's side" of
      12 October 2023 (evt_2023_10_12_DEU_B10 on data/wave-1): the Chancellor's statement at the European Council video
      conference places Austria at Israel's side, assures it of full solidarity and assigns responsibility for civilian
      casualties in Gaza to Hamas, with no condition attached; flagged for the author (docs/10 B-298). The
      Chancellor's speech of 26 October 2023 ("ohne Wenn und Aber", Hamas responsible for the suffering in Gaza) is
      of the same kind and is not filed separately. Decayed to zero (Δ > 730 days).

