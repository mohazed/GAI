# Hand-authored events for the Republic of Chile (P-D research session, wave 7, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: President Gabriel Boric Font (head of state and government to 11 March 2026), the Minister of Foreign
# Affairs Alberto van Klaveren (to 11 March 2026); President José Antonio Kast and Minister Francisco Pérez Mackenna
# from 11 March 2026. B9 events are filed only on the speaker's own words: the President's speeches as transcribed
# by the Presidency, and the Minister's words quoted verbatim in the Ministry's releases; not on the Ministry's
# unsigned communiqués issued in the name of "el Gobierno de Chile", nor on readouts in indirect speech (docs/10
# B-361 (4), as B-356 (3) for Colombia). Spanish texts are quoted in Spanish with this session's English
# translation beside them.

- id: evt_2023_10_31_CHL_B12
  revision: 1
  country: CHL
  indicator: B12
  type: standing
  date: '2023-10-31'
  end: '2026-06-04'
  points: 5
  points_rationale: >-
    Ambassador recalled (+5): the government called the ambassador in Israel to Santiago for consultations on 31
    October 2023, citing violations of international humanitarian law in the Gaza Strip. Ended on 4 June 2026,
    when the President designated a new ambassador to Israel who had received the agrément. No downgrade or
    severance followed; the withdrawal of the military attachés on 28 May 2025 is not counted as a separate tier
    (docs/10 B-362 (2)).
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The government recalled the ambassador in Israel to Santiago for consultations, citing violations of
      international humanitarian law in Gaza.
    fr: >-
      Le gouvernement a rappelé l'ambassadeur en Israël à Santiago pour consultations, en invoquant des violations
      du droit international humanitaire à Gaza.
  actor:
    en: "Government of Chile"
    fr: "Gouvernement du Chili"
  evidence:
  - source: src_20231031_minrel_llamado-consultas-embajador-israel
    quote: "Ante las inaceptables violaciones del Derecho Internacional Humanitario en que ha incurrido Israel en la franja de Gaza, el Gobierno de Chile ha resuelto llamar en consultas a Santiago al embajador de Chile en Israel, Jorge Carvajal."
    quote_lang: es
    quote_en: "In view of the unacceptable violations of international humanitarian law committed by Israel in the Gaza Strip, the Government of Chile has decided to call the ambassador of Chile in Israel, Jorge Carvajal, to Santiago for consultations."
    locator: line 49
  - source: src_20260604_minrel_designacion-embajadores-israel
    quote: "El Ministerio de Relaciones Exteriores informa que el Presidente de la República, José Antonio Kast, designó como embajadores de Chile a Ricardo Hernández, en Ecuador; Hernán Bascuñán, en Países Bajos; James Sinclair, en Santa Sede, y Gabriel Zaliasnik, en Israel. Todos ellos ya recibieron sus respectivos beneplácitos."
    quote_lang: es
    quote_en: "The Ministry of Foreign Affairs reports that the President of the Republic, José Antonio Kast, designated as ambassadors of Chile Ricardo Hernández, in Ecuador; Hernán Bascuñán, in the Netherlands; James Sinclair, to the Holy See; and Gabriel Zaliasnik, in Israel. All of them have already received their respective agréments."
    locator: line 3
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Ministry release dated 31 October 2023: the recall is decided that day and cites Israel's conduct in the Gaza
        Strip, so the event is scoped gaza. The recalled ambassador, Jorge Carvajal, was designated ambassador to the
        Netherlands on 30 October 2024 (Ministry item, read) and did not return; the President's annual addresses of 1
        June 2024 and 1 June 2025 still list the recall among the measures taken. The Ministry release of 4 June 2026
        designates Gabriel Zaliasnik as ambassador in Israel with agrément: read as the end of the recall. Recall tier
        agrees.
    notes: >-
      On 28 May 2025 the embassy notified Israel of the withdrawal of Chile's military, defence and air attachés in
      Tel Aviv, citing the situation in Gaza (src_20250528_minrel_retiro-agregados-militares-israel); it is recorded
      here, not as a downgrade tier, and flagged for the author (docs/10 B-362 (2)). Whether the attachés returned
      was not found. The end date is the designation, not the ambassador's arrival or credentials (not found).

