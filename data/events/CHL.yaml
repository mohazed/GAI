    quote: "El embajador de Chile en el Reino de los Países Bajos, Jaime Moscoso, presentó hoy, ante la Corte Internacional de Justicia (CIJ), el escrito de intervención de Chile en el marco de la demanda presentada por Sudáfrica contra Israel, sobre la aplicación de la Convención para la Prevención y la Sanción del Delito de Genocidio en la Franja de Gaza."
    quote_lang: es
    quote_en: "The ambassador of Chile in the Kingdom of the Netherlands, Jaime Moscoso, today filed with the International Court of Justice (ICJ) Chile's written intervention in the case brought by South Africa against Israel on the application of the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip."
