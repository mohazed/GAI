    quote: This was the first visit by an Israeli minister to Tajikistan, and included high-level meetings, participation in the 2025 Tajikistan Tourism Investment Forum, and the signing of a
      Joint Declaration of Intent on Tourism.
    quote_lang: en
    locator: line 1
  - source: src_20250922_jns_israel-tajikistan-tourism-agreement
    quote: Israeli Tourism Minister Haim Katz and Jumakhonzoda Jamshed Jurakhon, chairman of the Committee for Tourism Development of the Republic of Tajikistan, inked the memorandum of understanding
      on Thursday at the UN Tourism Investment Forum in Dushanbe, in the first official visit by an Israeli minister to the country.
    quote_lang: en
    locator: line 669
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-05'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-05'
      verdict: agree
      notes: 'Re-read both texts: the Israeli Government''s news item records the signing of a Joint Declaration of Intent on Tourism during the Minister''s visit and names the Tajik counterpart
        (the Chairman of the Tourism Development Committee under the Government); JNS says the two signed a memorandum of understanding on Thursday 18 September 2025 (caption: Dushanbe, 18 September
        2025). One instrument, signed by governmental bodies of both states: agrees, flagged for the wording (declaration of intent) and for the missing Tajik record.'
    notes: 'The Israeli Government''s own page (the embassy in Uzbekistan, which covers Tajikistan) is the primary; it carries no date, so the date of 18 September 2025 rests on JNS (the signing
      in Dushanbe, ''Thursday'', and the photograph''s caption). No Tajik record was found (the Committee''s site and the Ministry''s pages were not found to carry it). The Israeli page calls
      the instrument a ''Joint Declaration of Intent'', JNS a ''memorandum of understanding'': read as a signed governmental instrument of cooperation under R18 (a declaration of intent that sets
      the framework of tourism cooperation); a reader who excludes declarations of intent would remove the event (the memoranda of intent on a visa exemption were left out for Kazakhstan on the
      same ground, B-504 (2)).'

