# Hand-authored events for the United Arab Emirates (P-D research session, wave 8, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: the President, Sheikh Mohamed bin Zayed Al Nahyan, is head of state; the Vice President, Prime Minister
# and Ruler of Dubai, Sheikh Mohammed bin Rashid Al Maktoum, is head of government; Sheikh Abdullah bin Zayed Al Nahyan
# is Deputy Prime Minister and Minister of Foreign Affairs. B9/B10 speakers are the Prime Minister and the Foreign
# Minister, not the President (as the King of Saudi Arabia, docs/10 B-382; docs/10 B-386 (4)). The statements are read in
# the English news of the Ministry of Foreign Affairs (www.mofa.gov.ae), which publishes the statements of the President,
# the Foreign Minister and the Ministry; the Emirates News Agency could not be read (docs/10 B-386 (2)). B9 events are
# filed only on the speaker's own words (signed statements, direct quotes) and on joint statements of foreign ministers,
# not on the Ministry's unsigned statements, words reported in indirect speech, or further statements in the same weeks
# as a filed one, and only when the document cites Gaza (docs/10 B-381 (4), B-32). The English texts are the Ministry's
# own; the Arabic originals were not compared.

- id: evt_2023_11_18_ARE_D4
  revision: 1
  country: ARE
  indicator: D4
  type: repeatable
  date: '2023-11-18'
  points: 5
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The United Arab Emirates received the first flight of its programme to treat 1,000 children from the Gaza Strip
      and their families in its hospitals.
    fr: >-
      Les Émirats arabes unis ont reçu le premier vol de leur programme de soins, dans leurs hôpitaux, de 1 000 enfants
      de la bande de Gaza et de leurs familles.
  actor:
    en: "Government of the United Arab Emirates"
    fr: "Gouvernement des Émirats arabes unis"
  evidence:
  - source: src_20231118_mofa-ae_first-plane-children-gaza
    quote: "Today, the first plane carrying 15 people, including children and their families, arrived in the UAE, as part of the initiative directed by His Highness Sheikh Mohamed bin Zayed Al Nahyan, UAE President, to provide medical treatment for 1,000 children accompanied by their families from the Gaza Strip in the UAE's hospitals."
    quote_lang: en
    locator: line 253
  - source: src_20241106_mofa-ae_evacuation-210-patients-gaza
    quote: "This evacuation of Palestinians, which includes the wounded, injured, and cancer patients, is in accordance with the initiative launched by His Highness Sheikh Mohamed Bin Zayed Al Nahyan, UAE President, to treat 1,000 wounded children and 1,000 cancer patients in the country’s hospitals. To date, 2,127 patients and companions have been evacuated to the UAE."
    quote_lang: en
    locator: line 6
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 251 is the item's title and line 252 its date (18 November 2023); line 253 records the first flight, 15
        people from El Arish to Abu Dhabi, under the President's initiative for 1,000 children with their families.
        The item of 6 November 2024, line 3, is the twenty-second flight (86 patients, 124 family members, with WHO);
        line 6 places it under the same initiative, extended to 1,000 cancer patients, and gives 2,127 people
        evacuated. One programme, one event (docs/02 §2 D4), dated from the first arrival as for Egypt and Ireland on
        data/wave-2.
    notes: >-
      The President's directive was announced on 1 November 2023 (Ministry item of that day, not archived). The later
      flights of 2025 and 2026 (Ministry items of 28 March, 14 May, 20 August, 17 September and 29 October 2025, by
      title) are part of this programme and are not filed separately.

- id: evt_2023_12_02_ARE_D4
  revision: 1
  country: ARE
  indicator: D4
  type: repeatable
  date: '2023-12-02'
  points: 5
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: >-
      The United Arab Emirates opened a field hospital of more than 150 beds in the southern Gaza Strip.
    fr: >-
      Les Émirats arabes unis ont ouvert un hôpital de campagne de plus de 150 lits dans le sud de la bande de Gaza.
  actor:
    en: "Government of the United Arab Emirates"
    fr: "Gouvernement des Émirats arabes unis"
  evidence:
  - source: src_20231203_mofa-ae_field-hospital-gaza
    quote: "The Emirati integrated field hospital in Gaza began today providing its treatment services to the people of the Gaza Strip, as part of the UAE’s efforts to alleviate the suffering of Palestinian people and support the health system in the Gaza Strip, which faces exceptional, critical circumstances."
    quote_lang: en
    locator: line 211
  - source: src_20241106_mofa-ae_evacuation-210-patients-gaza
    quote: "Since it began operations on December 2nd, 2023, the UAE field hospital in the southern Gaza Strip has treated 50,489 cases."
    quote_lang: en
    locator: line 7
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 208 is the title and line 209 the item's date (3 December 2023); line 211 says the hospital began its
        services "today", line 212 gives more than 150 beds and an Emirati medical team, line 215 the entry into the
        southern Gaza Strip through Rafah "last Friday" (1 December 2023). The item of 6 November 2024, line 7, dates
        the start of operations to 2 December 2023. A field hospital deployment is one D4 programme; the date follows
        the later item's explicit date (docs/10 B-388 (3)).
    notes: >-
      The Ministry's item of 3 December 2023 was probably published a day after the opening; the one-day difference
      does not change the score (the event is past its 730-day decay today).

