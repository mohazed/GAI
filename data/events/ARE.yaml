    locator: line 253
  - source: src_20241106_mofa-ae_evacuation-210-patients-gaza
    quote: "This evacuation of Palestinians, which includes the wounded, injured, and cancer patients, is in accordance with the initiative launched by His Highness Sheikh Mohamed Bin Zayed Al Nahyan, UAE President, to treat 1,000 wounded children and 1,000 cancer patients in the country’s hospitals. To date, 2,127 patients and companions have been evacuated to the UAE."
    quote_lang: en
    locator: line 6
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-29'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-29'
      verdict: agree
      notes: >-
        Line 251 is the item's title and line 252 its date (18 November 2023); line 253 records the first flight, 15
        people from El Arish to Abu Dhabi, under the President's initiative for 1,000 children with their families.
        The item of 6 November 2024, line 3, is the twenty-second flight (86 patients, 124 family members, with WHO);
        line 6 places it under the same initiative, extended to 1,000 cancer patients, and gives 2,127 people
        evacuated. One programme, one event (docs/02 §2 D4), dated from the first arrival as for Egypt and Ireland on
        data/wave-2.
    notes: >-
      The President's directive was announced on 1 November 2023 (Ministry item of that day, not archived). The later
      flights of 2025 and 2026 (Ministry items of 28 March, 14 May, 20 August, 17 September and 29 October 2025, by
      title) are part of this programme and are not filed separately.

