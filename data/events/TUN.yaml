- id: evt_2023_12_03_TUN_D4
  revision: 1
  country: TUN
  indicator: D4
  type: repeatable
  date: '2023-12-03'
  points: 5
  confidence: corroborated
  scope:
  - gaza
  summary:
    en: The government flew 29 wounded Palestinians from Al-Arish to Tunis for treatment, the first flight of a medical-evacuation programme.
    fr: Le gouvernement a transporté à Tunis, depuis El-Arich, 29 Palestiniens blessés pour des soins, premier vol d'un programme d'évacuation sanitaire.
  actor:
    en: Government of Tunisia
    fr: Gouvernement de la Tunisie
  evidence:
  - source: src_20231204_kapitalis_saied-wounded-palestinians-tunis
    quote: Rappelons qu’un avion militaire tunisien transportant 39 palestiniens dont 29 blessés a atterri, quelques heures plus tôt, à l’aéroport de Tunis-Carthage, en provenance de l’aéroport
      international El-Arich en Egypte.
    quote_lang: fr
    quote_en: We recall that a Tunisian military aircraft carrying 39 Palestinians, 29 of them wounded, landed a few hours earlier at Tunis-Carthage airport, from El-Arish international airport
      in Egypt.
    locator: line 3
  - source: src_20231205_lapresse_tunisia-receives-wounded-palestinians
    quote: Il convient de rappeler qu’un avion militaire avec à son bord 39 Palestiniens dont 29 blessés a atterri dimanche soir
    quote_lang: fr
    quote_en: It should be recalled that a military aircraft with 39 Palestinians on board, 29 of them wounded, landed on Sunday evening
    locator: line 5
  - source: src_20231220_courrier-atlas_second-convoy-wounded-tunis
    quote: Un avion de la compagnie nationale aérienne Tunisair en provenance de l’aéroport d’El-Arish en Egypte est arrivé le 18 décembre au soir en Tunisie transportant 53 nouveaux blessés palestiniens
      victimes de l’agression israélienne contre Gaza.
    quote_lang: fr
    quote_en: A Tunisair aircraft from El-Arish airport in Egypt arrived on the evening of 18 December in Tunisia carrying 53 new wounded Palestinians, victims of the Israeli aggression against
      Gaza.
    locator: line 1
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-10-13'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-10-13'
      verdict: agree
      notes: 'Re-read Kapitalis (line 3), La Presse (line 5) and Le Courrier de l''Atlas (line 1 and line 5): the flight of Sunday 3 December 2023 (39 Palestinians, 29 of them wounded) and the
        second flight of 18 December (53 wounded). Two publishers report the first flight, so `corroborated`. The Courrier de l''Atlas quotes the Minister of Health saying 20 wounded were evacuated
        on 3 December, against 29 in the two other reports: the count differs, the programme does not.'
    notes: One event for the programme (docs/02 §2 D4), dated from the arrival of the first group on Sunday 3 December 2023; the second flight of 18 December 2023 (53 wounded, a Tunisair aircraft)
      is the same programme, not a second event. The flights were on the President's instructions (Kapitalis quotes the President's adviser; the Courrier de l'Atlas quotes the Minister of Health);
      no Government release was found that could be archived (the Presidency's and the Ministry of Health's pages are on social networks), so the event rests on two independent press publishers
      (La Presse and Kapitalis). Expired (1,045 days). Filed in the light protocol (docs/10 B-662 ff.).

