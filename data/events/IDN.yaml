# Hand-authored events for Indonesia (P-D research session, wave 9, 2026-09-29).
# Generated indicators (A1, A2, A4, B1, B2, B8, C3, D1) are not in this file (D-08).
# Speakers: Indonesia has a presidential system; the President is head of state and head of government and is a B9
# speaker (Joko Widodo to 20 October 2024, Prabowo Subianto since). Foreign Ministers: Retno L. P. Marsudi to
# 20 October 2024, Sugiono since 21 October 2024. Statements are read in the full texts the Ministry of Foreign Affairs
# publishes (kemlu.go.id, section Pidato Menteri) and the Cabinet Secretariat's transcripts; B9 events are filed only
# on the speaker's own words, citing Gaza, one per occasion and not for further statements in the same weeks as a
# filed one; not on the Ministry's unsigned statements, the Vice Ministers' statements or words reported in indirect
# speech (docs/10 B-381 (4) on data/wave-8, B-32, B-407).

