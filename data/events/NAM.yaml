    quote_lang: en
    locator: page 18 (paragraph 57)
  - source: src_20260927_icj-cij_case-192
    quote: Declarations of intervention in the proceedings filed on 12 March 2026 by Namibia, the United States of America, Hungary and Fiji under Article 63 of the Statute
    quote_lang: en
    locator: line 9
  status: reviewed
  supersedes: null
