- id: evt_2026_03_12_NAM_B3
  revision: 1
  country: NAM
  indicator: B3
  type: standing
  date: '2026-03-12'
  end: null
  points: 15
  points_rationale: 'Declaration of intervention (+15) under Article 63 in ICJ case 192, supporting the applicant''s construction: Namibia argues that omissions, including a refusal
    to provide or facilitate aid, can constitute the underlying acts of genocide, that the scale, systematicity and repetition of the underlying acts are probative of specific intent,
    and that starvation as a method of warfare or a general refusal to facilitate the delivery of essential supplies to a civilian population is prima facie indicative of genocidal intent.'
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The government filed a declaration of intervention under Article 63 in the ICJ case South Africa v. Israel on the Genocide Convention in the Gaza Strip.
    fr: Le gouvernement a déposé devant la CIJ une déclaration d'intervention au titre de l'article 63 dans l'affaire de la Convention sur le génocide à Gaza (Afrique du Sud c. Israël).
  evidence:
  - source: src_20260312_un-unispal_namibia-declaration-intervention
    quote: DECLARATION OF INTERVENTION BY THE REPUBLIC OF NAMIBIA 12 March 2026
    quote_lang: en
    locator: page 1 (cover)
  - source: src_20260312_un-unispal_namibia-declaration-intervention
    quote: hereby avails itself of its right to intervene in the proceedings under Article 63, paragraph 2, of the Statute.
    quote_lang: en
    locator: page 1 (paragraph 1)
  - source: src_20260312_un-unispal_namibia-declaration-intervention
    quote: a refusal to provide aid or to agree to and facilitate its provision by other actors may constitute an omission which constitutes the enumerated acts of genocide.
    quote_lang: en
    locator: page 14 (paragraph 41)
  - source: src_20260312_un-unispal_namibia-declaration-intervention
    quote: the scale, systematicity, intensity, and repetition of those underlying acts is of fundamental importance in inferring the genocidal intent with which they were committed.
    quote_lang: en
    locator: page 16 (paragraph 53)
  - source: src_20260312_un-unispal_namibia-declaration-intervention
    quote: genocidal acts aimed at an entire or large civilian population – for instance, the use of starvation as a method of warfare or a general refusal to facilitate delivery of
