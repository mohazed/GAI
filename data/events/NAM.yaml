    quote_lang: en
    locator: page 18 (paragraph 57)
  - source: src_20260927_icj-cij_case-192
    quote: Declarations of intervention in the proceedings filed on 12 March 2026 by Namibia, the United States of America, Hungary and Fiji under Article 63 of the Statute
    quote_lang: en
    locator: line 9
  status: reviewed
  supersedes: null
  related: []
  review:
    drafted_by: claude-sonnet-5-5
    drafted_at: '2026-11-04'
    notes: 'Namibia filed on 12 March 2026 (the Court''s page of case 192, archived on 27 September 2026, lists ''Declaration of intervention of Namibia, 12 March 2026''; the declaration
      is ICJ document 192-20260312-int-01-00-en.pdf, 26 pages, signed by the Agent, the Ambassador of Namibia to Belgium, the Netherlands, Luxembourg and the European Union). icj-cij.org
      answers HTTP 403 to a scripted request and has no Wayback capture of the file, so the copy that UNISPAL publishes is archived (the same route as Iceland''s and the Netherlands'').
      The declaration is read by direction (docs/10 B-541): it asks the Court to construe Articles I, II and III(c) of the Convention in ways that favour the applicant''s reading (omissions
      and refusal of aid as underlying acts, the probative weight of scale and repetition, starvation and the refusal of supplies as indicators of intent, and the Convention''s obligations
      on states not to commit genocide themselves); it does not argue against the applicant''s construction (not B4). Namibia is a party to the Convention (accession of 28 November 1994,
      paragraph 1) and a party to the Rome Statute. The Namibian Government''s own announcement was not read (the Presidency and the Ministry did not answer, docs/10 B-817).'
    second_read:
      by: claude-sonnet-5-5
      at: '2026-11-04'
      verdict: agree
      notes: 'Read in reverse order of the evidence list: the Court''s page (line 9) names the filing of 12 March 2026 by Namibia; the four passages of the declaration (pages 18, 16,
        14 and 1) are substrings of the archived text and their printed page numbers are those of the declaration (the page number follows the page''s content in the PDF text); the cover
        gives the date. The direction is the applicant''s: the three construction arguments quoted are the same family as Iceland''s and the Netherlands'' (docs/10 B-677). The tier and
        the scope match the passage.'
