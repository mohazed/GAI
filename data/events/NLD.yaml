      the budget debate of 21 November 2024, the day the Pre-Trial Chamber issued the warrants for
      the Israeli Prime Minister and former Minister of Defence, in answer to questions naming them;
      the speaker is identified as "Minister Veldkamp" in the official record. He added that a visit
      to an international organisation in the Netherlands would be weighed, while "Nederland voert
      echter dergelijke bevelen in principe uit"; read as a commitment. Later written answers of 13
      December 2024 and 22 April 2025 call on all states parties to cooperate on the warrants. No
      contrary position found, so no end.

