  summary:
    en: The Minister for Foreign Trade and Development Cooperation froze future Dutch contributions to UNRWA pending the investigation of allegations against its staff.
    fr: Le ministre du Commerce extérieur et de la Coopération au développement a gelé les futures contributions néerlandaises à l'UNRWA dans l'attente de l'enquête sur des accusations visant son personnel.
  evidence:
  - source: src_20240127_rijksoverheid_bevriest-bijdragen-unrwa
    quote: Nederland bevriest toekomstige bijdragen aan de VN-organisatie UNRWA.
    quote_lang: nl
    quote_en: The Netherlands is freezing future contributions to the UN organisation UNRWA.
    locator: line 2
  - source: src_20240127_rijksoverheid_bevriest-bijdragen-unrwa
    quote: In de tussentijd gaat er geen geld meer naar UNRWA, ook niet bij nieuwe verzoeken vanwege de situatie daar.
    quote_lang: nl
    quote_en: In the meantime no more money goes to UNRWA, including in response to new requests because of the situation there.
    locator: line 3
  status: reviewed
  supersedes: null
  related:
  - evt_2024_09_25_NLD_D3
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Lines 2 and 3 of the release of 27 January 2024 re-read: future contributions to UNRWA frozen, no new money pending the investigation. D2 agrees; end on the announced 2025 payment (kst-23432-539, line 15).'
    notes: >-
      Standing state from the announcement of 27 January 2024 (docs/02 §2 D2). The 2024 core
      contribution of €19 million had already been paid (same release); the freeze covered further
      funding. Ended on 25 September 2024, when the Government announced it would pay the 2025
      contribution of €19 million in January 2025 under the 2023–2025 agreement
      (src_20240925_officielebekendmakingen_kst-23432-539), the announced resumption (D3 from that
      date, evt_2024_09_25_NLD_D3). On 26 April 2024 the Government had said UNRWA would again be
      weighed as a channel for future contributions but that none was planned (Kamerstuk
      26150-211), which is not a resumption.

- id: evt_2024_02_12_NLD_A6
  revision: 1
  country: NLD
  indicator: A6
  type: standing
  date: '2024-02-12'
  end: null
  points: 10
  confidence: confirmed
  scope:
  - gaza
  summary:
    en: The Government stopped the export and transit of F-35 parts to Israel from the Netherlands, as ordered by the Court of Appeal of The Hague.
    fr: Le gouvernement a arrêté l'exportation et le transit de pièces de F-35 vers Israël depuis les Pays-Bas, sur ordre de la cour d'appel de La Haye.
  evidence:
  - source: src_20240212_rijksoverheid_cassatie-f-35-onderdelen
    quote: Het Hof heeft vanmorgen bepaald dat er over uiterlijk 7 dagen vanuit Nederland geen doorlevering van F-35-onderdelen naar Israël meer mag plaatsvinden. Uiteraard respecteert het kabinet de uitspraak van het Hof en zal die uitvoeren.
    quote_lang: nl
    quote_en: This morning the Court ruled that within seven days at the latest no further onward delivery of F-35 parts to Israel may take place from the Netherlands. The Government of course respects the Court's ruling and will implement it.
    locator: line 2
  - source: src_20240424_officielebekendmakingen_kst-22054-417
    quote: Het kabinet heeft daaraan opvolging gegeven door (middels de aanpassing van de algemene vergunningen NL007 en NL009) de uit- en doorvoer van goederen binnen het kader van het F-35-Lightning II programma met eindbestemming Israël niet langer toe te staan.
    quote_lang: nl
    quote_en: The Government has complied by no longer permitting (through the amendment of general licences NL007 and NL009) the export and transit of goods within the F-35 Lightning II programme with final destination Israel.
    locator: line 11
  status: reviewed
  supersedes: null
  related:
  - evt_2023_10_07_NLD_A3
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Line 2 of the release of 12 February 2024 and line 11 of the letter of 24 April 2024 re-read: the Court ordered the halt of F-35 part deliveries to Israel within seven days and the Government implemented it through general licences NL007 and NL009. A class of licences suspended by court order: A6 agrees.'
    notes: >-
      A court order suspending a class of licences (docs/02 §2 A6: "or a court order with the same
      effect"), implemented by the Government through general licences NL007 and NL009. Dated from
      the Court of Appeal's judgment of 12 February 2024 (the halt took effect within seven days).
      The Supreme Court quashed that judgment on 3 October 2025 and ordered a reassessment
      (Kamerstuk 22054-466); on 14 November 2025 the Government kept Israel excluded from general
      licence AV009 on its own decision and announced a further reassessment within six months
      (Kamerstuk 22054-469, read at zoek.officielebekendmakingen.nl; not archived: Save Page Now's
      capture of it was not served within 300 s twice, and the capture of its second address holds
      only the metadata page); no later decision was found in the arms-export dossier to
      2026-09-28, so the state has no end.
      Separately, the Government states that it refused eleven applications for military and
      dual-use goods with military end use in Israel since 7 October 2023 and that granting a
      licence for goods that could contribute to operations in Gaza is virtually excluded
      (src_20250728_officielebekendmakingen_kst-23432-569, line 25): case-by-case refusals, noted
      here, not a separate event. The exclusion of Israel from general licences NL007 and NL010 on 7
      April 2025 (Kamerstuk 22054-454) moves exports to individual licensing and is not filed as a
      second A6.

