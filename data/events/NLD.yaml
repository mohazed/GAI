  summary:
    en: The Netherlands took part in the F-35 supply chain through the European Regional Warehouse at Woensdrecht and Dutch suppliers of F-35 components.
    fr: Les Pays-Bas ont participé à la chaîne d'approvisionnement du F-35 par l'entrepôt régional européen de Woensdrecht et des fournisseurs néerlandais de composants.
  evidence:
  - source: src_20240424_officielebekendmakingen_kst-22054-417
    quote: In het kort geding en het daarop volgende hoger beroep stonden de uit- en doorvoer van Amerikaanse F-35-componenten vanuit het European Regional Warehouse in Woensdrecht naar Israël centraal.
    quote_lang: nl
    quote_en: In the summary proceedings and the appeal that followed, the export and transit of American F-35 components from the European Regional Warehouse in Woensdrecht to Israel were at issue.
    locator: line 11
  - source: src_20240424_officielebekendmakingen_kst-22054-417
    quote: Sommige Nederlandse bedrijven zijn de enige toeleverancier van bepaalde componenten binnen het gehele F-35-programma.
    quote_lang: nl
    quote_en: Some Dutch companies are the sole supplier of certain components within the entire F-35 programme.
    locator: line 20
  status: reviewed
  supersedes: null
  related:
  - evt_2024_02_12_NLD_A6
  review:
    drafted_by: claude-opus-5-5
    drafted_at: '2026-09-28'
    second_read:
      by: claude-opus-5-5
      at: '2026-09-28'
      verdict: agree
      notes: 'Lines 11 and 20 of the letter of 24 April 2024 re-read: transit of US F-35 components to Israel through the Woensdrecht warehouse and Dutch sole suppliers of F-35 components. A3 standing agrees; ended on the court-ordered halt of 12 February 2024 per the A3 rule.'
    notes: >-
      Pre-existing participation, a standing state from 2023-10-07 (docs/02 §2 A3), on a national
      ministry statement, one of the three document kinds the indicator names: the Government's
      letter of 24 April 2024 describes the transit of US-owned F-35 parts to Israel through the
      European Regional Warehouse at Woensdrecht and Dutch companies that are sole suppliers of
      certain F-35 components. Ended on 2024-02-12, the day the Court of Appeal of The Hague ordered
      the halt of all export and transit of F-35 parts with final destination Israel, which the
      Government implemented (docs/02 §2: a judicial or governmental halt ends the standing state and
      is separately an A6 event, evt_2024_02_12_NLD_A6). The same letter states that Dutch-made
      components continue to be exported to the United States and other F-35 users without
      intervention (line 19); the rule does not count those once the halt to Israel is in force
      (docs/10 B-257 (1)). A/HRC/59/23 does not name the Netherlands for the F-35.

- id: evt_2024_01_27_NLD_D2
  revision: 1
