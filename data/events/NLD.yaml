    quote: 'We leven het Statuut van Rome voor honderd procent na. Over arrestatiebevelen: het is duidelijk dat wij een arrestatiebevel uitvoeren.'
    quote_lang: nl
    quote_en: 'We comply with the Rome Statute one hundred per cent. On arrest warrants: it is clear that we execute an arrest warrant.'
    locator: line 181
  - source: src_20241121_officielebekendmakingen_h-tk-20242025-27-7
    quote: Dat betekent dat wij arrestatiebevelen opvolgen als iemand zich op Nederlands grondgebied bevindt.
    quote_lang: nl
    quote_en: That means that we act on arrest warrants if someone is on Dutch territory.
