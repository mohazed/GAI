      verdict: agree
      notes: 'Lines 180 to 189 of the Handelingen re-read: the speaker is Minister Veldkamp; he states that the Netherlands executes arrest warrants and acts on them when a person is on Dutch territory, in answer to questions naming the warrants for the Israeli Prime Minister and former Minister of Defence. B5 agrees.'
