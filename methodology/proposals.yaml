# proposals.yaml — methodology changes open for comment (docs/08 §1 step 3).
#
# One entry while a pull request that changes `methodology/` is open, from the day the Discussion is
# posted to the merge or the withdrawal of the pull request; the Changes page shows each entry as
# "Proposed: v1.1.0, comment until 2026-11-14" with the links, and methodology/index.json carries
# the list (`proposals`). The file is empty when no proposal is open. The pull request itself
# carries the diff table: the `Methodology diff` workflow (.github/workflows/methodology-diff.yml)
# posts `pnpm methodology:diff --from <base>` as a comment on every pull request that touches
# methodology/ (docs/08 §1 step 2). Schema: @gai/schema `ProposalsFile`.
#
# Entry (an example, not a proposal):
#   - version: 1.1.0
#     pr_url: "https://github.com/mohazed/GAI/pull/0"
#     discussion_url: null            # the Discussion's link once it is posted
#     opened: 2026-11-01
#     comment_until: 2026-11-15       # 14 days after the Discussion opens
#     summary:
#       en: One sentence on what changes.
#       fr: Une phrase sur ce qui change.
proposals:
  - version: 1.0.0-rc.2
    pr_url: "https://github.com/mohazed/GAI/pull/15"
    discussion_url: "https://github.com/mohazed/GAI/discussions/20"
    opened: 2026-10-05
    comment_until: 2026-12-12
    summary:
      en: >-
        The calibration set: eight rule changes from the hand-scoring of ten countries, among
        them a cap of −15 to +15 on UN General Assembly votes and passivity lifted only by acts
        of +2 or more.
      fr: >-
        Le jeu d'étalonnage : huit changements de règles issus de la notation à la main de dix
        pays, dont un plafond de −15 à +15 pour les votes à l'Assemblée générale des Nations
        unies et une passivité levée seulement par des actes de +2 ou plus.
  - version: 1.0.0-rc.3
    pr_url: "https://github.com/mohazed/GAI/pull/19"
    discussion_url: "https://github.com/mohazed/GAI/discussions/21"
    opened: 2026-11-27
    comment_until: 2026-12-12
    summary:
      en: >-
        Built on 1.0.0-rc.2: an absence of a state with no vote under Article 19 of the Charter
        scores 0, with the reason shown, and each SIPRI order year from 2024 is scored once, in
        the first imported release that reports it.
      fr: >-
        Fondée sur 1.0.0-rc.2 : l'absence d'un État sans droit de vote au titre de l'Article 19
        de la Charte compte 0, avec la raison affichée, et chaque année de commandes du SIPRI à
        partir de 2024 est notée une fois, dans la première édition importée qui la couvre.
