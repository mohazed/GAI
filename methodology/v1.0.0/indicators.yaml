  - id: B8
    category: B
    name:
      en: Recognition of the State of Palestine after Oct 2023
      fr: Reconnaissance de l'État de Palestine après octobre 2023
    description:
      en: >-
        Recognition of the State of Palestine: +8 if recognised after 2023-10-07, else +3 if
        recognised before. One standing state only; pre-existing recognition is a standing
        state from 2023-10-07.
      fr: >-
        Reconnaissance de l'État de Palestine : +8 en cas de reconnaissance après le 7 octobre 2023,
        sinon +3 en cas de reconnaissance antérieure. Un seul état durable ; la reconnaissance
        préexistante est un état durable à partir du 7 octobre 2023.
    sign: positive
    type: standing
    scored: true
    authoring: generated
    generated_from: data/countries.yaml recognises_palestine.since
    points:
      kind: tiers
      tiers:
        - key: recognised_after_window
          value: 8
          label:
            en: Recognised after 2023-10-07
            fr: Reconnaissance après le 7 octobre 2023
        - key: pre_existing
          value: 3
          label:
            en: Pre-existing recognition
            fr: Reconnaissance préexistante
    scaled: true
    indicator_cap: null
    stacking:
      rule: most_severe
      note:
        en: >-
          One standing state only: +8 if recognised after 2023-10-07, else +3 if recognised
          before (pre-existing recognition is a standing state from 2023-10-07).
        fr: >-
          Un seul état durable : +8 en cas de reconnaissance après le 7 octobre 2023, sinon +3 en
          cas de reconnaissance antérieure (la reconnaissance préexistante est un état durable à
          partir du 7 octobre 2023).
    superseded_by: []
    not_applicable: null
    evidence:
      requires_actor: false
      source_kinds: null
      # Sources: D-08, docs/03 §3.
      rule:
        en: >-
          Generated from `recognises_palestine.since` in `data/countries.yaml`; never hand-authored.
          The recognition date recorded there comes from the foreign ministry's announcement.
        fr: >-
          Généré à partir de `recognises_palestine.since` dans `data/countries.yaml` ; jamais rédigé
          à la main. La date de reconnaissance qui y figure provient de l'annonce du ministère des
          Affaires étrangères.
    primary_sources:
      - en: Foreign ministry
        fr: Ministère des Affaires étrangères
    cadence: on-event

  - id: B9
    category: B
    name:
      en: Head of government or foreign minister formally names violations, calls for ceasefire or an end to the blockade
      fr: Le chef de gouvernement ou le ministre des Affaires étrangères nomme formellement des violations, appelle à un cessez-le-feu ou à la fin du blocus
    description:
      en: >-
        Head of government or foreign minister formally names violations, calls for a ceasefire
        or an end to the blockade: +2 for a formal call for ceasefire or end of blockade; +5
        when the statement names specific violations (e.g. starvation as a method of warfare,
        attacks on hospitals, forced displacement) or uses a legal characterisation. Same
        speaker, same day: one event. Cap +10.
      fr: >-
        Le chef de gouvernement ou le ministre des Affaires étrangères nomme formellement des
        violations, appelle à un cessez-le-feu ou à la fin du blocus : +2 pour un appel formel
        au cessez-le-feu ou à la fin du blocus ; +5 lorsque la déclaration nomme des violations
        précises (par exemple l'utilisation de la famine comme méthode de guerre, les attaques
        contre des hôpitaux, les déplacements forcés) ou emploie une qualification juridique.
        Même orateur, même jour : un seul événement. Plafond +10.
    sign: positive
    type: repeatable
    scored: true
    authoring: hand
    points:
      kind: per_instance
      tiers:
        - key: call
          value: 2
          label:
            en: Formal call for ceasefire or end of blockade
            fr: Appel formel au cessez-le-feu ou à la fin du blocus
        - key: names_violations
          value: 5
          label:
            en: Names specific violations or uses a legal characterisation
            fr: Nomme des violations précises ou emploie une qualification juridique
    scaled: true
    indicator_cap: {min: null, max: 10}
    stacking:
      rule: sum
      note:
        en: >-
          Indicator cap: +10, applied to the indicator's summed contributions before the
          category clip.
        fr: >-
          Plafond de l'indicateur : +10, appliqué à la somme des contributions de l'indicateur
          avant l'application du plafond de la catégorie.
    superseded_by: []
    not_applicable: null
    evidence:
      requires_actor: true
      source_kinds: [official, official-video]
      # Sources: spec §3, docs/02 §2; docs/02 §12.4, docs/03 §4–§5; docs/06 §7.
      rule:
        en: >-
          The exact quote, the speaker, the date and the official transcript or official video with
          timestamp; paraphrases in press are not enough. The event carries `actor.name` and cites a
          source of kind official or official-video; the quote appears verbatim in
          `archive/text/{source}.txt` after whitespace normalisation, including for a video, whose
          transcript is stored there. Same speaker, same day: one event. The speaker is the head of
          government or the foreign minister; statements by spokespersons do not score.
        fr: >-
          La citation exacte, l'orateur, la date et la transcription officielle ou la vidéo
          officielle avec horodatage ; les paraphrases de presse ne suffisent pas. L'événement porte
          `actor.name` et cite une source de type official ou official-video ; la citation figure
          mot pour mot dans `archive/text/{source}.txt` après normalisation des espaces, y compris
