# methodology/v1.0.0/symmetry.yaml
#
# The symmetry table: for each negative indicator, its positive counterpart.
#
# Encodes docs/02-methodology-spec.md §13 (the 15 rows; labels and notes in English verbatim) and
# the symmetry test of spec §8 ("for each negative indicator, name the positive counterpart or
# explain why none exists"), checked in CI per docs/02 §12.5. Every negative indicator of v1.0
# has a counterpart, so `no_counterpart` is empty.
# Shape: packages/schema/src/methodology/schemas.ts (SymmetryFile; objects are strict).
#
# Changes only through a new version folder and a CHANGELOG entry (docs/08 §1).

